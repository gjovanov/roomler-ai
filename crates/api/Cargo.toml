[package]
name = "roomler-ai-api"
license = "AGPL-3.0-only"
publish = false
version.workspace = true
edition.workspace = true

[lib]
name = "roomler_ai_api"
path = "src/lib.rs"

[[bin]]
name = "roomler-ai-api"
path = "src/main.rs"

[features]
# FR-69 — one feature per module crate, and five PROFILES that aggregate them
# (D9): each profile is a product story, and what it leaves OUT is the claim
# (`remote`/`mesh`/`access` never compile the C++ SFU worker; `collab` never
# links the tunnel stack) — asserted by the `profiles` job in ci.yml (AC3).
#
# `default` is the HOSTED build: the full profile plus `saas`, the add-on the
# published self-host images never carry. ⚠️ Deliberately not D9's bare
# `["profile-full"]`: the hosted image is a manual `docker build` with no
# feature argument and the integration suite builds this crate with `default`,
# so a default without `saas` would drop billing from the next prod deploy
# silently. The self-host publish workflow passes `SAAS=0` explicitly and its
# boot smoke asserts the image does not mount it — enforced where the image is
# made, not by a default a recipe would have to remember.
default = ["profile-full", "saas"]
profile-full = ["chat", "conference", "fleet", "remote", "network"]
profile-collab = ["chat", "conference"]
profile-remote = ["fleet", "remote"]
profile-mesh = ["fleet", "network"]
profile-access = ["fleet", "remote", "network"]
saas = ["dep:roomler-ai-mod-saas"]
chat = ["dep:roomler-ai-mod-chat"]
# `conference` is the only feature that links mediasoup (the C++ worker build).
# It is built ON `chat` (rooms are the container calls run in — the graph's
# `conference → chat` edge), so the feature implies it.
conference = ["dep:roomler-ai-mod-conference", "chat"]
# `fleet` (P5a) is device management; `remote` (P6) and `network` (P7) are built
# ON it, so their features imply it. Kill switches: `[modules] <id> = false`.
fleet = ["dep:roomler-ai-mod-fleet"]
remote = ["dep:roomler-ai-mod-remote", "fleet"]
network = ["dep:roomler-ai-mod-network", "fleet"]


[dependencies]
roomler-ai-config = { path = "../config" }
roomler-ai-db = { path = "../db" }
roomler-ai-services = { path = "../services" }
roomler-ai-remote-control = { path = "../remote_control" }
# FR-69 — the composition contract, `Core`, and the primitives every module
# handler needs.
roomler-core = { path = "../core" }
# FR-69 — module crates, one optional dependency each, selected by the
# features below (`crates/api/src/compose.rs` is where they are mounted).
roomler-ai-mod-saas = { path = "../modules/saas", optional = true }
roomler-ai-mod-chat = { path = "../modules/chat", optional = true }
roomler-ai-mod-conference = { path = "../modules/conference", optional = true }
roomler-ai-mod-remote = { path = "../modules/remote", optional = true }
# FR-69 P5a — NOT optional yet: the host still serves the agent socket from
# the fleet module's handles (the Hub, the agent row, presence). It becomes a
# feature like the others when the socket moves into the module (P5b).
roomler-ai-mod-fleet = { path = "../modules/fleet", optional = true }
# FR-69 P7a — NOT optional yet either: the host's tunnel, DERP and agent-socket
# code still calls the engine that moved here (`state.network()`). It becomes a
# feature when the sockets move (P7b).
roomler-ai-mod-network = { path = "../modules/network", optional = true }

axum.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tower_governor.workspace = true
serde.workspace = true
serde_json.workspace = true
mongodb.workspace = true
bson.workspace = true
chrono.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
anyhow.workspace = true
jsonwebtoken.workspace = true
dashmap.workspace = true
rand.workspace = true
# Optional GeoIP country lookup (platform user analytics). The database
# itself is operator-supplied via ROOMLER__STATS__GEOIP_MMDB — nothing
# licensed is vendored, and an absent file degrades to "unknown".
futures.workspace = true
validator.workspace = true
reqwest.workspace = true
dotenvy.workspace = true
hmac.workspace = true
sha1.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
async-trait.workspace = true
nanoid.workspace = true
ipnet = "2" # subnet-route CIDR validation for the mesh subnet-router admin API
# Magic-byte content sniffing for uploads. A stored content-type that came
# from the client is a claim, not a fact; this reads what the bytes actually
# are. Pure Rust, no transitive deps, already in the lockfile.
infer = "0.19"
# FR-69 P1b — `object_store`, `maxminddb`, `redis`, `bytes` and `tempfile`
# left with the storage / analytics / cluster / pub-sub modules that used
# them; they are `roomler-core`'s now.
