[package]
name = "roomler-ai-api"
license = "AGPL-3.0-only"
publish = false
version.workspace = true
edition.workspace = true

[lib]
name = "roomler_ai_api"
path = "src/lib.rs"

[[bin]]
name = "roomler-ai-api"
path = "src/main.rs"

[features]
default = []


[dependencies]
roomler-ai-config = { path = "../config" }
roomler-ai-db = { path = "../db" }
roomler-ai-services = { path = "../services" }
roomler-ai-remote-control = { path = "../remote_control" }
roomler-ai-tunnel-core = { path = "../tunnel-core" }
# FR-69 — the composition contract (the module graph today; the `Module`
# trait and `Core` from P1b on).
roomler-core = { path = "../core" }

axum.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tower_governor.workspace = true
serde.workspace = true
serde_json.workspace = true
mongodb.workspace = true
bson.workspace = true
chrono.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
anyhow.workspace = true
jsonwebtoken.workspace = true
dashmap.workspace = true
rand.workspace = true
# Optional GeoIP country lookup (platform user analytics). The database
# itself is operator-supplied via ROOMLER__STATS__GEOIP_MMDB — nothing
# licensed is vendored, and an absent file degrades to "unknown".
maxminddb.workspace = true
redis.workspace = true
futures.workspace = true
validator.workspace = true
tempfile.workspace = true
reqwest.workspace = true
mediasoup.workspace = true
dotenvy.workspace = true
hmac.workspace = true
sha1.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
async-trait.workspace = true
nanoid.workspace = true
ipnet = "2" # subnet-route CIDR validation for the mesh subnet-router admin API
# S3/MinIO file-storage backend (uploads + export artifacts). `aws` feature =
# the AmazonS3 implementation; MinIO speaks the same dialect via a custom
# endpoint + path-style addressing. See `src/storage.rs`.
object_store = { version = "0.12", features = ["aws"] }
# Magic-byte content sniffing for uploads. A stored content-type that came
# from the client is a claim, not a fact; this reads what the bytes actually
# are. Pure Rust, no transitive deps, already in the lockfile.
infer = "0.19"
bytes = "1"
