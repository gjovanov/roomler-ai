# Vendored copy of webrtc-sctp 0.11.0 from crates.io.
# Upstream is verbatim EXCEPT (the delta IS
# `crates/vendored/webrtc-sctp.patch`; re-derive with
# `scripts/revendor-webrtc-sctp.sh`, drift-checked in CI):
#   - src/chunk/chunk_forward_tsn.rs: `unmarshal` bounds the stream-entry
#     loop by the CHUNK's declared length instead of the packet buffer.
#     Upstream counted every byte to the end of the packet as stream
#     entries, so a FORWARD-TSN with any chunk bundled after it — what
#     Chrome's dcSCTP sends (FORWARD-TSN + SACK) whenever it abandons a
#     message on an unreliable DataChannel — failed with `chunk too
#     short` and the WHOLE packet, the SACK included, was discarded.
#     Field 2026-09-02: 549 such drops in one day on one host, each a
#     lost acknowledgement that stalled the outbound video on an RTO.
#   - src/chunk/chunk_test.rs: the regression tests for that shape.
#   - src/association/mod.rs (#1856): the write loop treats a failed
#     `net_conn.send` as a LOST PACKET (SCTP retransmits it) instead of
#     closing the association and every stream on it. Upstream ended the
#     loop on any send error, so one EHOSTUNREACH from a route that was
#     absent for 3 ms killed a remote-desktop session outright. A transport
#     that is really closed is detected by the read loop once the ICE agent
#     under it is closed, which the peer connection's close does (#3716).
#   - src/association/association_test.rs: the regression test (a send
#     that fails once; the message must arrive by retransmission).
#   - src/queue/pending_queue.rs, src/stream/mod.rs and
#     src/association/association_internal.rs (#3716): the association's
#     close lets go every writer parked in flow control (the semaphore is
#     closed; a write it lets go fails instead of waiting forever), and a
#     stream's reset no longer queues behind such a writer. On a dead path
#     the peer never acks, so a data channel's close waited forever behind
#     the video writer, and with it the peer connection's close: its ICE
#     agent, sockets and this association lived until the process exited.
#     A write holds its stream's `write_turn` from its shutdown check until
#     its chunks are queued, and the reset waits for that turn on its task,
#     so it never goes ahead of a write the check let through.
#   - src/stream/stream_test.rs: the regression test for that order (a
#     reset taken while a write holds its turn queues behind the write).
#   - src/queue/pending_queue.rs and src/stream/mod.rs (#3755): a write cut
#     short (a timeout, a `select!` arm, a task abort) leaves its stream
#     whole. Upstream spent the stream's sequence number and added to
#     `buffered_amount` in `packetize`, before the waits for the queue's
#     lock and room, so a write dropped in those waits left a gap: the
#     receiver of an ordered stream waited for that number forever (RFC
#     4960 §6.6), and every later message of the stream waited behind it.
#     The queue now commits a write (`Stream::commit_write`) once its first
#     chunk has room, with no await before that chunk's push. A large
#     message cut after its first chunk queues its rest as it drops
#     (`BegunMessage`), owing the rest's bytes before it reads the room
#     (`PendingQueue::overdraft`, which the free room and then `pop` pay
#     back). A `pop` that decided what it pays before the debt was recorded
#     gives its chunk back after the drop read the room: one chunk of room
#     free per racing drop while the rest is owed, one rest added per race
#     (a large message that begins on it, cut while owed), so at most
#     (1 + races) times the largest message owed; exact at rest. A
#     write that must wait for room wakes the write loop first: on an
#     association with nothing in flight nothing else woke it, and a
#     message larger than the room left waited forever.
#   - src/queue/queue_test.rs, src/stream/stream_test.rs,
#     src/association/association_test.rs and test-only seams in
#     src/association/association_internal.rs and src/queue/pending_queue.rs:
#     the regression tests (a cut write, a cut large write, writers cut at
#     random on one thread and on two, the queue's accounting at rest, pops
#     during a cut message's drop and one split around it, a refused and an
#     empty write).

[package]
edition = "2021"
name = "webrtc-sctp"
version = "0.11.0"
authors = ["Rain Liu <yliu@webrtc.rs>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A pure Rust implementation of SCTP"
homepage = "https://webrtc.rs"
documentation = "https://docs.rs/webrtc-sctp"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/webrtc-rs/webrtc/tree/master/sctp"

[lib]
name = "webrtc_sctp"
path = "src/lib.rs"

[[example]]
name = "ping"
path = "examples/ping.rs"
bench = false

[[example]]
name = "pong"
path = "examples/pong.rs"
bench = false

[[example]]
name = "throughput"
path = "examples/throughput.rs"

[dependencies.arc-swap]
version = "1"

[dependencies.async-trait]
version = "0.1"

[dependencies.bytes]
version = "1"

[dependencies.crc]
version = "3.2.1"

[dependencies.log]
version = "0.4"

[dependencies.portable-atomic]
version = "1.6"

[dependencies.rand]
version = "0.8"

[dependencies.thiserror]
version = "1"

[dependencies.tokio]
version = "1.32.0"
features = [
    "fs",
    "io-util",
    "io-std",
    "macros",
    "net",
    "parking_lot",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
]

[dependencies.util]
version = "0.10.0"
features = ["conn"]
default-features = false
package = "webrtc-util"

[dev-dependencies.chrono]
version = "0.4.28"

[dev-dependencies.clap]
version = "3"

[dev-dependencies.env_logger]
version = "0.11.3"

[dev-dependencies.lazy_static]
version = "1"

[dev-dependencies.tokio-test]
version = "0.4"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ["cfg(fuzzing)"]
