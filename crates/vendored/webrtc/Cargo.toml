# Vendored copy of webrtc 0.12.0 from crates.io.
# Upstream is verbatim EXCEPT:
#   - src/api/setting_engine/mod.rs: SettingEngine gains
#     `sctp_max_receive_buffer_size: u32` + matching setter/getter so
#     callers can advertise an SCTP rwnd larger than the upstream
#     1 MB default (INITIAL_RECV_BUF_SIZE in webrtc-sctp-0.11.0). At
#     50-100 ms RTT, 1 MB caps single-stream DC throughput at
#     ~80-167 Mbps; the tunnel CLI needs 8 MB to keep
#     native-to-native DCs link-bound on home-broadband paths.
#   - src/sctp_transport/mod.rs:174: pulls the value out of
#     SettingEngine instead of hardcoding 0 (which falls back to the
#     1 MB upstream default).
#   - src/api/setting_engine/setting_engine_test.rs: round-trip test
#     locking the getter/setter so an upstream Cargo bump can't
#     silently un-do the patch.
#   - this Cargo.toml: header rewritten with patch notes (was the
#     cargo-normalized header for the registry upload).
#   - src/data_channel/mod.rs (#3716): `send`/`send_text` no longer hold the
#     channel's slot lock across the SCTP write, so a write parked in flow
#     control on a dead path cannot hold the channel's (and the peer
#     connection's) close behind it. They take turns on a `send_lock` of
#     their own instead, which `close()` and `buffered_amount()` never take:
#     the slot lock was the only thing ordering a channel's writes.
#   - src/sctp_transport/mod.rs (FR-148 P0): `delivery_clock()`, the
#     association's acknowledgement clock (`Association::delivery_clock`, a
#     patch of the vendored webrtc-sctp) for a caller outside this crate,
#     since `association()` is crate-private. It never waits for the slot:
#     `stop()` holds it across the association's close, so a held slot
#     answers `None`.
#   - src/sctp_transport/mod.rs (FR-148 O10): `gauges()`, the association's
#     congestion gauges (`Association::gauges`, a patch of the vendored
#     webrtc-sctp), beside `delivery_clock()` and in its way: it never waits
#     for the slot, and a held slot answers `None`.
#   - src/api/setting_engine/mod.rs + src/ice_transport/ice_gatherer.rs
#     (FR-148 P4): `SettingEngine::set_ice_carrier_rank`, carried into the
#     ICE agent's `AgentConfig::carrier_rank` the way the IP filter is (a
#     patch of the vendored webrtc-ice). Unset, the agent is unchanged.
#     And src/ice_transport/mod.rs: `RTCIceTransport::local_candidates()`,
#     the gathered candidates for a caller outside this crate (the gatherer
#     is crate-private), read without ever creating an agent.
#   - src/ice_transport/mod.rs (FR-148 P4 step 2): `RTCIceTransport::
#     route_read()`, a pair as the ICE agent's route rank reads it
#     (`Agent::route_read`, a patch of the vendored webrtc-ice): whether it
#     rides the mesh, and how the agent's hold went. `None` unless the agent
#     runs the route rank (`rc_carrier_rank = route`); it never creates an
#     agent.
#   - src/ice_transport/ice_candidate_pair.rs + src/ice_transport/mod.rs
#     (FR-148 P0): `RTCIceCandidatePair::local_relay_transport()`, what
#     carries the local candidate's TURN allocation (`Candidate::
#     relay_transport`, a patch of the vendored webrtc-ice), on the pairs the
#     selection reads and its change handler hands over. Read only by the
#     agent's carrier line.
#   - src/sctp_transport/mod.rs (#4103): the transport's stop is a `watch`
#     value that `stop()` sets first and keeps, in place of upstream's
#     `Notify`, whose `notify_waiters()` wakes only the waiters of that
#     instant. A stop that came while the data-channel accept task was in
#     its loop body (awaiting the app's `on_data_channel` handler) was lost,
#     and the task waited for good, holding the association and the DTLS
#     conn under it. The accept loop and `start()` read the value before
#     they wait, and `start()` reads it again under the association's slot
#     lock, so it closes an association whose handshake ended as the stop
#     came instead of storing it. Hence tokio 1.39 below (was 1.32), the
#     first with `Default` for `watch::Sender`, which `#[derive(Default)]`
#     on `RTCSctpTransport` needs. Both `select!`s poll the stop first
#     (`biased;`): a stop already set never starts a handshake, and after a
#     stop the accept loop takes up no further stream.
#   - src/sctp_transport/mod.rs (FR-148 P4b-1, D55):
#     `mark_deadline_stream(stream_id)`, which marks a stream of the
#     association deadline-limited (`Association::mark_deadline_stream`, a
#     patch of the vendored webrtc-sctp: the order written across ordered and
#     unordered messages, and a `maxRetransmits: 0` chunk abandoned when it
#     is lost instead of at its first send), beside `gauges()` and in its
#     way: it never waits for the slot. The agent's lane calls it under
#     `video_deadline` `on` (FR-148 P4b-3). Since FR-148 P4b a refusal says
#     why, `Err(DeadlineMarkRefusal)`: the slot held, no association, or a
#     stream the association does not have (the enum, at the end of the
#     file, writes `slot_held`, `no_association`, `no_stream`). And
#     `deadline_streams()`, the streams the association has marked
#     (`Association::deadline_streams`, a patch of the vendored webrtc-sctp),
#     a read that marks nothing, reached the same way; the agent's cells read
#     it. src/sctp_transport/sctp_transport_test.rs's
#     `test_mark_deadline_stream_says_why_it_refused` (each refusal by its
#     cause, on a real pair) and `test_deadline_mark_refusal_words` hold
#     their tests.
#   - src/sctp_transport/mod.rs + src/data_channel/mod.rs (FR-148 P4b): a
#     channel the remote end opened in band carries its SCTP stream as its
#     id from the moment the accept path builds it, before the app's
#     `on_data_channel` handler sees it. Upstream leaves `RTCDataChannel::
#     new`'s placeholder 0 there, which only `open()` replaces and an
#     accepted channel never runs, so its `id()` read 0 for good, in logs,
#     in stats and to the agent's deadline mark: with the viewer the DTLS
#     server its streams are odd and every mark was refused, and with the
#     viewer the DTLS client stream 0 is its first channel, which the mark
#     would have marked instead. Pion passes the stream (`ID: &sid`) to every
#     channel it accepts. src/data_channel/data_channel_test.rs's
#     `test_data_channel_accepted_id_is_its_stream_when_the_answerer_is_the_
#     dtls_client` and `..._dtls_server` hold its tests (the id in the
#     handler and once open, against the stream, on both DTLS roles). The
#     ids a local channel takes are unchanged: an accepted channel's has the
#     remote end's parity.
#   - src/ice_transport/ice_gatherer.rs + src/peer_connection/
#     peer_connection_test.rs (#4500): in this crate's own tests only
#     (`cfg(test)`, which no dependent compiles), a gatherer opens no mDNS
#     socket unless the test asks for mDNS candidates, and gathers host
#     candidates on loopback unless the test set a filter or a vnet
#     (`confined_for_tests`). The three tests that bind a non-loopback socket
#     on purpose (a STUN server on the internet, mDNS gathering) are ignored
#     on Windows, where that bind raises a firewall prompt for every new test
#     binary. A build for any dependent is unchanged.
#
# Default behaviour is unchanged — sctp_max_receive_buffer_size
# defaults to 0, which preserves the upstream 1 MB fallback. Only
# callers that explicitly opt in to a larger value see different
# behaviour: tunnel-core's `TunnelPeer` (the CLI's and the agent's
# tunnels) asks for 8 MiB, and the agent's remote-desktop sessions
# leave it at 0.

[package]
edition = "2021"
name = "webrtc"
version = "0.12.0"
authors = ["Rain Liu <yliu@webrtc.rs>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A pure Rust implementation of WebRTC API"
homepage = "https://webrtc.rs"
documentation = "https://docs.rs/webrtc"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/webrtc-rs/webrtc"

[lib]
name = "webrtc"
path = "src/lib.rs"

[dependencies.arc-swap]
version = "1"

[dependencies.async-trait]
version = "0.1"

[dependencies.bytes]
version = "1"

[dependencies.cfg-if]
version = "1"

[dependencies.data]
version = "0.10.0"
package = "webrtc-data"

[dependencies.dtls]
version = "0.11.0"
package = "webrtc-dtls"

[dependencies.hex]
version = "0.4"

[dependencies.ice]
version = "0.12.0"
package = "webrtc-ice"

[dependencies.interceptor]
version = "0.13.0"

[dependencies.lazy_static]
version = "1.4"

[dependencies.log]
version = "0.4"

[dependencies.mdns]
version = "0.8.0"
package = "webrtc-mdns"

[dependencies.media]
version = "0.9.0"
package = "webrtc-media"

[dependencies.pem]
version = "3"
optional = true

[dependencies.portable-atomic]
version = "1.6"

[dependencies.rand]
version = "0.8"

[dependencies.rcgen]
version = "0.13"
features = [
    "pem",
    "x509-parser",
]

[dependencies.regex]
version = "1.9.5"

[dependencies.ring]
version = "0.17"

[dependencies.rtcp]
version = "0.12.0"

[dependencies.rtp]
version = "0.12.0"

[dependencies.rustls]
version = "0.23.10"
features = [
    "std",
    "ring",
]
default-features = false

[dependencies.sctp]
version = "0.11.0"
package = "webrtc-sctp"

[dependencies.sdp]
version = "0.7.0"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dependencies.sha2]
version = "0.10"

[dependencies.smol_str]
version = "0.2"
features = ["serde"]

[dependencies.srtp]
version = "0.14.0"
package = "webrtc-srtp"

[dependencies.stun]
version = "0.7.0"

[dependencies.thiserror]
version = "1"

[dependencies.time]
version = "0.3"

[dependencies.tokio]
version = "1.39.0"
features = [
    "fs",
    "io-util",
    "io-std",
    "macros",
    "net",
    "parking_lot",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
]

[dependencies.turn]
version = "0.9.0"

[dependencies.url]
version = "2"

[dependencies.util]
version = "0.10.0"
package = "webrtc-util"

[dependencies.waitgroup]
version = "0.1"

[dev-dependencies.env_logger]
version = "0.11.3"

[dev-dependencies.tokio-test]
version = "0.4"

[features]
openssl = ["srtp/openssl"]
pem = [
    "dep:pem",
    "dtls/pem",
]
vendored-openssl = ["srtp/vendored-openssl"]
