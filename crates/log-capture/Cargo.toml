[package]
name = "roomler-log-capture"
license = "MPL-2.0"
publish = false
version.workspace = true
edition.workspace = true
description = "The one way a test reads its own log lines: its thread's scoped subscriber beside a second registered dispatcher (#3403). A dev-dependency only."

[lib]
name = "roomler_log_capture"
path = "src/lib.rs"

[dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
