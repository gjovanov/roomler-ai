[package]
name = "roomler-ai-tests"
license = "AGPL-3.0-only"
publish = false
version.workspace = true
edition.workspace = true

[lib]
name = "roomler_ai_tests"
path = "src/lib.rs"

[dependencies]
roomler-ai-config = { path = "../config" }
roomler-ai-db = { path = "../db" }
roomler-ai-services = { path = "../services" }
base64.workspace = true
roomler-ai-remote-control = { path = "../remote_control" }
roomler-ai-api = { path = "../api" }
roomler-core = { path = "../core" }
# FR-69 P4 — the cluster + stats tests reach the conference module's state
# (room manager, media claims) through `AppState::modules`.
roomler-ai-mod-conference = { path = "../modules/conference" }
roomler-ai-mod-fleet = { path = "../modules/fleet" }
roomler-ai-mod-network = { path = "../modules/network" }
# `external-access` so the FR-52 loopback proof runs the REAL device-side login
# (the OPAQUE record, the guess budget, the live config read) rather than a
# stand-in — the spec's bar for P3 is "proven on loopback against the real
# agent". Everything else in this crate is unaffected: the feature only adds
# the credential modules.
roomlerd = { path = "../../agents/roomlerd", features = ["external-access"] }
webrtc.workspace = true
tokio.workspace = true
mongodb.workspace = true
bson.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
reqwest.workspace = true
jsonwebtoken.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum.workspace = true
tower.workspace = true
hmac.workspace = true
sha2.workspace = true
hex.workspace = true

[dev-dependencies]
tempfile = { workspace = true }
tokio-test = "0.4"
tokio-tungstenite = "0.26"
futures.workspace = true
# FR-52 — the OUTSIDER's half of the login in `extauth_tests`, standing in for
# the browser (P4). Same version and features as roomlerd's, so cargo unifies
# them into one crate; `rand_opaque` is the rand 0.8 alias opaque-ke needs
# (see roomlerd's Cargo.toml for why it cannot be the workspace rand).
opaque-ke = { version = "4", default-features = false, features = ["ristretto255", "serde", "argon2", "std"] }
rand_opaque = { package = "rand", version = "0.8" }
