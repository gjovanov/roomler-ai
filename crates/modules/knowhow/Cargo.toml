[package]
name = "roomler-ai-mod-knowhow"
license = "AGPL-3.0-only"
publish = false
version.workspace = true
edition.workspace = true
description = "FR-90 module: knowhow — the organization's map, the server side: what exists, where it lives and how each is reached, as entities and the edges between them, with the history of every write. A map, not a gate: it grants nothing."

[lib]
name = "roomler_ai_mod_knowhow"
path = "src/lib.rs"

# P4-2 reads the fleet's devices and the network's overlay through the shared
# DAOs (their models are `roomler-ai-remote-control`'s) and hears of devices
# through core's hooks; P4-3a reaches a device on its connection's own sender,
# so no `knowhow → fleet`. P4-4-1's `knowhow → hive`: a session's question is
# believed from its record, read through hive's own stateless DAO, as the
# vault reads it.
[dependencies]
roomler-core = { path = "../../core" }
roomler-ai-mod-hive = { path = "../hive" }
roomler-ai-config = { path = "../../config" }
roomler-ai-db = { path = "../../db" }
roomler-ai-services = { path = "../../services" }
roomler-ai-remote-control = { path = "../../remote_control" }

anyhow.workspace = true
# P4-2a — the hooks fleet's events reach the map through.
async-trait.workspace = true
axum.workspace = true
bson.workspace = true
# P4-4-1 — this pod's connections' question queues, as the vault keeps its.
dashmap.workspace = true
futures.workspace = true
mongodb.workspace = true
serde.workspace = true
serde_json.workspace = true
# P4-3a-2 — a checkout's key: its path's SHA-256, since a path is not a key.
sha2.workspace = true
# P4-2a — a hello's sync off the socket's path, and the reconcile's interval.
tokio.workspace = true
tracing.workspace = true
