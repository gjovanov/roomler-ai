[package]
name = "roomler-ai-mod-knowhow"
license = "AGPL-3.0-only"
publish = false
version.workspace = true
edition.workspace = true
description = "FR-90 module: knowhow — the organization's map, the server side: what exists, where it lives and how each is reached, as entities and the edges between them, with the history of every write. A map, not a gate: it grants nothing."

[lib]
name = "roomler_ai_mod_knowhow"
path = "src/lib.rs"

# On core alone, and no module edge yet. P4-2 reads the fleet's devices and
# the network's overlay through the shared DAOs (their models are
# `roomler-ai-remote-control`'s) and hears of devices through core's hooks.
# The edges come with the steps that call a module: `knowhow → fleet` (its
# Hub) with P4-3a, `knowhow → hive` (a session's question believed from its
# record) with P4-4.
[dependencies]
roomler-core = { path = "../../core" }
roomler-ai-config = { path = "../../config" }
roomler-ai-db = { path = "../../db" }
roomler-ai-services = { path = "../../services" }
roomler-ai-remote-control = { path = "../../remote_control" }

anyhow.workspace = true
# P4-2a — the hooks fleet's events reach the map through.
async-trait.workspace = true
axum.workspace = true
bson.workspace = true
futures.workspace = true
mongodb.workspace = true
serde.workspace = true
serde_json.workspace = true
# P4-2a — a hello's sync off the socket's path, and the reconcile's interval.
tokio.workspace = true
tracing.workspace = true
