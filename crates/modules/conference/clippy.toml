# FR-127 P1.1: a DashMap guard held across an `.await` parks the THREAD of
# every task that wants the same shard, not just the task holding it. A
# production pod has 2 CPUs, so tokio runs 2 worker threads. On 2026-10-27 a
# burst of meeting joins parked both of them behind `RoomManager::consume`,
# which held a participant's entry across its mediasoup round trips. `/health`
# stopped answering until the liveness probe killed the pod.
#
# Clone what the await needs under the guard, drop the guard, then await.
# `clippy::await_holding_invalid_type` is warn-by-default and CI denies
# warnings, so holding one of these across an await fails the build for this
# crate. Clippy reads the nearest clippy.toml upward from the crate's manifest,
# so this file binds this crate only.
await-holding-invalid-types = [
    { path = "dashmap::mapref::one::Ref", reason = "clone what the await needs and drop the guard first (FR-127 P1.1)" },
    { path = "dashmap::mapref::one::RefMut", reason = "clone what the await needs and drop the guard first (FR-127 P1.1)" },
    { path = "dashmap::mapref::one::MappedRef", reason = "clone what the await needs and drop the guard first (FR-127 P1.1)" },
    { path = "dashmap::mapref::one::MappedRefMut", reason = "clone what the await needs and drop the guard first (FR-127 P1.1)" },
    { path = "dashmap::mapref::multiple::RefMulti", reason = "collect what the await needs and drop the iterator first (FR-127 P1.1)" },
    { path = "dashmap::mapref::multiple::RefMutMulti", reason = "collect what the await needs and drop the iterator first (FR-127 P1.1)" },
    { path = "dashmap::mapref::entry::Entry", reason = "finish the entry before awaiting (FR-127 P1.1)" },
    { path = "dashmap::mapref::entry::OccupiedEntry", reason = "finish the entry before awaiting (FR-127 P1.1)" },
    { path = "dashmap::mapref::entry::VacantEntry", reason = "finish the entry before awaiting (FR-127 P1.1)" },
    { path = "dashmap::iter::Iter", reason = "collect what the await needs and drop the iterator first (FR-127 P1.1)" },
    { path = "dashmap::iter::IterMut", reason = "collect what the await needs and drop the iterator first (FR-127 P1.1)" },
]
