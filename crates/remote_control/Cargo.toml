[package]
name = "roomler-ai-remote-control"
version.workspace = true
edition.workspace = true

[lib]
name = "roomler_ai_remote_control"
path = "src/lib.rs"

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
# CIDR matching for models::host_matches (moved here from tunnel-core policy
# in P3e lever E — the matcher lives next to its canonical shapes). Pure, tiny.
ipnet = "2"
thiserror.workspace = true
tracing.workspace = true
dashmap.workspace = true
parking_lot.workspace = true
hmac.workspace = true
sha1.workspace = true
base64.workspace = true
jsonwebtoken.workspace = true
ring = "0.17"
mongodb.workspace = true
bson.workspace = true
bitflags = { workspace = true, features = ["serde"] }

[dev-dependencies]
tokio-test.workspace = true
