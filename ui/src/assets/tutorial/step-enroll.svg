<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="se-t">
  <title id="se-t">One command on any platform enrolls a machine into your organization</title>
  <!-- Palette locked to the landing page: teal #009688 / #00796B, coral
       #ef5350, ink #1a1a2e. Light-surface artwork — the tutorial paints it
       on a fixed pale panel in both themes. -->
  <g fill="#1a1a2e" font-size="9">
    <!-- Three platform tiles -->
    <g>
      <rect x="8" y="16" width="86" height="34" rx="6" fill="#ffffff" stroke="rgba(0,150,136,0.45)" stroke-width="1.5"/>
      <rect x="17" y="26" width="14" height="14" rx="2" fill="#009688"/>
      <text x="38" y="36" font-weight="600">Windows</text>
    </g>
    <g>
      <rect x="8" y="58" width="86" height="34" rx="6" fill="#ffffff" stroke="rgba(0,150,136,0.45)" stroke-width="1.5"/>
      <circle cx="24" cy="75" r="7" fill="#00796B"/>
      <text x="38" y="78" font-weight="600">Linux</text>
    </g>
    <g>
      <rect x="8" y="100" width="86" height="34" rx="6" fill="#ffffff" stroke="rgba(0,150,136,0.45)" stroke-width="1.5"/>
      <path d="M28 111 a6.5 6.5 0 1 0 0 13 a8 8 0 0 1 0 -13" fill="#1a1a2e"/>
      <path d="M25.5 109.5 a3.5 3.5 0 0 1 3 -2.5 a3.5 3.5 0 0 1 -3 2.5" fill="#1a1a2e"/>
      <text x="38" y="120" font-weight="600">macOS</text>
    </g>
  </g>

  <!-- The single command -->
  <rect x="112" y="58" width="132" height="34" rx="6" fill="#1a1a2e"/>
  <text x="122" y="73" font-size="8.5" fill="#4caf50" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">$ install.sh</text>
  <text x="122" y="85" font-size="8.5" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">--token &lt;jwt&gt;</text>

  <g stroke="rgba(0,150,136,0.55)" stroke-width="1.5" fill="none">
    <path d="M94 33 Q104 33 108 60" marker-end="url(#seArrow)"/>
    <path d="M94 75 h12" marker-end="url(#seArrow)"/>
    <path d="M94 117 Q104 117 108 92" marker-end="url(#seArrow)"/>
    <path d="M244 75 h24" marker-end="url(#seArrow)"/>
  </g>
  <defs>
    <marker id="seArrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L6 4 L0 7 z" fill="#009688"/>
    </marker>
  </defs>

  <!-- The organization -->
  <rect x="272" y="30" width="100" height="90" rx="10" fill="rgba(0,150,136,0.10)" stroke="#00796B" stroke-width="1.5"/>
  <text x="322" y="50" text-anchor="middle" font-size="9.5" font-weight="700" fill="#00796B">your org</text>
  <g fill="#ffffff" stroke="rgba(0,150,136,0.5)" stroke-width="1.2">
    <rect x="286" y="60" width="34" height="22" rx="4"/>
    <rect x="326" y="60" width="34" height="22" rx="4"/>
    <rect x="286" y="88" width="34" height="22" rx="4"/>
    <rect x="326" y="88" width="34" height="22" rx="4"/>
  </g>
  <g fill="#4caf50">
    <circle cx="292" cy="66" r="2.6"/><circle cx="332" cy="66" r="2.6"/><circle cx="292" cy="94" r="2.6"/>
  </g>
  <circle cx="332" cy="94" r="2.6" fill="#ef5350"/>
</svg>
