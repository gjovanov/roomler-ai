<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" aria-labelledby="rooms-title rooms-desc">
  <!-- Split out of docs/assets/collaboration.svg: this half is rooms/chat,
       calls.svg is the video half, so the two chapters no longer share one image. -->
  <title id="rooms-title">Rooms, threads and mentions</title>
  <desc id="rooms-desc">
    A channel list on the left with one unread channel, next to a conversation
    where a reply is threaded under its parent message, someone is mentioned by
    name, and a colleague is typing.
  </desc>
  <style>
    /* Only the newest reply arrives each cycle; everything else stays put, so
       the scene reads correctly at any instant rather than only at the end. */
    .arrive { animation: rm-arrive 6s ease infinite; }
    @keyframes rm-arrive { 0% { opacity: 0; transform: translateY(8px); } 10%, 100% { opacity: 1; transform: translateY(0); } }
    .dot { animation: rm-dot 1.2s ease-in-out infinite; }
    .dot:nth-of-type(2) { animation-delay: .15s; }
    .dot:nth-of-type(3) { animation-delay: .3s; }
    @keyframes rm-dot { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
    .unread { transform-box: fill-box; transform-origin: center; animation: rm-pulse 6s ease infinite; }
    @keyframes rm-pulse { 0%,88% { transform: scale(1); } 94% { transform: scale(1.25); } 100% { transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) {
      .arrive, .dot, .unread { animation: none; opacity: 1; transform: none; }
    }
  </style>

  <rect width="760" height="400" fill="none" />

  <!-- channel rail -->
  <rect x="36" y="48" width="180" height="304" rx="10" fill="#009688" opacity=".10" />
  <g font-size="14" fill="#00796B">
    <text x="56" y="80" font-weight="600">Channels</text>
    <text x="56" y="118">#general</text>
    <text x="56" y="150" font-weight="600">#incidents</text>
    <text x="56" y="182">#release</text>
    <text x="56" y="214" opacity=".75">#design</text>
  </g>
  <circle class="unread" cx="196" cy="145" r="9" fill="#ef5350" />
  <text x="196" y="149" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">3</text>

  <!-- conversation -->
  <g>
    <rect x="248" y="64" width="440" height="58" rx="10" fill="#009688" opacity=".12" />
    <circle cx="276" cy="93" r="14" fill="#00796B" opacity=".55" />
    <text x="304" y="88" font-size="13.5" fill="#00796B" font-weight="600">Priya</text>
    <text x="304" y="108" font-size="13" fill="#00796B" opacity=".85">The relay pair is on DERP again after the roll.</text>
  </g>

  <!-- a threaded reply, indented under its parent -->
  <g class="arrive">
    <path d="M272 130 v28 h20" stroke="#00796B" stroke-width="2" fill="none" opacity=".5" stroke-linecap="round" />
    <rect x="300" y="140" width="388" height="58" rx="10" fill="#009688" opacity=".18" />
    <circle cx="328" cy="169" r="14" fill="#009688" opacity=".7" />
    <text x="356" y="164" font-size="13.5" fill="#00796B" font-weight="600">Sam</text>
    <text x="356" y="184" font-size="13" fill="#00796B">
      <tspan fill="#ef5350" font-weight="600">@priya</tspan>
      <tspan> it re-upgraded — direct again, 7 ms.</tspan>
    </text>
  </g>

  <!-- reactions on the parent -->
  <g transform="translate(248,214)">
    <rect width="66" height="26" rx="13" fill="#009688" opacity=".16" />
    <text x="33" y="18" text-anchor="middle" font-size="13" fill="#00796B">👍 4</text>
    <rect x="76" width="66" height="26" rx="13" fill="#009688" opacity=".16" />
    <text x="109" y="18" text-anchor="middle" font-size="13" fill="#00796B">🎉 2</text>
  </g>

  <!-- someone is typing -->
  <g transform="translate(248,286)">
    <rect width="150" height="34" rx="17" fill="#009688" opacity=".14" />
    <circle class="dot" cx="34" cy="17" r="4.5" fill="#00796B" />
    <circle class="dot" cx="50" cy="17" r="4.5" fill="#00796B" />
    <circle class="dot" cx="66" cy="17" r="4.5" fill="#00796B" />
    <text x="88" y="22" font-size="12.5" fill="#00796B" opacity=".8">typing</text>
  </g>

  <!-- composer -->
  <rect x="248" y="332" width="440" height="36" rx="18" fill="none" stroke="#00796B" stroke-width="1.5" opacity=".45" />
  <text x="270" y="355" font-size="13" fill="#00796B" opacity=".55">Message #incidents…</text>
</svg>
