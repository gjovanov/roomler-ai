<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" aria-labelledby="dev-title dev-desc">
  <!-- The Devices chapter shared hero-mesh.svg with Get started; the mesh says
       "machines are connected", which is the overview's point, not this one.
       This scene is the inventory itself: what an enrollment token turns into. -->
  <title id="dev-title">One token enrolls a machine into the fleet</title>
  <desc id="dev-desc">
    A single-use enrollment token on the left, and a device list on the right
    holding four machines with their platform, overlay address and status. Three
    are online, one is offline, and the newest row has just joined.
  </desc>
  <style>
    /* The new row settles within the first tenth of the cycle and then stays,
       so the list reads as a complete inventory at any instant. */
    .arrive { animation: dv-arrive 6s ease infinite; }
    @keyframes dv-arrive { 0% { opacity: 0; transform: translateX(-14px); } 10%, 100% { opacity: 1; transform: translateX(0); } }
    .halo { transform-box: fill-box; transform-origin: center; animation: dv-halo 6s ease infinite; }
    @keyframes dv-halo { 0%, 8% { opacity: 0; transform: scale(.4); } 20% { opacity: .55; transform: scale(1); } 34%, 100% { opacity: 0; transform: scale(1.5); } }
    .token { animation: dv-token 6s ease infinite; }
    @keyframes dv-token { 0%, 4% { opacity: 1; } 16%, 100% { opacity: .45; } }
    @media (prefers-reduced-motion: reduce) {
      .arrive, .halo, .token { animation: none; opacity: 1; transform: none; }
      .halo { opacity: 0; }
    }
  </style>

  <rect width="760" height="400" fill="none" />

  <!-- enrollment token -->
  <rect x="36" y="132" width="196" height="126" rx="12" fill="#009688" opacity=".10" />
  <text x="134" y="164" text-anchor="middle" font-size="14" font-weight="600" fill="#00796B">enrollment token</text>
  <rect class="token" x="58" y="182" width="152" height="34" rx="7" fill="#009688" opacity=".22" />
  <text x="134" y="205" text-anchor="middle" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#00796B" letter-spacing="1">7Q2K·M4XD</text>
  <text x="134" y="238" text-anchor="middle" font-size="12" fill="#00796B" opacity=".75">single use · expires in 10 min</text>

  <!-- token to new row -->
  <path d="M232 200 C 262 200 262 306 296 306" fill="none" stroke="#4DB6AC" stroke-width="2.5" stroke-dasharray="6 6" />
  <path d="M290 300 L 300 306 L 290 312 Z" fill="#4DB6AC" />

  <!-- device list -->
  <rect x="300" y="48" width="424" height="304" rx="12" fill="#009688" opacity=".10" />
  <text x="324" y="82" font-size="15" font-weight="600" fill="#00796B">Devices</text>
  <text x="700" y="82" text-anchor="end" font-size="13" fill="#00796B" opacity=".75">3 online · 1 offline</text>

  <!-- row 1 -->
  <rect x="316" y="98" width="392" height="52" rx="8" fill="#009688" opacity=".14" />
  <text x="336" y="120" font-size="14" font-weight="600" fill="#00796B">buildhost</text>
  <text x="336" y="138" font-size="12" fill="#00796B" opacity=".7">linux</text>
  <text x="560" y="130" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#00796B" opacity=".8">100.65.4.2</text>
  <circle cx="690" cy="124" r="6" fill="#26A69A" />

  <!-- row 2 -->
  <rect x="316" y="158" width="392" height="52" rx="8" fill="#009688" opacity=".14" />
  <text x="336" y="180" font-size="14" font-weight="600" fill="#00796B">laptop</text>
  <text x="336" y="198" font-size="12" fill="#00796B" opacity=".7">windows</text>
  <text x="560" y="190" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#00796B" opacity=".8">100.65.4.28</text>
  <circle cx="690" cy="184" r="6" fill="#26A69A" />

  <!-- row 3 — offline, so the list is visibly a liveness view, not a roster -->
  <rect x="316" y="218" width="392" height="52" rx="8" fill="#009688" opacity=".08" />
  <text x="336" y="240" font-size="14" font-weight="600" fill="#00796B" opacity=".6">studio</text>
  <text x="336" y="258" font-size="12" fill="#00796B" opacity=".45">macos</text>
  <text x="560" y="250" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#00796B" opacity=".45">100.65.4.14</text>
  <circle cx="690" cy="238" r="6" fill="#B0BEC5" />
  <text x="690" y="259" text-anchor="middle" font-size="10" fill="#00796B" opacity=".55">offline</text>

  <!-- row 4 — the machine this token just enrolled -->
  <g class="arrive">
    <rect x="316" y="278" width="392" height="52" rx="8" fill="#009688" opacity=".14" />
    <text x="336" y="300" font-size="14" font-weight="600" fill="#00796B">workstation</text>
    <text x="336" y="318" font-size="12" fill="#00796B" opacity=".7">windows</text>
    <text x="560" y="310" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#00796B" opacity=".8">100.65.4.31</text>
    <circle class="halo" cx="690" cy="304" r="12" fill="none" stroke="#26A69A" stroke-width="3" />
    <circle cx="690" cy="304" r="6" fill="#26A69A" />
  </g>
</svg>
