<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" aria-labelledby="calls-title calls-desc">
  <!-- Split out of docs/assets/collaboration.svg: the video half, so the calls
       chapter no longer shares an image with rooms. -->
  <title id="calls-title">A call with an active speaker and a shared screen</title>
  <desc id="calls-desc">
    A shared screen fills the stage, with three participant tiles beside it —
    the fourth person in the call is the one sharing. One participant is
    speaking, shown by a ring and moving level bars; one has their camera off
    and appears as an avatar; one is muted.
  </desc>
  <style>
    .ring { transform-box: fill-box; transform-origin: center; animation: cl-ring 1.8s ease-out infinite; }
    @keyframes cl-ring { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(1.35); opacity: 0; } }
    .bar { transform-box: fill-box; transform-origin: center bottom; animation: cl-bar .9s ease-in-out infinite; }
    .bar:nth-of-type(2) { animation-delay: .15s; }
    .bar:nth-of-type(3) { animation-delay: .3s; }
    @keyframes cl-bar { 0%,100% { transform: scaleY(.3); } 50% { transform: scaleY(1); } }
    /* The cursor crosses the shared screen and returns — the slide it points at
       never changes, so nothing is mid-transition when you glance at it. */
    .cursor { animation: cl-cursor 6s ease-in-out infinite; }
    @keyframes cl-cursor { 0%,100% { transform: translate(0,0); } 50% { transform: translate(150px,52px); } }
    @media (prefers-reduced-motion: reduce) {
      .ring, .bar, .cursor { animation: none; }
      .bar { transform: scaleY(.7); }
    }
  </style>

  <rect width="760" height="400" fill="none" />

  <!-- shared screen (the stage) -->
  <rect x="40" y="56" width="452" height="272" rx="12" fill="#00796B" opacity=".10" />
  <rect x="40" y="56" width="452" height="272" rx="12" fill="none" stroke="#00796B" stroke-width="2" opacity=".45" />
  <g fill="#00796B" opacity=".45">
    <rect x="72" y="92"  width="220" height="14" rx="7" />
    <rect x="72" y="122" width="330" height="10" rx="5" opacity=".7" />
    <rect x="72" y="146" width="286" height="10" rx="5" opacity=".7" />
    <rect x="72" y="188" width="150" height="96" rx="8" opacity=".55" />
    <rect x="240" y="188" width="162" height="46" rx="8" opacity=".4" />
    <rect x="240" y="246" width="162" height="38" rx="8" opacity=".4" />
  </g>
  <g class="cursor">
    <path d="M150 200 l0 22 l6 -6 l5 10 l5 -3 l-5 -9 l8 0 z" fill="#00796B" />
  </g>
  <text x="60" y="348" font-size="13" fill="#00796B" opacity=".8">Sam is sharing a screen</text>

  <!-- participant filmstrip.
       ⚠️ The speaking ring is drawn around the AVATAR, not the tile: an earlier
       version expanded a tile-sized ring and it bled over the neighbouring
       tiles at every pulse. Names sit on a scrim inside the tile so a moving
       bar can never land on top of the text. -->
  <g>
    <!-- speaking -->
    <rect x="528" y="56" width="124" height="76" rx="10" fill="#009688" opacity=".22" />
    <circle class="ring" cx="580" cy="86" r="20" fill="none" stroke="#009688" stroke-width="3" />
    <circle cx="580" cy="86" r="17" fill="#00796B" opacity=".6" />
    <g transform="translate(622,74)">
      <rect class="bar" width="5" height="16" rx="2.5" fill="#009688" />
      <rect class="bar" x="9" width="5" height="16" rx="2.5" fill="#009688" />
      <rect class="bar" x="18" width="5" height="16" rx="2.5" fill="#009688" />
    </g>
    <rect x="528" y="112" width="124" height="20" rx="0" fill="#00796B" opacity=".14" />
    <text x="538" y="126" font-size="11.5" fill="#00796B" font-weight="600">Priya</text>

    <!-- camera off: an avatar, never a frozen frame -->
    <rect x="528" y="148" width="124" height="76" rx="10" fill="#00796B" opacity=".14" />
    <circle cx="580" cy="178" r="19" fill="#00796B" opacity=".5" />
    <text x="580" y="184" text-anchor="middle" font-size="15" fill="#fff" font-weight="600">A</text>
    <g transform="translate(618,170)">
      <rect x="0" y="2" width="13" height="10" rx="2.5" fill="#ef5350" />
      <path d="M14 4 l6 -3 v12 l-6 -3 z" fill="#ef5350" />
      <path d="M-2 -1 L22 15" stroke="#ef5350" stroke-width="2.5" stroke-linecap="round" />
    </g>
    <rect x="528" y="204" width="124" height="20" fill="#00796B" opacity=".14" />
    <text x="538" y="218" font-size="11.5" fill="#00796B" font-weight="600">Ada</text>

    <!-- muted -->
    <rect x="528" y="240" width="124" height="76" rx="10" fill="#009688" opacity=".22" />
    <circle cx="580" cy="270" r="17" fill="#00796B" opacity=".6" />
    <g transform="translate(618,262)">
      <rect x="4" y="0" width="8" height="13" rx="4" fill="#ef5350" />
      <path d="M1 9 a7 7 0 0 0 14 0" fill="none" stroke="#ef5350" stroke-width="2" />
      <path d="M-1 -2 L18 16" stroke="#ef5350" stroke-width="2.5" stroke-linecap="round" />
    </g>
    <rect x="528" y="296" width="124" height="20" fill="#00796B" opacity=".14" />
    <text x="538" y="310" font-size="11.5" fill="#00796B" font-weight="600">Jon</text>
  </g>

  <text x="528" y="348" font-size="12.5" fill="#00796B" opacity=".75">4 in the call</text>
</svg>
