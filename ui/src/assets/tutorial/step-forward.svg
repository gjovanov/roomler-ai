<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="sf-t">
  <title id="sf-t">A local port tunnelled through an enrolled machine to a service on its private network</title>
  <!-- Your machine -->
  <rect x="6" y="40" width="104" height="64" rx="7" fill="#ffffff" stroke="rgba(0,150,136,0.45)" stroke-width="1.5"/>
  <text x="58" y="60" text-anchor="middle" font-size="9" font-weight="700" fill="#1a1a2e">your laptop</text>
  <rect x="16" y="68" width="84" height="22" rx="4" fill="#1a1a2e"/>
  <text x="58" y="82" text-anchor="middle" font-size="8" fill="#4caf50" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">127.0.0.1:5432</text>

  <!-- Encrypted tunnel -->
  <path d="M110 72 h58" stroke="#009688" stroke-width="2" fill="none" stroke-dasharray="5 4"/>
  <g transform="translate(139 72)">
    <circle r="11" fill="#ffffff" stroke="#00796B" stroke-width="1.4"/>
    <path d="M-3.5 -1 v-2.5 a3.5 3.5 0 0 1 7 0 v2.5 M-5 -1 h10 v7 h-10 z" fill="none" stroke="#00796B" stroke-width="1.3"/>
  </g>
  <text x="139" y="98" text-anchor="middle" font-size="7.5" font-weight="600" fill="#00796B">encrypted</text>

  <!-- The exit machine -->
  <rect x="170" y="34" width="96" height="76" rx="7" fill="rgba(0,150,136,0.10)" stroke="#00796B" stroke-width="1.5"/>
  <text x="218" y="52" text-anchor="middle" font-size="9" font-weight="700" fill="#00796B">enrolled machine</text>
  <rect x="182" y="62" width="72" height="34" rx="5" fill="#ffffff" stroke="rgba(0,150,136,0.4)" stroke-width="1.2"/>
  <text x="218" y="76" text-anchor="middle" font-size="7.5" fill="rgba(26,26,46,0.7)">no public port</text>
  <text x="218" y="88" text-anchor="middle" font-size="7.5" fill="rgba(26,26,46,0.7)">dials out only</text>

  <path d="M266 72 h30" stroke="rgba(0,150,136,0.55)" stroke-width="1.6" fill="none" marker-end="url(#sfA)"/>
  <defs>
    <marker id="sfA" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L6 4 L0 7 z" fill="#009688"/>
    </marker>
  </defs>

  <!-- The private service -->
  <g>
    <rect x="300" y="42" width="70" height="60" rx="7" fill="#ffffff" stroke="rgba(239,83,80,0.55)" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="335" y="58" text-anchor="middle" font-size="7.5" font-weight="600" fill="#ef5350">private LAN</text>
    <ellipse cx="335" cy="70" rx="19" ry="5.5" fill="#00796B"/>
    <path d="M316 70 v10 a19 5.5 0 0 0 38 0 v-10" fill="#009688"/>
    <ellipse cx="335" cy="70" rx="19" ry="5.5" fill="rgba(255,255,255,0.25)"/>
    <text x="335" y="98" text-anchor="middle" font-size="8" font-weight="600" fill="rgba(26,26,46,0.75)">db:5432</text>
  </g>
</svg>
