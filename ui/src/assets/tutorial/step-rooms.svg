<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="sr-t">
  <title id="sr-t">Nested rooms with threaded chat, mentions, reactions and shared files</title>
  <!-- Room tree -->
  <rect x="8" y="18" width="116" height="114" rx="7" fill="rgba(0,150,136,0.08)" stroke="rgba(0,150,136,0.35)" stroke-width="1.3"/>
  <g font-size="8.5" fill="#1a1a2e">
    <text x="20" y="36" font-weight="700" fill="#00796B"># general</text>
    <text x="30" y="52"># engineering</text>
    <text x="40" y="68" fill="rgba(26,26,46,0.7)">↳ backend</text>
    <text x="40" y="84" fill="rgba(26,26,46,0.7)">↳ infra</text>
    <text x="30" y="100"># design</text>
    <text x="20" y="118" fill="rgba(26,26,46,0.55)">🔒 private</text>
  </g>
  <rect x="14" y="27" width="4" height="12" rx="2" fill="#009688"/>

  <!-- Messages -->
  <g>
    <rect x="136" y="18" width="236" height="114" rx="7" fill="#ffffff" stroke="rgba(0,150,136,0.35)" stroke-width="1.3"/>
    <!-- message 1 -->
    <circle cx="152" cy="38" r="8" fill="#009688"/>
    <rect x="166" y="30" width="60" height="7" rx="3.5" fill="rgba(26,26,46,0.55)"/>
    <rect x="166" y="42" width="150" height="6" rx="3" fill="rgba(26,26,46,0.16)"/>
    <!-- mention chip -->
    <rect x="322" y="40" width="38" height="11" rx="5.5" fill="rgba(0,150,136,0.18)"/>
    <text x="341" y="48.5" text-anchor="middle" font-size="7" font-weight="700" fill="#00796B">@you</text>
    <!-- thread -->
    <circle cx="164" cy="66" r="7" fill="#00796B"/>
    <rect x="176" y="60" width="48" height="6" rx="3" fill="rgba(26,26,46,0.5)"/>
    <rect x="176" y="70" width="112" height="5.5" rx="2.75" fill="rgba(26,26,46,0.14)"/>
    <path d="M156 56 v6 a4 4 0 0 0 4 4 h2" fill="none" stroke="rgba(0,150,136,0.5)" stroke-width="1.2"/>
    <!-- reactions -->
    <g>
      <rect x="176" y="80" width="26" height="12" rx="6" fill="rgba(0,150,136,0.12)" stroke="rgba(0,150,136,0.35)" stroke-width="0.8"/>
      <text x="189" y="89" text-anchor="middle" font-size="7">👍 3</text>
      <rect x="206" y="80" width="26" height="12" rx="6" fill="rgba(239,83,80,0.10)" stroke="rgba(239,83,80,0.3)" stroke-width="0.8"/>
      <text x="219" y="89" text-anchor="middle" font-size="7">🎉 1</text>
    </g>
    <!-- file attachment -->
    <g>
      <rect x="152" y="100" width="112" height="22" rx="5" fill="rgba(26,26,46,0.05)" stroke="rgba(26,26,46,0.2)" stroke-width="1"/>
      <path d="M164 105 h10 l4 4 v9 h-14 z" fill="#ffffff" stroke="#00796B" stroke-width="1.1"/>
      <text x="186" y="114" font-size="7.5" fill="rgba(26,26,46,0.7)">spec-v2.pdf</text>
    </g>
    <!-- call affordance -->
    <g transform="translate(330 110)">
      <rect x="-32" y="-11" width="64" height="22" rx="11" fill="#009688"/>
      <path d="M-18 -4 h7 v8 h-7 z M-9 -3 l4 -3 v10 l-4 -3 z" fill="#ffffff"/>
      <text x="8" y="3.5" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff">call</text>
    </g>
  </g>
</svg>
