<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="sv-t">
  <title id="sv-t">A room call with several participants and a shared screen</title>
  <!-- Shared screen -->
  <rect x="8" y="20" width="196" height="110" rx="7" fill="#1a1a2e"/>
  <rect x="20" y="32" width="172" height="76" rx="4" fill="rgba(0,150,136,0.30)"/>
  <g fill="rgba(255,255,255,0.35)">
    <rect x="30" y="42" width="76" height="8" rx="3"/>
    <rect x="30" y="56" width="120" height="6" rx="3"/>
    <rect x="30" y="68" width="98" height="6" rx="3"/>
    <rect x="30" y="80" width="110" height="6" rx="3"/>
  </g>
  <g transform="translate(168 96)">
    <circle r="10" fill="#ef5350"/>
    <path d="M-4 -3 h5 v6 h-5 z M2 -2 l3 -2 v8 l-3 -2 z" fill="#ffffff"/>
  </g>
  <text x="106" y="124" text-anchor="middle" font-size="8" font-weight="600" fill="rgba(255,255,255,0.75)">screen sharing</text>

  <!-- Participant tiles -->
  <g>
    <rect x="216" y="20" width="74" height="50" rx="6" fill="#ffffff" stroke="rgba(0,150,136,0.45)" stroke-width="1.4"/>
    <circle cx="253" cy="40" r="10" fill="#009688"/>
    <path d="M239 62 a14 12 0 0 1 28 0 z" fill="rgba(0,150,136,0.55)"/>
  </g>
  <g>
    <rect x="298" y="20" width="74" height="50" rx="6" fill="#ffffff" stroke="rgba(0,150,136,0.45)" stroke-width="1.4"/>
    <circle cx="335" cy="40" r="10" fill="#ef5350"/>
    <path d="M321 62 a14 12 0 0 1 28 0 z" fill="rgba(239,83,80,0.5)"/>
  </g>
  <g>
    <rect x="216" y="80" width="74" height="50" rx="6" fill="#ffffff" stroke="rgba(0,150,136,0.45)" stroke-width="1.4"/>
    <circle cx="253" cy="100" r="10" fill="#00796B"/>
    <path d="M239 122 a14 12 0 0 1 28 0 z" fill="rgba(0,121,107,0.45)"/>
  </g>
  <g>
    <rect x="298" y="80" width="74" height="50" rx="6" fill="rgba(0,150,136,0.10)" stroke="rgba(0,150,136,0.45)" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="335" y="102" text-anchor="middle" font-size="8" font-weight="700" fill="#00796B">+ join</text>
    <text x="335" y="115" text-anchor="middle" font-size="7" fill="rgba(26,26,46,0.55)">anyone in the room</text>
  </g>

  <!-- Live badge -->
  <g transform="translate(30 20)">
    <rect x="-8" y="-9" width="52" height="18" rx="9" fill="#ef5350"/>
    <circle cx="2" cy="0" r="3.4" fill="#ffffff"/>
    <text x="12" y="3.5" font-size="8" font-weight="700" fill="#ffffff">LIVE</text>
  </g>
</svg>
