<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>The screen is captured, each hardware encoder is tried in order inside a child process until one opens, and the browser decodes the stream</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#009688"/>
    </marker>
    <linearGradient id="scr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0f2f1"/>
      <stop offset="1" stop-color="#b2dfdb"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0f2f1"/>
      <stop offset=".5" stop-color="#e8f5e9"/>
      <stop offset="1" stop-color="#e0f7fa"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="760" height="400" rx="18" fill="url(#panel)"/>

  <text x="380" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="#00796B">each encoder is tried in order until one actually opens</text>

  <!-- the screen -->
  <rect x="28" y="118" width="156" height="104" rx="9" fill="#1a1a2e"/>
  <rect x="36" y="126" width="140" height="84" rx="4" fill="url(#scr)"/>
  <rect x="44" y="134" width="70" height="44" rx="3" fill="#ffffff"/>
  <rect x="44" y="134" width="70" height="8" rx="3" fill="#4DB6AC"/>
  <rect x="50" y="148" width="50" height="4" rx="2" fill="#cfd8dc"/>
  <rect x="50" y="156" width="40" height="4" rx="2" fill="#cfd8dc"/>
  <rect x="50" y="164" width="56" height="4" rx="2" fill="#cfd8dc"/>
  <rect x="120" y="146" width="48" height="56" rx="3" fill="#ffffff"/>
  <rect x="120" y="146" width="48" height="8" rx="3" fill="#009688"/>
  <rect x="125" y="160" width="36" height="4" rx="2" fill="#cfd8dc"/>
  <rect x="125" y="168" width="28" height="4" rx="2" fill="#cfd8dc"/>
  <rect x="97" y="222" width="18" height="16" fill="#1a1a2e"/>
  <rect x="76" y="237" width="60" height="7" rx="3" fill="#1a1a2e"/>
  <text x="106" y="270" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a2e">the screen</text>
  <text x="106" y="289" text-anchor="middle" font-size="11.5" fill="#607d8b">captured at 60 fps</text>

  <line x1="192" y1="170" x2="250" y2="170" stroke="#009688" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- the cascade, inside the probe's child process -->
  <rect x="258" y="58" width="246" height="306" rx="12" fill="#ffffff" stroke="#4DB6AC" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="381" y="80" text-anchor="middle" font-size="11.5" fill="#00796B">tried in this order</text>

  <rect x="276" y="92" width="210" height="24" rx="12" fill="#eceff1"/>
  <text x="294" y="108.5" font-size="12.5" fill="#90a4ae">NVENC · NVIDIA</text>
  <text x="474" y="108.5" text-anchor="end" font-size="11.5" fill="#ef5350">✗ no GPU here</text>

  <rect x="276" y="122" width="210" height="24" rx="12" fill="#e0f2f1" stroke="#009688" stroke-width="1.5"/>
  <text x="294" y="138.5" font-size="12.5" font-weight="700" fill="#00796B">QSV · Intel</text>
  <text x="474" y="138.5" text-anchor="end" font-size="11.5" font-weight="700" fill="#2e7d32">✓ opened</text>

  <rect x="276" y="152" width="210" height="24" rx="12" fill="#f5f7fa"/>
  <text x="294" y="168.5" font-size="12.5" fill="#90a4ae">AMF · AMD</text>
  <rect x="276" y="182" width="210" height="24" rx="12" fill="#f5f7fa"/>
  <text x="294" y="198.5" font-size="12.5" fill="#90a4ae">VideoToolbox · Apple</text>
  <rect x="276" y="212" width="210" height="24" rx="12" fill="#f5f7fa"/>
  <text x="294" y="228.5" font-size="12.5" fill="#90a4ae">VAAPI · Linux</text>
  <rect x="276" y="242" width="210" height="24" rx="12" fill="#f5f7fa"/>
  <text x="294" y="258.5" font-size="12.5" fill="#90a4ae">D3D12 · Windows</text>
  <rect x="276" y="272" width="210" height="24" rx="12" fill="#f5f7fa"/>
  <text x="294" y="288.5" font-size="12.5" fill="#90a4ae">Vulkan · any GPU</text>

  <line x1="286" y1="308" x2="476" y2="308" stroke="#cfd8dc" stroke-width="1"/>
  <rect x="276" y="318" width="210" height="24" rx="12" fill="none" stroke="#b0bec5" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="381" y="334.5" text-anchor="middle" font-size="11.5" fill="#607d8b">software floor · OpenH264 · libvpx</text>

  <circle cx="226" cy="382" r="8" fill="#ffb300"/>
  <text x="226" y="386.5" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a2e">!</text>
  <text x="241" y="386.5" font-size="11.5" fill="#37474f">a driver that crashes takes down the probe, never the daemon</text>

  <line x1="512" y1="170" x2="570" y2="170" stroke="#009688" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="541" y="158" text-anchor="middle" font-size="11" fill="#00796B">WebRTC</text>

  <!-- the browser -->
  <rect x="578" y="108" width="160" height="124" rx="9" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.5"/>
  <path d="M578,128 L578,117 Q578,108 587,108 L729,108 Q738,108 738,117 L738,128 Z" fill="#eceff1"/>
  <circle cx="591" cy="118" r="3" fill="#ef5350"/>
  <circle cx="601" cy="118" r="3" fill="#ffb300"/>
  <circle cx="611" cy="118" r="3" fill="#4caf50"/>
  <rect x="590" y="136" width="136" height="84" rx="3" fill="url(#scr)"/>
  <rect x="597" y="143" width="66" height="42" rx="3" fill="#ffffff"/>
  <rect x="597" y="143" width="66" height="8" rx="3" fill="#4DB6AC"/>
  <rect x="603" y="157" width="46" height="4" rx="2" fill="#cfd8dc"/>
  <rect x="603" y="165" width="36" height="4" rx="2" fill="#cfd8dc"/>
  <rect x="603" y="173" width="52" height="4" rx="2" fill="#cfd8dc"/>
  <rect x="669" y="155" width="46" height="54" rx="3" fill="#ffffff"/>
  <rect x="669" y="155" width="46" height="8" rx="3" fill="#009688"/>
  <rect x="674" y="169" width="34" height="4" rx="2" fill="#cfd8dc"/>
  <rect x="674" y="177" width="26" height="4" rx="2" fill="#cfd8dc"/>
  <text x="658" y="260" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a2e">your browser</text>
  <text x="658" y="279" text-anchor="middle" font-size="11.5" fill="#607d8b">WebCodecs → canvas</text>
  <text x="658" y="298" text-anchor="middle" font-size="11.5" fill="#00796B">H.264 · HEVC · AV1 · VP9</text>
</svg>
