# The same pinned images as docker-compose.selfhost.yml, and for the same reasons:
# its header says why, and docs/self-hosting.md what each pin costs.
services:
  mongo:
    image: mongo:7.0.45@sha256:8bb4442761a63a8dda452744082cdac9644b429807eb977b42324a63cef59ca4
    ports:
      - "27019:27017"
    volumes:
      - roomler_ai_mongo_data:/data/db
    # LOCAL DEVELOPMENT ONLY. These defaults exist so `docker compose up` works
    # with no setup; they are published in this repo and must never reach a
    # reachable deployment. Override per-environment via a local .env
    # (gitignored) rather than editing this file.
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-roomler}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-local-dev-only-CHANGE-ME}

  redis:
    image: redis:7.4.12-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    ports:
      - "6379:6379"

  # The same pinned Chainguard build as docker-compose.selfhost.yml, and for the same reasons:
  # minio/minio is gone from Docker Hub (#2034), and a dev volume made by the old image is
  # root-owned.
  minio:
    image: ghcr.io/gjovanov/minio:RELEASE.2026-09-22T19-25-18Z@sha256:dc455cdd4db6e390b1b26514f15ff37681a777bf8dab41aac445a0259f751e56
    user: "0:0"
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    # LOCAL DEVELOPMENT ONLY — see the note on the mongo service above.
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-dev-only-CHANGE-ME}
    volumes:
      - minio_data:/data

  coturn:
    # The same pinned build as docker-compose.selfhost.yml (#3287).
    image: coturn/coturn:4.18.0-r0@sha256:bbefd3e1fdfdc0d58770fe01b581fd8b00d9f3a5580d00acb77cf719a6bc78e3
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/turnserver.conf:ro

volumes:
  roomler_ai_mongo_data:
  minio_data:

networks:
  roomler-ai-network:
    name: roomler-ai-network
