# No DashMap guard may be held across an `.await`, in any crate of the
# workspace.
#
# Such a guard does not park the task holding it. It parks the THREAD of every
# task that wants the same shard (dashmap's lock sleeps in parking_lot_core).
# A production pod has 2 CPUs, so tokio runs 2 worker threads. Once two tasks
# are parked behind a guard whose holder is waiting on I/O, no thread is left
# to poll the holder, and the whole runtime stops, `/health` with it, until the
# liveness probe kills the pod. A daemon on a 2-core device stops the same
# way. On 2026-10-27 a burst of meeting joins did this to production through
# `RoomManager::consume` (FR-127 P1.1, `docs/real-time.md`).
#
# Clone or collect what the await needs under the guard, drop the guard, then
# await. A guard released with `drop()` still counts: a value that was borrowed
# stays in the future's state until its scope ends, so put the guard in a block
# that ends before the await.
#
# ⚠️ This catches the common shape, not every shape. The lint matches the type of
# the value held, so it sees a bare guard (`let r = map.get(k)?`, `if let Some(r)`,
# `for e in map.iter()`) but NOT a guard inside an `Option` (a `map.get(k)` kept
# unwrapped), a `Result`, a tuple, a struct, or an iterator adapter
# (`map.iter().map(..)`). Measured in FR-127 P1.1's review: an `Option<RefMut>`
# held across the worker awaits passed clippy and froze the room manager's
# storm test. Read what the await needs into owned values first.
#
# `clippy::await_holding_invalid_type` is warn-by-default and CI denies
# warnings, so this is a build error. Clippy reads the nearest clippy.toml
# upward from each crate's manifest, so a crate that adds its own clippy.toml
# must repeat this list. A path that names a crate a package does not depend on
# is ignored.
#
# ⚠️ clippy 1.95 can panic while rendering this lint's findings when stderr is
# not a terminal (the build still fails). `cargo clippy --message-format=short`
# lists every finding without the snippets.
await-holding-invalid-types = [
    { path = "dashmap::mapref::one::Ref", reason = "clone what the await needs and drop the guard first (root clippy.toml)" },
    { path = "dashmap::mapref::one::RefMut", reason = "clone what the await needs and drop the guard first (root clippy.toml)" },
    { path = "dashmap::mapref::one::MappedRef", reason = "clone what the await needs and drop the guard first (root clippy.toml)" },
    { path = "dashmap::mapref::one::MappedRefMut", reason = "clone what the await needs and drop the guard first (root clippy.toml)" },
    { path = "dashmap::mapref::multiple::RefMulti", reason = "collect what the await needs and drop the iterator first (root clippy.toml)" },
    { path = "dashmap::mapref::multiple::RefMutMulti", reason = "collect what the await needs and drop the iterator first (root clippy.toml)" },
    { path = "dashmap::mapref::entry::Entry", reason = "finish the entry before awaiting (root clippy.toml)" },
    { path = "dashmap::mapref::entry::OccupiedEntry", reason = "finish the entry before awaiting (root clippy.toml)" },
    { path = "dashmap::mapref::entry::VacantEntry", reason = "finish the entry before awaiting (root clippy.toml)" },
    { path = "dashmap::iter::Iter", reason = "collect what the await needs and drop the iterator first (root clippy.toml)" },
    { path = "dashmap::iter::IterMut", reason = "collect what the await needs and drop the iterator first (root clippy.toml)" },
]

# A removed thing answers nothing (#3327, docs/security-baseline.md).
#
# Soft-deleted rows stay in their collection with a `deleted_at`, so a lookup
# by id finds them unless it asks for live rows. `BaseDao::find_by_id_in_tenant`
# answers live rows only. The tombstone-inclusive lookup is
# `find_any_by_id_in_tenant`, and only a reader whose job is the tombstone may
# use it: a refusal that must tell a removed device why (or it retries a bare
# 401 forever), and an audit view of a removed thing. Each such reader is a
# named DAO method (the `find_any_in_tenant`s) carrying
# `#[expect(clippy::disallowed_methods, reason = "...")]` and a doc comment
# saying why. A route that called it directly (through `base`) is how the
# External access routes reopened the device hole after #1821 (#3322).
#
# ⚠️ This catches a call of that method, not every way to read a tombstone:
# the tenant-less `BaseDao::find_by_id` and a hand-written `find_one` filter
# are not covered.
disallowed-methods = [
    { path = "roomler_ai_services::dao::base::BaseDao::find_any_by_id_in_tenant", reason = "the tombstone-inclusive lookup: call it only from a named DAO reader that says why it must see a removed row, under #[expect] (root clippy.toml, #3327)" },
]
