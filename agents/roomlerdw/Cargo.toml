[package]
name = "roomlerdw"
license = "MPL-2.0"
publish = false
version.workspace = true
edition.workspace = true
description = "Windowless launcher the per-user Scheduled Task runs, so the daemon opens no console on the desktop (#3292)."

# The per-user MSI installs this beside roomlerd.exe. The name carries the `w`
# of pythonw.exe and javaw.exe, and it must keep dodging "install", "setup",
# "update" and "patch": Windows UAC's installer detection elevates by file name.
[[bin]]
name = "roomlerdw"
path = "src/main.rs"

# No lib target, so cargo derives no test-binary name from one (CLAUDE.md's
# "UAC naming rule").

[dependencies]

# build.rs embeds a Windows VERSIONINFO resource: this runs on every per-user
# Windows host, and AV consoles, Task Manager and AppLocker read it there. See
# agents/roomlerd/Cargo.toml for the embed-resource-vs-winresource rationale.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[target.'cfg(target_os = "windows")'.dependencies]
# The job object and the shutdown order only. Bindings-only, on the 0.59 line the
# agent already compiles in every Windows build.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
