# cargo-deny — dependency licence policy (FR-24).
#
# This file governs what our DEPENDENCIES may be licensed under. Our own split
# (AGPL server / MPL client) lives in scripts/licence-classes.sh.
#
# The rule it encodes: nothing in the tree may impose obligations we have not
# read and accepted. A new dependency under an unvetted licence fails the build
# rather than shipping quietly.

[graph]
all-features = true

[licenses]
# Anything not listed is denied. `confidence-threshold` is the default 0.8.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]

# ⚠️ Deliberately NOT allowed, and why — do not add one of these without
# reading the obligation it carries:
#
#   GPL-2.0 / GPL-3.0  viral to the whole binary; would make the MPL promise on
#                      the agent (LICENSING.md, the MSP answer) untrue.
#   LGPL-*             permitted ONLY for the FFmpeg libraries, which are not
#                      cargo dependencies — they are vendored system libraries
#                      handled in THIRD-PARTY-NOTICES.md with a written relink
#                      offer. A cargo crate under LGPL is a different problem
#                      and must be reviewed by hand.
#   SSPL / BUSL / FSL  not open source; commercial-use restrictions.
#   CC-BY-NC-*         non-commercial.

exceptions = []

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "allow"   # tracked separately; not a licence concern
wildcards = "allow"

[advisories]
# Advisory policy is owned by `cargo audit` in the security lane, not here.
# Listing it explicitly keeps cargo-deny from failing this job on a CVE that
# the security lane already tracks with its own accepted-risk notes.
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "allow"   # the vendored webrtc-rs forks are path deps, not git
