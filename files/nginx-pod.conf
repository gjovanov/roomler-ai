server {
    listen 80;
    server_name _;
    root /var/www/roomler-ai;
    index index.html;

    client_max_body_size 100m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml application/wasm;
    gzip_min_length 256;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=*, microphone=*, display-capture=*" always;
    # HSTS: belt to the edge nginx (which already sends it) — covers direct
    # pod access and any future exposure path.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP tuned to what the SPA actually does: no third-party scripts;
    # Vuetify injects <style> tags (style-src 'unsafe-inline'); avatars/Giphy
    # load images from arbitrary https hosts; WS + API on self/wss; the rc
    # decode workers are same-origin module chunks (blob: as belt for inline
    # workers); MediaStreams bind via srcObject and are not CSP-governed.
    # frame-ancestors mirrors X-Frame-Options SAMEORIGIN.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' wss: https:; worker-src 'self' blob:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # Hashed static assets — cache aggressively (Vite content-hashed filenames)
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA — serve static files, fallback to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to Rust backend
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100m;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    # Health endpoints (direct to Rust). `= /health` is the cheap liveness
    # check; `= /health/ready` is the readiness/dependency check (Mongo +
    # Redis + pub/sub subscriber). Both exact — the SPA fallback must never
    # answer a probe.
    location = /health {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    location = /health/ready {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    # WebSocket proxy
    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # DERP overlay relay — the pubkey-addressed WS carrier for the
    # both-UDP-blocked overlay tier (NAT-traversal Phase D). A dedicated
    # location (NOT folded into /ws) so line-rate WG data can't head-of-line-
    # block the control channel; same WS-upgrade + long-idle timeouts. Without
    # this the SPA `location /` fallback would serve index.html to the upgrade.
    location /derp {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
