# Ephemeral MinIO for e2e. Same emptyDir treatment as MongoDB.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  labels:
    app: minio
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          # minio/minio is gone from Docker Hub (#2034): the self-host compose's pinned Chainguard
          # build. emptyDir is world-writable, so its default non-root user is fine here.
          image: ghcr.io/gjovanov/minio:RELEASE.2026-09-22T19-25-18Z@sha256:dc455cdd4db6e390b1b26514f15ff37681a777bf8dab41aac445a0259f751e56
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - containerPort: 9000
            - containerPort: 9001
          envFrom:
            - secretRef:
                name: minio-secret
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 1Gi
