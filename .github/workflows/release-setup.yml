name: Release roomler-setup

# Builds the unified `roomler-setup` Tauri 2 wizard for the three
# desktop targets the operator might run on:
#   - Linux x86_64 (gtk + webkit2gtk) — packaged as `.tar.gz`
#   - macOS universal (x86_64 + aarch64 lipo'd) — packaged as `.tar.gz`
#   - Windows x86_64 (msvc + webview2 auto-bootstrap) — SIGNED EXE in a `.zip`
#
# The unified wizard superseded the two legacy wizard EXEs, retired
# in P4c-2 (roomler-installer = agent/daemon, roomler-tunnel-installer
# = tunnel CLI). On Windows it offers all roles (daemon perMachine-SCM
# / perUser-task / perMachine + tunnel-client); on Linux/macOS only
# the tunnel-client role is functional (the daemon roles are MSI-only).
#
# Tag schema: `setup-v<workspace_version>` — a family INDEPENDENT
# of agent-v* / tunnel-v*. Workspace Cargo.toml
# version is the source of truth (validate-version enforces it). The
# api's `/api/setup/<platform>` proxy (routes/setup_release.rs) serves
# the published assets via its 1h cache; `pick_setup_asset` requires
# the exact `roomler-setup-<v>-<triple>.<ext>` names produced below
# (windows→.zip, linux→.tar.gz, macos→.tar.gz).
#
# Windows signing is REQUIRED (the wizard downloads MSIs + invokes
# msiexec — corporate ESET/Defender quarantine an unsigned downloader
# as a "downloader trojan"; rc.28 BLOCKER-10). It runs through
# ./.github/actions/sign-windows (Azure Artifact Signing over OIDC; the
# signing job carries `environment: release` — the federated credential
# is bound to that GitHub environment) and HARD-FAILS on a release tag.
# A credential-less dispatch run still succeeds with a ::warning:: so
# packaging can be iterated. macOS ships a signed + notarised + STAPLED
# `Roomler Setup.app` inside the tarball (same asset name — the wizard
# is the one binary users double-click from Finder, so it gets full
# offline Gatekeeper validation). See docs/code-signing.md.
#
# Triggered by:
#  - `git push` of a tag matching `setup-v*` → publishes a GitHub Release.
#  - `workflow_dispatch` with `version` + `publish_release` → artifacts
#    only (30-day retention) unless `publish_release=true`.

on:
  push:
    tags:
      - 'setup-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Setup wizard version (e.g. 0.3.0-rc.196) — must match workspace Cargo.toml'
        required: true
      publish_release:
        description: 'Create a GitHub Release with the artifacts'
        type: boolean
        default: false
      signing_mode:
        description: 'Windows signing: auto (azure if configured) | azure | local (self-signed rehearsal) | off'
        type: choice
        options: [auto, local, azure, 'off']
        default: auto
      require_signing:
        description: 'Fail the job if artifacts end up unsigned (rehearses the release-tag gate)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 0. Validate version matches Cargo.toml
  # ---------------------------------------------------------------------------
  validate-version:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      is_release: ${{ steps.resolve.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version + tag
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#setup-v}"
            is_release=true
          else
            version="${{ github.event.inputs.version }}"
            tag="setup-v${version}"
            if [[ "${{ github.event.inputs.publish_release }}" == "true" ]]; then
              is_release=true
            else
              is_release=false
            fi
          fi
          echo "Resolved: version=${version} tag=${tag} is_release=${is_release}"
          cargo_version=$(awk '
            /^\[workspace\.package\]/ {in_section=1; next}
            /^\[/ {in_section=0}
            in_section && /^version[[:space:]]*=/ {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)
          echo "Cargo.toml workspace version: ${cargo_version}"
          if [[ "${cargo_version}" != "${version}" ]]; then
            echo "::error::Version mismatch: requested ${version} but Cargo.toml has ${cargo_version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}"         >> "$GITHUB_OUTPUT"
          echo "is_release=${is_release}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 1. Linux x86_64 — Tauri webkit2gtk needs apt-installed deps
  # ---------------------------------------------------------------------------
  build-linux:
    name: Build wizard (Linux x86_64)
    needs: validate-version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
      - name: Cache cargo
        continue-on-error: true
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: setup-linux
          # Tag-ref cache saves can never be restored by a future tag run
          # (GH cache isolation: own ref or default branch only) — only
          # non-tag runs (dispatch rehearsals on master) save.
          save-if: ${{ github.ref_type != 'tag' }}
      - name: Install Tauri Linux system deps
        # webkit2gtk + libsoup + ayatana; librsvg2 for icon decode. Same
        # set as the legacy tunnel wizard (roomler-setup pulls the same
        # Tauri Linux runtime). roomler-agent comes in with DEFAULT
        # features (signalling-only) — no vcpkg/FFmpeg/libvpx needed.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf
      - name: Build wizard (release)
        run: cargo build -p roomler-setup --release
      - name: Strip binary
        run: strip target/release/roomler-setup
      - name: Pack tarball
        id: tar
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate-version.outputs.version }}"
          name="roomler-setup-${version}-x86_64-unknown-linux-gnu"
          mkdir -p "/tmp/${name}"
          cp target/release/roomler-setup "/tmp/${name}/"
          cp LICENSE README.md "/tmp/${name}/" 2>/dev/null || true
          (cd /tmp && tar czf "${name}.tar.gz" "${name}")
          sha256sum "/tmp/${name}.tar.gz" | awk '{print $1"  "$2}' > "/tmp/${name}.tar.gz.sha256"
          mv "/tmp/${name}.tar.gz" "/tmp/${name}.tar.gz.sha256" .
          echo "artifact=${name}.tar.gz" >> "$GITHUB_OUTPUT"
      - name: Upload Linux wizard artifact
        uses: actions/upload-artifact@v4
        with:
          name: setup-linux-x86_64
          path: |
            ${{ steps.tar.outputs.artifact }}
            ${{ steps.tar.outputs.artifact }}.sha256
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 2. macOS — universal binary (x86_64 + aarch64 lipo'd) + tarball
  # ---------------------------------------------------------------------------
  build-macos:
    name: Build wizard (macOS universal)
    needs: validate-version
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - name: Cache cargo
        continue-on-error: true
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: setup-macos
          save-if: ${{ github.ref_type != 'tag' }}
      - name: Build wizard x86_64
        run: cargo build -p roomler-setup --release --target x86_64-apple-darwin
      - name: Build wizard aarch64
        run: cargo build -p roomler-setup --release --target aarch64-apple-darwin
      - name: Lipo into universal
        run: |
          mkdir -p target/release-universal
          lipo -create -output target/release-universal/roomler-setup \
            target/x86_64-apple-darwin/release/roomler-setup \
            target/aarch64-apple-darwin/release/roomler-setup
          strip target/release-universal/roomler-setup
          file target/release-universal/roomler-setup

      # Wrap the universal binary in a .app BEFORE signing.
      #
      # This is the one Roomler binary a user genuinely double-clicks from
      # Finder, i.e. the worst Gatekeeper case, and a bare Mach-O cannot carry
      # a stapled notarisation ticket (Apple only staples bundles/.dmg/.pkg).
      # A bundle can -- and the ticket lands as a regular file inside it, so
      # it survives the tar round-trip and the wizard validates even on an
      # offline Mac. A relative symlink keeps the documented `./roomler-setup`
      # invocation working, and the ARCHIVE NAME is unchanged so
      # `pick_setup_asset` (setup_release.rs) is untouched.
      - name: Stage .app bundle
        id: app
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate-version.outputs.version }}"
          APP="/tmp/stage/Roomler Setup.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/release-universal/roomler-setup "$APP/Contents/MacOS/roomler-setup"
          chmod 755 "$APP/Contents/MacOS/roomler-setup"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>          <string>roomler-setup</string>
              <key>CFBundleIdentifier</key>          <string>ai.roomler.setup</string>
              <key>CFBundleName</key>                <string>Roomler Setup</string>
              <key>CFBundleShortVersionString</key>  <string>${version}</string>
              <key>CFBundleVersion</key>             <string>${version}</string>
              <key>CFBundlePackageType</key>         <string>APPL</string>
              <key>LSMinimumSystemVersion</key>      <string>12.0</string>
              <key>NSPrincipalClass</key>            <string>NSApplication</string>
          </dict>
          </plist>
          PLIST
          echo "path=$APP" >> "$GITHUB_OUTPUT"

      - name: Sign + notarise the wizard bundle
        uses: ./.github/actions/sign-macos
        with:
          bundle-path:          ${{ steps.app.outputs.path }}
          require:              ${{ needs.validate-version.outputs.is_release == 'true' }}
          app-p12-base64:       ${{ secrets.APPLE_DEVELOPER_ID_APP_P12_BASE64 }}
          installer-p12-base64: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12_BASE64 }}
          cert-password:        ${{ secrets.APPLE_CERT_PASSWORD }}
          api-key-id:           ${{ secrets.APPLE_API_KEY_ID }}
          api-issuer-id:        ${{ secrets.APPLE_API_ISSUER_ID }}
          api-key-p8-base64:    ${{ secrets.APPLE_API_KEY_P8_BASE64 }}

      - name: Pack tarball
        id: tar
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate-version.outputs.version }}"
          name="roomler-setup-${version}-universal-apple-darwin"
          mkdir -p "/tmp/${name}"
          cp -R "/tmp/stage/Roomler Setup.app" "/tmp/${name}/"
          # Keep `./roomler-setup` working (docs + muscle memory) while the
          # real, stapled code lives in the bundle.
          ln -s "Roomler Setup.app/Contents/MacOS/roomler-setup" "/tmp/${name}/roomler-setup"
          cp LICENSE README.md "/tmp/${name}/" 2>/dev/null || true
          # `tar` preserves the symlink and the stapled ticket; COPYFILE_DISABLE
          # stops bsdtar emitting ._ AppleDouble files alongside every entry.
          (cd /tmp && COPYFILE_DISABLE=1 tar czf "${name}.tar.gz" "${name}")
          shasum -a 256 "/tmp/${name}.tar.gz" | awk '{print $1"  "$2}' > "/tmp/${name}.tar.gz.sha256"
          mv "/tmp/${name}.tar.gz" "/tmp/${name}.tar.gz.sha256" .
          echo "artifact=${name}.tar.gz" >> "$GITHUB_OUTPUT"

      # The whole point of the .app: prove the ticket survived tar/untar, so
      # the wizard validates offline. A bare-binary tarball cannot pass this.
      - name: Verify the stapled ticket survives a tar round-trip
        if: needs.validate-version.outputs.is_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/roundtrip && mkdir -p /tmp/roundtrip
          tar xzf "${{ steps.tar.outputs.artifact }}" -C /tmp/roundtrip
          app="$(find /tmp/roundtrip -maxdepth 3 -name '*.app' -type d | head -n1)"
          [ -n "$app" ] || { echo "::error::no .app found in the packed tarball"; exit 1; }
          xcrun stapler validate "$app"
          spctl -a -vvv "$app" 2>&1 | tee /tmp/spctl.txt
          grep -q 'source=Notarized Developer ID' /tmp/spctl.txt \
            || { echo "::error::extracted wizard is not Gatekeeper-clean"; exit 1; }
      - name: Upload macOS wizard artifact
        uses: actions/upload-artifact@v4
        with:
          name: setup-macos-universal
          path: |
            ${{ steps.tar.outputs.artifact }}
            ${{ steps.tar.outputs.artifact }}.sha256
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 3. Windows x86_64 — SIGN the EXE, then zip it (pick_setup_asset wants .zip)
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build wizard (Windows x86_64)
    needs: validate-version
    runs-on: windows-latest
    timeout-minutes: 60
    # The signing federated credential is bound to this GitHub environment
    # (the tenant rejects wildcard tag subjects) — do not remove.
    environment: release
    permissions:
      contents: read
      id-token: write     # azure/login OIDC inside ./.github/actions/sign-windows
    env:
      VERSION: ${{ needs.validate-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
      - name: Cache cargo
        continue-on-error: true
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: setup-windows
          save-if: ${{ github.ref_type != 'tag' }}
      - name: Build wizard (release)
        shell: pwsh
        # Static CRT: the wizard is a double-click EXE extracted from a
        # zip onto arbitrary fresh machines -- it must not assume the
        # MSVC runtime (vcruntime140*.dll) exists there (field report
        # 2026-07-28: loader dialog on a box without the VC++ redist).
        # The wizard graph is pure Rust (agent DEFAULT features, no
        # vcpkg /MD libs), so +crt-static is safe; link-verified
        # against the Tauri 2 stack.
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build -p roomler-setup --release
      # Sign BEFORE zipping, so the EXE the operator extracts is the signed
      # one. This is the artifact rc.28 BLOCKER-10 was about: a downloader
      # that fetches MSIs and shells out to msiexec is exactly the shape
      # corporate ESET/Defender quarantine when it has no publisher.
      - name: Sign the wizard EXE
        id: sign
        uses: ./.github/actions/sign-windows
        with:
          files:                    target\release\roomler-setup.exe
          description:              'Roomler Setup'
          mode:                     ${{ github.event.inputs.signing_mode || 'auto' }}
          require:                  ${{ needs.validate-version.outputs.is_release == 'true' || github.event.inputs.require_signing == 'true' }}
          expect-subject-contains:  ${{ vars.AZURE_SIGNING_EXPECT_SUBJECT }}
          endpoint:                 ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name:     ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          azure-client-id:          ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id:          ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id:    ${{ vars.AZURE_SUBSCRIPTION_ID }}
          local-pfx-base64:         ${{ secrets.WIN_TEST_PFX_BASE64 }}
          local-pfx-password:       ${{ secrets.WIN_TEST_PFX_PASSWORD }}
        env:
          WIN_CODESIGN_PFX_BASE64: ${{ secrets.WIN_CODESIGN_PFX_BASE64 }}
      - name: Pack zip
        id: zip
        shell: pwsh
        run: |
          $version = "${{ needs.validate-version.outputs.version }}"
          # Stable name (no -unsigned suffix): pick_setup_asset matches on
          # `contains(x86_64-pc-windows-msvc) && endsWith(.zip)`, and the
          # health endpoint returns whatever filename exists — a stable
          # name keeps the operator-facing URI deterministic. Signed-ness
          # is a property of the EXE inside, surfaced in the release notes.
          $name = "roomler-setup-$version-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\$name" -Force | Out-Null
          Copy-Item target\release\roomler-setup.exe "$env:RUNNER_TEMP\$name\"
          if (Test-Path LICENSE) { Copy-Item LICENSE "$env:RUNNER_TEMP\$name\" }
          if (Test-Path README.md) { Copy-Item README.md "$env:RUNNER_TEMP\$name\" }
          Compress-Archive -Path "$env:RUNNER_TEMP\$name\*" -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File "$name.zip.sha256" -Encoding ascii
          "artifact=$name.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Upload Windows wizard artifact
        uses: actions/upload-artifact@v4
        with:
          name: setup-windows-x86_64
          path: |
            ${{ steps.zip.outputs.artifact }}
            ${{ steps.zip.outputs.artifact }}.sha256
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 4. Publish GitHub Release
  # ---------------------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release
    needs: [validate-version, build-linux, build-macos, build-windows]
    if: needs.validate-version.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sigstore identity for the provenance attestation
      attestations: write  # actions/attest-build-provenance
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten + list
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) -exec cp {} release/ \;
          ls -la release/
      # GPG + provenance: same pattern as release-agent.yml -- .asc detached
      # signatures when the key is configured, SLSA provenance always.
      - name: GPG-sign release artifacts
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE:  ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "::notice::GPG_PRIVATE_KEY not configured -- publishing without .asc signatures."
            exit 0
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          for f in release/*; do
            case "$f" in *.asc|*.sha256) continue ;; esac
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
                --armor --detach-sign "$f"
          done
          gpg --batch --armor --export > release/roomler-release-pubkey.asc
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: 'release/*'
      - name: Create / update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-version.outputs.tag }}
          name: roomler-setup ${{ needs.validate-version.outputs.version }}
          draft: false
          # prerelease:true for rc/alpha/beta — unlike the agent (whose
          # updater polls /releases/latest and so must be non-prerelease),
          # the `/api/setup` proxy filters by the `setup-v` prefix with a
          # prerelease fallback (setup_release.rs pick_release_for), so an
          # rc setup release is served fine while the repo's "Latest"
          # badge correctly stays on the agent release.
          prerelease: ${{ contains(needs.validate-version.outputs.version, 'rc.') || contains(needs.validate-version.outputs.version, 'alpha') || contains(needs.validate-version.outputs.version, 'beta') }}
          body: |
            Automated build of the unified `roomler-setup` wizard ${{ needs.validate-version.outputs.version }} via
            [release-setup.yml](.github/workflows/release-setup.yml).

            **Download / run:**
            - Windows x86_64: `.zip` containing a signed `roomler-setup.exe` — extract + double-click.
            - Linux x86_64: `.tar.gz` — extract, run `./roomler-setup`.
            - macOS universal (x86_64 + aarch64): `.tar.gz` — extract, then open `Roomler Setup.app`
              (or run `./roomler-setup`, a symlink into the bundle). The app is Developer-ID-signed,
              notarised and stapled, so Gatekeeper accepts it even offline — no `xattr` workaround.

            **What the wizard does:** pick a role, detect existing installs, paste an enrollment token, and it
            resolves → downloads → verifies → installs → enrolls the node. On Windows the daemon roles
            (be-accessed: perMachine-SCM / perUser / perMachine + SystemContext) run the agent MSI (which
            carries the `roomler` CLI); every OS offers the tunnel-client role (reach-others). A terminal
            equivalent is served at `roomler.ai/api/setup/install.sh` (Linux/macOS) and
            `roomler.ai/api/setup/install.ps1` (Windows).
          files: release/*

  # ---------------------------------------------------------------------------
  # Bust the roomler.ai release cache — see the long-form rationale in
  # release-agent.yml. `/api/{agent,tunnel,setup}/latest-release` share ONE
  # per-pod cache, so every release family needs this step; one POST busts
  # every pod (the receiving pod fans out over the C-1 control bus).
  # Non-blocking: the 15-minute cache TTL is the backstop.
  # ---------------------------------------------------------------------------
  refresh-release-cache:
    name: Refresh roomler.ai release cache
    if: needs.validate-version.outputs.is_release == 'true'
    needs: [validate-version, publish-release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/releases/refresh
        env:
          TOKEN: ${{ secrets.ROOMLER_RELEASE_REFRESH_TOKEN }}
          TAG: ${{ needs.validate-version.outputs.tag }}
        run: |
          set -uo pipefail
          if [ -z "${TOKEN}" ]; then
            echo "::notice::ROOMLER_RELEASE_REFRESH_TOKEN unset (fork?); skipping cache refresh"
            exit 0
          fi
          for attempt in 1 2 3; do
            body=$(curl -sS -m 90 -X POST \
              -H "Authorization: Bearer ${TOKEN}" \
              "https://roomler.ai/api/releases/refresh?expect_tag=${TAG}")
            if [ "$(jq -r '.all_ok' <<<"$body" 2>/dev/null)" = "true" ]; then
              jq . <<<"$body"
              echo "Release cache refreshed on every live pod for ${TAG}"
              exit 0
            fi
            echo "attempt ${attempt}: ${body:-<no response>}"
            sleep 10
          done
          echo "::warning::release cache refresh did not confirm on every pod for ${TAG}; the cache TTL will heal it within 15 min"
