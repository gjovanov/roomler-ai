name: ci3698-probe
# Throwaway diagnostic for #3698 (removed before the PR is ready): what the
# cached-apt cold path waits on, read on the same runner image the lint job uses.
on:
  push:
    branches: [fix/ci-apt-cache-miss-hang]
    paths: ['.github/workflows/ci3698-probe.yml']
permissions:
  contents: read
jobs:
  cold-path:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Image, resolvers, the image's own (stale) index
        shell: bash
        run: |
          set +e
          date -u
          . /etc/os-release; echo "$PRETTY_NAME  ImageVersion=${ImageVersion:-?}"
          echo "--- /etc/apt/apt-mirrors.txt"; cat /etc/apt/apt-mirrors.txt
          echo "--- sources"; ls /etc/apt/sources.list.d/; grep -h -E '^(URIs|Suites|Types)' /etc/apt/sources.list.d/*.sources 2>/dev/null | head -20
          echo "--- /etc/resolv.conf"; grep -v '^#' /etc/resolv.conf
          echo "--- resolvectl"; resolvectl status 2>&1 | head -30
          echo "--- aria2c / apt-fast present?"; command -v aria2c apt-fast; aria2c --version | head -1
          echo "--- candidates from the IMAGE index (nothing refreshed yet)"
          apt-cache policy libsoup-3.0-dev libglib2.0-dev libwebkit2gtk-4.1-dev | grep -E '^[a-z]|Candidate'

      - name: DNS and reachability matrix
        shell: bash
        run: |
          set +e
          q() { # host [resolver]
            local out st qt ans
            out=$(timeout 20 dig +time=4 +tries=1 +noall +comments +answer +stats "$1" A ${2:+@$2} 2>&1)
            st=$(grep -o 'status: [A-Z]*' <<<"$out" | head -1)
            qt=$(grep -o 'Query time: [0-9]* msec' <<<"$out")
            ans=$(grep -E '[[:space:]]IN[[:space:]]+A[[:space:]]' <<<"$out" | awk '{print $NF}' | tr '\n' ' ')
            echo "dig $1 ${2:+@$2} :: ${st:-NO-STATUS: $(head -c 100 <<<"$out" | tr '\n' ' ')} ${qt} :: ${ans}"
          }
          for h in azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com ports.ubuntu.com ubuntu.com github.com; do
            for r in "" 168.63.129.16 1.1.1.1 8.8.8.8; do q "$h" "$r"; done
          done
          echo "--- getent (the libc path apt uses), timed"
          for h in azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com; do
            s=$(date +%s%N); r=$(timeout 40 getent ahostsv4 "$h" | head -1); e=$(date +%s%N)
            echo "getent $h -> ${r:-FAILED} ($(( (e - s) / 1000000 )) ms)"
          done
          echo "--- HTTP by name"
          for u in http://azure.archive.ubuntu.com/ubuntu/dists/resolute/InRelease http://archive.ubuntu.com/ubuntu/dists/resolute/InRelease http://security.ubuntu.com/ubuntu/dists/resolute-security/InRelease; do
            echo "$u -> $(curl -sS -m 25 -o /dev/null -w 'http=%{http_code} t=%{time_total}s' "$u" 2>&1 | tr '\n' ' ')"
          done

      - name: apt-get update exactly as the composite does it, timed
        shell: bash
        run: |
          set +e
          echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/80-ci-retries
          t0=$(date +%s)
          timeout 420 sudo apt-get update -qq 2>&1 | tail -20
          echo "apt-get update rc=${PIPESTATUS[0]} took $(( $(date +%s) - t0 )) s"
          echo "--- candidates AFTER the update"
          apt-cache policy libsoup-3.0-dev libglib2.0-dev libwebkit2gtk-4.1-dev | grep -E '^[a-z]|Candidate'

      - name: Start a process watcher (writes to a file; read back at the end)
        shell: bash
        run: |
          nohup bash -c '
            while :; do
              echo "=== $(date -u +%T)"
              ps -eo pid,ppid,etimes,stat,args --sort=start_time | grep -E "apt|aria2|dpkg|install_and_cache|post_cache|curl|wget|tar " | grep -v -E "grep|ps -eo" | cut -c1-260
              echo "-- /tmp/apt-fast.list (head)"; head -c 500 /tmp/apt-fast.list 2>/dev/null; echo
              echo "-- sockets"; sudo ss -tupn 2>/dev/null | grep -E "aria2|apt|methods" | head -6
              echo "-- downloaded so far"; ls /var/cache/apt-fast 2>/dev/null | wc -l; ls /var/cache/apt/archives/*.deb 2>/dev/null | wc -l
              sleep 30
            done' > /tmp/ci3698-watch.log 2>&1 &
          echo "watcher started"

      - name: The real cache-apt-pkgs-action, forced miss, 7 min ceiling
        id: act
        continue-on-error: true
        timeout-minutes: 7
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libglib2.0-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev pkg-config
          version: probe-3698-${{ github.run_id }}

      - name: What the cold path was doing
        if: always()
        shell: bash
        run: |
          set +e
          echo "action outcome: ${{ steps.act.outcome }}"
          echo "--- ~/cache-apt-pkgs"; ls -la ~/cache-apt-pkgs/ 2>&1 | head -20
          echo "--- install.log (apt-fast's stdout; the action sends it to this file)"
          wc -l ~/cache-apt-pkgs/install.log 2>&1
          tail -n 60 ~/cache-apt-pkgs/install.log 2>&1 | cut -c1-300
          echo "--- /tmp/apt-fast.list"; head -c 1500 /tmp/apt-fast.list 2>&1
          echo; echo "--- /etc/apt-fast.conf (non-comment)"; grep -v '^\s*#' /etc/apt-fast.conf 2>&1 | grep -v '^\s*$'
          echo "--- processes now"; ps -eo pid,ppid,etimes,stat,args --sort=start_time | grep -E "apt|aria2|dpkg|install_and_cache|post_cache" | grep -v grep | cut -c1-260
          echo "--- watcher log (last 120 lines)"; tail -n 120 /tmp/ci3698-watch.log

  plain-apt:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Plain apt-get as the existing fallback runs it, bounded
        shell: bash
        run: |
          set +e
          date -u
          echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/80-ci-retries
          t0=$(date +%s)
          timeout 300 sudo apt-get update -qq 2>&1 | tail -12
          echo "update rc=${PIPESTATUS[0]} took $(( $(date +%s) - t0 )) s"
          apt-cache policy libsoup-3.0-dev | sed -n 1,6p
          t0=$(date +%s)
          timeout 600 sudo apt-get install -y --no-install-recommends libglib2.0-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev pkg-config 2>&1 | tail -25
          echo "install rc=${PIPESTATUS[0]} took $(( $(date +%s) - t0 )) s"
          pkg-config --exists glib-2.0 webkit2gtk-4.1 && echo "GTK: present" || echo "GTK: MISSING"
          echo "--- the superseded libsoup the stale index names"
          cd "$(mktemp -d)" && timeout 90 apt-get download libsoup-3.0-dev=3.6.6-1ubuntu0.1 2>&1 | tail -5; echo "download-old rc=${PIPESTATUS[0]}"
