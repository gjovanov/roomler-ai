name: Release roomler-agent

# Builds per-OS installers for the roomler-agent binary (MSI on Windows,
# notarised .pkg on macOS, .deb on Linux). Triggered either by pushing a
# tag matching `agent-v*` (publishes a GitHub Release) or manually via
# workflow_dispatch (uploads workflow artifacts for 30-day retention).
#
# Windows signing goes through ./.github/actions/sign-windows (Azure Artifact
# Signing over GitHub OIDC — no key material is stored in this repository).
# Signedness is a VERIFIED property of the bytes, never a filename suffix and
# never "a secret happened to be set": the action re-reads every signature
# with `signtool verify /pa /all` and, on a release run, FAILS the job rather
# than publishing unsigned. Dispatch runs without credentials still succeed
# with a ::warning:: so packaging can be iterated.
#
# The signing jobs carry `environment: release` — the Entra federated
# credential is bound to that GitHub environment (this tenant rejects
# wildcard tag-subject credentials), so removing the environment line breaks
# the OIDC exchange for azure-mode signing.
#
# Rehearse for free with `signing_mode: local` and the self-signed cert from
# scripts/signing/50-selfsigned-dev-cert.ps1. Setup + background:
# docs/code-signing.md.

on:
  push:
    tags:
      - 'agent-v*'
  schedule:
    # Weekly cache-seed rehearsal (Mon 03:17 UTC) — an artifacts-only run
    # on master whose Swatinem saves land on the MASTER ref, the only ref
    # tag builds can restore from (see the save-if comments below). Keeps
    # the seed alive across toolchain bumps (which rotate the cache env
    # hash and orphan every prior seed — exactly what left tag builds
    # fully cold from 2026-07-15 to rc.208) and the 7-day unused-cache
    # expiry. seed-release-caches.yml additionally dispatches the same
    # rehearsal immediately when rust-toolchain.toml or this file changes.
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: 'Agent version (e.g. 0.1.0) — must match workspace Cargo.toml'
        required: true
      publish_release:
        description: 'Create a GitHub Release with the artifacts'
        type: boolean
        default: false
      signing_mode:
        description: 'Windows signing: auto (azure if configured) | azure | local (self-signed rehearsal) | off'
        type: choice
        options: [auto, local, azure, 'off']
        default: auto
      require_signing:
        description: 'Fail the job if artifacts end up unsigned (rehearses the release-tag gate)'
        type: boolean
        default: false

permissions:
  contents: write
  # actions:write is for the `reseed` job's workflow_dispatch. (The #485
  # "delete BEFORE restore" seed steps are gone: cache keys now carry a
  # per-Cargo.lock suffix, so saves always land under a fresh key and
  # restores prefix-fall-back to the newest generation — no absent-key
  # window, no forced-cold rehearsals.)
  actions: write

# Runner-queue hygiene (2026-08-20, run 32363354465): rc.424's Windows MSI
# job sat QUEUED for 70 minutes — a release burst (3 tag runs in 20 min +
# installer-smoke ×3 + a Windows job on every CI run) plus a reseed
# rehearsal per release (2 more Windows jobs each) stacked past the
# account's concurrent-job cap. Rehearsals exist only for their final
# cache save and only the NEWEST one matters, so they share one
# cancel-in-progress group: a fresh reseed cancels its superseded
# predecessor instead of queueing behind it. Tag builds and explicit
# publishes get a unique group and are NEVER cancelled. (A cancelled
# rehearsal triggers no seed-failure alert — the alert keys on
# failure, not cancellation — and its lost save is exactly the
# generation the newer rehearsal supersedes.)
concurrency:
  group: >-
    ${{ (github.event_name == 'schedule' ||
         (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release != 'true'))
        && 'agent-seed-rehearsal'
        || format('agent-run-{0}', github.run_id) }}
  cancel-in-progress: >-
    ${{ github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release != 'true') }}

# P3e Phase 2: single-codegen-unit release artifacts. Set as WORKFLOW env
# (cargo reads CARGO_PROFILE_RELEASE_* like a Cargo.toml [profile.release]
# key) instead of the workspace manifest, deliberately: the manifest form
# would also slow the API docker image build on the build host, which ships
# in a container where binary size is irrelevant. Measured on the rc.363
# tree (32-core box, cold): roomlerd 31.95 -> 26.07 MiB (-18.4%) at 128 ->
# 200 s; the standalone CLI 21.29 -> 15.53 MiB (-27.1%). NB fat/thin LTO
# both LOSE to this on size AND build time for these binaries (thin is
# +5% SIZE over baseline) — do not "upgrade" this to lto without
# re-measuring. First run after this change rebuilds the caches (the env
# is part of cargo's fingerprint); that one-time cost is the same class as
# any dependency bump.
env:
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"

jobs:
  # ---------------------------------------------------------------------------
  # 0. Validate that the requested version matches Cargo.toml.
  # ---------------------------------------------------------------------------
  validate-version:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      msi_version: ${{ steps.resolve.outputs.msi_version }}
      tag: ${{ steps.resolve.outputs.tag }}
      is_release: ${{ steps.resolve.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version + tag
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          # Grep the [workspace.package] table for the declared version.
          cargo_version=$(awk '
            /^\[workspace\.package\]/ {in_section=1; next}
            /^\[/ {in_section=0}
            in_section && /^version[[:space:]]*=/ {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)
          echo "Cargo.toml workspace version: ${cargo_version}"

          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            # Weekly cache-seed rehearsal: no tag, no inputs. Build whatever
            # master currently is, artifacts-only — the run exists for its
            # master-ref Swatinem saves, which every tag build restores.
            version="${cargo_version}"
            tag="agent-v${version}"
            is_release=false
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#agent-v}"
            is_release=true
          else
            version="${{ github.event.inputs.version }}"
            tag="agent-v${version}"
            if [[ "${{ github.event.inputs.publish_release }}" == "true" ]]; then
              is_release=true
            else
              is_release=false
            fi
          fi

          echo "Resolved: version=${version} tag=${tag} is_release=${is_release}"

          if [[ "${cargo_version}" != "${version}" ]]; then
            echo "::error::Version mismatch: requested ${version} but Cargo.toml has ${cargo_version}"
            exit 1
          fi

          # Derive the MSI ProductVersion. Windows Installer IGNORES the
          # 4th (revision) version field for upgrade comparison, so the
          # raw semver `0.3.0-rc.N` — which cargo-wix maps to `0.3.0.N` —
          # made every rc look like the same `0.3.0` product: WiX
          # MajorUpgrade never saw a "newer" version, never removed the
          # prior one, and rc builds piled up (8 perMachine versions
          # found coexisting on a host 2026-06-01). Fix: put the rc in
          # the 3rd (build) field so MSI ProductVersions are monotonic —
          # `MAJOR.MINOR.RC`. A final (non-rc) release maps the build
          # field to 65535 so it outranks every rc of that minor. Only
          # the MSI-internal ProductVersion changes; the .msi *filename*
          # keeps the readable semver (see the rename steps below).
          # Assumes the project's `MAJOR.MINOR.0-rc.N` scheme (patch == 0
          # for rc builds) — fails loudly otherwise so the mapping can't
          # silently collide.
          if [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)-rc\.([0-9]+)$ ]]; then
            vmajor="${BASH_REMATCH[1]}"; vminor="${BASH_REMATCH[2]}"
            vpatch="${BASH_REMATCH[3]}"; vrc="${BASH_REMATCH[4]}"
            if [[ "$vpatch" != "0" ]]; then
              echo "::error::rc builds must have patch == 0 (got ${version}); the MAJOR.MINOR.RC MSI mapping would collide with a patched rc"
              exit 1
            fi
            if (( vrc > 65535 )); then
              echo "::error::rc number ${vrc} exceeds the MSI build-field max (65535)"
              exit 1
            fi
            msi_version="${vmajor}.${vminor}.${vrc}"
          elif [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            msi_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.65535"
          else
            echo "::error::cannot derive an MSI version from '${version}' (expected MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-rc.N)"
            exit 1
          fi
          echo "Resolved MSI ProductVersion: ${msi_version} (from ${version})"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "msi_version=${msi_version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}"         >> "$GITHUB_OUTPUT"
          echo "is_release=${is_release}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 1. Linux — .deb via cargo-deb, bundles the systemd-user unit.
  # ---------------------------------------------------------------------------
  build-linux:
    name: Build .deb (Linux x86_64)
    needs: validate-version
    # Build on 22.04 (glibc 2.35), NOT ubuntu-latest (now 24.04 = glibc 2.39):
    # a 24.04-built binary requires GLIBC_2.39 and fails the "loads on stock
    # Ubuntu 22.04" guard (and won't run on any pre-24.04 host). Building on
    # 22.04 produces a binary + bundled host-libs that load on 22.04 AND 24.04.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install system build deps
        run: |
          # libvpx-dev needed for the `vp9-444` feature (bindgen + link).
          # Ubuntu 24.04 (ubuntu-latest) ships libvpx 1.14.0 — bindgen
          # 0.68.1 + libclang handles its `vpx_codec_enc_cfg` struct
          # correctly; libvpx 1.16.x changes the header-include order
          # in a way that triggers a known bindgen forward-declaration
          # bug, so do not bump beyond apt's pinned version here.
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev \
            cmake libclang-dev pkg-config \
            libvpx-dev \
            libasound2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Restore cargo seed (lockfile-generation keys)
        # Explicit actions/cache with OUR key scheme -- rust-cache cannot
        # express "unique key + prefix restore + no env hash": with
        # add-rust-environment-hash-key:false its `key:` input is folded
        # into the dropped component (a no-op -- #482, re-proven by probe
        # run 31907241610). Unique key per Cargo.lock => saves always
        # land; prefix restore => never an absent-key window (the rc.382
        # race); no env hash => no runner-image warm/cold lottery. Full
        # story in .github/actions/seed-cache-restore. The paired save
        # step is at the end of this job.
        continue-on-error: true
        uses: ./.github/actions/seed-cache-restore
        with:
          shared-key: agent-linux

      - name: Install cargo-deb
        # Idempotent: the lockfile-generation seed caches (#488) restore
        # ~/.cargo/bin WITH the tool already present, and a plain
        # `cargo install` hard-errors on an existing binary (rc.383's
        # release run died on exactly this in all three build jobs).
        run: command -v cargo-deb >/dev/null || cargo install cargo-deb --locked

      - name: Fetch vendored FFmpeg 8.1.2 (for the ffmpeg-encoder HEVC backend)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Prebuilt LGPL FFmpeg 8.1.2 (nvenc/qsv/amf/vaapi/vulkan HEVC + the
          # LGPL libkvazaar SW encoder; NO GPL libx265 → the MIT agent stays
          # license-clean, matching the Windows vcpkg policy). Published once
          # at the `vendored-ffmpeg-8.1.2` release and reused by every build
          # instead of compiling FFmpeg from source: Ubuntu apt ships only
          # FFmpeg 6.1, but `ffmpeg-next = 8.1` needs 8.x.
          gh release download vendored-ffmpeg-8.1.2 \
            --repo "${{ github.repository }}" \
            --pattern 'ffmpeg-8.1.2-linux64-lgpl-shared-minimal.tar.xz' \
            --dir /tmp/ffdl
          # P3e lever B (Linux twin): the MINIMAL from-source build — the ten
          # HW encoders + their parsers, nothing else (whole lib dir 2.5 MB
          # vs ~50 MB of libav* in the old BtbN re-upload; the agent's
          # cascade is locked to nvenc/qsv/amf by a unit test, so kvazaar/
          # vaapi/every-decoder were unreachable). Vendor job's runtime probe
          # asserts the encoder set; rollback = drop the `-minimal` suffix.
          sudo mkdir -p /opt/roomler-ffmpeg
          sudo tar xf /tmp/ffdl/ffmpeg-8.1.2-linux64-lgpl-shared-minimal.tar.xz \
            -C /opt/roomler-ffmpeg --strip-components=1
          # BtbN's pkgconfig files hardcode the build-machine prefix; rewrite
          # it to our extract path so pkg-config emits correct -L/-I flags.
          sudo sed -i "s|^prefix=.*|prefix=/opt/roomler-ffmpeg|" \
            /opt/roomler-ffmpeg/lib/pkgconfig/*.pc
          {
            echo "FFMPEG_DIR=/opt/roomler-ffmpeg"
            echo "PKG_CONFIG_PATH=/opt/roomler-ffmpeg/lib/pkgconfig"
            echo "LD_LIBRARY_PATH=/opt/roomler-ffmpeg/lib"
          } >> "$GITHUB_ENV"

      - name: Build agent (release, full + vp9-444 + vp9-444-bindgen)
        # `vp9-444` adds the libvpx VP9 profile-1 (8-bit 4:4:4) software
        # encoder for the DataChannel-bypass video transport (Phase Y in
        # docs/encoders.md). Browser viewers that flip the
        # "Crystal-clear (VP9 4:4:4)" toolbar toggle expect this on the
        # other end.
        # `vp9-444-bindgen` enables `env-libvpx-sys/generate` so bindgen
        # runs against the system libvpx 1.14 headers; without this the
        # build script panics looking for `vpx-ffi-1.14.0.rs` in the
        # crate's `generated/` dir (only ships ≤ 1.13.0).
        # `overlay-l3` (Phase 3b) compiles in the Tailscale-style overlay mesh
        # (WireGuard via boringtun + the OS TUN device). `overlay-netstack` adds
        # the userspace-smoltcp OS-free surface (field-validated 2026-07-11
        # against the live overlay incl. a Check Point host). Both pure-Rust, no
        # extra system dep on Linux (/dev/net/tun is in-kernel; smoltcp needs
        # nothing). Default-OFF: an agent only joins the mesh when its config
        # sets `overlay_enabled`, and netstack mode additionally needs
        # `ROOMLER_AGENT_OVERLAY_NETSTACK_SOCKS=<port>` — so shipping both
        # everywhere is inert until an operator opts a host in.
        # `ffmpeg-encoder` adds the FFmpeg HEVC backend (hevc_nvenc / qsv / amf
        # / vaapi / vulkan) via the vendored FFmpeg 8.1.2 fetched above — the
        # Linux/WSL counterpart to the Windows MF/vcpkg HEVC path.
        # `full` now includes `audio` (system-audio Opus track) → pulls cpal
        # (ALSA, libasound2-dev above) + audiopus (bundled libopus via CMake).
        env:
          # audiopus_sys' bundled libopus CMakeLists declares
          # cmake_minimum_required(VERSION < 3.5); CMake 3.31+ errors without
          # this policy shim.
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: cargo build -p roomler-agent --release --features "full,vp9-444,vp9-444-bindgen,overlay-l3,overlay-netstack,ffmpeg-encoder,ssh-server"

      # P3e Phase 2: the .deb's `roomler` is now the CLI SHIM (re-execs
      # `roomlerd cli`) — the Linux twin of the rc.365 MSI change. It must
      # exist before `cargo deb --no-build` runs (the assets list references
      # target/release/roomler-shim). Replaces the 143 s full-CLI build that
      # duplicated ~21 MiB of the daemon's crates inside the .deb, and
      # structurally retires the CLI/daemon version-skew failure class
      # (field-caught 2026-08-06: rc.205 CLI vs rc.311 daemon) — the command
      # surface now lives inside roomlerd itself. Tunnel-ONLY Linux hosts
      # still get the real standalone binary from release-tunnel.yml.
      - name: Build the roomler CLI shim (shipped in the .deb alongside roomlerd)
        run: |
          cargo build -p roomler-cli-shim --release
          test -f target/release/roomler-shim || { echo "::error::roomler-shim not produced — the cargo-deb assets entry would fail"; exit 1; }

      - name: Bundle FFmpeg into the .deb (self-contained, RPATH)
        run: |
          set -euo pipefail
          # Ubuntu 24.04 ships FFmpeg 6.1 (libavcodec.so.60) but the agent links
          # 8.1.2 (libavcodec.so.62), so the .deb must CARRY its own FFmpeg or it
          # won't start on a stock box. Ship each lib under its SONAME as a real
          # file (no symlinks) into /usr/lib/roomler-agent; RPATH wires it up.
          sudo apt-get update -qq && sudo apt-get install -y patchelf
          dst=agents/roomler-agent/vendor-ffmpeg
          rm -rf "$dst" && mkdir -p "$dst"
          # P3e Phase 3: bundle ONLY the vendored libs the binary actually
          # references. Before the ffmpeg codec+format trim the binary linked
          # all seven libav* and the blanket copy was accurate; post-trim it
          # links avcodec/avformat/avutil/swresample only, and blindly copying
          # the rest (avfilter alone is ~18 MB of .so) kept the .deb at
          # ~56 MiB for dead weight. `ldd` lists the TRANSITIVE closure, so
          # deriving the keep-set from it stays correct if linkage changes
          # again — a lib that stops being referenced silently drops out, and
          # one that starts being referenced is caught by the empty-copy guard
          # + the stock-24.04 load check below.
          # Pass 1: the binary's own DT_NEEDED (ldd prints the SONAME in $1
          # even for not-yet-findable libs). Passes 2..n: each copied lib's
          # OWN needs — ldd cannot traverse INTO a lib it can't find, so
          # vendored-lib -> vendored-lib edges (e.g. avformat -> swresample)
          # need the fixpoint. Converges in 2 passes today; capped at 5.
          needed=$(ldd target/release/roomlerd | awk '{print $1}')
          for _pass in 1 2 3 4 5; do
            grew=0
            for real in $(find /opt/roomler-ffmpeg/lib -maxdepth 1 -type f -name 'lib*.so.*'); do
              soname=$(patchelf --print-soname "$real")
              [ -f "$dst/$soname" ] && continue
              if echo "$needed" | grep -qx "$soname"; then
                cp "$real" "$dst/$soname"
                grew=1
              fi
            done
            [ "$grew" = "1" ] || break
            needed=$(printf '%s\n' "$needed"; for l in "$dst"/lib*.so.*; do patchelf --print-needed "$l"; done)
          done
          copied=$(ls "$dst" | wc -l)
          for real in $(find /opt/roomler-ffmpeg/lib -maxdepth 1 -type f -name 'lib*.so.*'); do
            soname=$(patchelf --print-soname "$real")
            [ -f "$dst/$soname" ] || echo "skipping unreferenced vendored lib: $soname"
          done
          # Floor = avcodec + avutil. With the MINIMAL vendored build the
          # linker's --as-needed drops even avformat AND swresample from
          # DT_NEEDED (the trimmed avcodec's pulled code never calls them;
          # .pc Requires is a link-time statement, not a runtime one) — the
          # first minimal rehearsal proved copied=2 is the correct steady
          # state, and the earlier ">= 3" guard encoded the FULL build's
          # linkage as law. Correctness is owned by the stock-24.04 load
          # check below; this guard only catches a broken derivation (0-1
          # matches = ldd/soname parsing went wrong).
          [ "$copied" -ge 2 ] || { echo "::error::only $copied vendored FFmpeg libs matched — expected at least avcodec+avutil; the keep-set derivation is broken"; exit 1; }
          # The agent binary ITSELF dynamically links libvpx.so.7 (the `vp9-444`
          # VP9 software encoder — env-libvpx-sys links this build runner's
          # libvpx-dev, which is 1.12 / libvpx.so.7 on ubuntu-22.04). Stock
          # Ubuntu 24.04 ships only libvpx.so.9, so WITHOUT bundling this the
          # .deb installs cleanly but the agent aborts at load with
          # `libvpx.so.7: cannot open shared object file`. Carry it alongside the
          # FFmpeg libs so the .deb runs on 22.04 (native) AND 24.04 (bundled).
          vpx7=$(readlink -f /usr/lib/x86_64-linux-gnu/libvpx.so.7)
          cp "$vpx7" "$dst/libvpx.so.7"
          [ -f "$dst/libvpx.so.7" ] || { echo "::error::libvpx.so.7 not bundled — agent aborts at load on 24.04"; exit 1; }
          # Each FFmpeg lib finds its siblings in the same dir ($ORIGIN); the
          # binary finds them at the absolute install dir. Only glibc-family
          # deps remain external (audited) — the HW encoders (nvenc/qsv/amf/
          # vaapi/vulkan) dlopen their driver libs at runtime, so no extra
          # .deb `depends` are needed.
          for lib in "$dst"/*.so.*; do patchelf --set-rpath '$ORIGIN' "$lib"; done
          # P3d Slice B: the daemon binary is now `roomlerd` (the [[bin]] output
          # name); the .deb assets map installs it to /usr/lib/roomler-agent RPATH.
          patchelf --set-rpath '/usr/lib/roomler-agent' target/release/roomlerd
          echo "bundled: $(ls "$dst" | tr '\n' ' ')"
          echo "binary RUNPATH -> $(patchelf --print-rpath target/release/roomlerd)"

      - name: Verify the bundled agent loads on stock Ubuntu 24.04
        # The binary is a 22.04 build (glibc 2.34) that links libvpx.so.7; 24.04
        # ships only libvpx.so.9, so this proves the bundled libvpx.so.7 + FFmpeg
        # make the .deb self-contained on 24.04 (22.04 works trivially — native
        # libvpx7 + lower glibc). Only the declared `depends` are installed; the
        # bundle is reached via LD_LIBRARY_PATH (the .deb wires it via RPATH).
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/w" ubuntu:24.04 bash -euc '
            apt-get update -qq
            apt-get install -y -qq libxcb1 libxcb-shm0 libxcb-randr0 libasound2t64 >/dev/null
            LD_LIBRARY_PATH=/w/agents/roomler-agent/vendor-ffmpeg /w/target/release/roomlerd --version'

      - name: Build .deb
        working-directory: agents/roomler-agent
        run: cargo deb --no-build --no-strip

      - name: Rename + checksum
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate-version.outputs.version }}"
          src=$(ls target/debian/roomler-agent_*_amd64.deb | head -n1)
          dst="roomler-agent-${version}-x86_64-unknown-linux-gnu.deb"
          mv "$src" "$dst"
          sha256sum "$dst" | awk '{print $1"  "$2}' > "${dst}.sha256"
          echo "artifact=${dst}" >> "$GITHUB_OUTPUT"

      # Distro-agnostic path for hosts with no dpkg/apt — see
      # docs/linux-self-update.md. Free here: the payload is already staged
      # for cargo-deb, so this is a tar over the same tree.
      - name: Stage the universal tarball
        id: tar
        run: |
          set -euo pipefail
          version="${{ needs.validate-version.outputs.version }}"
          sh scripts/stage-linux-tarball.sh "$version" x86_64-unknown-linux-gnu
          echo "artifact=roomler-agent-${version}-x86_64-unknown-linux-gnu.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: |
            ${{ steps.pack.outputs.artifact }}
            ${{ steps.pack.outputs.artifact }}.sha256
            ${{ steps.tar.outputs.artifact }}
            ${{ steps.tar.outputs.artifact }}.sha256
          retention-days: 30

      - name: Save cargo seed (new lockfile generation)
        # always(): preserves cache-on-failure semantics -- a rehearsal
        # that builds and then dies later must still seed (the 07-28
        # incident). Non-tag only: tag-ref saves are unrestorable dead
        # weight. A same-lockfile twin save loses the reservation and
        # warns -- harmless.
        if: always() && github.ref_type != 'tag'
        continue-on-error: true
        uses: ./.github/actions/seed-cache-save
        # GH_TOKEN powers the action's generation-retirement step (keeps
        # the 2 newest generations of this family, deletes the rest) —
        # without it, generations piled to 9.5 GB in a day and LRU evicted
        # the CI lane's caches instead (run 32198738776).
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          shared-key: agent-linux

  # ---------------------------------------------------------------------------
  # 1b. Linux aarch64 — the same .deb for arm64 hosts.
  #
  # Why this exists: without an arm64 asset the updater's asset picker finds
  # no match and every check ends "no installer asset for this platform", so
  # `Update all` from the web UI is a permanent no-op on an arm64 box. Field
  # case 2026-08-15 on a Fedora Asahi Remix host (Apple M2) that meshes and
  # screen-shares fine but could never self-update.
  #
  # Deliberately WITHOUT `ffmpeg-encoder`: the vendored FFmpeg 8.1.2 tree is
  # published for linux64/macos-arm64 only, there is no linux-arm64 build to
  # fetch, and the backend it feeds dispatches to nvenc/qsv/amf — none of
  # which exist on the Apple-silicon and Ampere hosts this targets. Dropping
  # it also keeps this lane on the P3e size trajectory (no 20 MB of FFmpeg in
  # a package whose encoders would all fail to init). Video on arm64 is
  # openh264 (SW H.264) + libvpx VP9-444, both field-verified.
  # ---------------------------------------------------------------------------
  build-linux-arm64:
    name: Build .deb (Linux aarch64)
    needs: validate-version
    # 22.04 for the same glibc reason as the x86_64 lane: build on the OLDEST
    # supported base so the binary loads on 22.04 AND 24.04.
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install system build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev \
            cmake libclang-dev pkg-config \
            libvpx-dev \
            libasound2-dev \
            patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Restore cargo seed (lockfile-generation keys)
        # Explicit actions/cache with OUR key scheme -- rust-cache cannot
        # express "unique key + prefix restore + no env hash": with
        # add-rust-environment-hash-key:false its `key:` input is folded
        # into the dropped component (a no-op -- #482, re-proven by probe
        # run 31907241610). Unique key per Cargo.lock => saves always
        # land; prefix restore => never an absent-key window (the rc.382
        # race); no env hash => no runner-image warm/cold lottery. Full
        # story in .github/actions/seed-cache-restore. The paired save
        # step is at the end of this job.
        continue-on-error: true
        uses: ./.github/actions/seed-cache-restore
        with:
          shared-key: agent-linux-arm64

      - name: Install cargo-deb
        # Idempotent: the lockfile-generation seed caches (#488) restore
        # ~/.cargo/bin WITH the tool already present, and a plain
        # `cargo install` hard-errors on an existing binary (rc.383's
        # release run died on exactly this in all three build jobs).
        run: command -v cargo-deb >/dev/null || cargo install cargo-deb --locked

      - name: Build agent (release, full + vp9-444, no ffmpeg-encoder)
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: cargo build -p roomler-agent --release --features "full,vp9-444,vp9-444-bindgen,overlay-l3,overlay-netstack,ssh-server"

      - name: Build the roomler CLI shim (shipped in the .deb alongside roomlerd)
        run: |
          set -euo pipefail
          cargo build -p roomler-cli-shim --release
          test -f target/release/roomler-shim || { echo "::error::roomler-shim not produced — the cargo-deb assets entry would fail"; exit 1; }

      - name: Bundle libvpx into the .deb (self-contained, RPATH)
        run: |
          set -euo pipefail
          # Same ABI trap as the x86_64 lane: the agent links this runner's
          # libvpx-dev (1.12 / libvpx.so.7 on 22.04) and stock 24.04 ships only
          # libvpx.so.9, so without carrying it the .deb installs cleanly and
          # then aborts at load. The cargo-deb assets glob is
          # `vendor-ffmpeg/*.so.*` — CI-populated and shared with the x86_64
          # lane's FFmpeg bundle; here it carries libvpx alone.
          dst=agents/roomler-agent/vendor-ffmpeg
          rm -rf "$dst" && mkdir -p "$dst"
          vpx7=$(readlink -f /usr/lib/aarch64-linux-gnu/libvpx.so.7)
          cp "$vpx7" "$dst/libvpx.so.7"
          [ -f "$dst/libvpx.so.7" ] || { echo "::error::libvpx.so.7 not bundled — agent aborts at load on 24.04"; exit 1; }
          for lib in "$dst"/*.so.*; do patchelf --set-rpath '$ORIGIN' "$lib"; done
          patchelf --set-rpath '/usr/lib/roomler-agent' target/release/roomlerd
          echo "bundled: $(ls "$dst" | tr '\n' ' ')"
          echo "binary RUNPATH -> $(patchelf --print-rpath target/release/roomlerd)"

      - name: Verify the bundled agent loads on stock Ubuntu 24.04 (arm64)
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/w" ubuntu:24.04 bash -euc '
            apt-get update -qq
            apt-get install -y -qq libxcb1 libxcb-shm0 libxcb-randr0 libasound2t64 >/dev/null
            LD_LIBRARY_PATH=/w/agents/roomler-agent/vendor-ffmpeg /w/target/release/roomlerd --version'

      - name: Build .deb
        working-directory: agents/roomler-agent
        run: cargo deb --no-build --no-strip

      - name: Rename + checksum
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate-version.outputs.version }}"
          src=$(ls target/debian/roomler-agent_*_arm64.deb | head -n1)
          dst="roomler-agent-${version}-aarch64-unknown-linux-gnu.deb"
          mv "$src" "$dst"
          sha256sum "$dst" | awk '{print $1"  "$2}' > "${dst}.sha256"
          echo "artifact=${dst}" >> "$GITHUB_OUTPUT"

      # Same universal path as the x86_64 lane. This is the one that unblocks
      # the Fedora Asahi field host: aarch64 AND no dpkg.
      - name: Stage the universal tarball
        id: tar
        run: |
          set -euo pipefail
          version="${{ needs.validate-version.outputs.version }}"
          sh scripts/stage-linux-tarball.sh "$version" aarch64-unknown-linux-gnu
          echo "artifact=roomler-agent-${version}-aarch64-unknown-linux-gnu.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb-arm64
          path: |
            ${{ steps.pack.outputs.artifact }}
            ${{ steps.pack.outputs.artifact }}.sha256
            ${{ steps.tar.outputs.artifact }}
            ${{ steps.tar.outputs.artifact }}.sha256
          retention-days: 30

      - name: Save cargo seed (new lockfile generation)
        # always(): preserves cache-on-failure semantics -- a rehearsal
        # that builds and then dies later must still seed (the 07-28
        # incident). Non-tag only: tag-ref saves are unrestorable dead
        # weight. A same-lockfile twin save loses the reservation and
        # warns -- harmless.
        if: always() && github.ref_type != 'tag'
        continue-on-error: true
        uses: ./.github/actions/seed-cache-save
        # GH_TOKEN powers the action's generation-retirement step (keeps
        # the 2 newest generations of this family, deletes the rest) —
        # without it, generations piled to 9.5 GB in a day and LRU evicted
        # the CI lane's caches instead (run 32198738776).
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          shared-key: agent-linux-arm64

  # ---------------------------------------------------------------------------
  # 2. Windows — MSI via cargo-wix. The MSI PAYLOAD (roomlerd.exe + the
  #    roomler.exe shim) is signed before the harvest and the MSIs themselves
  #    afterwards; see ./.github/actions/sign-windows. On a release tag,
  #    unsigned fails the job.
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build .msi (Windows x86_64)
    needs: validate-version
    runs-on: windows-latest
    timeout-minutes: 90
    # The Entra federated credential for azure-mode signing is bound to this
    # GitHub environment (the tenant rejects wildcard tag subjects) — removing
    # the environment line breaks the OIDC exchange. No protection rules are
    # configured on it, so it adds no approval friction.
    environment: release
    # Workflow-level permissions make every unlisted scope `none`, so id-token
    # must be granted explicitly. Per-job to keep the OIDC blast radius small.
    permissions:
      contents: read      # `gh release download` for the vendored FFmpeg/libvpx
      id-token: write     # azure/login OIDC inside ./.github/actions/sign-windows
      actions: write      # seed-cache-save retires old cache generations via `gh api DELETE`
    env:
      VERSION: ${{ needs.validate-version.outputs.version }}
      # Monotonic MSI ProductVersion (rc in the 3rd/build field) so
      # MajorUpgrade fires — see the derivation in the validate-version
      # job. VERSION (the readable semver) still names the .msi files.
      MSI_VERSION: ${{ needs.validate-version.outputs.msi_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Locate LLVM (provides libclang for bindgen)
        shell: pwsh
        run: |
          # windows-latest ships LLVM (v20+) pre-installed under
          # C:\Program Files\LLVM. Just point bindgen at it — don't try to
          # downgrade via chocolatey (choco refuses without --allow-downgrade).
          $llvm = "C:\Program Files\LLVM"
          if (-not (Test-Path $llvm)) {
            choco install -y llvm
            $llvm = "C:\Program Files\LLVM"
          }
          "LIBCLANG_PATH=$llvm\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$llvm\bin"              | Out-File -FilePath $env:GITHUB_PATH -Append
          & "$llvm\bin\clang.exe" --version

      # pkgconf is ~1 MB of prebuilt tool, but `vcpkg install` spends ~96 s per
      # run (measured on the rc.363 release: the 3rd-costliest step in this
      # job) re-materialising it. Cache the tools dir so the step below
      # degenerates into a PATH append. Same GitHub cache-isolation rule as the
      # Swatinem blocks: a save on a tag ref can never be restored by a future
      # tag, so only non-tag runs (the master seed rehearsals) write it while
      # tag runs restore the default-branch entry. The key is deliberately
      # constant — pkgconf is a frozen build tool here, not a dependency; bump
      # the -vN suffix if it ever needs refreshing.
      - name: Restore cached pkgconf
        id: pkgconf_cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: C:\vcpkg\installed\x64-windows\tools\pkgconf
          key: pkgconf-x64-windows-v1

      - name: Install pkg-config (env-libvpx-sys + ffmpeg-sys build scripts need it)
        id: pkgconf_install
        shell: pwsh
        run: |
          # `env-libvpx-sys` / `ffmpeg-sys-next` build.rs shell out to
          # `pkg-config`; windows-latest ships none. We install vcpkg's
          # `pkgconf` from the pre-installed vcpkg at C:\vcpkg (the ONLY
          # remaining vcpkg use in this job — libvpx + FFmpeg are fetched
          # prebuilt from the vendored-* releases below), so this pulls
          # from the vcpkg registry, NOT SourceForge. The old `choco
          # pkgconfiglite` downloaded its binary from SourceForge, which
          # timed out and failed the rc.151 MSI build. Kept as a retried
          # fallback.
          $tools = 'C:\vcpkg\installed\x64-windows\tools\pkgconf'
          $got = $false
          # Cache hit: the tools dir is already on disk (including the
          # pkg-config.exe alias, which was copied in before the save), so
          # skip the vcpkg install entirely.
          if (Test-Path "$tools\pkgconf.exe") {
            Write-Host "pkgconf restored from cache — skipping vcpkg install"
            Copy-Item "$tools\pkgconf.exe" "$tools\pkg-config.exe" -Force
            $tools | Out-File -FilePath $env:GITHUB_PATH -Append
            $env:PATH = "$tools;$env:PATH"
            $got = $true
          }
          if (-not $got -and (Test-Path 'C:\vcpkg\vcpkg.exe')) {
            C:\vcpkg\vcpkg.exe install pkgconf:x64-windows
            if (Test-Path "$tools\pkgconf.exe") {
              # The *-sys scripts invoke the command `pkg-config`; pkgconf is
              # a drop-in replacement, so expose it under that name too.
              Copy-Item "$tools\pkgconf.exe" "$tools\pkg-config.exe" -Force
              $tools | Out-File -FilePath $env:GITHUB_PATH -Append
              $env:PATH = "$tools;$env:PATH"
              $got = $true
            }
          }
          if (-not $got) {
            Write-Host "vcpkg pkgconf unavailable — falling back to choco pkgconfiglite (SourceForge; retried)"
            for ($i = 1; $i -le 3; $i++) {
              choco install -y pkgconfiglite
              if (Get-Command pkg-config -ErrorAction SilentlyContinue) { break }
              Write-Host "pkgconfiglite attempt $i failed (likely SourceForge); retrying in 15s"
              Start-Sleep -Seconds 15
            }
          }
          # Tells the save step below whether there is actually a vcpkg-shaped
          # tools dir worth caching (the choco fallback leaves it empty).
          # NB `hashFiles()` can't be used for this: it only globs inside
          # GITHUB_WORKSPACE, so it would silently return '' for a C:\vcpkg
          # path and the save would never run.
          $hasVcpkgPkgconf = if (Test-Path (Join-Path $tools 'pkgconf.exe')) { 'true' } else { 'false' }
          "vcpkg_pkgconf=$hasVcpkgPkgconf" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          # Fails the step loudly if neither path produced a usable pkg-config.
          pkg-config --version

      # Only seeds from non-tag runs (see the restore step's comment), and only
      # when the vcpkg tools dir is really populated — GitHub cache keys are
      # write-once, so caching an empty dir under this key would stick.
      - name: Save pkgconf cache
        if: steps.pkgconf_cache.outputs.cache-hit != 'true' && github.ref_type != 'tag' && steps.pkgconf_install.outputs.vcpkg_pkgconf == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: C:\vcpkg\installed\x64-windows\tools\pkgconf
          key: pkgconf-x64-windows-v1

      - name: Fetch vendored libvpx 1.12.0 (matches pre-generated bindings)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          # We DON'T enable `vp9-444-bindgen` on Windows because bindgen
          # 0.68.1 + libclang on Windows has a regression that opaques
          # `vpx_codec_enc_cfg` (forward-declared in vpx_codec.h's union
          # before its full def in vpx_encoder.h) — every field becomes
          # `_address: u8` and the build collapses. Local-repro confirms
          # this on libvpx 1.12 / 1.13 / 1.16 alike, so it's not a
          # libvpx-version issue, it's a Windows-libclang issue.
          #
          # Workaround: skip bindgen entirely. env-libvpx-sys ships
          # pre-generated FFI for libvpx 1.3.0–1.13.0 and its build.rs
          # picks the file matching pkg-config's reported version EXACTLY
          # — hence the 1.12.0 pin. Built once by vendor-libvpx-windows.yml
          # (same manifest/baseline/triplet the inline vcpkg build used)
          # and fetched here in seconds instead of ~5 min of vcpkg compile
          # per tag — same pattern as the vendored FFmpeg below.
          $dl = "$env:RUNNER_TEMP\vpxdl"
          gh release download vendored-libvpx-1.12.0 --repo "${{ github.repository }}" `
            --pattern 'libvpx-1.12.0-win64-msvc.zip*' --dir $dl
          $zip = "$dl\libvpx-1.12.0-win64-msvc.zip"
          $expected = ((Get-Content "$zip.sha256" -Raw).Trim() -split '\s+')[0].ToLower()
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          if ($actual -ne $expected) { Write-Host "::error::vendored libvpx sha256 mismatch (got $actual, want $expected)"; exit 1 }
          # Extract to the EXACT tree the old inline vcpkg build produced so
          # the baked .pc paths + the env exports below stay valid.
          $root = 'C:\vpx-pin\installed\x64-windows'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          tar -xf $zip -C $root
          if (-not (Test-Path "$root\lib\pkgconfig\vpx.pc")) { Write-Host "::error::vpx.pc missing after extract"; exit 1 }
          # Expose the install dir to subsequent steps.
          "PKG_CONFIG_PATH=C:/vpx-pin/installed/x64-windows/lib/pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append
          # The x64-windows libvpx port yields a static .lib only (no DLL),
          # so the staging step below no-ops; the env stays for the day the
          # port grows a bin/ again.
          "VPX_DLL_DIR=C:/vpx-pin/installed/x64-windows/bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      # =======================================================================
      # rc.65 Option B HEVC → ffmpeg-next 8.x links a static-md FFmpeg
      # (avcodec/…/nvcodec/qsv/amf/vpx, LGPL — no GPL x264/x265). Until
      # rc.179 this was a 25-40 min inline vcpkg build behind an
      # actions/cache that was BOTH structurally unreliable for tag runs
      # (caches save on the tag ref; a future tag can only restore own-ref
      # or default-branch caches, and nothing ever seeded master) AND
      # LRU-evicted by the repo's blown 10 GB cache budget — rc.176
      # measured a 29-min rebuild on a miss. Now built ONCE by
      # vendor-ffmpeg-windows.yml (identical manifest/baseline/triplet,
      # LGPL-verified) and fetched from the vendored-ffmpeg-8.1.2 release
      # in seconds. Re-dispatch that workflow when bumping FFmpeg.
      # =======================================================================
      - name: Fetch vendored FFmpeg 8.1.2 (win64 static-md, LGPL, minimal)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dl = "$env:RUNNER_TEMP\ffdl"
          # P3e lever B: the MINIMAL tree — --disable-everything + exactly the
          # ten HW encoders the agent dispatches (avcodec.lib 139.3 -> 12.1 MB;
          # vendor-ffmpeg-windows.yml's verify step asserts the symbol set).
          # Rollback = drop the `-minimal` suffix here; the full zip stays on
          # the same release untouched.
          gh release download vendored-ffmpeg-8.1.2 --repo "${{ github.repository }}" `
            --pattern 'ffmpeg-8.1.2-win64-msvc-static-md-lgpl-minimal.zip*' --dir $dl
          $zip = "$dl\ffmpeg-8.1.2-win64-msvc-static-md-lgpl-minimal.zip"
          $expected = ((Get-Content "$zip.sha256" -Raw).Trim() -split '\s+')[0].ToLower()
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          if ($actual -ne $expected) { Write-Host "::error::vendored FFmpeg sha256 mismatch (got $actual, want $expected)"; exit 1 }
          # Extract to the EXACT tree the old inline vcpkg build produced so
          # the baked .pc paths + every downstream step (PKG_CONFIG_PATH
          # append, static-md no-op DLL staging) stay valid. bsdtar handles
          # zip and is much faster than Expand-Archive. (If bsdtar ever
          # chokes on Compress-Archive's backslash entry names, swap to
          # Expand-Archive — the .pc assert below catches it loudly.)
          $root = 'C:\ffmpeg-pin\installed\x64-windows-static-md'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          tar -xf $zip -C $root
          foreach ($pc in 'libavcodec.pc', 'libavutil.pc') {
            if (-not (Test-Path "$root\lib\pkgconfig\$pc")) { Write-Host "::error::$pc missing after extract"; exit 1 }
          }
          Write-Host "FFmpeg pkg-config files present at $root\lib\pkgconfig\"

      - name: Append FFmpeg to PKG_CONFIG_PATH + DLL PATH
        shell: pwsh
        run: |
          # libvpx step already set PKG_CONFIG_PATH=C:/vpx-pin/...; ffmpeg
          # needs to extend, not replace. Read current value, append ffmpeg
          # path, write back. Windows pkg-config uses ';' as separator.
          $existing = [Environment]::GetEnvironmentVariable('PKG_CONFIG_PATH', 'Process')
          if ([string]::IsNullOrEmpty($existing)) { $existing = "" } else { $existing = "$existing;" }
          $combined = "${existing}C:/ffmpeg-pin/installed/x64-windows-static-md/lib/pkgconfig"
          "PKG_CONFIG_PATH=$combined" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "PKG_CONFIG_PATH=$combined"
          # rc.71 hotfix: vcpkg's x64-windows triplet produces DLLs for
          # ffmpeg (libavcodec-*.dll etc.), not static libs. The agent test
          # binary links against them at compile time but Windows can't
          # find them at runtime (STATUS_DLL_NOT_FOUND, 0xc0000135 — rc.69
          # CI failure). Add the ffmpeg bin dir to GITHUB_PATH so cargo test
          # picks it up. Also stash for the MSI staging step below.
          "C:\ffmpeg-pin\installed\x64-windows-static-md\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "FFMPEG_DLL_DIR=C:\ffmpeg-pin\installed\x64-windows-static-md\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Restore cargo seed (lockfile-generation keys)
        # Explicit actions/cache with OUR key scheme -- rust-cache cannot
        # express "unique key + prefix restore + no env hash": with
        # add-rust-environment-hash-key:false its `key:` input is folded
        # into the dropped component (a no-op -- #482, re-proven by probe
        # run 31907241610). Unique key per Cargo.lock => saves always
        # land; prefix restore => never an absent-key window (the rc.382
        # race); no env hash => no runner-image warm/cold lottery. Full
        # story in .github/actions/seed-cache-restore. The paired save
        # step is at the end of this job.
        continue-on-error: true
        uses: ./.github/actions/seed-cache-restore
        with:
          shared-key: agent-windows-vp9-444

      - name: Install WiX Toolset v3
        shell: pwsh
        run: |
          choco install -y wixtoolset
          # WiX v3 installs to C:\Program Files (x86)\WiX Toolset v3.14\bin by
          # default — add to PATH for this and subsequent steps.
          $wixBin = Get-ChildItem "C:\Program Files (x86)\WiX Toolset v*\bin" | Select-Object -First 1
          "$($wixBin.FullName)" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install cargo-wix
        # Idempotent for the same reason as the cargo-deb steps: the seed
        # caches restore the tool and a plain install errors on it.
        shell: pwsh
        run: |
          if (-not (Get-Command cargo-wix -ErrorAction SilentlyContinue)) {
            cargo install cargo-wix --locked
          }

      - name: Build agent (release, full-hw + vp9-444 + system-context + ffmpeg-encoder)
        # `vp9-444` (without `-bindgen`) uses env-libvpx-sys's
        # pre-generated FFI — no libclang invocation, no
        # forward-decl-opaque issue. pkg-config still has to find
        # `vpx.pc` (which the vcpkg step exported via PKG_CONFIG_PATH);
        # the linker resolves vpx.lib from the pkg-config-emitted
        # `-L`. No INCLUDE / vcvars dance needed.
        #
        # `system-context` (added 0.3.0) compiles the M3 A1 SYSTEM-
        # context worker plumbing: DXGI Desktop Duplication backend,
        # GDI BitBlt fallback, SetThreadDesktop input rebind, and
        # winlogon-token spawn. The perMachine MSI's SCM service
        # exercises this code path to drive the lock screen / UAC.
        # The perUser MSI gets the same binary but `worker_role::
        # probe_self()` returns `User` (perUser is never spawned as
        # LocalSystem) so none of the SystemContext code ever fires
        # — the perUser path stays exactly as it was in 0.2.7.
        #
        # rc.65: `ffmpeg-encoder` adds the ffmpeg-next dep and exercises
        # the FFmpeg link via `linked_libavcodec_version()`. The actual
        # encoder backend lands in rc.66 — for now this RC verifies:
        # (a) ffmpeg-next 8.x compiles against vcpkg's FFmpeg
        # (b) hevc_qsv + vp9_qsv symbols are reachable (asserted by the
        #     unit test `libavcodec_version_is_ffmpeg_7_or_newer`)
        # (c) MSI size delta vs rc.64 is within budget (≤ +8 MB; HARD
        #     STOP enforced by the next step at +12 MB)
        shell: pwsh
        # `overlay-l3` (Phase 3b): the overlay mesh (WireGuard + TUN). The
        # binary compiles overlay in everywhere; on Windows the TUN is
        # Wintun, whose signed `wintun.dll` is LoadLibrary'd at runtime
        # from the app dir — bundled into both MSIs via the `WintunDll`
        # wxs component (staged by the wintun step below). Linux
        # (/dev/net/tun) + macOS (utun) need no extra dep. Default-OFF
        # (config `overlay_enabled`).
        # `full-hw` includes `audio` (via `full`) → cpal WASAPI loopback (no
        # extra lib on Windows) + audiopus (bundled libopus via CMake).
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: cargo build -p roomler-agent --release --features "full-hw,vp9-444,system-context,ffmpeg-encoder,overlay-l3,overlay-netstack,ssh-server"

      - name: Build the roomler CLI shim for the MSI bundle (P3e lever D)
        shell: pwsh
        run: |
          # P4b put the tunnel CLI inside both MSIs so daemon installs subsume
          # it and the MSI stays the ONE updater for the node stack. That is
          # unchanged — what changed (P3e lever D) is HOW: the daemon now owns
          # the command surface (`roomlerd cli` → roomler_tunnel::cli) and the
          # MSI carries a ~150 KB shim instead of a second full binary.
          #
          # rc.361 measurements that motivated it: roomler.exe was 22.1 MiB of
          # which cargo-bloat attributes only 1.16 MiB to CLI-specific code —
          # the rest duplicated std/webrtc/tunnel_core/tokio/rustls/reqwest/
          # quinn/clap that roomlerd.exe already links. This step also used to
          # cost 143 s (3rd-costliest in the job) because it rebuilt shared
          # deps under a DIFFERENT feature set than the agent build above.
          #
          # Both wxs files reference target\release\roomler-shim.exe at harvest
          # time, so this MUST still run before the two cargo-wix builds below.
          # Tunnel-ONLY hosts are unaffected: release-tunnel.yml keeps building
          # and shipping the real standalone `roomler` binary.
          cargo build -p roomler-cli-shim --release
          if (-not (Test-Path target\release\roomler-shim.exe)) {
            Write-Host "::error::roomler-shim.exe not produced — the TunnelExe wxs component would fail the MSI harvest (LGHT0103)"
            exit 1
          }
          $kb = [math]::Round((Get-Item target\release\roomler-shim.exe).Length/1KB, 0)
          Write-Host "Staged roomler-shim.exe ($kb KB, installs as roomler.exe) for the TunnelExe component"

      # The rc.65 "Verify FFmpeg link via unit test" step is GONE: even in
      # --release with the exact build feature set, `cargo test` cost 5m33s
      # per tag (dev-dep tokio-test enables tokio/test-util → the tokio
      # subgraph rebuilds in the test graph). The same libavcodec >= 61
      # assert now runs inside `encoder-smoke` below on the already-built
      # EXE — a link/version failure still fails this job before MSI
      # packaging, at zero compile cost.

      - name: Stage vpx.dll alongside agent binary (if not statically linked)
        shell: pwsh
        run: |
          # vcpkg's `x64-windows` triplet for libvpx produces a static
          # .lib + .pdb only — no .dll. The agent binary links libvpx
          # statically and runs without a separate DLL. If a future
          # vcpkg port (or a triplet swap) produces a vpx.dll, copy it
          # next to roomler-agent.exe so cargo-wix harvests it. No-op
          # when the DLL isn't there.
          $dll = Join-Path $env:VPX_DLL_DIR "vpx.dll"
          if (Test-Path $dll) {
            Copy-Item $dll target\release\
            Write-Host "Staged vpx.dll for MSI harvest"
          } else {
            Write-Host "No vpx.dll under $env:VPX_DLL_DIR — static linkage, nothing to stage"
          }

      - name: Stage FFmpeg DLLs alongside agent binary (no-op for static-md)
        # rc.76: triplet switched to x64-windows-static-md so no FFmpeg
        # DLLs exist — FFmpeg is statically linked into the EXE. This
        # step becomes a soft no-op when FFMPEG_DLL_DIR is empty or
        # doesn't exist (vs the rc.71 hard error). Kept around in case
        # we ever switch back to a dynamic triplet for size reasons.
        shell: pwsh
        run: |
          if (-not (Test-Path $env:FFMPEG_DLL_DIR)) {
            Write-Host "No bin dir under $env:FFMPEG_DLL_DIR — static-md triplet, nothing to stage."
            exit 0
          }
          $dlls = Get-ChildItem -Path $env:FFMPEG_DLL_DIR -Filter "*.dll"
          if ($dlls.Count -eq 0) {
            Write-Host "No DLLs under $env:FFMPEG_DLL_DIR — static-md triplet, nothing to stage."
            exit 0
          }
          foreach ($dll in $dlls) {
            Copy-Item $dll.FullName target\release\
          }
          Write-Host "Staged $($dlls.Count) FFmpeg DLLs for MSI harvest:"
          foreach ($dll in $dlls) {
            Write-Host "  $($dll.Name) ($([math]::Round($dll.Length / 1KB, 0)) KB)"
          }

      - name: Encoder smoke test (FFmpeg link check + MF cascade → openh264 fallback)
        shell: pwsh
        env:
          RUST_LOG: roomler_agent=debug,info
        run: |
          # Probe the hardware encoder path. On windows-latest the runner
          # exposes a WARP software D3D11 device; the MS H264 Encoder MFT
          # falls back to its SW path there, which is enough for "it loads,
          # negotiates types, produces an IDR, no SEH crash". Debug logging
          # surfaces STREAM_CHANGE notifications and per-frame byte counts
          # so regressions in the MF drain path are visible in CI output.
          # P3d Slice B: daemon EXE is now roomlerd.exe.
          # Under ffmpeg-encoder, encoder-smoke FIRST asserts the linked
          # libavcodec is >= 61 (FFmpeg 7+) — the load-bearing replacement
          # for the deleted 5m33s cargo-test link-verify step. On failure:
          # re-pin ffmpeg-next in agents/roomler-agent/Cargo.toml or
          # re-vendor via vendor-ffmpeg-windows.yml.
          & "target\release\roomlerd.exe" encoder-smoke --encoder hardware

      # Sign the MSI PAYLOAD, before cargo-wix harvests it.
      #
      # Signing only the .msi leaves roomlerd.exe + the shim unsigned ON DISK
      # after install -- and the on-disk binaries are what AV scans, what Task
      # Manager shows a publisher for, and what an AppLocker/WDAC publisher
      # rule matches. An MSI-only signature buys none of that.
      #
      # Both wxs files reference target\release\{roomlerd,roomler-shim}.exe by
      # literal path and BOTH cargo-wix runs are --no-build, so signing once
      # here covers the perUser AND perMachine MSIs.
      #
      # Placement is load-bearing on both sides:
      #   * AFTER encoder-smoke, so a broken FFmpeg link fails the job before
      #     it spends a signature.
      #   * BEFORE the wintun + VC-CRT staging steps, so the THIRD-PARTY
      #     Microsoft/WireGuard-signed DLLs are not even on disk yet.
      #     Authenticode `sign` REPLACES rather than appends, and AV
      #     allow-lists key off the original publishers -- ordering makes
      #     re-signing them structurally impossible rather than merely
      #     unintended.
      #
      # INVARIANT: no step after this one may run `cargo build` in this job.
      # A relink silently drops these signatures and only the outer MSI
      # signature would survive.
      - name: Sign MSI payload binaries
        id: sign_payload
        uses: ./.github/actions/sign-windows
        with:
          files: |
            target\release\roomlerd.exe
            target\release\roomler-shim.exe
          description:              'Roomler Daemon'
          mode:                     ${{ github.event.inputs.signing_mode || 'auto' }}
          require:                  ${{ needs.validate-version.outputs.is_release == 'true' || github.event.inputs.require_signing == 'true' }}
          expect-subject-contains:  ${{ vars.AZURE_SIGNING_EXPECT_SUBJECT }}
          endpoint:                 ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name:     ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          azure-client-id:          ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id:          ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id:    ${{ vars.AZURE_SUBSCRIPTION_ID }}
          local-pfx-base64:         ${{ secrets.WIN_TEST_PFX_BASE64 }}
          local-pfx-password:       ${{ secrets.WIN_TEST_PFX_PASSWORD }}

      - name: Stage wintun.dll for the overlay TUN (overlay-l3 MSI bundle)
        shell: pwsh
        run: |
          # overlay-l3's Windows TUN is Wintun, whose signed wintun.dll is
          # LoadLibrary'd at runtime from the app dir. Fetch the official
          # build (WireGuard LLC, Authenticode-signed) and stage the amd64
          # DLL next to the EXE so the `WintunDll` wxs component (in both
          # wix/ + wix-perMachine/) bundles it into both MSIs. The build
          # above includes overlay-l3, so the agent will LoadLibrary this.
          $ver = '0.14.1'
          $zip = "$env:RUNNER_TEMP\wintun.zip"
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-$ver.zip" -OutFile $zip -UseBasicParsing
          $dest = "$env:RUNNER_TEMP\wintun"
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $dll = Join-Path $dest 'wintun\bin\amd64\wintun.dll'
          if (-not (Test-Path $dll)) { Write-Host "::error::wintun.dll (amd64) not found in the downloaded archive"; exit 1 }
          $sig = Get-AuthenticodeSignature $dll
          Write-Host "wintun.dll signature: $($sig.Status) -- signer: $($sig.SignerCertificate.Subject)"
          Copy-Item $dll target\release\wintun.dll -Force
          Write-Host "Staged wintun.dll ($([math]::Round((Get-Item target\release\wintun.dll).Length/1KB,0)) KB) for the MSI bundle"

      - name: Stage VC++ runtime DLLs alongside agent binary (app-local CRT)
        shell: pwsh
        run: |
          # Both wxs files bundle a `VcRedistCrt` component (the three CRT
          # DLLs our binaries actually import) so the install is
          # self-contained on machines without any VC++ 2015-2022
          # redistributable -- a fresh Windows box otherwise pops
          # "vcruntime140_1.dll was not found" the moment install.ps1
          # (or the operator) runs the freshly installed roomlerd.exe,
          # which links the CRT dynamically via its C++ encoder objects
          # (field report 2026-07-28). The DLLs come from the runner's
          # own VS installation; fail loudly if any expected name is
          # absent (the WiX harvest would die with LGHT0103 later
          # anyway). Mirrored in installer-smoke.yml.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { Write-Host "::error::vswhere.exe not found on the runner"; exit 1 }
          $vsRoot = & $vswhere -latest -products * -property installationPath
          $crtDir = Get-ChildItem -Directory "$vsRoot\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT" -ErrorAction SilentlyContinue |
                    Sort-Object FullName | Select-Object -Last 1
          if (-not $crtDir) { Write-Host "::error::no Microsoft.VC14x.CRT redist folder under $vsRoot"; exit 1 }
          # Only what the import tables ask for: roomlerd.exe needs all three,
          # roomler.exe needs vcruntime140, roomler-desktop.exe needs none, and
          # msvcp140.dll itself imports only the two vcruntime DLLs. The other
          # six redist DLLs (concrt140, vccorlib140, msvcp140_1, msvcp140_2,
          # msvcp140_atomic_wait, msvcp140_codecvt_ids) are satellites a
          # consuming binary imports DIRECTLY when it uses the matching STL
          # feature; nothing we ship does, so they were 1.12 MiB of dead
          # payload per install. If a new C++ dependency lands, re-check with
          # `dumpbin -dependents target\release\roomlerd.exe | findstr /i 140`
          # and extend this list AND both wxs VcRedistCrt components together.
          $expected = @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')
          foreach ($n in $expected) {
            $src = Join-Path $crtDir.FullName $n
            if (-not (Test-Path $src)) { Write-Host "::error::$n missing from $($crtDir.FullName) -- VcRedistCrt harvest would fail (LGHT0103)"; exit 1 }
            Copy-Item $src target\release\ -Force
          }
          Write-Host "Staged $($expected.Count) VC++ runtime DLLs from $($crtDir.FullName)"

      - name: Build MSI (per-User)
        shell: pwsh
        run: |
          # cargo-wix reads agents/roomler-agent/wix/main.wxs and sets the
          # Version preprocessor variable from --install-version.
          cargo wix -p roomler-agent --nocapture --no-build --install-version $env:MSI_VERSION

      - name: Locate + rename per-User MSI
        id: locate
        shell: pwsh
        run: |
          $msi = Get-ChildItem "target/wix/*.msi" | Select-Object -First 1
          if (-not $msi) { throw "per-User MSI not produced" }
          # No `-unsigned` suffix. It used to be derived from whether a secret
          # was set, computed BEFORE signtool ran, so it described the repo's
          # configuration rather than the bytes. Signedness now comes from the
          # sign-windows action's verify step, which fails the job on a
          # release run. Consumers are suffix-agnostic in both directions
          # (agent_release.rs / updater.rs match on ".msi" + the
          # "-permachine-" infix), so older published releases keep resolving.
          $dst = "roomler-agent-$env:VERSION-x86_64-pc-windows-msvc.msi"
          Move-Item $msi.FullName $dst
          "artifact=$dst" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build MSI (per-Machine)
        shell: pwsh
        run: |
          # cargo-wix auto-discovers every *.wxs under wix/, so the
          # per-Machine source lives in a sibling wix-perMachine/ dir
          # to keep it OUT of the per-User build's compile set.
          # For this run we copy that file over wix/main.wxs (after
          # backing up the original), invoke cargo wix again, and
          # restore. Both MSIs end up in target/wix/ and we rename
          # to disambiguate. Different UpgradeCode + the mutually-
          # exclusive LaunchConditions ensure a host can only ever
          # have one of the two installed at a time.
          $wixDir = "agents\roomler-agent\wix"
          $pmSrc  = "agents\roomler-agent\wix-perMachine\main.wxs"
          Copy-Item "$wixDir\main.wxs" "$wixDir\main.wxs.bak" -Force
          Copy-Item $pmSrc "$wixDir\main.wxs" -Force
          try {
            cargo wix -p roomler-agent --nocapture --no-build --install-version $env:MSI_VERSION
          } finally {
            Move-Item "$wixDir\main.wxs.bak" "$wixDir\main.wxs" -Force
          }

      - name: Locate + rename per-Machine MSI
        id: locate_pm
        shell: pwsh
        run: |
          $msi = Get-ChildItem "target/wix/*.msi" | Select-Object -First 1
          if (-not $msi) { throw "per-Machine MSI not produced" }
          # Suffix-free -- see the per-User rename above.
          $dst = "roomler-agent-$env:VERSION-perMachine-x86_64-pc-windows-msvc.msi"
          Move-Item $msi.FullName $dst
          "artifact=$dst" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # Sign the finished MSIs. Deliberately BEFORE the size-budget step so
      # the number the guard reports is the number that actually ships, and
      # before the SHA256 step so the checksums cover the signed bytes.
      # Cost is ~10 KB per file (high-entropy, so it does not compress) --
      # noise against the 13 MB baseline.
      - name: Sign MSIs
        id: sign_msi
        uses: ./.github/actions/sign-windows
        with:
          files: |
            ${{ steps.locate.outputs.artifact }}
            ${{ steps.locate_pm.outputs.artifact }}
          description:              'Roomler Agent installer'
          mode:                     ${{ github.event.inputs.signing_mode || 'auto' }}
          require:                  ${{ needs.validate-version.outputs.is_release == 'true' || github.event.inputs.require_signing == 'true' }}
          expect-subject-contains:  ${{ vars.AZURE_SIGNING_EXPECT_SUBJECT }}
          endpoint:                 ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name:     ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          azure-client-id:          ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id:          ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id:    ${{ vars.AZURE_SUBSCRIPTION_ID }}
          local-pfx-base64:         ${{ secrets.WIN_TEST_PFX_BASE64 }}
          local-pfx-password:       ${{ secrets.WIN_TEST_PFX_PASSWORD }}

      # Regression detector for the payload-signing ordering above: if either
      # third-party DLL ever stops carrying its ORIGINAL publisher, something
      # re-signed it and broke every AV allow-list keyed to that publisher.
      - name: Assert third-party DLLs keep their original signatures
        shell: pwsh
        run: |
          $checks = @(
            @{ Path = 'target\release\wintun.dll';        Want = '*WireGuard*' },
            @{ Path = 'target\release\vcruntime140.dll';  Want = '*Microsoft*' }
          )
          foreach ($c in $checks) {
            $sig = Get-AuthenticodeSignature $c.Path
            $cn = if ($sig.SignerCertificate.Subject -match 'CN=([^,]+)') { $Matches[1].Trim() } else { '<none>' }
            Write-Host "$(Split-Path -Leaf $c.Path) signer: $cn (status=$($sig.Status))"
            if ($cn -notlike $c.Want) {
              Write-Host "::error::$($c.Path) is no longer signed by its original publisher (got '$cn'). The MSI payload-signing step must never include third-party DLLs."
              exit 1
            }
          }

      - name: 'Verify MSI size budget (P4b: MSI carries the tunnel CLI)'
        # Budget history: rc.63 baseline 8 MB (pre-ffmpeg); rc.65's
        # Option B guard capped ffmpeg bloat at a 24 MB hard ceiling;
        # rc.194 measured 20.73 MB per flavour. P4b DELIBERATELY grows
        # the MSI: both flavours now bundle the tunnel CLI roomler.exe
        # (~8 MB compressed; node-stack unification Option A) →
        # expected ≈ 29 MB. The guard's job is unchanged in spirit:
        # catch ACCIDENTAL bloat (unstripped FFmpeg, stray DLLs,
        # debug info, duplicate payloads) on top of the deliberate
        # scope — not the scope itself. Warn above baseline+2 so a
        # creeping regression is visible one release early; hard-fail
        # at 36 MB.
        shell: pwsh
        run: |
          $msiPerUser = (Get-Item "${{ steps.locate.outputs.artifact }}").Length / 1MB
          $msiPerMachine = (Get-Item "${{ steps.locate_pm.outputs.artifact }}").Length / 1MB
          $maxMsi = [math]::Max($msiPerUser, $msiPerMachine)
          # P3e lever D re-baseline. rc.361 measured 31.97 MB with the full
          # 22.1 MiB tunnel CLI inside; the CLI's compressed contribution was
          # ~7.6 MB (measured as the rc.194 -> rc.195 step when P4b added it),
          # and the shim that replaces it is ~0.15 MB. Ceiling drops with it:
          # 36 -> 30 MB, keeping the same ~5 MB of headroom over the baseline
          # that the P4b guard had.
          # Baseline PINNED from the P3e Phase-2 rehearsal (run 31869144675,
          # 2026-08-15, lever-B rehearsal 31877551270): both flavours measured
          # 13.13 MB (minimal vendored FFmpeg). A baseline left above the real value is
          # exactly the silent failure this guard exists to catch — it would
          # swallow a multi-MB regression as "within budget".
          # Roomler SSH (`ssh-server`) is a DELIBERATE growth on top of that
          # baseline: russh measured +1.86 MiB in roomlerd, ~+0.7 MB
          # compressed here. That stays inside the +2 warn band, so the guard
          # is deliberately NOT re-pinned in the same commit that adds it —
          # re-pin from the first measured release run, never from an
          # estimate, or the baseline swallows exactly the regression it
          # exists to catch.
          $p4bBaseline = 13.13
          $deltaMB = $maxMsi - $p4bBaseline
          Write-Host "::notice::per-User MSI = $([math]::Round($msiPerUser, 2)) MB"
          Write-Host "::notice::per-Machine MSI = $([math]::Round($msiPerMachine, 2)) MB"
          Write-Host "::notice::baseline = $p4bBaseline MB; delta = $([math]::Round($deltaMB, 2)) MB"
          if ($maxMsi -gt 18) {
            Write-Host "::error::MSI exceeds the 18 MB hard ceiling ($([math]::Round($maxMsi, 2)) MB). Investigate unintended payload growth (unstripped FFmpeg, extra DLLs, debug info, or a full CLI binary back in the TunnelExe component)."
            exit 1
          } elseif ($deltaMB -gt 2) {
            Write-Host "::warning::MSI is $([math]::Round($deltaMB, 2)) MB over the baseline (still under the 18 MB ceiling). Re-baseline deliberately or investigate."
          } else {
            Write-Host "::notice::MSI within the P4b size budget."
          }

      # The desktop companion EXE is built by the parallel
      # `build-windows-companions` job below (it only needs the agent's
      # DEFAULT feature graph — no vcpkg/FFmpeg/libvpx — and used to add
      # ~9 min of serial tail here).


      - name: SHA256 checksum (both MSIs)
        shell: pwsh
        run: |
          $files = @(
            "${{ steps.locate.outputs.artifact }}",
            "${{ steps.locate_pm.outputs.artifact }}"
          )
          foreach ($f in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $f).Hash.ToLower()
            "$hash  $f" | Out-File -Encoding ascii "$f.sha256"
          }

      - name: Upload artifacts (per-User + per-Machine MSIs)
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: |
            ${{ steps.locate.outputs.artifact }}
            ${{ steps.locate.outputs.artifact }}.sha256
            ${{ steps.locate_pm.outputs.artifact }}
            ${{ steps.locate_pm.outputs.artifact }}.sha256
          retention-days: 30

      - name: Save cargo seed (new lockfile generation)
        # always(): preserves cache-on-failure semantics -- a rehearsal
        # that builds and then dies later must still seed (the 07-28
        # incident). Non-tag only: tag-ref saves are unrestorable dead
        # weight. A same-lockfile twin save loses the reservation and
        # warns -- harmless.
        if: always() && github.ref_type != 'tag'
        continue-on-error: true
        uses: ./.github/actions/seed-cache-save
        # GH_TOKEN powers the action's generation-retirement step (keeps
        # the 2 newest generations of this family, deletes the rest) —
        # without it, generations piled to 9.5 GB in a day and LRU evicted
        # the CI lane's caches instead (run 32198738776).
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          shared-key: agent-windows-vp9-444

  # ---------------------------------------------------------------------------
  # 2b. Windows companion — the roomler-desktop EXE, built in PARALLEL with
  #     the MSI job. The crate deps on roomler-agent with DEFAULT features
  #     (`default = []`, signalling-only), so this job needs no vcpkg /
  #     FFmpeg / libvpx / LLVM — Tauri 2 + the agent-default graph build on
  #     a bare windows-latest. The MSIs never contained this EXE (it ships
  #     standalone), so the split changes wall-clock only. (P4c-2 retired
  #     the legacy roomler-installer wizard EXE this job also used to build
  #     — the unified roomler-setup wizard ships via release-setup.yml.)
  # ---------------------------------------------------------------------------
  build-windows-companions:
    name: Build desktop companion EXE (Windows x86_64)
    needs: validate-version
    runs-on: windows-latest
    timeout-minutes: 60
    # See build-windows: the signing FIC is bound to this environment.
    environment: release
    permissions:
      contents: read
      id-token: write     # azure/login OIDC inside ./.github/actions/sign-windows
      actions: write      # seed-cache-save generation retirement
    env:
      VERSION: ${{ needs.validate-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Restore cargo seed (lockfile-generation keys)
        # Explicit actions/cache with OUR key scheme -- rust-cache cannot
        # express "unique key + prefix restore + no env hash": with
        # add-rust-environment-hash-key:false its `key:` input is folded
        # into the dropped component (a no-op -- #482, re-proven by probe
        # run 31907241610). Unique key per Cargo.lock => saves always
        # land; prefix restore => never an absent-key window (the rc.382
        # race); no env hash => no runner-image warm/cold lottery. Full
        # story in .github/actions/seed-cache-restore. The paired save
        # step is at the end of this job.
        continue-on-error: true
        uses: ./.github/actions/seed-cache-restore
        with:
          shared-key: installer-smoke-windows

      # rc.18: the Tauri tray companion. Tray's Cargo.toml uses
      # `frontendDist: "../src/front"` pointing at static HTML/CSS/JS —
      # no front-end bundler step needed. The build.rs generates
      # placeholder icons if missing so this works without an offline
      # icon-prep step. Released as a plain EXE.
      - name: Build tray binary (release)
        shell: pwsh
        # Static CRT: the desktop companion ships as a raw standalone EXE
        # (placed beside roomlerd.exe by install.ps1 / the wizard), so it
        # must not assume the MSVC runtime exists on the host -- a fresh
        # Windows box without the VC++ redist pops a loader dialog
        # otherwise (field report 2026-07-28). The tray graph is pure
        # Rust (agent DEFAULT features, no vcpkg /MD libs), so
        # +crt-static is safe; link-verified against the Tauri 2 stack.
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build -p roomler-agent-tray --release

      - name: Locate + rename tray EXE
        id: locate_tray
        shell: pwsh
        run: |
          # P3d Slice B: the tray/desktop-companion OUTPUT binary is now
          # `roomler-desktop.exe` (package roomler-agent-tray unchanged). The
          # released artifact is renamed to match.
          $exe = "target/release/roomler-desktop.exe"
          if (-not (Test-Path $exe)) { throw "roomler-desktop EXE not produced" }
          # Suffix-free: signedness is verified, not encoded in the filename.
          # install.ps1's `-like 'roomler-desktop-*-x86_64-pc-windows-msvc*.exe'`
          # and asset_resolver.rs's contains/ends_with both still match.
          $dst = "roomler-desktop-$env:VERSION-x86_64-pc-windows-msvc.exe"
          Copy-Item $exe $dst
          "artifact=$dst" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # The desktop companion is the one EXE a user double-clicks straight
      # from a browser download, so it is the most exposed to SmartScreen and
      # to corporate AV quarantine.
      - name: Sign desktop companion
        id: sign_desktop
        uses: ./.github/actions/sign-windows
        with:
          files:                    ${{ steps.locate_tray.outputs.artifact }}
          description:              'Roomler desktop'
          mode:                     ${{ github.event.inputs.signing_mode || 'auto' }}
          require:                  ${{ needs.validate-version.outputs.is_release == 'true' || github.event.inputs.require_signing == 'true' }}
          expect-subject-contains:  ${{ vars.AZURE_SIGNING_EXPECT_SUBJECT }}
          endpoint:                 ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name:     ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          azure-client-id:          ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id:          ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id:    ${{ vars.AZURE_SUBSCRIPTION_ID }}
          local-pfx-base64:         ${{ secrets.WIN_TEST_PFX_BASE64 }}
          local-pfx-password:       ${{ secrets.WIN_TEST_PFX_PASSWORD }}

      - name: SHA256 checksum (desktop companion)
        shell: pwsh
        run: |
          $files = @(
            "${{ steps.locate_tray.outputs.artifact }}"
          )
          foreach ($f in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $f).Hash.ToLower()
            "$hash  $f" | Out-File -Encoding ascii "$f.sha256"
          }

      - name: Upload artifacts (desktop companion)
        uses: actions/upload-artifact@v4
        with:
          name: windows-companions
          path: |
            ${{ steps.locate_tray.outputs.artifact }}
            ${{ steps.locate_tray.outputs.artifact }}.sha256
          retention-days: 30

      - name: Save cargo seed (new lockfile generation)
        # always(): preserves cache-on-failure semantics -- a rehearsal
        # that builds and then dies later must still seed (the 07-28
        # incident). Non-tag only: tag-ref saves are unrestorable dead
        # weight. A same-lockfile twin save loses the reservation and
        # warns -- harmless.
        if: always() && github.ref_type != 'tag'
        continue-on-error: true
        uses: ./.github/actions/seed-cache-save
        # GH_TOKEN powers the action's generation-retirement step (keeps
        # the 2 newest generations of this family, deletes the rest) —
        # without it, generations piled to 9.5 GB in a day and LRU evicted
        # the CI lane's caches instead (run 32198738776).
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          shared-key: installer-smoke-windows

  # ---------------------------------------------------------------------------
  # 3. macOS — signed + notarised .pkg. Unsigned unless Apple secrets present.
  # ---------------------------------------------------------------------------
  build-macos:
    name: Build .pkg (macOS arm64)
    needs: validate-version
    runs-on: macos-14
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.validate-version.outputs.version }}
      # Mirror the signing secrets into env once so the `if:` guards below can
      # reference `env.*` instead of `secrets.*` (secrets are not allowed in
      # step-level `if:` conditions).
      APP_P12_BASE64:       ${{ secrets.APPLE_DEVELOPER_ID_APP_P12_BASE64 }}
      INSTALLER_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12_BASE64 }}
      CERT_PASSWORD:        ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_API_KEY_ID:        ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID:     ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      # Apple signing is ALL-OR-NOTHING, and this runs first so a
      # misconfiguration fails in seconds rather than after a 90-minute build.
      #
      # The old two-gate arrangement had two failure modes. Loud one: the
      # import step was gated on APP_P12 but `security import`ed the INSTALLER
      # p12 unconditionally under `set -euo pipefail`, so a half-configured
      # run died with an opaque keychain error. Silent one, and much worse:
      # `Warn on unsigned` only fired when signed != 'yes', so a .pkg that was
      # correctly Developer-ID-signed but NEVER NOTARISED published with no
      # warning at all -- and Gatekeeper refuses those on every end-user Mac.
      - name: Resolve Apple signing mode
        id: apple
        shell: bash
        run: |
          set -euo pipefail
          req=(APP_P12_BASE64 INSTALLER_P12_BASE64 CERT_PASSWORD
               APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_KEY_P8_BASE64)
          have=(); miss=()
          for v in "${req[@]}"; do
            if [[ -n "${!v:-}" ]]; then have+=("$v"); else miss+=("$v"); fi
          done

          if [[ ${#miss[@]} -eq 0 ]]; then
            mode=full
          elif [[ ${#have[@]} -eq 0 ]]; then
            mode=none
          else
            echo "::error::Apple credentials are PARTIALLY configured (missing: ${miss[*]}). Signing is all-or-nothing: a half-configured run can only produce a signed-but-unnotarised or an unsigned-but-pkg-signed artifact, both of which Gatekeeper rejects. Run scripts/signing/60-apple-setup.sh check."
            exit 1
          fi

          if [[ "$mode" == none ]]; then
            if [[ "${{ needs.validate-version.outputs.is_release }}" == "true" ]]; then
              echo "::error::Apple signing credentials absent and this is a RELEASE run. An unsigned .pkg is blocked by Gatekeeper on every end-user Mac. Configure the six APPLE_* secrets (scripts/signing/60-apple-setup.sh) or dispatch with publish_release=false."
              exit 1
            fi
            echo "::warning::Apple credentials absent -- the .pkg will be unsigned and unnotarised (artifacts-only run, so this is allowed)."
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Apple signing mode: $mode"

      - name: Install Rust toolchain (aarch64-apple-darwin)
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-darwin

      - name: Restore cargo seed (lockfile-generation keys)
        # Explicit actions/cache with OUR key scheme -- rust-cache cannot
        # express "unique key + prefix restore + no env hash": with
        # add-rust-environment-hash-key:false its `key:` input is folded
        # into the dropped component (a no-op -- #482, re-proven by probe
        # run 31907241610). Unique key per Cargo.lock => saves always
        # land; prefix restore => never an absent-key window (the rc.382
        # race); no env hash => no runner-image warm/cold lottery. Full
        # story in .github/actions/seed-cache-restore. The paired save
        # step is at the end of this job.
        continue-on-error: true
        uses: ./.github/actions/seed-cache-restore
        with:
          shared-key: agent-macos

      - name: Install system deps
        # libvpx for the `vp9-444` feature; pkg-config for the
        # env-libvpx-sys build script. brew's libvpx is currently 1.15
        # which has the same well-formed header layout as 1.14 (the
        # libvpx 1.16 forward-decl regression that breaks bindgen on
        # Windows is upstream-only-on-1.16, so brew's 1.15 works).
        run: brew install cmake libvpx pkg-config

      - name: Fetch vendored FFmpeg 8.1.2 (for the ffmpeg-encoder HEVC backend)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Prebuilt LGPL FFmpeg 8.1.2 for Apple Silicon (HEVC via
          # hevc_videotoolbox; no GPL libx264/x265 → the MIT agent stays
          # license-clean). Built once by vendor-ffmpeg-macos.yml and fetched
          # here — the macOS counterpart to the Linux BtbN vendored build.
          gh release download vendored-ffmpeg-8.1.2 \
            --repo "${{ github.repository }}" \
            --pattern 'ffmpeg-8.1.2-macos-arm64-lgpl-shared.tar.xz' \
            --dir "$RUNNER_TEMP/ffdl"
          FFPREFIX="$RUNNER_TEMP/roomler-ffmpeg"
          mkdir -p "$FFPREFIX"
          # Tarball root is lib/ + include/ (no top dir) — no --strip-components.
          tar xf "$RUNNER_TEMP/ffdl/ffmpeg-8.1.2-macos-arm64-lgpl-shared.tar.xz" -C "$FFPREFIX"
          # .pc prefix is baked to the builder's path; rewrite it (BSD sed).
          sed -i '' "s|^prefix=.*|prefix=$FFPREFIX|" "$FFPREFIX"/lib/pkgconfig/*.pc
          {
            echo "FFMPEG_DIR=$FFPREFIX"
            # Prepend ffmpeg but KEEP the default pc_path so brew's libvpx.pc
            # (vp9-444) still resolves.
            echo "PKG_CONFIG_PATH=$FFPREFIX/lib/pkgconfig:$(pkg-config --variable pc_path pkg-config)"
            echo "FFPREFIX=$FFPREFIX"
          } >> "$GITHUB_ENV"

      - name: Build agent (release, full + vp9-444 + vp9-444-bindgen + ffmpeg-encoder)
        # `vp9-444-bindgen` runs bindgen against brew's libvpx 1.16
        # headers — env-libvpx-sys's pre-generated bindings only cover
        # 1.13.0, so without bindgen the build script panics looking
        # for `generated/vpx-ffi-1.16.0.rs`. macOS bindgen + libclang
        # has none of the Windows opaque-struct issue, so this just
        # works.
        # `overlay-l3` (Phase 3b): the overlay mesh (WireGuard + TUN, utun
        # on macOS — in-kernel, no extra dep). Default-OFF (config
        # `overlay_enabled`), inert until an operator opts a host in.
        # `ffmpeg-encoder`: HEVC via the vendored FFmpeg fetched above
        # (hevc_videotoolbox on Apple Silicon) — the macOS counterpart to the
        # Linux/Windows HEVC path.
        # `full` includes `audio` → cpal CoreAudio (in the OS SDK, no extra
        # lib) + audiopus (bundled libopus via CMake).
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: cargo build -p roomler-agent --release --features "full,vp9-444,vp9-444-bindgen,overlay-l3,overlay-netstack,ffmpeg-encoder,ssh-server" --target aarch64-apple-darwin

      - name: Stage .app bundle
        shell: bash
        run: |
          set -euo pipefail
          # P3d Slice B: the built binary is now `roomlerd` (the [[bin]] output
          # name). macOS is NOT the fleet, so the .app/binary INTERNAL name stays
          # `roomler-agent` for now (CFBundleExecutable + com.roomler.agent plist
          # Label unchanged — out of scope); only the SOURCE path is updated so
          # the copy resolves. Renaming the macOS .app internals is a follow-up.
          BIN=target/aarch64-apple-darwin/release/roomlerd
          APP=stage/roomler-agent.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "$BIN" "$APP/Contents/MacOS/roomler-agent"
          # Bundle the vendored FFmpeg dylibs into the .app so it's
          # self-contained (macOS ships no FFmpeg). They carry @rpath install
          # names (built --install-name-dir=@rpath), so a single LC_RPATH of
          # @executable_path/../Frameworks on the binary resolves BOTH the
          # binary's FFmpeg deps and the dylibs' siblings — the macOS analog of
          # the Linux $ORIGIN patchelf.
          mkdir -p "$APP/Contents/Frameworks"
          cp -a "$FFPREFIX"/lib/*.dylib "$APP/Contents/Frameworks/"
          install_name_tool -add_rpath "@executable_path/../Frameworks" "$APP/Contents/MacOS/roomler-agent"
          echo "=== FFmpeg load commands (want @rpath/libav*) ==="
          otool -L "$APP/Contents/MacOS/roomler-agent" | grep -E '@rpath/lib(av|sw)' || true
          echo "=== self-containment check: staged arm64 binary loads its bundled FFmpeg? ==="
          # macos-14 is arm64, so the aarch64 binary runs here; if the rpath +
          # bundled dylibs are wrong, dyld fails and this step (set -e) fails.
          "$APP/Contents/MacOS/roomler-agent" --version
          cp agents/roomler-agent/packaging/macos/com.roomler.agent.plist "$APP/Contents/Resources/"
          # The privileged half's plist rides along in Resources; the
          # postinstall only installs it into /Library/LaunchDaemons when the
          # operator has opted in. Staged unconditionally so enabling the
          # daemon never requires a different package.
          cp agents/roomler-agent/packaging/macos/com.roomler.daemon.plist "$APP/Contents/Resources/"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>          <string>roomler-agent</string>
              <key>CFBundleIdentifier</key>          <string>com.roomler.agent</string>
              <key>CFBundleName</key>                <string>Roomler Agent</string>
              <key>CFBundleShortVersionString</key>  <string>${VERSION}</string>
              <key>CFBundleVersion</key>             <string>${VERSION}</string>
              <key>CFBundlePackageType</key>         <string>APPL</string>
              <key>LSMinimumSystemVersion</key>      <string>12.0</string>
              <key>LSUIElement</key>                 <true/>
              <key>NSPrincipalClass</key>            <string>NSApplication</string>
              <key>NSScreenCaptureUsageDescription</key>
                  <string>Roomler Agent captures the screen to stream it to an authorised remote controller.</string>
              <key>NSAppleEventsUsageDescription</key>
                  <string>Roomler Agent injects input events on behalf of an authorised remote controller.</string>
          </dict>
          </plist>
          PLIST

      - name: Import signing certs
        if: steps.apple.outputs.mode == 'full'
        run: |
          set -euo pipefail
          KEYCHAIN=build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$APP_P12_BASE64" | base64 -d > /tmp/app.p12
          security import /tmp/app.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security

          echo "$INSTALLER_P12_BASE64" | base64 -d > /tmp/installer.p12
          security import /tmp/installer.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/productbuild -T /usr/bin/security

          security list-keychain -d user -s "$KEYCHAIN" login.keychain
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          rm /tmp/app.p12 /tmp/installer.p12

          # Print identities (harmless — just the CN, not the cert itself)
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Codesign binary
        if: steps.apple.outputs.mode == 'full'
        run: |
          set -euo pipefail
          # Sign the bundled FFmpeg dylibs FIRST (inside-out) — the hardened
          # runtime + notarisation reject unsigned nested code.
          find stage/roomler-agent.app/Contents/Frameworks -type f -name '*.dylib' -print0 \
            | while IFS= read -r -d '' dylib; do
                codesign --sign "Developer ID Application" --options runtime --timestamp "$dylib"
              done
          codesign --sign "Developer ID Application" \
                   --options runtime --timestamp \
                   --entitlements agents/roomler-agent/packaging/macos/entitlements.plist \
                   "stage/roomler-agent.app/Contents/MacOS/roomler-agent"

          codesign --sign "Developer ID Application" \
                   --options runtime --timestamp \
                   "stage/roomler-agent.app"

      - name: Build component + product pkg
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p payload/Applications scripts dist
          cp -R stage/roomler-agent.app payload/Applications/
          cp agents/roomler-agent/packaging/macos/postinstall scripts/postinstall
          chmod 755 scripts/postinstall

          pkgbuild \
            --root payload \
            --scripts scripts \
            --identifier com.roomler.agent \
            --version "$VERSION" \
            --install-location / \
            component.pkg

          # Suffix-free name in both branches: signedness is VERIFIED by the
          # step below, not encoded in a filename. install.sh's
          # `aarch64-apple-darwin[^"]*\.pkg` regex matches either way, so
          # already-published `-unsigned` releases keep resolving too.
          artifact="dist/roomler-agent-$VERSION-aarch64-apple-darwin.pkg"

          if [[ "${{ steps.apple.outputs.mode }}" == "full" ]]; then
            productbuild --package component.pkg --sign "Developer ID Installer" "$artifact"
          else
            productbuild --package component.pkg "$artifact"
          fi

          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - name: Notarise
        if: steps.apple.outputs.mode == 'full'
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPLE_API_KEY_P8_BASE64" | base64 -d \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"

          xcrun notarytool submit "${{ steps.pkg.outputs.artifact }}" \
            --key "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait

          xcrun stapler staple "${{ steps.pkg.outputs.artifact }}"

      # Verify rather than assume. `spctl -a -t install` exercises the exact
      # Gatekeeper path an end user hits and is the ONLY check that
      # distinguishes "signed" from "signed AND notarised" -- the distinction
      # that used to be able to ship silently.
      - name: Verify signature + notarisation
        if: steps.apple.outputs.mode == 'full'
        run: |
          set -euo pipefail
          PKG="${{ steps.pkg.outputs.artifact }}"

          echo "=== codesign (app bundle, strict) ==="
          codesign --verify --strict --verbose=2 stage/roomler-agent.app

          echo "=== hardened runtime ==="
          codesign -d --verbose=2 stage/roomler-agent.app 2>&1 | grep -q 'flags=.*runtime' \
            || { echo "::error::hardened runtime is NOT enabled on the app bundle -- notarisation would reject it"; exit 1; }

          echo "=== pkg signature ==="
          pkgutil --check-signature "$PKG"

          echo "=== stapled notarisation ticket ==="
          xcrun stapler validate "$PKG"

          echo "=== Gatekeeper (authoritative end-to-end check) ==="
          out="$(spctl -a -vvv -t install "$PKG" 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -q 'source=Notarized Developer ID' \
            || { echo "::error::spctl did not report 'source=Notarized Developer ID'. The .pkg would be refused on end-user Macs."; exit 1; }

      - name: Warn on unsigned build
        if: steps.apple.outputs.mode != 'full'
        run: echo "::warning::Apple signing credentials absent — the .pkg is unsigned and unnotarised, and Gatekeeper will block it on every end-user Mac. Artifacts-only run, so not fatal."

      - name: SHA256 checksum
        run: shasum -a 256 "${{ steps.pkg.outputs.artifact }}" > "${{ steps.pkg.outputs.artifact }}.sha256"

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain build.keychain || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: |
            ${{ steps.pkg.outputs.artifact }}
            ${{ steps.pkg.outputs.artifact }}.sha256
          retention-days: 30

      - name: Save cargo seed (new lockfile generation)
        # always(): preserves cache-on-failure semantics -- a rehearsal
        # that builds and then dies later must still seed (the 07-28
        # incident). Non-tag only: tag-ref saves are unrestorable dead
        # weight. A same-lockfile twin save loses the reservation and
        # warns -- harmless.
        if: always() && github.ref_type != 'tag'
        continue-on-error: true
        uses: ./.github/actions/seed-cache-save
        # GH_TOKEN powers the action's generation-retirement step (keeps
        # the 2 newest generations of this family, deletes the rest) —
        # without it, generations piled to 9.5 GB in a day and LRU evicted
        # the CI lane's caches instead (run 32198738776).
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          shared-key: agent-macos

  # ---------------------------------------------------------------------------
  # 4. Publish — only on tag push (or dispatch with publish_release=true).
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    if: needs.validate-version.outputs.is_release == 'true'
    needs: [validate-version, build-linux, build-linux-arm64, build-windows, build-windows-companions, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sigstore identity for the provenance attestation
      attestations: write  # actions/attest-build-provenance
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifact tree
        run: |
          mkdir -p release
          # rc.18: include `.exe` so the desktop companion EXE makes
          # the GitHub Release alongside the agent MSI/.pkg/.deb.
          # `windows-msi` carries the two agent MSIs; `windows-companions`
          # carries the desktop EXE; flatten is extension-based
          # so both artifact dirs (+ all .sha256 files) land unchanged.
          # `.tar.gz` is the universal Linux installer (docs/linux-self-update.md);
          # it must be listed here or the artifact is silently dropped from the
          # Release and every non-Debian host keeps skipping its updates.
          find dist -type f \( -name '*.msi' -o -name '*.pkg' -o -name '*.deb' -o -name '*.exe' -o -name '*.tar.gz' -o -name '*.sha256' \) \
            -exec mv {} release/ \;
          ls -la release/

      # Detached .asc signatures over every asset. What this actually buys
      # (and what it doesn't): dpkg -i does NOT verify signatures and apt
      # verifies a repo's InRelease, not per-package sigs -- so this is NOT
      # apt-level trust. It is an integrity check a human or a script can run
      # that does not depend on GitHub being honest, which is exactly the gap
      # the .sha256 sidecars leave (they are served by the same host they
      # attest). Key setup: scripts/signing/70-gpg-release-key.sh. Absent key
      # => skip with a notice (attestations below still cover provenance).
      - name: GPG-sign release artifacts
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE:  ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "::notice::GPG_PRIVATE_KEY not configured -- publishing without .asc signatures."
            exit 0
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          for f in release/*; do
            case "$f" in *.asc|*.sha256) continue ;; esac
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
                --armor --detach-sign "$f"
            echo "signed: $f"
          done
          # Republish the public key alongside the assets so verification
          # never depends on a checkout of this repo.
          gpg --batch --armor --export > release/roomler-release-pubkey.asc

      # SLSA build provenance for EVERY asset (all platforms in one step) --
      # ties each artifact to this exact workflow run + commit, verifiable
      # with `gh attestation verify <file> --repo gjovanov/roomler-ai`
      # independently of GitHub's per-asset digest field.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: 'release/*'

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-version.outputs.tag }}
          name: roomler-agent ${{ needs.validate-version.outputs.version }}
          # prerelease must stay false so GitHub's /releases/latest API
          # returns this release — the agent's built-in auto-updater
          # polls that endpoint every 6 h. Marking 0.x as prerelease
          # (the previous policy) caused every release to be invisible
          # to /releases/latest, which 404'd and broke self-update for
          # every 0.1.36 agent in the field.
          prerelease: false
          generate_release_notes: true
          files: release/*

  # ---------------------------------------------------------------------------
  # 5. Seed-failure alert — fires ONLY for non-release runs (the weekly
  #    cron + seed-release-caches.yml dispatches). A failed seed rehearsal
  #    used to be doubly silent: nobody watches artifacts-only runs, and
  #    the failed job saved no caches, so the release lane quietly went
  #    cold until someone noticed the slow builds. Exactly that happened
  #    2026-07-28→30: the dispatcher fired on a release-agent.yml change,
  #    its rehearsal died on LGHT0368 (broken mid-day wxs state), the wxs
  #    FIX commit touched only wix/ so nothing re-dispatched, and
  #    rc.266→277 all built cold (~23 min vs ~9). cache-on-failure above
  #    fixes the wasted-compile half; this job fixes the nobody-noticed
  #    half. Tag-run failures stay out — those are already loud.
  # ---------------------------------------------------------------------------
  seed-failure-alert:
    name: Alert on failed seed rehearsal
    if: >-
      always() &&
      needs.validate-version.outputs.is_release == 'false' &&
      (needs.build-linux.result == 'failure' ||
       needs.build-linux-arm64.result == 'failure' ||
       needs.build-windows.result == 'failure' ||
       needs.build-windows-companions.result == 'failure' ||
       needs.build-macos.result == 'failure')
    needs: [validate-version, build-linux, build-linux-arm64, build-windows, build-windows-companions, build-macos]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: File an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue create --repo "${{ github.repository }}" \
            --title "Seed rehearsal failed — release-lane caches NOT refreshed ($(date -u +%F))" \
            --body "$(printf 'The artifacts-only release-agent rehearsal (weekly cron or seed-release-caches.yml dispatch) failed: %s\n\nUntil a rehearsal succeeds on master, agent tag builds run with cold cargo caches (~+14 min on the Windows MSI job). cache-on-failure means partial seeds may still have been saved, but the failure itself needs fixing.\n\nRe-run after fixing:\n\n    gh workflow run release-agent.yml --ref master -f version=<workspace version> -f publish_release=false\n' "$run_url")"

  # ---------------------------------------------------------------------------
  # 6. Post-release re-seed — after every successful TAG release, dispatch
  #    the artifacts-only rehearsal so the master-ref seed (a) always
  #    matches the just-released Cargo.lock exactly and (b) is always the
  #    NEWEST cache in the repo pool, which LRU eviction therefore never
  #    touches ahead of the PR/CI churn. Together with the weekly cron,
  #    the toolchain/workflow-change dispatcher, cache-on-failure, and
  #    the seed-failure alert, every observed way the lane has gone cold
  #    (failed seed 07-28, env-hash rotation 07-23 + 08-01, pool eviction
  #    07-30) is now covered by an automatic re-seed within one cycle.
  #    Recursion-safe: rehearsals run with is_release=false, so they
  #    never trigger this job.
  # ---------------------------------------------------------------------------
  reseed:
    name: Re-seed master caches (post-release)
    if: needs.validate-version.outputs.is_release == 'true'
    needs: [validate-version, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Dispatch artifacts-only rehearsal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Read the version from MASTER (not the tag) — if another bump
          # already landed, the rehearsal should build that state; if the
          # version races mid-dispatch, validate-version fails loudly in
          # ~30 s and the next release's reseed (or the cron) covers it.
          version=$(awk '
            /^\[workspace\.package\]/ {in_section=1; next}
            /^\[/ {in_section=0}
            in_section && /^version[[:space:]]*=/ {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)
          echo "Dispatching post-release seed rehearsal for ${version}"
          gh workflow run release-agent.yml --ref master \
            -f version="${version}" -f publish_release=false

  # ---------------------------------------------------------------------------
  # 7. Bust the roomler.ai release cache.
  #
  #    `/api/{agent,tunnel,setup}/latest-release` is served from a per-pod,
  #    in-process cache, so without this step a freshly published tag stays
  #    invisible to the fleet for up to one TTL — and, with more than one pod,
  #    non-deterministically so (which answer you get depends on which pod the
  #    LB picked). Field repro 2026-08-04: agent-v0.3.0-rc.305 published 21:14
  #    UTC, `roomlerd self-update` still reported rc.304 at 21:33 because both
  #    pods had warmed their caches at 21:05.
  #
  #    One POST busts the whole cluster: the receiving pod refetches and fans
  #    the same request out to every live peer over the C-1 control bus.
  #    `expect_tag` makes the call meaningful rather than advisory — a pod only
  #    reports ok once it can actually SEE the tag we just published (GitHub's
  #    releases LIST endpoint trails release creation by a few seconds).
  #
  #    Deliberately non-blocking: the 15-minute cache TTL is the backstop, and
  #    a transient prod blip must not mark an already-shipped release failed.
  # ---------------------------------------------------------------------------
  refresh-release-cache:
    name: Refresh roomler.ai release cache
    if: needs.validate-version.outputs.is_release == 'true'
    needs: [validate-version, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/releases/refresh
        env:
          TOKEN: ${{ secrets.ROOMLER_RELEASE_REFRESH_TOKEN }}
          TAG: ${{ needs.validate-version.outputs.tag }}
        run: |
          set -uo pipefail
          if [ -z "${TOKEN}" ]; then
            echo "::notice::ROOMLER_RELEASE_REFRESH_TOKEN unset (fork?); skipping cache refresh"
            exit 0
          fi
          for attempt in 1 2 3; do
            body=$(curl -sS -m 90 -X POST \
              -H "Authorization: Bearer ${TOKEN}" \
              "https://roomler.ai/api/releases/refresh?expect_tag=${TAG}")
            if [ "$(jq -r '.all_ok' <<<"$body" 2>/dev/null)" = "true" ]; then
              jq . <<<"$body"
              echo "Release cache refreshed on every live pod for ${TAG}"
              exit 0
            fi
            echo "attempt ${attempt}: ${body:-<no response>}"
            sleep 10
          done
          echo "::warning::release cache refresh did not confirm on every pod for ${TAG}; the cache TTL will heal it within 15 min"
