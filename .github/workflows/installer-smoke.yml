# Phase 6 Chunk 6A — install + uninstall smoke for the per-User MSI
# on windows-latest. Catches the regressions install_detect locks
# (UpgradeCode registry presence) + the WiX bundle's basic
# correctness (the MSI installs cleanly + the agent binary lands at
# the expected path + uninstall cleans up). Cheap signal (~10 min) on
# every push that touches the agent or installer source.
#
# Explicitly NOT in scope this iteration:
#   * WebView2 UI automation of the wizard EXE (Welcome → Server →
#     Token → Install → Done). Tauri 2 + tauri-driver on a headless
#     GitHub runner is a 1–2 day spike in itself; deferred to Chunk
#     6B once this baseline is green.
#   * SystemContext swap testing. `ROOMLER_AGENT_ENABLE_SYSTEM_SWAP=1`
#     + WTSQueryUserToken + winlogon-token spawn needs an interactive
#     desktop session that GitHub-hosted Windows runners don't expose;
#     requires a self-hosted runner on a real Win11 VM. Phase 6 plan
#     called this risk out — see commit message.
#   * Per-Machine MSI. Same install/uninstall flow but admin-elevated.
#     Add when this per-User flow is green + we want to widen coverage.
#   * REAL code signing. The smoke doesn't ship anywhere, so it never
#     touches Azure Artifact Signing. It DOES exercise the sign-windows
#     action in `local` mode when the WIN_TEST_PFX_* secrets exist, which
#     gives the release path free per-push regression coverage: the
#     "assert install payload" step below then proves a SIGNED payload
#     still installs. Without the secrets the step skips, so forks and
#     unconfigured repos stay green.
name: installer-smoke

on:
  push:
    branches: [master]
    paths:
      - 'agents/roomler-agent/**'
      - '.github/workflows/installer-smoke.yml'
  workflow_dispatch: {}

# actions:write for the "Refresh the cache seed" step's `gh cache delete`
# (the default token is read-only for actions otherwise).
permissions:
  contents: read
  actions: write

jobs:
  windows-msi-install-uninstall:
    name: per-User MSI install + uninstall (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Mirrored so the payload-signing step's `if:` can test it -- secrets
      # are not available in step-level `if:` conditions.
      WIN_TEST_PFX_BASE64: ${{ secrets.WIN_TEST_PFX_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Refresh the cache seed (delete BEFORE restore)
        # Deleting the flat key BEFORE the restore makes this run's restore
        # MISS, and rust-cache saves UNCONDITIONALLY on a miss — so every
        # green non-tag run repopulates the seed with fresh content. The
        # earlier delete-AFTER-restore variant had two proven holes
        # (2026-08-15, runs 31904848770/31904853884): rust-cache SKIPS its
        # post-save when the restore was an exact hit ("Cache up-to-date"),
        # and two concurrent rehearsals (seed-release-caches dispatched a
        # twin 7 s after a manual one) could delete+skip in an interleaving
        # that left the key ABSENT for the next tag. Delete-before-restore
        # is race-proof for freshness: worst case both runs build cold and
        # the last save wins. Cost: rehearsals always build cold — which is
        # exactly the freshest possible seed; tag runs never delete.
        if: ${{ github.ref_type != 'tag' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache delete "v0-rust-installer-smoke-windows-Windows_NT-x64" --repo "${{ github.repository }}" || true

      - name: Cache cargo
        continue-on-error: true
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: installer-smoke-windows

      - name: Install WiX Toolset v3 + cargo-wix
        shell: pwsh
        run: |
          choco install -y wixtoolset
          $wixBin = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset v*\bin' | Select-Object -First 1
          "$($wixBin.FullName)" | Out-File -FilePath $env:GITHUB_PATH -Append
          # Idempotent: the seed caches (#488) can restore ~/.cargo/bin with
          # the tool present; a plain install hard-errors on it.
          if (-not (Get-Command cargo-wix -ErrorAction SilentlyContinue)) {
            cargo install cargo-wix --locked
          }

      - name: Build agent (release, minimal feature set)
        # Chunk 6A scope: install/uninstall validation only. Drop
        # `vp9-444` (avoids the vcpkg/libvpx dance) and `wgc-capture`
        # (Windows.Graphics.Capture not needed for install
        # validation). The MSI bundle just packages whatever exe is
        # at target/release/roomler-agent.exe; feature set affects
        # runtime behaviour only.
        shell: pwsh
        run: |
          cargo build -p roomler-agent --release `
            --features "mf-encoder,scrap-capture,openh264-encoder,enigo-input,clipboard,viewer-indicator,system-context"

      - name: Build the roomler CLI shim for the MSI bundle (P3e lever D)
        shell: pwsh
        run: |
          # wix/main.wxs UNCONDITIONALLY bundles a `TunnelExe` component, so
          # the WiX `light` step needs its source EXE present or it fails with
          # LGHT0103 — same failure mode as the wintun.dll staging below.
          # P3e lever D moved that source from the full tunnel CLI to the
          # ~150 KB shim that re-execs `roomlerd cli`; the INSTALLED name is
          # still roomler.exe, which is what the payload assert below checks.
          # Mirrors release-agent.yml's shim build step.
          cargo build -p roomler-cli-shim --release
          if (-not (Test-Path target\release\roomler-shim.exe)) {
            Write-Host "::error::roomler-shim.exe not produced — TunnelExe harvest would fail (LGHT0103)"
            exit 1
          }
          $kb = [math]::Round((Get-Item target\release\roomler-shim.exe).Length/1KB, 0)
          Write-Host "Staged roomler-shim.exe ($kb KB, installs as roomler.exe) for the TunnelExe component"

      # Mirrors release-agent.yml's payload-signing placement exactly: after
      # the binaries are built, BEFORE the third-party DLLs (wintun, VC-CRT)
      # are staged so they cannot be caught up in it, and before cargo-wix
      # harvests. Skipped entirely when the test cert is not configured --
      # `mode: local` is a hard error without a PFX by design (an explicit
      # request to sign must never silently degrade), so the gate is here.
      # `mode` is pinned to local rather than auto so a configured repo does
      # not burn real Azure signing quota on every master push.
      - name: Sign MSI payload binaries (local rehearsal)
        if: env.WIN_TEST_PFX_BASE64 != ''
        uses: ./.github/actions/sign-windows
        with:
          files: |
            target\release\roomlerd.exe
            target\release\roomler-shim.exe
          mode:               local
          require:            'true'
          # The action imports the self-signed cert into the runner's Root +
          # TrustedPublisher stores, so strict verification genuinely applies
          # here -- this is the same code path a release run takes.
          local-pfx-base64:   ${{ secrets.WIN_TEST_PFX_BASE64 }}
          local-pfx-password: ${{ secrets.WIN_TEST_PFX_PASSWORD }}

      - name: Stage wintun.dll for the MSI bundle
        shell: pwsh
        run: |
          # wix/main.wxs UNCONDITIONALLY bundles a `WintunDll` component
          # (overlay-l3's TUN driver) from target\release\wintun.dll, so the
          # WiX `light` step needs the DLL present even in this minimal-feature
          # smoke build — otherwise it fails with LGHT0103 (the long-standing
          # installer-smoke red). Mirrors release-agent.yml's staging step.
          $ver = '0.14.1'
          $zip = "$env:RUNNER_TEMP\wintun.zip"
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-$ver.zip" -OutFile $zip -UseBasicParsing
          $dest = "$env:RUNNER_TEMP\wintun"
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $dll = Join-Path $dest 'wintun\bin\amd64\wintun.dll'
          if (-not (Test-Path $dll)) { Write-Host "::error::wintun.dll (amd64) not found in the downloaded archive"; exit 1 }
          Copy-Item $dll target\release\wintun.dll -Force
          Write-Host "Staged wintun.dll ($([math]::Round((Get-Item target\release\wintun.dll).Length/1KB,0)) KB) for the MSI bundle"

      - name: Stage VC++ runtime DLLs for the MSI bundle
        shell: pwsh
        run: |
          # wix/main.wxs UNCONDITIONALLY bundles a `VcRedistCrt` component
          # (app-local Microsoft.VC14x.CRT so fresh machines without the
          # VC++ redistributable can run roomlerd.exe -- field report
          # 2026-07-28) from target\release\*.dll, so the WiX `light`
          # step needs the DLLs present or it fails with LGHT0103.
          # Mirrors release-agent.yml's staging step.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { Write-Host "::error::vswhere.exe not found on the runner"; exit 1 }
          $vsRoot = & $vswhere -latest -products * -property installationPath
          $crtDir = Get-ChildItem -Directory "$vsRoot\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT" -ErrorAction SilentlyContinue |
                    Sort-Object FullName | Select-Object -Last 1
          if (-not $crtDir) { Write-Host "::error::no Microsoft.VC14x.CRT redist folder under $vsRoot"; exit 1 }
          # Kept in lockstep with release-agent.yml: only the three CRT DLLs
          # our binaries import (see that step's comment for the import-table
          # evidence and the re-check recipe). The payload assert below locks
          # the same three by name.
          $expected = @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')
          foreach ($n in $expected) {
            $src = Join-Path $crtDir.FullName $n
            if (-not (Test-Path $src)) { Write-Host "::error::$n missing from $($crtDir.FullName) -- VcRedistCrt harvest would fail (LGHT0103)"; exit 1 }
            Copy-Item $src target\release\ -Force
          }
          Write-Host "Staged $($expected.Count) VC++ runtime DLLs from $($crtDir.FullName)"

      - name: Build per-User MSI
        shell: pwsh
        env:
          # cargo-wix reads the version from Cargo.toml but
          # `--install-version` lets us pin a known-marker version
          # for the registry assertion (the MSI's ProductVersion
          # lands under the UpgradeCode key alongside the
          # InstallProperties).
          #
          # cargo-wix requires the prerelease component to be
          # parseable as an integer — `0.0.0-smoke` fails with
          # "we couldn't convert the prerelease components to an
          # integer" (it maps semver `X.Y.Z-<text>.<N>` to MSI
          # `X.Y.Z.N`). Use a trailing `.1` so it lands as MSI
          # `0.0.0.1` — distinct enough from any real release
          # (which always start at 0.3.0+ rc.N) that an operator
          # who finds it on a machine knows it's a smoke artifact.
          SMOKE_VERSION: 0.0.0-smoke.1
        run: |
          cargo wix -p roomler-agent --nocapture --no-build --install-version $env:SMOKE_VERSION
          $msi = Get-ChildItem 'target/wix/*.msi' | Select-Object -First 1
          if (-not $msi) { throw 'MSI not produced by cargo-wix' }
          'MSI_PATH=' + $msi.FullName | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "MSI ready: $($msi.FullName) ($([math]::Round($msi.Length / 1MB, 2)) MiB)"

      - name: Install the MSI (quiet, per-User)
        shell: pwsh
        run: |
          # /quiet runs without UI; /norestart prevents implicit reboot
          # if the MSI calls for one; /l*v emits a verbose log so the
          # workflow's artifact upload below captures it on failure.
          $logDir = Join-Path $env:RUNNER_TEMP 'msi-logs'
          New-Item -ItemType Directory -Path $logDir -Force | Out-Null
          $log = Join-Path $logDir 'install.log'
          $proc = Start-Process -FilePath 'msiexec.exe' `
            -ArgumentList "/i `"$env:MSI_PATH`" /quiet /norestart /l*v `"$log`"" `
            -Wait -PassThru
          'INSTALL_LOG=' + $log | Out-File -FilePath $env:GITHUB_ENV -Append
          if ($proc.ExitCode -ne 0) {
            Get-Content $log -Tail 200
            throw "msiexec /i failed with exit $($proc.ExitCode)"
          }
          Write-Host "Install succeeded (exit 0)"

      - name: Assert registry UpgradeCode present (rc.27 install_detect lock)
        shell: pwsh
        run: |
          # rc.27's `install_detect::detect_existing_install` reads
          # HKCU + HKLM `Software\\…\\Installer\\UpgradeCodes\\<packed>`
          # where <packed> is the Windows-Installer-compressed encoding
          # of the UpgradeCode GUID. The MSI we just built carries
          # UpgradeCode `1F2D7B1C-8B2F-4D2E-B1A3-6B1E2C7E4D91` (see
          # `agents/roomler-agent/Cargo.toml::package.metadata.wix`).
          #
          # First attempt used `Get-Package -Provider msi` but the
          # PackageManagement `msi` provider isn't available on
          # PowerShell 7 (the runner's pwsh.exe), only on Windows
          # PowerShell 5.x. Run #26376742677 hit `Unable to find
          # package providers (msi)`. Switch to a direct registry walk
          # against `Uninstall\*` — works on every PS version, is
          # faster than Get-Package, and observably equivalent (an
          # MSI install lands BOTH an Uninstall entry AND the
          # UpgradeCodes entry; checking the former is sufficient
          # for "the MSI installed and the system sees it").
          # rc.279 asserted the ARP record must live in HKCU. That is NOT a
          # reliable per-user signal, and the check has failed on EVERY master
          # run since it landed in #260 -- it never once passed.
          #
          # The verbose MSI log from run 30843667006 settles what actually
          # happens: the payload installs per-user exactly as intended
          # (APPLICATIONFOLDER = C:\Users\<u>\AppData\Local\Programs\Roomler,
          # Start Menu under the user's Roaming profile, no ALLUSERS authored),
          # while Windows Server 2025 still mirrors the ARP record into an HKLM
          # Uninstall hive. So the install is correct and the assertion was
          # wrong about where to look.
          #
          # The AUTHORITATIVE per-user signal is the Installer UserData hive: a
          # per-user install registers the product under the INSTALLING USER's
          # SID, a per-machine one under SYSTEM (S-1-5-18). Assert that. The
          # scope-flip guard rc.279 wanted is PRESERVED, just re-pointed: a
          # genuine perMachine regression shows up under S-1-5-18 and still
          # fails this step.
          $sid    = ([Security.Principal.WindowsIdentity]::GetCurrent()).User.Value
          $udRoot = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Installer\UserData'
          function Find-RoomlerProduct($scopeSid) {
            $products = Join-Path $udRoot "$scopeSid\Products"
            if (-not (Test-Path $products)) { return $null }
            Get-ChildItem $products -ErrorAction SilentlyContinue |
              ForEach-Object {
                Get-ItemProperty (Join-Path $_.PSPath 'InstallProperties') -ErrorAction SilentlyContinue
              } |
              Where-Object { $_.DisplayName -and $_.DisplayName -match '(?i)roomler.*agent' } |
              Select-Object -First 1
          }
          $perUser    = Find-RoomlerProduct $sid
          $perMachine = Find-RoomlerProduct 'S-1-5-18'

          if (-not $perUser) {
            Write-Host "--- Roomler ARP entries, per hive (installing SID: $sid) ---"
            $hives = @{
              'HKCU\Uninstall'           = 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall'
              'HKLM\Uninstall'           = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall'
              'HKLM\WOW6432Node\Uninstall' = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
            }
            foreach ($label in $hives.Keys) {
              $root = $hives[$label]
              if (-not (Test-Path $root)) { Write-Host "${label}: (absent)"; continue }
              $rows = Get-ChildItem $root -ErrorAction SilentlyContinue |
                        Get-ItemProperty -ErrorAction SilentlyContinue |
                        Where-Object { $_.DisplayName -like '*roomler*' } |
                        Select-Object DisplayName, DisplayVersion, UninstallString
              if ($rows) { Write-Host "${label}:"; $rows | Format-Table -AutoSize }
              else { Write-Host "${label}: (no roomler entry)" }
            }
            Write-Host '--- Installer UserData SIDs present ---'
            Get-ChildItem $udRoot -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty PSChildName
            throw "MSI product not registered for the installing user ($sid) — the perUser flavour did not install per-user"
          }
          Write-Host "Installed per-user: $($perUser.DisplayName) $($perUser.DisplayVersion) (UserData SID $sid)"
          if ($perMachine) {
            throw "perUser MSI unexpectedly registered machine-wide (UserData S-1-5-18): $($perMachine.DisplayName)"
          }
          # Product code for later steps: the ARP mirror carries the real GUID
          # (the UserData key name is the PACKED form, which msiexec /x rejects).
          $arp = @(
            'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
          ) | Where-Object { Test-Path $_ } |
              ForEach-Object { Get-ChildItem $_ -ErrorAction SilentlyContinue } |
              Get-ItemProperty -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -and $_.DisplayName -match '(?i)roomler.*agent' } |
              Select-Object -First 1
          if ($arp) {
            'INSTALLED_PRODUCT_CODE=' + $arp.PSChildName | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Assert install payload at the canonical path (P4b)
        shell: pwsh
        run: |
          # P4b renamed the per-User install dir to
          # %LOCALAPPDATA%\Programs\Roomler and added the tunnel CLI
          # to the bundle. Assert the EXACT canonical layout (the old
          # loose multi-candidate probe would silently pass on a
          # regression back to the pre-rename dir): daemon
          # + tunnel CLI + wintun must all land. Also assert the
          # TunnelExe component's user-PATH append took (HKCU\
          # Environment — MSI writes it for Environment System='no').
          # P3d Slice C: the roomler-agent.exe alias is retired — the MSI
          # ships only the canonical names now.
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\Roomler'
          # msvcp140/vcruntime140* lock the app-local VcRedistCrt component
          # (fresh machines without the VC++ redist -- 2026-07-28 fix).
          $mustExist = @('roomlerd.exe', 'roomler.exe', 'wintun.dll',
                         'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')
          $missing = @()
          foreach ($f in $mustExist) {
            $p = Join-Path $installDir $f
            if (Test-Path $p) {
              Write-Host "present: $p"
            } else {
              $missing += $p
            }
          }
          if ($missing.Count -gt 0) {
            Write-Host '--- Searching for stray payloads under common roots ---'
            $roots = @(
              $env:LOCALAPPDATA,
              $env:ProgramFiles
            ) | Where-Object { Test-Path $_ }
            foreach ($r in $roots) {
              Get-ChildItem -Path $r -Include 'roomlerd.exe','roomler-agent.exe' -Recurse -ErrorAction SilentlyContinue |
                ForEach-Object { Write-Host "  found at: $($_.FullName)" }
            }
            throw "missing from $($installDir): $($missing -join ', ')"
          }
          $userPath = (Get-ItemProperty -Path 'HKCU:\Environment' -ErrorAction SilentlyContinue).PATH
          if (-not ($userPath -and $userPath -match [regex]::Escape('Programs\Roomler'))) {
            throw "user PATH does not contain Programs\Roomler after install (HKCU\Environment PATH = '$userPath')"
          }
          Write-Host "User PATH contains the install dir"

      - name: Uninstall the MSI (quiet)
        shell: pwsh
        run: |
          $logDir = Join-Path $env:RUNNER_TEMP 'msi-logs'
          $log = Join-Path $logDir 'uninstall.log'
          $proc = Start-Process -FilePath 'msiexec.exe' `
            -ArgumentList "/x `"$env:MSI_PATH`" /quiet /norestart /l*v `"$log`"" `
            -Wait -PassThru
          'UNINSTALL_LOG=' + $log | Out-File -FilePath $env:GITHUB_ENV -Append
          if ($proc.ExitCode -ne 0) {
            Get-Content $log -Tail 200
            throw "msiexec /x failed with exit $($proc.ExitCode)"
          }
          Write-Host 'Uninstall succeeded (exit 0)'

      - name: Assert cleanup — registry + install dir gone
        shell: pwsh
        run: |
          # Same registry-direct query as the post-install assert.
          # Get-Package -Provider msi is PowerShell 5.x-only and the
          # runner uses pwsh 7 (see post-install step's comment).
          $uninstallRoots = @(
            'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
          )
          # Same loose filter as the post-install step — match either
          # "Roomler Agent" (WiX DisplayName) or "roomler-agent"
          # (Cargo package name) so a future WiX rename in either
          # direction doesn't silently turn this assert into a no-op.
          $stragglers = @()
          foreach ($root in $uninstallRoots) {
            if (-not (Test-Path $root)) { continue }
            $stragglers += Get-ChildItem $root -ErrorAction SilentlyContinue |
                             Get-ItemProperty -ErrorAction SilentlyContinue |
                             Where-Object {
                               $_.DisplayName -and $_.DisplayName -match '(?i)roomler.*agent'
                             }
          }
          if ($stragglers.Count -gt 0) {
            throw "roomler-agent install record still present after uninstall: $($stragglers.DisplayName -join ', ')"
          }
          # P4b canonical layout: every component-managed payload must
          # be gone from Programs\Roomler (all files are component-
          # managed, and the wxs RemoveFolder pair drops the dir when
          # empty), and the TunnelExe component's user-PATH append
          # must have been removed (Environment Part='last' +
          # implicit Permanent='no').
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\Roomler'
          foreach ($f in @('roomlerd.exe', 'roomler-agent.exe', 'roomler.exe', 'wintun.dll', 'msvcp140.dll', 'vcruntime140_1.dll')) {
            $p = Join-Path $installDir $f
            if (Test-Path $p) {
              throw "$f still at $p after uninstall — MSI uninstaller is broken"
            }
          }
          if (Test-Path $installDir) {
            Write-Host "::warning::$installDir still exists (empty dir tolerated; component files verified gone)"
            Get-ChildItem $installDir -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  leftover: $($_.FullName)" }
          }
          $userPath = (Get-ItemProperty -Path 'HKCU:\Environment' -ErrorAction SilentlyContinue).PATH
          if ($userPath -and $userPath -match [regex]::Escape('Programs\Roomler')) {
            throw "user PATH still contains Programs\Roomler after uninstall (HKCU\Environment PATH = '$userPath')"
          }
          Write-Host 'Uninstall left no traces: payload, install dir contents, PATH entry and MSI registry record all clean'

      - name: Compile per-Machine MSI (wxs lint, no install)
        shell: pwsh
        env:
          SMOKE_VERSION: 0.0.0-smoke.1
        run: |
          # The release pipeline builds the per-Machine flavour by
          # file-swapping wix-perMachine/main.wxs over wix/main.wxs
          # (cargo-wix auto-discovers every wxs under wix/), and until
          # now NOTHING validated that file before the agent-v* tag run
          # -- the first rc.266 tag burned on a per-Machine-only
          # LGHT0368 that this smoke never compiled. Mirror the swap
          # and compile it here (candle + light + ICE = the actual
          # gate); no install, the flavour needs elevation semantics
          # this job doesn't exercise. Clear target\wix first: both
          # flavours emit the SAME output filename, and the per-User
          # MSI at $env:MSI_PATH was already installed + uninstalled
          # above, so clobbering is fine but a stale file would make
          # the produced-MSI assert vacuous.
          Remove-Item target\wix\*.msi -Force -ErrorAction SilentlyContinue
          $wixDir = "agents\roomler-agent\wix"
          $pmSrc  = "agents\roomler-agent\wix-perMachine\main.wxs"
          Copy-Item "$wixDir\main.wxs" "$wixDir\main.wxs.bak" -Force
          Copy-Item $pmSrc "$wixDir\main.wxs" -Force
          try {
            cargo wix -p roomler-agent --nocapture --no-build --install-version $env:SMOKE_VERSION
          } finally {
            Move-Item "$wixDir\main.wxs.bak" "$wixDir\main.wxs" -Force
          }
          $msi = Get-ChildItem 'target/wix/*.msi' | Select-Object -First 1
          if (-not $msi) { throw 'per-Machine MSI not produced by cargo-wix' }
          Write-Host "per-Machine MSI compiles clean: $($msi.Name) ($([math]::Round($msi.Length / 1MB, 2)) MiB)"

      - name: Upload MSI logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: msi-logs
          path: ${{ runner.temp }}/msi-logs/
          retention-days: 7
