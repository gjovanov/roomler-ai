# RETIRED-NAME-ANCHOR-BEGIN
# This lane installs and uninstalls the real installers, so it must assert on
# the names a host actually has — including the pre-rename ones it is checking
# are cleaned up: the legacy service and task, the roomler-agent.exe alias, the
# old install folders and the published MSI names.
# INVARIANT: a retired name here must be one the installer has to create, find or
# remove on a real host. docs/fr/FR-21
# Phase 6 Chunk 6A — install + uninstall smoke for the per-User MSI
# on windows-latest. Catches the regressions install_detect locks
# (UpgradeCode registry presence) + the WiX bundle's basic
# correctness (the MSI installs cleanly + the agent binary lands at
# the expected path + uninstall cleans up). Cheap signal (~10 min) on
# every push that touches the agent or installer source.
#
# Explicitly NOT in scope this iteration:
#   * WebView2 UI automation of the wizard EXE (Welcome → Server →
#     Token → Install → Done). Tauri 2 + tauri-driver on a headless
#     GitHub runner is a 1–2 day spike in itself; deferred to Chunk
#     6B once this baseline is green.
#   * SystemContext swap testing. `ROOMLER_AGENT_ENABLE_SYSTEM_SWAP=1`
#     + WTSQueryUserToken + winlogon-token spawn needs an interactive
#     desktop session that GitHub-hosted Windows runners don't expose;
#     requires a self-hosted runner on a real Win11 VM. Phase 6 plan
#     called this risk out — see commit message.
#   * The per-Machine MSI's full install assertions. It IS installed now,
#     since #1727: four upgrades that check the SystemContext switch in the
#     service's Environment survives a hand-run install. It is not put
#     through the per-User payload and registry asserts below.
#   * REAL code signing. The smoke doesn't ship anywhere, so it never
#     touches Azure Artifact Signing. It DOES exercise the sign-windows
#     action in `local` mode when the WIN_TEST_PFX_* secrets exist, which
#     gives the release path free per-push regression coverage: the
#     "assert install payload" step below then proves a SIGNED payload
#     still installs. Without the secrets the step skips, so forks and
#     unconfigured repos stay green.
name: installer-smoke

on:
  push:
    branches: [master]
    paths:
      - 'agents/roomlerd/**'
      - 'agents/roomlerdw/**'
      - 'agents/roomler-msi-ca/**'
      - '.github/workflows/installer-smoke.yml'
      - 'scripts/macos-productbuild-gated.sh'
  # Also on PRs — but only those touching the INSTALLER surface, not the whole
  # agent. Until now this job ran on push-to-master and dispatch only, so its
  # checks (including the PE import audit added in #647) first executed AFTER
  # a change had already landed. A gate that cannot run on the change under
  # review is a gate that reports history.
  #
  # Scoped deliberately rather than mirroring the push paths: this is a ~20 min
  # windows-latest job, and Windows runner contention in this repo is real —
  # rc.424's MSI job sat QUEUED for 70 minutes behind a release burst. Measured
  # over the last 90 days, these paths carry 29 commits against 316 for
  # `agents/roomlerd/**`, so this fires on roughly one agent PR in ten:
  # the ones where the installer itself changed.
  #
  # ⚠️ If you change what the MSI SHIPS (a new native dependency, a wxs
  # component, the CRT staging list), add that path here too — otherwise the
  # audit silently stops covering the change that needed it most.
  pull_request:
    paths:
      - 'agents/roomlerd/wix/**'
      - 'agents/roomlerd/wix-perMachine/**'
      # #3292 — what the per-user MSI's task, custom actions and shortcut run,
      # and what the registration writes.
      - 'agents/roomlerdw/**'
      - 'agents/roomlerd/src/service.rs'
      - 'agents/roomlerd/packaging/windows/**'
      # The macOS packaging was missing here, so the postinstall — the script
      # that decides whether the root daemon lives or is DELETED — could change
      # without this job ever running on the PR. That is the hole the warning
      # above describes, and it cost a real regression: an rc.458 -> rc.460
      # self-update silently removed the daemon on a field MacBook.
      - 'agents/roomlerd/packaging/macos/**'
      - 'agents/roomlerd/build.rs'
      # #1727 — the per-Machine MSI runs `roomlerd keep-system-context`, which
      # decides from this module; a change to it changes what an install does.
      - 'agents/roomlerd/src/win_service/system_context_attempt.rs'
      # #3115 — what RegisterService / UnregisterService do to the service (its
      # waits, the in-place reconfigure) and the SystemContext actions' env
      # writes and restart. `win_service/mod.rs` is left out on purpose: its
      # install()/uninstall() are thin wrappers over lifecycle.rs, and the host
      # code that shares the file changes far more often than the installer.
      - 'agents/roomlerd/src/win_service/lifecycle.rs'
      - 'agents/roomlerd/src/win_service/environment.rs'
      # #3375 — the custom-action DLL the per-Machine MSI loads on every
      # upgrade: a change to it changes what an update keeps.
      - 'agents/roomler-msi-ca/**'
      - '.github/workflows/installer-smoke.yml'
      - 'scripts/macos-productbuild-gated.sh'
  workflow_dispatch: {}

# actions:write was for a "Refresh the cache seed (delete BEFORE restore)"
# step, removed in FR-6 wave 14 (#773): it ran on PRs too, and a PR deleting
# a master cache it may not re-save (see `save-if` below) is eviction by
# another name. Nothing else here needs it — artifact uploads use the
# runner's own token.
permissions:
  contents: read

# FR-6 wave 25 (#773): ci.yml's rule. A newer push to a PR cancels its
# running smokes. On master a running smoke always finishes (it publishes
# the cargo caches), and a newer push cancels only the run still waiting.
# A dispatch gets a group of its own.
concurrency:
  group: installer-smoke-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-msi-install-uninstall:
    name: per-User MSI install + uninstall (windows-latest)
    runs-on: windows-latest
    # 40, not 30: FR-133 P1's upgrade cells add three released-MSI installs and
    # two more MSI builds (about 6 min) to a job that runs ~10 min warm.
    timeout-minutes: 40
    # FR-6 wave 22 (#773): a master push publishes this job's cargo cache as a
    # release asset (ci-seed-save), which needs `contents: write`.
    permissions:
      contents: write
    env:
      # Mirrored so the payload-signing step's `if:` can test it -- secrets
      # are not available in step-level `if:` conditions.
      WIN_TEST_PFX_BASE64: ${{ secrets.WIN_TEST_PFX_BASE64 }}
      # rust-cache set this for the job until wave 22; set it here.
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4

      # #3754 — every installer run of this job goes through Invoke-Installer,
      # never through `Start-Process -Wait`, which waits for every process in
      # the child's job object and has no deadline. It waits for the one process
      # it started, for at most its deadline. Past the deadline it saves the
      # evidence (every process with its image path, and the service's and the
      # per-User daemon's logs), ends that process's tree and fails the step.
      # Any exit but 0 fails too, and 3010 or 1641 says that a restart was
      # needed. Every failure prints the MSI log's RESTART MANAGER and held-in-use
      # lines. Five jobs sat in an msiexec run until the job's limit and left no
      # log at all (#3754). 300 s is twice the slowest passing per-Machine step
      # (nine runs), and more than every bounded wait of the custom actions summed.
      - name: "The installer runner: a deadline on every installer run, and its evidence (#3754)"
        shell: pwsh
        run: |
          $runner = Join-Path $env:RUNNER_TEMP 'installer-run.ps1'
          @'
          $InstallerEvidence = Join-Path $env:RUNNER_TEMP 'msi-logs'
          New-Item -ItemType Directory -Path $InstallerEvidence -Force | Out-Null
          # What a Windows Installer log says about a restart.
          $RestartMarks = 'RESTART MANAGER', 'held in use', 'ReplacedInUseFiles', 'requires a system restart', 'MainEngineThread is returning'

          # Every process with its image path and command line, and the logs of
          # the service and of the per-User daemon, as they are now.
          function Save-InstallerEvidence([string]$Label, [string]$Dir = $InstallerEvidence) {
            $to = Join-Path $Dir ('evidence-' + ($Label -replace '[^A-Za-z0-9._-]+', '-'))
            New-Item -ItemType Directory -Path $to -Force | Out-Null
            $procs = @(Get-CimInstance Win32_Process | Sort-Object ProcessId)
            $procs | Select-Object ProcessId, ParentProcessId, Name, ExecutablePath, CommandLine, CreationDate |
              Export-Csv -NoTypeInformation -Encoding utf8 -Path (Join-Path $to 'processes.csv')
            $procs | Where-Object { $_.Name -match '^(msiexec|roomler)' } |
              Format-Table -AutoSize ProcessId, ParentProcessId, Name, ExecutablePath | Out-String -Width 400 | Write-Host
            $logs = @{ 'service-logs' = "$env:ProgramData\roomler\roomler\service-logs"; 'per-user-logs' = "$env:LOCALAPPDATA\roomler\roomler\data\logs" }
            foreach ($name in $logs.Keys) {
              if (Test-Path -LiteralPath $logs[$name]) { Copy-Item -LiteralPath $logs[$name] -Destination (Join-Path $to $name) -Recurse -Force -ErrorAction SilentlyContinue }
            }
            Write-Host "evidence saved: $to ($($procs.Count) processes)"
          }

          function Get-RestartLines([string]$Log) {
            if (-not $Log -or -not (Test-Path -LiteralPath $Log)) { return @() }
            @(Select-String -LiteralPath $Log -SimpleMatch -Pattern $RestartMarks | ForEach-Object { "{0,6}: {1}" -f $_.LineNumber, $_.Line.Trim() })
          }

          # Runs one installer process and waits for that process alone, for at
          # most $DeadlineSeconds. -Output sends a console program's stdout and
          # stderr to <Output>.out.log and <Output>.err.log. -RestartNote is added
          # to the failure when the exit says a restart was needed.
          function Invoke-Installer {
            param(
              [Parameter(Mandatory)][string]$Label,
              [Parameter(Mandatory)][string]$FilePath,
              [Parameter(Mandatory)][string]$Arguments,
              [string]$Log,
              [int]$DeadlineSeconds = 300,
              [string]$Output,
              [string]$RestartNote,
              [string]$EvidenceDir = $InstallerEvidence,
              [int]$Tail = 120,
              [switch]$NoAnnotation
            )
            $start = @{ FilePath = $FilePath; ArgumentList = $Arguments; PassThru = $true }
            if ($Output) { $start += @{ NoNewWindow = $true; RedirectStandardOutput = "$Output.out.log"; RedirectStandardError = "$Output.err.log" } }
            $clock = [System.Diagnostics.Stopwatch]::StartNew()
            $p = Start-Process @start
            $null = $p.Handle   # held from here, so the exit code outlives the process
            $why = $null
            if (-not $p.WaitForExit($DeadlineSeconds * 1000)) {
              Save-InstallerEvidence $Label $EvidenceDir   # before anything is ended
              try { $p.Kill($true) } catch { Write-Host "ending pid $($p.Id): $($_.Exception.Message)" }
              $null = $p.WaitForExit(30000)
              $why = "still running at its deadline of $DeadlineSeconds s, so its process tree was ended"
            } elseif ($p.ExitCode -eq 3010 -or $p.ExitCode -eq 1641) {
              $why = "exited $($p.ExitCode): Windows Installer needed a restart ($(if ($p.ExitCode -eq 1641) { 'and started one' } else { 'held back by REBOOT=ReallySuppress' }))"
              if ($RestartNote) { $why += ". $RestartNote" }
            } elseif ($p.ExitCode -ne 0) {
              $why = "exited $($p.ExitCode)"
            }
            $secs = [int]$clock.Elapsed.TotalSeconds
            if (-not $why) { Write-Host "${Label}: exit 0 in $secs s"; return }
            if ($why -notlike 'still running*') { Save-InstallerEvidence $Label $EvidenceDir }
            $lines = @(Get-RestartLines $Log)
            if ($Log) {
              Write-Host "--- $(Split-Path $Log -Leaf): $($lines.Count) line(s) on RESTART MANAGER, files held in use and the engine's end ---"
              $lines | ForEach-Object { Write-Host $_ }
              if (Test-Path -LiteralPath $Log) { Write-Host "--- the last $Tail lines of $(Split-Path $Log -Leaf) ---"; Get-Content -LiteralPath $Log -Tail $Tail | Write-Host }
            }
            $msg = "${Label}: $why (after $secs s)"
            if (-not $NoAnnotation) { Write-Host "::error title=installer run failed::$msg" }
            $ex = [System.Exception]::new($msg)
            $ex.Data['RestartLines'] = $lines
            throw $ex
          }

          # msiexec with the workflow's usual switches; /norestart is
          # REBOOT=ReallySuppress for /i and /x.
          function Invoke-Msi([string]$verb, [string]$msi, [string]$log, [string]$props) {
            Invoke-Installer -Label "msiexec $verb $(Split-Path $msi -Leaf) [$props]" -FilePath 'msiexec.exe' `
              -Arguments "$verb `"$msi`" /qn /norestart /l*v `"$log`" $props" -Log $log
          }
          '@ | Set-Content -LiteralPath $runner -Encoding utf8
          'INSTALLER_RUN=' + $runner | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "installer runner: $runner"

      # #3754 — the negative control of the deadline above: an endless process
      # with an endless child of its own is ended and reported within its limit,
      # or every deadline in this job is a claim, not a check. And an exit of
      # 3010 fails with the log's Restart Manager lines. Only then does it pass.
      - name: "The installer runner ends an endless process at its deadline and reports it (#3754, negative control)"
        shell: pwsh
        run: |
          . $env:INSTALLER_RUN
          $dir = Join-Path $env:RUNNER_TEMP 'deadline-control'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $endless = Join-Path $dir 'endless.ps1'
          @'
          param([string]$Marker, [switch]$Leaf)
          if (-not $Leaf) {
            Start-Process -FilePath (Get-Process -Id $PID).Path -WindowStyle Hidden `
              -ArgumentList '-NoProfile', '-File', "`"$PSCommandPath`"", '-Marker', $Marker, '-Leaf'
          }
          while ($true) { Start-Sleep -Seconds 1 }
          '@ | Set-Content -LiteralPath $endless -Encoding utf8
          $marker = 'endless-' + [guid]::NewGuid().ToString('N')
          $limit = 20
          $clock = [System.Diagnostics.Stopwatch]::StartNew()
          $failed = $null
          try {
            Invoke-Installer -Label 'deadline control' -FilePath (Get-Process -Id $PID).Path `
              -Arguments "-NoProfile -File `"$endless`" -Marker $marker" -DeadlineSeconds $limit -EvidenceDir $dir -NoAnnotation
          } catch { $failed = $_.Exception.Message }
          $took = $clock.Elapsed.TotalSeconds
          Write-Host ("the runner said, after {0:n1} s: {1}" -f $took, $failed)
          if (-not $failed) { throw 'NEGATIVE CONTROL FAILED: an endless process came back as a success' }
          if ($failed -notlike '*deadline*') { throw "NEGATIVE CONTROL FAILED: the runner failed, but not on its deadline: $failed" }
          if ($took -lt $limit -or $took -gt $limit + 60) { throw "NEGATIVE CONTROL FAILED: the deadline was $limit s and the runner gave up after $took s" }
          # Reported: the process list it saved before ending anything holds both.
          $saved = @(Import-Csv (Join-Path $dir 'evidence-deadline-control\processes.csv') | Where-Object { $_.CommandLine -like "*$marker*" })
          if ($saved.Count -ne 2) { throw "NEGATIVE CONTROL FAILED: the saved process list holds $($saved.Count) of the 2 endless processes" }
          # Ended: neither outlives the deadline.
          Start-Sleep -Seconds 2
          $left = @(Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like "*$marker*" })
          if ($left.Count) {
            $left | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            throw "NEGATIVE CONTROL FAILED: $($left.Count) endless process(es) outlived the deadline"
          }
          Write-Host "OK: the endless process and its child were saved in the evidence, then ended, $([int]$took) s after a $limit s deadline"

          # An exit of 3010 fails, and prints the log's restart lines.
          $planted = Join-Path $dir 'planted.log'
          @(
            'MSI (s) (00:00) [00:00:00:000]: RESTART MANAGER: Did detect that a critical application holds file[s] in use, so a reboot will be necessary.',
            'Info 1603. The file C:\Program Files\Roomler\roomlerd.exe is being held in use by the following process: Name: roomlerd, Id: 1.'
          ) | Set-Content -LiteralPath $planted -Encoding utf8
          $failed = $null
          try {
            Invoke-Installer -Label 'exit 3010 control' -FilePath "$env:SystemRoot\System32\cmd.exe" -Arguments '/d /c exit 3010' `
              -Log $planted -EvidenceDir $dir -RestartNote 'planted' -NoAnnotation
          } catch { $failed = $_ }
          if (-not $failed -or $failed.Exception.Message -notlike '*exited 3010*') { throw "NEGATIVE CONTROL FAILED: an exit of 3010 came back as: $failed" }
          $printed = @($failed.Exception.Data['RestartLines'])
          if ($printed.Count -ne 2) { throw "NEGATIVE CONTROL FAILED: the runner printed $($printed.Count) of the log's 2 restart lines" }
          Write-Host 'OK: an exit of 3010 failed, with the log''s RESTART MANAGER and held-in-use lines'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Salt the cargo cache key with this job's definition
        # FR-6 wave 16 (#773): rotates this job's cargo cache when its own
        # steps change. After checkout, before the cache; see the action.
        uses: ./.github/actions/cargo-cache-salt

      - name: Restore the cargo cache (release-asset store)
        # FR-6 wave 22 (#773): this job's cache lives on the seed-cache release,
        # not in the Actions cache, whose free 10 GB holds the PR lanes (see
        # .github/actions/ci-seed-restore). It carries the cargo-installed
        # cargo-wix too, as rust-cache did.
        id: seed
        continue-on-error: true
        uses: ./.github/actions/ci-seed-restore
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          family: installer-smoke-windows

      - name: Install WiX Toolset v3 + cargo-wix
        shell: pwsh
        run: |
          choco install -y wixtoolset; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wixBin = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset v*\bin' | Select-Object -First 1
          "$($wixBin.FullName)" | Out-File -FilePath $env:GITHUB_PATH -Append
          # Idempotent: the seed caches (#488) can restore ~/.cargo/bin with
          # the tool present; a plain install hard-errors on it.
          if (-not (Get-Command cargo-wix -ErrorAction SilentlyContinue)) {
            cargo install cargo-wix --locked; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build agent (release, minimal feature set)
        # Chunk 6A scope: install/uninstall validation only. Drop
        # `vp9-444` (avoids the vcpkg/libvpx dance) and `wgc-capture`
        # (Windows.Graphics.Capture not needed for install
        # validation). The MSI bundle just packages whatever exe is
        # at target/release/roomler-agent.exe; feature set affects
        # runtime behaviour only.
        shell: pwsh
        run: |
          cargo build -p roomlerd --release `
            --features "mf-encoder,scrap-capture,openh264-encoder,enigo-input,clipboard,viewer-indicator,system-context"

      - name: Build the roomler CLI shim for the MSI bundle (P3e lever D)
        shell: pwsh
        run: |
          # wix/main.wxs UNCONDITIONALLY bundles a `TunnelExe` component, so
          # the WiX `light` step needs its source EXE present or it fails with
          # LGHT0103 — same failure mode as the wintun.dll staging below.
          # P3e lever D moved that source from the full tunnel CLI to the
          # ~150 KB shim that re-execs `roomlerd cli`; the INSTALLED name is
          # still roomler.exe, which is what the payload assert below checks.
          # Mirrors release-agent.yml's shim build step.
          cargo build -p roomler-cli-shim --release; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path target\release\roomler-shim.exe)) {
            Write-Host "::error::roomler-shim.exe not produced — TunnelExe harvest would fail (LGHT0103)"
            exit 1
          }
          $kb = [math]::Round((Get-Item target\release\roomler-shim.exe).Length/1KB, 0)
          Write-Host "Staged roomler-shim.exe ($kb KB, installs as roomler.exe) for the TunnelExe component"
          # #3292: the windowless launcher the per-user Scheduled Task runs.
          cargo build -p roomlerdw --release; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path target\release\roomlerdw.exe)) {
            Write-Host "::error::roomlerdw.exe not produced — LauncherExe harvest would fail (LGHT0103)"
            exit 1
          }

      # #3375: the per-Machine MSI's custom-action DLL (agents/roomler-msi-ca),
      # built as release-agent.yml builds it: the CRT linked in, in a target
      # dir of its own so the flag never reaches another crate. msiexec loads
      # it from the MSI's Binary table, alone in a temp folder, on machines
      # that may have no VC++ redistributable. A plain build of the same crate
      # is kept aside for the import audit's negative control below. Before
      # the payload signing, which it joins.
      - name: "Build the per-Machine MSI's custom-action DLL (#3375)"
        shell: pwsh
        run: |
          cargo build -p roomler-msi-ca --release
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\msi-ca" -Force | Out-Null
          Copy-Item target\release\roomler_msi_ca.dll "$env:RUNNER_TEMP\msi-ca\plain-crt.dll" -Force
          $env:RUSTFLAGS = '-C target-feature=+crt-static'
          cargo build -p roomler-msi-ca --release --target-dir target\msi-ca
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item target\msi-ca\release\roomler_msi_ca.dll target\release\roomler_msi_ca.dll -Force

      # Mirrors release-agent.yml's payload-signing placement exactly: after
      # the binaries are built, BEFORE the third-party DLLs (wintun, VC-CRT)
      # are staged so they cannot be caught up in it, and before cargo-wix
      # harvests. Skipped entirely when the test cert is not configured --
      # `mode: local` is a hard error without a PFX by design (an explicit
      # request to sign must never silently degrade), so the gate is here.
      # `mode` is pinned to local rather than auto so a configured repo does
      # not burn real Azure signing quota on every master push.
      - name: Sign MSI payload binaries (local rehearsal)
        if: env.WIN_TEST_PFX_BASE64 != ''
        uses: ./.github/actions/sign-windows
        with:
          files: |
            target\release\roomlerd.exe
            target\release\roomler-shim.exe
            target\release\roomlerdw.exe
            target\release\roomler_msi_ca.dll
          mode:               local
          require:            'true'
          # The action imports the self-signed cert into the runner's Root +
          # TrustedPublisher stores, so strict verification genuinely applies
          # here -- this is the same code path a release run takes.
          local-pfx-base64:   ${{ secrets.WIN_TEST_PFX_BASE64 }}
          local-pfx-password: ${{ secrets.WIN_TEST_PFX_PASSWORD }}

      - name: Stage wintun.dll for the MSI bundle
        shell: pwsh
        run: |
          # wix/main.wxs UNCONDITIONALLY bundles a `WintunDll` component
          # (overlay-l3's TUN driver) from target\release\wintun.dll, so the
          # WiX `light` step needs the DLL present even in this minimal-feature
          # smoke build — otherwise it fails with LGHT0103 (the long-standing
          # installer-smoke red). Mirrors release-agent.yml's staging step.
          $ver = '0.14.1'
          $zip = "$env:RUNNER_TEMP\wintun.zip"
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-$ver.zip" -OutFile $zip -UseBasicParsing
          $dest = "$env:RUNNER_TEMP\wintun"
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $dll = Join-Path $dest 'wintun\bin\amd64\wintun.dll'
          if (-not (Test-Path $dll)) { Write-Host "::error::wintun.dll (amd64) not found in the downloaded archive"; exit 1 }
          Copy-Item $dll target\release\wintun.dll -Force
          Write-Host "Staged wintun.dll ($([math]::Round((Get-Item target\release\wintun.dll).Length/1KB,0)) KB) for the MSI bundle"

      - name: Stage VC++ runtime DLLs for the MSI bundle
        shell: pwsh
        run: |
          # wix/main.wxs UNCONDITIONALLY bundles a `VcRedistCrt` component
          # (app-local Microsoft.VC14x.CRT so fresh machines without the
          # VC++ redistributable can run roomlerd.exe -- field report
          # 2026-07-28) from target\release\*.dll, so the WiX `light`
          # step needs the DLLs present or it fails with LGHT0103.
          # Mirrors release-agent.yml's staging step.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { Write-Host "::error::vswhere.exe not found on the runner"; exit 1 }
          $vsRoot = & $vswhere -latest -products * -property installationPath
          $crtDir = Get-ChildItem -Directory "$vsRoot\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT" -ErrorAction SilentlyContinue |
                    Sort-Object FullName | Select-Object -Last 1
          if (-not $crtDir) { Write-Host "::error::no Microsoft.VC14x.CRT redist folder under $vsRoot"; exit 1 }
          # Kept in lockstep with release-agent.yml: only the three CRT DLLs
          # our binaries import (see that step's comment for the import-table
          # evidence and the re-check recipe). The payload assert below locks
          # the same three by name.
          $expected = @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')
          foreach ($n in $expected) {
            $src = Join-Path $crtDir.FullName $n
            if (-not (Test-Path $src)) { Write-Host "::error::$n missing from $($crtDir.FullName) -- VcRedistCrt harvest would fail (LGHT0103)"; exit 1 }
            Copy-Item $src target\release\ -Force
          }
          Write-Host "Staged $($expected.Count) VC++ runtime DLLs from $($crtDir.FullName)"

      - name: Build per-User MSI
        shell: pwsh
        env:
          # cargo-wix reads the version from Cargo.toml but
          # `--install-version` lets us pin a known-marker version
          # for the registry assertion (the MSI's ProductVersion
          # lands under the UpgradeCode key alongside the
          # InstallProperties).
          #
          # cargo-wix requires the prerelease component to be
          # parseable as an integer — `0.0.0-smoke` fails with
          # "we couldn't convert the prerelease components to an
          # integer" (it maps semver `X.Y.Z-<text>.<N>` to MSI
          # `X.Y.Z.N`). Use a trailing `.1` so it lands as MSI
          # `0.0.0.1` — distinct enough from any real release
          # (which always start at 0.3.0+ rc.N) that an operator
          # who finds it on a machine knows it's a smoke artifact.
          SMOKE_VERSION: 0.0.0-smoke.1
        run: |
          cargo wix -p roomlerd --nocapture --no-build --install-version $env:SMOKE_VERSION
          $msi = Get-ChildItem 'target/wix/*.msi' | Select-Object -First 1
          if (-not $msi) { throw 'MSI not produced by cargo-wix' }
          'MSI_PATH=' + $msi.FullName | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "MSI ready: $($msi.FullName) ($([math]::Round($msi.Length / 1MB, 2)) MiB)"

      # #3292: a rollback plays the script backwards, so a failed upgrade restores
      # the task and the daemon only from ahead of RemoveExistingProducts, once the
      # old files are back, and the task must come back before the start. Anything
      # spooled ahead of that action fails every upgrade with Error 2613, so an
      # InstallExecute has to flush them right before it. WiX orders actions that share
      # a parent by itself, so this reads what it built.
      - name: "Assert the rollback actions' order in the built MSI (#3292)"
        shell: pwsh
        run: |
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null, $installer, @($env:MSI_PATH, 0))
          function Get-Seq([string]$action) {
            $view = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @("SELECT Sequence FROM InstallExecuteSequence WHERE Action='$action'"))
            [void]$view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null)
            $row = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)
            if ($null -eq $row) { throw "$action is not in InstallExecuteSequence" }
            [int]$row.GetType().InvokeMember('IntegerData', 'GetProperty', $null, $row, ([object[]]@([int32]1)))
          }
          $seq = @('InstallInitialize', 'DaemonBackOnRollback', 'AutostartBackOnRollback', 'InstallExecute', 'RemoveExistingProducts', 'InstallFiles') | ForEach-Object { Get-Seq $_ }
          Write-Host "InstallInitialize, DaemonBackOnRollback, AutostartBackOnRollback, InstallExecute, RemoveExistingProducts, InstallFiles: $($seq -join ', ')"
          for ($i = 1; $i -lt $seq.Count; $i++) {
            if ($seq[$i - 1] -ge $seq[$i]) { throw "out of order: $($seq -join ', ')" }
          }
          # Immediately ahead: anything between InstallExecute and the removal is spooled
          # ahead of it again.
          $between = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @("SELECT Action FROM InstallExecuteSequence WHERE Sequence > $($seq[3]) AND Sequence < $($seq[4])"))
          [void]$between.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $between, $null)
          if ($null -ne $between.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $between, $null)) { throw 'an action sits between InstallExecute and RemoveExistingProducts' }
          # A rollback leaves a registration the next release cannot remove, and only
          # this attribute lets that release go on (docs/installation.md).
          $view = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @("SELECT Attributes FROM Upgrade WHERE ActionProperty='WIX_UPGRADE_DETECTED'"))
          [void]$view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null)
          $row = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)
          $attributes = [int]$row.GetType().InvokeMember('IntegerData', 'GetProperty', $null, $row, ([object[]]@([int32]1)))
          Write-Host "Upgrade.Attributes: $attributes"
          if (($attributes -band 4) -eq 0) { throw 'msidbUpgradeAttributesIgnoreRemoveFailure is not set' }

      - name: Install the MSI (quiet, per-User)
        shell: pwsh
        run: |
          # /quiet runs without UI; /norestart prevents implicit reboot
          # if the MSI calls for one; /l*v emits a verbose log so the
          # workflow's artifact upload below captures it on failure.
          # #3754: under the installer runner's deadline.
          . $env:INSTALLER_RUN
          $logDir = Join-Path $env:RUNNER_TEMP 'msi-logs'
          New-Item -ItemType Directory -Path $logDir -Force | Out-Null
          $log = Join-Path $logDir 'install.log'
          'INSTALL_LOG=' + $log | Out-File -FilePath $env:GITHUB_ENV -Append
          Invoke-Installer -Label 'msiexec /i (per-User)' -FilePath 'msiexec.exe' `
            -Arguments "/i `"$env:MSI_PATH`" /quiet /norestart /l*v `"$log`"" -Log $log -Tail 200
          Write-Host "Install succeeded (exit 0)"

      - name: Assert registry UpgradeCode present (rc.27 install_detect lock)
        shell: pwsh
        run: |
          # rc.27's `install_detect::detect_existing_install` reads
          # HKCU + HKLM `Software\\…\\Installer\\UpgradeCodes\\<packed>`
          # where <packed> is the Windows-Installer-compressed encoding
          # of the UpgradeCode GUID. The MSI we just built carries
          # UpgradeCode `1F2D7B1C-8B2F-4D2E-B1A3-6B1E2C7E4D91` (see
          # `agents/roomlerd/Cargo.toml::package.metadata.wix`).
          #
          # First attempt used `Get-Package -Provider msi` but the
          # PackageManagement `msi` provider isn't available on
          # PowerShell 7 (the runner's pwsh.exe), only on Windows
          # PowerShell 5.x. Run #26376742677 hit `Unable to find
          # package providers (msi)`. Switch to a direct registry walk
          # against `Uninstall\*` — works on every PS version, is
          # faster than Get-Package, and observably equivalent (an
          # MSI install lands BOTH an Uninstall entry AND the
          # UpgradeCodes entry; checking the former is sufficient
          # for "the MSI installed and the system sees it").
          # rc.279 asserted the ARP record must live in HKCU. That is NOT a
          # reliable per-user signal, and the check has failed on EVERY master
          # run since it landed in #260 -- it never once passed.
          #
          # The verbose MSI log from run 30843667006 settles what actually
          # happens: the payload installs per-user exactly as intended
          # (APPLICATIONFOLDER = C:\Users\<u>\AppData\Local\Programs\Roomler,
          # Start Menu under the user's Roaming profile, no ALLUSERS authored),
          # while Windows Server 2025 still mirrors the ARP record into an HKLM
          # Uninstall hive. So the install is correct and the assertion was
          # wrong about where to look.
          #
          # The AUTHORITATIVE per-user signal is the Installer UserData hive: a
          # per-user install registers the product under the INSTALLING USER's
          # SID, a per-machine one under SYSTEM (S-1-5-18). Assert that. The
          # scope-flip guard rc.279 wanted is PRESERVED, just re-pointed: a
          # genuine perMachine regression shows up under S-1-5-18 and still
          # fails this step.
          #
          # FR-133 P1: the product registers as exactly 'Roomler' (the wxs
          # Name), so the match is EXACT and also asserts the rename. It used
          # to match roomler.*agent, which the new name no longer contains: a
          # loose filter that a rename turns into a silent no-op.
          $sid    = ([Security.Principal.WindowsIdentity]::GetCurrent()).User.Value
          $udRoot = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Installer\UserData'
          function Find-RoomlerProduct($scopeSid) {
            $products = Join-Path $udRoot "$scopeSid\Products"
            if (-not (Test-Path $products)) { return $null }
            Get-ChildItem $products -ErrorAction SilentlyContinue |
              ForEach-Object {
                Get-ItemProperty (Join-Path $_.PSPath 'InstallProperties') -ErrorAction SilentlyContinue
              } |
              Where-Object { $_.DisplayName -ceq 'Roomler' } |
              Select-Object -First 1
          }
          $perUser    = Find-RoomlerProduct $sid
          $perMachine = Find-RoomlerProduct 'S-1-5-18'

          if (-not $perUser) {
            Write-Host "--- Roomler ARP entries, per hive (installing SID: $sid) ---"
            $hives = @{
              'HKCU\Uninstall'           = 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall'
              'HKLM\Uninstall'           = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall'
              'HKLM\WOW6432Node\Uninstall' = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
            }
            foreach ($label in $hives.Keys) {
              $root = $hives[$label]
              if (-not (Test-Path $root)) { Write-Host "${label}: (absent)"; continue }
              $rows = Get-ChildItem $root -ErrorAction SilentlyContinue |
                        Get-ItemProperty -ErrorAction SilentlyContinue |
                        Where-Object { $_.DisplayName -like '*roomler*' } |
                        Select-Object DisplayName, DisplayVersion, UninstallString
              if ($rows) { Write-Host "${label}:"; $rows | Format-Table -AutoSize }
              else { Write-Host "${label}: (no roomler entry)" }
            }
            Write-Host '--- Installer UserData SIDs present ---'
            Get-ChildItem $udRoot -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty PSChildName
            throw "MSI product not registered for the installing user ($sid) — the perUser flavour did not install per-user"
          }
          Write-Host "Installed per-user: $($perUser.DisplayName) $($perUser.DisplayVersion) (UserData SID $sid)"
          if ($perMachine) {
            throw "perUser MSI unexpectedly registered machine-wide (UserData S-1-5-18): $($perMachine.DisplayName)"
          }
          # Product code for later steps: the ARP mirror carries the real GUID
          # (the UserData key name is the PACKED form, which msiexec /x rejects).
          $arp = @(
            'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
          ) | Where-Object { Test-Path $_ } |
              ForEach-Object { Get-ChildItem $_ -ErrorAction SilentlyContinue } |
              Get-ItemProperty -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -ceq 'Roomler' } |
              Select-Object -First 1
          if ($arp) {
            'INSTALLED_PRODUCT_CODE=' + $arp.PSChildName | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Assert install payload at the canonical path (P4b)
        shell: pwsh
        run: |
          # P4b renamed the per-User install dir to
          # %LOCALAPPDATA%\Programs\Roomler and added the tunnel CLI
          # to the bundle. Assert the EXACT canonical layout (the old
          # loose multi-candidate probe would silently pass on a
          # regression back to the pre-rename dir): daemon
          # + tunnel CLI + wintun must all land. Also assert the
          # TunnelExe component's user-PATH append took (HKCU\
          # Environment — MSI writes it for Environment System='no').
          # P3d Slice C: the roomler-agent.exe alias is retired — the MSI
          # ships only the canonical names now.
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\Roomler'
          # msvcp140/vcruntime140* lock the app-local VcRedistCrt component
          # (fresh machines without the VC++ redist -- 2026-07-28 fix).
          $mustExist = @('roomlerd.exe', 'roomler.exe', 'roomlerdw.exe', 'wintun.dll',
                         'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')
          $missing = @()
          foreach ($f in $mustExist) {
            $p = Join-Path $installDir $f
            if (Test-Path $p) {
              Write-Host "present: $p"
            } else {
              $missing += $p
            }
          }
          if ($missing.Count -gt 0) {
            Write-Host '--- Searching for stray payloads under common roots ---'
            $roots = @(
              $env:LOCALAPPDATA,
              $env:ProgramFiles
            ) | Where-Object { Test-Path $_ }
            foreach ($r in $roots) {
              Get-ChildItem -Path $r -Include 'roomlerd.exe','roomler-agent.exe' -Recurse -ErrorAction SilentlyContinue |
                ForEach-Object { Write-Host "  found at: $($_.FullName)" }
            }
            throw "missing from $($installDir): $($missing -join ', ')"
          }
          $userPath = (Get-ItemProperty -Path 'HKCU:\Environment' -ErrorAction SilentlyContinue).PATH
          if (-not ($userPath -and $userPath -match [regex]::Escape('Programs\Roomler'))) {
            throw "user PATH does not contain Programs\Roomler after install (HKCU\Environment PATH = '$userPath')"
          }
          Write-Host "User PATH contains the install dir"

      - name: Assert the install is self-contained (PE import audit)
        shell: pwsh
        run: |
          # A file-EXISTS check is not a self-containment check.
          #
          # The step above proves msvcp140/vcruntime140* were laid down; it
          # cannot prove they are SUFFICIENT, and running the binary here
          # would not either — `windows-latest` carries the VC redist (it is
          # where the staging step SOURCES those DLLs from, via vswhere), so
          # the loader would satisfy the imports from System32 and pass on a
          # machine that is guaranteed to have the dependency. That is the
          # exact shape that shipped a launch-crashing macOS .pkg in every
          # release until rc.453: a check executed in the environment that
          # supplies the missing dependency cannot detect a dependency on
          # that environment.
          #
          # So read the imports instead of trusting a successful start —
          # the Windows analogue of the Mach-O load-command scan. This is
          # the `dumpbin -dependents` check CLAUDE.md tells humans to run by
          # hand before adding a C++ dependency, made automatic.
          $ErrorActionPreference = 'Stop'
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\Roomler'

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot  = & $vswhere -latest -products * -property installationPath; if ($LASTEXITCODE -ne 0) { throw "vswhere exited $LASTEXITCODE" }
          $dumpbin = Get-ChildItem -Path "$vsRoot\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
                     Sort-Object FullName | Select-Object -Last 1
          if (-not $dumpbin) { throw "dumpbin.exe not found under $vsRoot" }

          # Redistributables — shipped by us, never by Windows. These MUST be
          # app-local; finding them in System32 proves nothing about a fresh
          # machine, so they are excluded from the System32 allowance below.
          $mustBeAppLocal = '^(msvcp|vcruntime|concrt|mfc|vcomp|msvcr)'

          function Audit-Imports {
            param([switch]$Quiet)
            $found    = @()
            $appLocal = @()
            foreach ($exe in @('roomlerd.exe', 'roomler.exe', 'roomlerdw.exe')) {
              $path = Join-Path $installDir $exe
              if (-not (Test-Path $path)) { $found += "$exe missing"; continue }
              $imports = & $dumpbin /dependents $path |
                Select-String -Pattern '^\s{4}(\S+\.dll)$' |
                ForEach-Object { $_.Matches[0].Groups[1].Value }; if ($LASTEXITCODE -ne 0) { throw "dumpbin /dependents $path exited $LASTEXITCODE" }
              if (-not $imports) { $found += "$exe : dumpbin listed no imports (parse broke?)"; continue }
              if (-not $Quiet) { Write-Host "$exe imports $($imports.Count) DLLs" }
              foreach ($dll in $imports) {
                if (Test-Path (Join-Path $installDir $dll)) { $appLocal += $dll; continue }
                if ($dll -match $mustBeAppLocal) {
                  $found += "$exe -> $dll is a REDISTRIBUTABLE and is not app-local"
                  continue
                }
                # API sets and OS DLLs are fine — they ship with Windows.
                if ($dll -match '^(api-ms-win-|ext-ms-win-)') { continue }
                if (Test-Path (Join-Path $env:SystemRoot 'System32' $dll)) { continue }
                $found += "$exe -> $dll is neither app-local nor an OS DLL"
              }
            }
            [pscustomobject]@{
              Problems = @($found)
              AppLocal = @($appLocal | Sort-Object -Unique)
            }
          }

          Write-Host '--- 1/2: the real install must be clean ---'
          $r = Audit-Imports
          if ($r.Problems.Count -gt 0) {
            $r.Problems | ForEach-Object { Write-Host "::error::$_" }
            throw "install is not self-contained"
          }
          Write-Host "OK: every import is app-local or shipped by Windows"
          Write-Host "app-local imports: $($r.AppLocal -join ', ')"

          # ⚠️ A gate proven only on the passing case is the failure mode this
          # step exists to fix — "it printed OK" is not evidence it can say
          # anything else. Hide a bundled DLL and require a complaint.
          #
          # The victim is chosen from what the binaries ACTUALLY import, not
          # named up front: this job builds a minimal feature set, so the C++
          # deps that pull in msvcp140 may be absent, and hiding a DLL nothing
          # imports proves nothing. (First attempt did exactly that and the
          # control caught it — which is the argument for having one.)
          Write-Host '--- 2/2: negative control — hiding a bundled import must FAIL the audit ---'
          if ($r.AppLocal.Count -eq 0) {
            throw "NEGATIVE CONTROL IMPOSSIBLE: no imported DLL is app-local, so this audit has nothing to detect. Either the bundle is unnecessary in this build, or the dumpbin parse is wrong — both need a human."
          }
          $victim = Join-Path $installDir $r.AppLocal[0]
          $stash  = "$victim.hidden"
          Write-Host "hiding $($r.AppLocal[0])"
          Move-Item $victim $stash
          try {
            $neg = Audit-Imports -Quiet
            if ($neg.Problems.Count -eq 0) {
              throw "NEGATIVE CONTROL FAILED: $($r.AppLocal[0]) was removed and the audit still passed — this check cannot detect what it claims to."
            }
            Write-Host "OK: audit reported $($neg.Problems.Count) problem(s): $($neg.Problems[0])"
          } finally {
            Move-Item $stash $victim
          }

      # #3292 — Restart Manager stops nothing once the daemon runs through the
      # windowless launcher, so the MSI's StopDaemon custom action is what ends
      # it. Without that action `msiexec /x` still exits 0, and the daemon runs on
      # with its files gone. The launcher is started by hand here, so no task
      # instance exists for the action's `schtasks /End` fallback to reach: only
      # the daemon's stop event can pass the assert below.
      - name: "Start a daemon for the uninstall to stop (#3292)"
        shell: pwsh
        run: |
          $cfgDir = Join-Path $env:APPDATA 'roomler\roomler\config'
          New-Item -ItemType Directory -Force -Path $cfgDir | Out-Null
          # Nothing answers on this port, so the daemon retries and stays up.
          @(
            'server_url = "http://127.0.0.1:9"',
            'agent_token = "smoke"',
            'agent_id = "000000000000000000000000"',
            'tenant_id = "000000000000000000000000"',
            'machine_id = "smoke"',
            'machine_name = "smoke"'
          ) | Set-Content -Encoding ascii -Path (Join-Path $cfgDir 'config.toml')
          $env:ROOMLERD_AUTO_UPDATE = '0'
          $launcher = Join-Path $env:LOCALAPPDATA 'Programs\Roomler\roomlerdw.exe'
          Start-Process -FilePath $launcher -ArgumentList 'run', '--supervisor', 'task'
          # Long enough to reach the wait on its stop event; a start on a slow
          # guest had its row online in under 20 s. An action that runs before
          # that finds no event, so a shorter sleep here reads as a false failure.
          Start-Sleep -Seconds 45
          $up = Get-Process roomlerd -ErrorAction SilentlyContinue
          if (-not $up) {
            Get-ChildItem (Join-Path $env:LOCALAPPDATA 'roomler\roomler\data\logs') -Filter 'roomlerd.log*' -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime | Select-Object -Last 1 | ForEach-Object { Get-Content -LiteralPath $_.FullName -Tail 40 }
            throw 'the daemon did not stay up on a config with no server, so this lane proves nothing'
          }
          Write-Host "Daemon up under the launcher: pid $($up.Id)"
          # #3774: this daemon must not reach the live update channel, or it
          # could put the newest published release over the build under test.
          # ROOMLERD_AUTO_UPDATE=0 shuts it, and its own log says so.
          $logFile = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'roomler\roomler\data\logs') -Filter 'roomlerd.log*' -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $logFile) { throw 'the daemon wrote no log, so nothing shows whether it armed its updater' }
          $lines = Get-Content -LiteralPath $logFile.FullName
          $armed = $lines | Select-String -SimpleMatch 'auto-updater armed'
          if ($armed) { $armed | ForEach-Object { Write-Host "  $_" }; throw 'the started daemon armed its auto-updater: it can reach the live update channel' }
          $shut = $lines | Select-String -SimpleMatch -Pattern 'auto-update disabled', 'auto-update opted out'
          if (-not $shut) { throw 'the daemon log has no line saying its auto-update is disabled' }
          $shut | Select-Object -First 1 | ForEach-Object { Write-Host "  $_" }
          Write-Host 'the started daemon does not reach the live update channel'

      - name: Uninstall the MSI (quiet)
        shell: pwsh
        run: |
          # #3754: under the installer runner's deadline.
          . $env:INSTALLER_RUN
          $logDir = Join-Path $env:RUNNER_TEMP 'msi-logs'
          $log = Join-Path $logDir 'uninstall.log'
          'UNINSTALL_LOG=' + $log | Out-File -FilePath $env:GITHUB_ENV -Append
          Invoke-Installer -Label 'msiexec /x (per-User)' -FilePath 'msiexec.exe' `
            -Arguments "/x `"$env:MSI_PATH`" /quiet /norestart /l*v `"$log`"" -Log $log -Tail 200
          Write-Host 'Uninstall succeeded (exit 0)'

      - name: "Assert the uninstall stopped the daemon (#3292)"
        shell: pwsh
        run: |
          $left = Get-Process roomlerd, roomlerdw -ErrorAction SilentlyContinue
          if ($left) {
            $left | ForEach-Object { Write-Host "still running: $($_.Name) pid $($_.Id)" }
            $left | Stop-Process -Force
            throw 'msiexec /x exited 0 and the daemon runs on: is StopDaemon still in the MSI, before UnregisterAutostart?'
          }
          $logFile = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'roomler\roomler\data\logs') -Filter 'roomlerd.log*' |
            Sort-Object LastWriteTime | Select-Object -Last 1
          # A daemon that died by itself between the two steps must not pass.
          $asked = Select-String -LiteralPath $logFile.FullName -SimpleMatch 'asked this per-user daemon to stop'
          if (-not $asked) {
            Get-Content -LiteralPath $logFile.FullName -Tail 40
            throw 'the daemon is gone, and its log does not say it was asked to stop'
          }
          Write-Host 'The uninstall asked the daemon to stop, and it left'
          # The later steps start from a host with no config.
          foreach ($root in $env:APPDATA, $env:LOCALAPPDATA) {
            Remove-Item -Recurse -Force (Join-Path $root 'roomler') -ErrorAction SilentlyContinue
          }

      - name: Assert cleanup — registry + install dir gone
        shell: pwsh
        run: |
          # Same registry-direct query as the post-install assert.
          # Get-Package -Provider msi is PowerShell 5.x-only and the
          # runner uses pwsh 7 (see post-install step's comment).
          $uninstallRoots = @(
            'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
          )
          # Deliberately LOOSER than the post-install step: any record whose
          # name starts with Roomler counts as a straggler, so a rename in
          # either direction cannot turn this assert into a no-op (the old
          # roomler.*agent filter would have, at FR-133 P1's rename). A fresh
          # runner has no other product by that name.
          $stragglers = @()
          foreach ($root in $uninstallRoots) {
            if (-not (Test-Path $root)) { continue }
            $stragglers += Get-ChildItem $root -ErrorAction SilentlyContinue |
                             Get-ItemProperty -ErrorAction SilentlyContinue |
                             Where-Object {
                               $_.DisplayName -and $_.DisplayName -like 'Roomler*'
                             }
          }
          if ($stragglers.Count -gt 0) {
            throw "a Roomler install record is still present after uninstall: $($stragglers.DisplayName -join ', ')"
          }
          # P4b canonical layout: every component-managed payload must
          # be gone from Programs\Roomler (all files are component-
          # managed, and the wxs RemoveFolder pair drops the dir when
          # empty), and the TunnelExe component's user-PATH append
          # must have been removed (Environment Part='last' +
          # implicit Permanent='no').
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\Roomler'
          foreach ($f in @('roomlerd.exe', 'roomlerdw.exe', 'roomler-agent.exe', 'roomler.exe', 'wintun.dll', 'msvcp140.dll', 'vcruntime140_1.dll')) {
            $p = Join-Path $installDir $f
            if (Test-Path $p) {
              throw "$f still at $p after uninstall — MSI uninstaller is broken"
            }
          }
          if (Test-Path $installDir) {
            Write-Host "::warning::$installDir still exists (empty dir tolerated; component files verified gone)"
            Get-ChildItem $installDir -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  leftover: $($_.FullName)" }
          }
          $userPath = (Get-ItemProperty -Path 'HKCU:\Environment' -ErrorAction SilentlyContinue).PATH
          if ($userPath -and $userPath -match [regex]::Escape('Programs\Roomler')) {
            throw "user PATH still contains Programs\Roomler after uninstall (HKCU\Environment PATH = '$userPath')"
          }
          Write-Host 'Uninstall left no traces: payload, install dir contents, PATH entry and MSI registry record all clean'

      - name: Compile per-Machine MSI (wxs lint, no install)
        shell: pwsh
        env:
          SMOKE_VERSION: 0.0.0-smoke.1
        run: |
          # The release pipeline builds the per-Machine flavour by
          # file-swapping wix-perMachine/main.wxs over wix/main.wxs
          # (cargo-wix auto-discovers every wxs under wix/), and until
          # now NOTHING validated that file before the agent-v* tag run
          # -- the first rc.266 tag burned on a per-Machine-only
          # LGHT0368 that this smoke never compiled. Mirror the swap
          # and compile it here (candle + light + ICE = the actual
          # gate); no install, the flavour needs elevation semantics
          # this job doesn't exercise. Clear target\wix first: both
          # flavours emit the SAME output filename, and the per-User
          # MSI at $env:MSI_PATH was already installed + uninstalled
          # above, so clobbering is fine but a stale file would make
          # the produced-MSI assert vacuous.
          Remove-Item target\wix\*.msi -Force -ErrorAction SilentlyContinue
          $wixDir = "agents\roomlerd\wix"
          $pmSrc  = "agents\roomlerd\wix-perMachine\main.wxs"
          Copy-Item "$wixDir\main.wxs" "$wixDir\main.wxs.bak" -Force
          Copy-Item $pmSrc "$wixDir\main.wxs" -Force
          try {
            cargo wix -p roomlerd --nocapture --no-build --install-version $env:SMOKE_VERSION
          } finally {
            Move-Item "$wixDir\main.wxs.bak" "$wixDir\main.wxs" -Force
          }
          $msi = Get-ChildItem 'target/wix/*.msi' | Select-Object -First 1
          if (-not $msi) { throw 'per-Machine MSI not produced by cargo-wix' }
          Write-Host "per-Machine MSI compiles clean: $($msi.Name) ($([math]::Round($msi.Length / 1MB, 2)) MiB)"

      - name: "The per-Machine MSI carries the service's Environment: its tables and its DLL (#3375)"
        # Read from the BUILT MSI, not the wxs: the order the carry depends on,
        # that neither action can fail an upgrade, that the values stay out of
        # the MSI's log, and the DLL itself, taken out of the Binary table.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Get-ChildItem 'target/wix/*.msi' | Select-Object -First 1).FullName
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null, $installer, @($msi, 0))
          function Get-Row([string]$sql) {
            $view = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @($sql))
            [void]$view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null)
            $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)
          }
          function Get-Field($row, [string]$kind) {
            $row.GetType().InvokeMember($kind, 'GetProperty', $null, $row, ([object[]]@([int32]1)))
          }
          function Get-Seq([string]$action) {
            $row = Get-Row "SELECT Sequence FROM InstallExecuteSequence WHERE Action='$action'"
            if ($null -eq $row) { throw "$action is not in InstallExecuteSequence" }
            [int](Get-Field $row 'IntegerData')
          }
          # The capture before the old product's removal (afterInstallInitialize),
          # the restore once the new entry exists, and every SystemContext action
          # after it: each restarts the service and decides the switch.
          $order = @('CaptureServiceEnvironment', 'InstallInitialize', 'RemoveExistingProducts', 'InstallFiles',
                     'RegisterService', 'SetRestoreServiceEnvironment', 'RestoreServiceEnvironment',
                     'RollbackSystemContext', 'EnableSystemContext')
          $seq = @($order | ForEach-Object { Get-Seq $_ })
          Write-Host "$($order -join ', '): $($seq -join ', ')"
          for ($i = 1; $i -lt $seq.Count; $i++) {
            if ($seq[$i - 1] -ge $seq[$i]) { throw "out of order: $($seq -join ', ')" }
          }
          foreach ($a in 'DisableSystemContext', 'KeepSystemContext') {
            if ((Get-Seq $a) -le (Get-Seq 'RestoreServiceEnvironment')) { throw "$a runs before RestoreServiceEnvironment" }
          }
          # msidbCustomActionTypeContinue (0x40): neither can fail an upgrade.
          foreach ($a in 'CaptureServiceEnvironment', 'RestoreServiceEnvironment') {
            $type = [int](Get-Field (Get-Row "SELECT Type FROM CustomAction WHERE Action='$a'") 'IntegerData')
            Write-Host "$a Type: $type"
            if (($type -band 0x40) -eq 0) { throw "$a can fail the install: its Return is not 'ignore'" }
          }
          # CustomActionData is logged under the restore's own name.
          $hidden = Get-Field (Get-Row "SELECT Value FROM Property WHERE Property='MsiHiddenProperties'") 'StringData'
          Write-Host "MsiHiddenProperties: $hidden"
          foreach ($p in 'RoomlerServiceEnvironment', 'RestoreServiceEnvironment') {
            if (@($hidden -split ';') -notcontains $p) { throw "$p is not hidden from the MSI's log" }
          }
          $db = $null
          [GC]::Collect()

          # The DLL as the MSI carries it. msiexec loads it alone in a temp
          # folder, so every import must ship with Windows. The runner HAS the
          # VC++ redistributable, so a redistributable found in System32 here
          # proves nothing: those are refused by name.
          $out = Join-Path $env:RUNNER_TEMP 'msi-ca\dark'
          dark.exe -nologo -x $out $msi (Join-Path $out 'per-machine.wxs') | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "dark.exe failed: $LASTEXITCODE" }
          $dll = Join-Path $out 'Binary\RoomlerMsiCa'
          if (-not (Test-Path $dll)) { throw "the MSI's Binary table has no RoomlerMsiCa" }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot  = & $vswhere -latest -products * -property installationPath; if ($LASTEXITCODE -ne 0) { throw "vswhere exited $LASTEXITCODE" }
          $dumpbin = Get-ChildItem -Path "$vsRoot\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
                     Sort-Object FullName | Select-Object -Last 1
          if (-not $dumpbin) { throw "dumpbin.exe not found under $vsRoot" }
          function Get-Problems([string]$path) {
            $imports = & $dumpbin /dependents $path |
              Select-String -Pattern '^\s{4}(\S+\.dll)$' |
              ForEach-Object { $_.Matches[0].Groups[1].Value }; if ($LASTEXITCODE -ne 0) { throw "dumpbin /dependents $path exited $LASTEXITCODE" }
            if (-not $imports) { return @('dumpbin listed no imports (parse broke?)') }
            Write-Host "  $(Split-Path -Leaf $path) imports: $($imports -join ', ')"
            @($imports | ForEach-Object {
              if ($_ -match '^(msvcp|vcruntime|concrt|mfc|vcomp|msvcr)') { "$_ is a redistributable" }
              elseif ($_ -match '^(api-ms-win-|ext-ms-win-)') { }
              elseif (-not (Test-Path (Join-Path $env:SystemRoot 'System32' $_))) { "$_ does not ship with Windows" }
            })
          }
          $problems = @(Get-Problems $dll)
          if ($problems.Count -gt 0) {
            $problems | ForEach-Object { Write-Host "::error::roomler_msi_ca.dll: $_" }
            throw 'the custom-action DLL needs a DLL that a fresh Windows does not have'
          }
          $exports = (& $dumpbin /exports $dll) -join "`n"; if ($LASTEXITCODE -ne 0) { throw "dumpbin /exports exited $LASTEXITCODE" }
          foreach ($e in 'CaptureServiceEnvironment', 'RestoreServiceEnvironment') {
            if ($exports -notmatch "\b$e\b") { throw "the DLL does not export $e" }
          }
          Write-Host 'OK: the DLL imports only what Windows ships, and exports both entry points'
          # Negative control: the same crate built WITHOUT +crt-static imports the
          # VC++ runtime, and the audit has to say so.
          $neg = @(Get-Problems "$env:RUNNER_TEMP\msi-ca\plain-crt.dll")
          if ($neg.Count -eq 0) { throw 'NEGATIVE CONTROL FAILED: the plain-CRT build passed the audit' }
          Write-Host "OK: the plain-CRT build is refused: $($neg[0])"
          if ($env:WIN_TEST_PFX_BASE64) {
            $sig = Get-AuthenticodeSignature $dll
            Write-Host "signature: $($sig.Status)"
            if ($sig.Status -ne 'Valid') { throw "the DLL in the MSI is not signed: $($sig.Status)" }
          }

      - name: "A hand-run per-Machine upgrade or reinstall keeps the service, the SystemContext mode and the operator's entries (#1727, #3115, #3375)"
        # The per-Machine MSI's first INSTALL coverage. A person running
        # `msiexec /i` with no ENABLE_SYSTEM_CONTEXT used to switch
        # SystemContext OFF: the property defaulted to "0", and every install
        # recreates the service, taking the ROOMLERD_ENABLE_SYSTEM_SWAP entry of
        # its Environment with it. A SystemContext laptop went offline that way
        # (2026-09-26). The fix keeps the mode the machine was last switched to
        # (`roomlerd keep-system-context`, from the product's own record).
        #
        # Four builds of the SAME binary at rising versions, so each install is
        # a real major upgrade (RemoveExistingProducts runs the old product's
        # service uninstall), the shape a hand-run install of a newer release
        # has. ⚠️ Windows Installer ignores a version's FOURTH field when it
        # decides an upgrade, so the versions differ in the third.
        #
        # What this CAN prove on a hosted runner: the switch in the service's
        # Environment, the record, and that the service is Running after each
        # step. What it cannot: the winlogon-token swap itself (the header's
        # "not in scope"), which needs a real interactive session.
        #
        # Negative control: on master the v2 cell fails (the swap is gone).
        #
        # #3115 — and a REINSTALL of the same MSI (a maintenance run, what the
        # wizard does over an installed release) while the service runs, with a
        # stop that takes the field's 7.8 s. A hosted runner's daemon is not
        # enrolled and cannot be relied on to stop slower than the 5 s the old
        # RegisterService waited, so the slow stop is made from outside, with
        # no hook in the product: the host's supervisor thread is held suspended.
        # Negative control: before #3115 that cell exits 1603 and leaves the
        # runner with no Roomler service.
        #
        # #3375 — and every other entry `roomlerd set-service-env-var` wrote:
        # the kill switch ROOMLERD_SFTP_AS_USER=0, and one whose value holds
        # every character the carry escapes. Each upgrade's removal of the old
        # product deletes the service, and the MSI's two custom actions carry
        # the entries across it. Asserted after every step. Then each action
        # is made to fail on purpose (ROOMLER_TEST_CA_FAIL), and the upgrade
        # must still complete, with only the entries lost. The repair and the
        # uninstall are the next two steps (#3754). No MSI log may hold a
        # carried value.
        # Negative control: on master the v2 cell fails (the entries are gone).
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'pm-msi'
          $logDir = Join-Path $env:RUNNER_TEMP 'msi-logs'
          New-Item -ItemType Directory -Path $out, $logDir -Force | Out-Null

          Remove-Item target\wix\*.msi -Force -ErrorAction SilentlyContinue
          $wixDir = "agents\roomlerd\wix"
          Copy-Item "$wixDir\main.wxs" "$wixDir\main.wxs.bak" -Force
          Copy-Item "agents\roomlerd\wix-perMachine\main.wxs" "$wixDir\main.wxs" -Force
          try {
            foreach ($n in 1..6) {
              cargo wix -p roomlerd --nocapture --no-build --install-version "0.0.$n-smoke.1"
              if ($LASTEXITCODE -ne 0) { throw "cargo wix failed for v$n" }
              $msi = Get-ChildItem 'target/wix/*.msi' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
              Move-Item $msi.FullName (Join-Path $out "pm-$n.msi") -Force
            }
          } finally {
            Move-Item "$wixDir\main.wxs.bak" "$wixDir\main.wxs" -Force
          }

          # #3754 — Invoke-Msi is the installer runner's. The cells' helpers go in
          # a file that the repair and the uninstall steps below load too.
          . $env:INSTALLER_RUN
          $pmCells = Join-Path $env:RUNNER_TEMP 'pm-cells.ps1'
          'PM_CELLS=' + $pmCells | Out-File -FilePath $env:GITHUB_ENV -Append
          @'
          $out = Join-Path $env:RUNNER_TEMP 'pm-msi'
          $logDir = Join-Path $env:RUNNER_TEMP 'msi-logs'
          function Get-Swap {
            $block = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\Roomler' -Name Environment -ErrorAction SilentlyContinue).Environment
            [bool](@($block) -contains 'ROOMLERD_ENABLE_SYSTEM_SWAP=1')
          }
          function Assert-Mode([string]$label, [bool]$want, [string]$version) {
            $svc = $null
            foreach ($i in 1..60) {
              $svc = Get-Service Roomler -ErrorAction SilentlyContinue
              if ($svc -and $svc.Status -eq 'Running') { break }
              Start-Sleep -Seconds 1
            }
            $swap = Get-Swap
            $rec = Get-Content "$env:ProgramData\roomler\last-system-context-attempt.json" -Raw -ErrorAction SilentlyContinue | ConvertFrom-Json
            $products = @(Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -like 'Roomler*per-Machine*' })
            Write-Host ("{0}: swap={1} (want {2}) service={3} record={4}/{5} products={6}" -f $label, $swap, $want, $svc.Status, $rec.command, $rec.stage, (($products | ForEach-Object { $_.DisplayVersion }) -join ','))
            if ($swap -ne $want) { throw "${label}: the SystemContext swap is $swap, want $want" }
            if (-not $svc -or $svc.Status -ne 'Running') { throw "${label}: the Roomler service is $($svc.Status), want Running" }
            if ($products.Count -ne 1 -or $products[0].DisplayVersion -ne $version) {
              throw "${label}: want exactly one per-Machine product at $version, found: $(($products | ForEach-Object { $_.DisplayVersion }) -join ',')"
            }
          }

          # #3375 — what an operator set with `roomlerd set-service-env-var`: the
          # kill switch, and a value with every character the carry escapes and a
          # token that no MSI log may hold.
          $token = 'smoke-carry-3375'
          $entries = [ordered]@{
            'ROOMLERD_SFTP_AS_USER' = '0'
            'ROOMLERD_SMOKE_CARRY'  = "$token|100%[a]{b}"
          }
          function Set-Entries {
            foreach ($name in $entries.Keys) {
              & "$env:ProgramFiles\Roomler\roomlerd.exe" set-service-env-var --name $name --value $entries[$name]
              if ($LASTEXITCODE -ne 0) { throw "set-service-env-var $name exited $LASTEXITCODE" }
            }
          }
          function Assert-Carried([string]$label, [bool]$want) {
            $block = @((Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\Roomler' -Name Environment -ErrorAction SilentlyContinue).Environment)
            Write-Host ("{0}: Environment names: {1}" -f $label, (($block | ForEach-Object { ($_ -split '=', 2)[0] }) -join ' '))
            foreach ($name in $entries.Keys) {
              $have = $block -ccontains "$name=$($entries[$name])"
              if ($have -ne $want) { throw "${label}: $name is $(if ($have) { 'there' } else { 'gone' }), want $(if ($want) { 'there' } else { 'gone' })" }
            }
          }
          function Assert-Logged([string]$log, [string]$line) {
            if (-not (Select-String -Path (Join-Path $logDir $log) -SimpleMatch "roomler_msi_ca: $line")) { throw "${log}: no '$line' from the custom actions" }
          }
          '@ | Set-Content -LiteralPath $pmCells -Encoding utf8
          . $pmCells

          # #3115 — a stop slower than the 5 s RegisterService used to wait,
          # made from OUTSIDE the product (no hook in it): the service host's
          # supervisor thread is held suspended, so a Stop leaves the host
          # STOP_PENDING until the thread is let go, a fixed time after the
          # stop arrived. The SCM sees exactly what it saw in the field: a
          # healthy host that takes 7.8 s to stop. The status is polled with a
          # fresh handle each time, as a monitoring tool would: a held handle
          # would keep a deleted entry alive and blur what is measured.
          Add-Type -TypeDefinition @'
          using System;
          using System.Diagnostics;
          using System.Runtime.InteropServices;
          using System.Threading;

          public sealed class SlowStop {
            [DllImport("kernel32.dll", SetLastError = true)] static extern IntPtr OpenThread(uint access, bool inherit, uint tid);
            [DllImport("kernel32.dll", SetLastError = true)] static extern uint SuspendThread(IntPtr h);
            [DllImport("kernel32.dll", SetLastError = true)] static extern uint ResumeThread(IntPtr h);
            [DllImport("kernel32.dll")] static extern bool CloseHandle(IntPtr h);
            [DllImport("kernel32.dll")] static extern int GetThreadDescription(IntPtr h, out IntPtr desc);
            [DllImport("kernel32.dll")] static extern IntPtr LocalFree(IntPtr p);
            [DllImport("advapi32.dll", SetLastError = true, CharSet = CharSet.Unicode)] static extern IntPtr OpenSCManagerW(string machine, string db, uint access);
            [DllImport("advapi32.dll", SetLastError = true, CharSet = CharSet.Unicode)] static extern IntPtr OpenServiceW(IntPtr scm, string name, uint access);
            [DllImport("advapi32.dll", SetLastError = true)] static extern bool QueryServiceStatus(IntPtr svc, out SvcStatus st);
            [DllImport("advapi32.dll")] static extern bool CloseServiceHandle(IntPtr h);
            [StructLayout(LayoutKind.Sequential)] struct SvcStatus { public uint Type, State, Accepted, Win32Exit, SpecificExit, CheckPoint, WaitHint; }

            IntPtr thread = IntPtr.Zero;
            Thread watcher;
            volatile bool engaged;
            volatile bool released;
            long heldMs;
            public bool Engaged { get { return engaged; } }
            public long HeldMs { get { return Interlocked.Read(ref heldMs); } }

            // The thread whose description is `name` in process `pid`, opened
            // to suspend and resume it; IntPtr.Zero when there is none.
            static IntPtr FindThread(int pid, string name) {
              foreach (ProcessThread t in Process.GetProcessById(pid).Threads) {
                IntPtr h = OpenThread(0x0002 | 0x0800, false, (uint)t.Id);
                if (h == IntPtr.Zero) continue;
                IntPtr d;
                string found = null;
                if (GetThreadDescription(h, out d) >= 0 && d != IntPtr.Zero) { found = Marshal.PtrToStringUni(d); LocalFree(d); }
                if (found == name) return h;
                CloseHandle(h);
              }
              return IntPtr.Zero;
            }

            static bool StopPending(string service) {
              IntPtr scm = OpenSCManagerW(null, null, 0x0001);
              if (scm == IntPtr.Zero) return false;
              try {
                IntPtr svc = OpenServiceW(scm, service, 0x0004);
                if (svc == IntPtr.Zero) return false;
                try { SvcStatus st; return QueryServiceStatus(svc, out st) && st.State == 3; }
                finally { CloseServiceHandle(svc); }
              } finally { CloseServiceHandle(scm); }
            }

            public static SlowStop Hold(int pid, string threadName, string service, int holdMs, int maxMs) {
              var s = new SlowStop();
              s.thread = FindThread(pid, threadName);
              if (s.thread == IntPtr.Zero) throw new InvalidOperationException("no thread named '" + threadName + "' in pid " + pid);
              if (SuspendThread(s.thread) == uint.MaxValue) {
                int err = Marshal.GetLastWin32Error();
                CloseHandle(s.thread);
                throw new InvalidOperationException("SuspendThread failed: " + err);
              }
              s.watcher = new Thread(() => {
                var total = Stopwatch.StartNew();
                Stopwatch since = null;
                try {
                  while (total.ElapsedMilliseconds < maxMs) {
                    if (since == null && StopPending(service)) { since = Stopwatch.StartNew(); s.engaged = true; }
                    if (since == null && s.released) break;
                    if (since != null && since.ElapsedMilliseconds >= holdMs) break;
                    Thread.Sleep(50);
                  }
                } finally {
                  Interlocked.Exchange(ref s.heldMs, since == null ? 0 : since.ElapsedMilliseconds);
                  ResumeThread(s.thread);
                  CloseHandle(s.thread);
                }
              });
              s.watcher.IsBackground = true;
              s.watcher.Start();
              return s;
            }

            // No stop came while the installer ran: stop waiting for one. A
            // hold already under way still runs to its end.
            public void Release() { released = true; }
            public void Join() { watcher.Join(); }
          }
          '@
          [System.Diagnostics.Process]::EnterDebugMode()
          function Start-SlowStop([int]$holdMs) {
            # The host's pid, fresh: every restart of the service is a new host.
            $hostPid = (Get-CimInstance Win32_Service -Filter "Name='Roomler'").ProcessId
            if (-not $hostPid) { throw 'slow stop: the Roomler service has no host process' }
            # The supervisor thread is spawned a moment after RUNNING (the
            # firewall prep runs first): look for it for a while.
            foreach ($i in 1..60) {
              try { return [SlowStop]::Hold([int]$hostPid, 'roomler-svc-supervisor', 'Roomler', $holdMs, 180000) }
              catch { if ($i -eq 60) { throw "slow stop: $($_.Exception.Message)" }; Start-Sleep -Milliseconds 500 }
            }
          }

          try {
            Invoke-Msi '/i' (Join-Path $out 'pm-1.msi') (Join-Path $logDir 'pm-1.log') 'ENABLE_SYSTEM_CONTEXT=1'
            Assert-Mode 'v1, installed with =1' $true '0.0.1.1'
            Set-Entries
            Assert-Carried 'v1, set by set-service-env-var' $true
            # #3115 — THE regression cell for the field case: a reinstall of the
            # SAME MSI (a maintenance run) over a running SystemContext service
            # whose stop takes the field's 7.8 s. Up to 0.4.189 RegisterService
            # deleted it after 5 s: a host still stopping is only MARKED, the
            # create answered 1072, EnableSystemContext failed on the missing
            # service, the MSI rolled back (1603), and the machine was left with
            # no service. The fix reconfigures the entry in place.
            $hold = Start-SlowStop 7800
            try {
              Invoke-Msi '/i' (Join-Path $out 'pm-1.msi') (Join-Path $logDir 'pm-1-reinstall.log') 'ENABLE_SYSTEM_CONTEXT=1'
            } finally {
              $hold.Release()
              $hold.Join()
            }
            # The positive control: the slow stop really happened, or this cell
            # proves nothing.
            if (-not $hold.Engaged) { throw 'slow stop: the service never went STOP_PENDING while its supervisor was held' }
            Write-Host "slow stop: the host stayed STOP_PENDING for $($hold.HeldMs) ms, then was let go"
            Assert-Mode 'v1, reinstalled over a running service that took 7.8 s to stop' $true '0.0.1.1'
            Assert-Carried 'v1, reinstalled in place' $true
            # THE regression cell: a person upgrading by hand, no property. #3375:
            # the old product's removal deletes the service; the entries come across.
            Invoke-Msi '/i' (Join-Path $out 'pm-2.msi') (Join-Path $logDir 'pm-2.log') ''
            Assert-Mode 'v2, hand-run upgrade with no property' $true '0.0.2.1'
            Assert-Carried 'v2, hand-run upgrade' $true
            Assert-Logged 'pm-2.log' 'capture: carrying 3 entries'
            Assert-Logged 'pm-2.log' 'restore: put back 2 entries'
            Invoke-Msi '/i' (Join-Path $out 'pm-3.msi') (Join-Path $logDir 'pm-3.log') 'ENABLE_SYSTEM_CONTEXT=0'
            Assert-Mode 'v3, upgrade with an explicit =0' $false '0.0.3.1'
            Assert-Carried 'v3, the switch is the installer''s, the rest comes across' $true
            # #3375 — a failing action never fails the upgrade: only the entries
            # are lost. The restore first, then the capture.
            Invoke-Msi '/i' (Join-Path $out 'pm-4.msi') (Join-Path $logDir 'pm-4.log') 'ROOMLER_TEST_CA_FAIL=restore'
            Assert-Mode 'v4, the restore failing on purpose' $false '0.0.4.1'
            Assert-Carried 'v4, the restore failing on purpose' $false
            Assert-Logged 'pm-4.log' 'restore: failing on purpose'
            Set-Entries
            Invoke-Msi '/i' (Join-Path $out 'pm-5.msi') (Join-Path $logDir 'pm-5.log') 'ROOMLER_TEST_CA_FAIL=capture'
            Assert-Mode 'v5, the capture failing on purpose' $false '0.0.5.1'
            Assert-Carried 'v5, the capture failing on purpose' $false
            Assert-Logged 'pm-5.log' 'capture: failing on purpose'
            Set-Entries
            Invoke-Msi '/i' (Join-Path $out 'pm-6.msi') (Join-Path $logDir 'pm-6.log') ''
            Assert-Mode 'v6, hand-run upgrade with no property' $false '0.0.6.1'
            Assert-Carried 'v6, after the two failures' $true
          } finally {
            Copy-Item "$env:ProgramData\roomler\roomler\service-logs" (Join-Path $logDir 'service-logs') -Recurse -Force -ErrorAction SilentlyContinue
            Copy-Item "$env:ProgramData\roomler\last-system-context-attempt.json" $logDir -Force -ErrorAction SilentlyContinue
          }

      # #3754 — the repair over the running service, in a step of its own so that
      # a failure names its cell. `/fa` takes no property, so `/norestart` never
      # reached it, and a repair whose files Restart Manager could not free
      # restarted Windows: the runner went with it, five times, with no log
      # (#3455 measured the same on a lab machine). As `/i REINSTALL=ALL
      # REINSTALLMODE=a` it takes REBOOT=ReallySuppress, and the server's own
      # Command Line in the log has to show it. A repair that still needs a
      # restart then ends 3010 with its log: that is #3455, the product's half.
      - name: "A repair over the running per-Machine service never restarts Windows, and keeps the mode and the entries (#3754, #3455)"
        shell: pwsh
        run: |
          . $env:INSTALLER_RUN
          . $env:PM_CELLS
          $msi = Join-Path $out 'pm-6.msi'
          $log = Join-Path $logDir 'pm-6-repair.log'
          $is3455 = '#3455: the package does not free its own files before InstallFiles on a repair over the running service, so Windows Installer can only replace them at a restart. It is the product''s open bug, not this workflow''s'
          $cmd = @()
          try {
            # A repair reconfigures the entry in place (#3115): nothing to carry.
            Invoke-Installer -Label 'msiexec repair of pm-6.msi over the running service' -FilePath 'msiexec.exe' `
              -Arguments "/i `"$msi`" REINSTALL=ALL REINSTALLMODE=a REBOOT=ReallySuppress /qn /l*v `"$log`"" -Log $log -RestartNote $is3455
          } finally {
            $cmd = @(Select-String -LiteralPath $log -Pattern 'MSI \(s\) \([^)]*\) \[[^\]]*\]: Command Line: ' -ErrorAction SilentlyContinue | ForEach-Object { $_.Line.Trim() })
            $cmd | ForEach-Object { Write-Host "the server's $_" }
            Copy-Item "$env:ProgramData\roomler\roomler\service-logs" (Join-Path $logDir 'service-logs') -Recurse -Force -ErrorAction SilentlyContinue
          }
          if ($cmd.Count -eq 0) { throw 'pm-6-repair.log holds no server Command Line line' }
          $bare = @($cmd | Where-Object { $_ -notmatch '\bREBOOT=ReallySuppress\b' })
          if ($bare.Count) { throw "the repair's server Command Line does not carry REBOOT=ReallySuppress: $($bare[0])" }
          Write-Host 'OK: the server ran the repair with REBOOT=ReallySuppress'
          $replaced = @(Select-String -LiteralPath $log -Pattern "ReplacedInUseFiles(?: property\. Its value is '|\s*=\s*)1")
          if ($replaced.Count) {
            Get-RestartLines $log | ForEach-Object { Write-Host $_ }
            throw "the repair exited 0, and its log says ReplacedInUseFiles = 1 (line $($replaced[0].LineNumber)). $is3455"
          }
          Assert-Mode 'v6, repaired' $false '0.0.6.1'
          Assert-Carried 'v6, repaired' $true

      - name: "The per-Machine uninstall removes the service and its Environment, and no MSI log holds a carried value (#3375)"
        shell: pwsh
        run: |
          . $env:INSTALLER_RUN
          . $env:PM_CELLS
          # The custom actions log names; no MSI log may hold a carried value.
          $leak = Select-String -Path (Join-Path $logDir '*.log') -SimpleMatch $token | Select-Object -First 3
          if ($leak) {
            $leak | ForEach-Object { Write-Host "::error::$($_.Filename):$($_.LineNumber) holds a carried value" }
            throw 'an MSI log holds a carried value'
          }
          Write-Host 'OK: no MSI log holds a carried value'

          Invoke-Msi '/x' (Join-Path $out 'pm-6.msi') (Join-Path $logDir 'pm-uninstall.log') ''
          if (Get-Service Roomler -ErrorAction SilentlyContinue) { throw 'the Roomler service survived the uninstall' }
          # #3375 — and every entry with it: an uninstall carries nothing.
          if (Test-Path 'HKLM:\SYSTEM\CurrentControlSet\Services\Roomler') { throw 'the service key, and its Environment, survived the uninstall' }
          Write-Host 'per-Machine uninstall removed the service and its Environment'

      - name: An upgrade from the released MSIs leaves ONE entry, under the new name (FR-133 P1)
        # FR-133 P1 renamed what Apps & Features lists: "Roomler" and
        # "Roomler (per-Machine)". An upgrade is matched by the UpgradeCode,
        # never by that name, and this step proves it on real released bytes:
        # install the newest published release of each flavour AT OR BELOW this
        # build's version (#3774: on a ref behind the newest release, the
        # newest of all is newer than this build), then this branch's MSI over
        # it, built one patch version above so it is a real major upgrade, and
        # count what a person would see: exactly one entry,
        # under the new name. The per-Machine cell also keeps the SystemContext
        # switch (#1727) and ends with the service Running.
        #
        # scripts/install.ps1 -Uninstall then has to find every name, run as
        # the field runs it (Windows PowerShell 5.1): both upgraded products (an
        # install made after P1) and a PINNED pre-P1 release (an install made
        # before it). The pin keeps that case honest once the newest release
        # carries the new name too; the newest is only logged as one or the other.
        #
        # Negative control: on master the per-User asserts fail, because
        # master's MSI still registers the pre-P1 name.
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          # A release whose MSIs register the pre-P1 names. Fixed on purpose: it
          # must never follow the newest release. If it is ever deleted, pin any
          # other release from before FR-133 P1.
          PRE_P1_TAG: agent-v0.4.189
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $out = Join-Path $env:RUNNER_TEMP 'fr133'
          $logDir = Join-Path $env:RUNNER_TEMP 'msi-logs'
          New-Item -ItemType Directory -Path $out, $logDir -Force | Out-Null

          # What each flavour registers now, and what every MSI before P1 did.
          $new = @{ pu = 'Roomler'; pm = 'Roomler (per-Machine)' }
          $old = @{ pu = 'Roomler Agent'; pm = 'Roomler Agent (per-Machine)' }

          function Get-ReleaseJson([string]$path) {
            $json = gh api "repos/$env:GITHUB_REPOSITORY/$path"
            if ($LASTEXITCODE -ne 0) { throw "gh api $path failed" }
            ($json -join "`n") | ConvertFrom-Json
          }
          function Save-Msi($rel, [string]$flavour) {
            $msis = @($rel.assets | Where-Object { $_.name -like '*.msi' })
            if ($flavour -eq 'pm') { $a = @($msis | Where-Object { $_.name -like '*-perMachine-*' }) }
            else { $a = @($msis | Where-Object { $_.name -notlike '*-perMachine-*' }) }
            if ($a.Count -ne 1) { throw "$($rel.tag_name): want one $flavour MSI, found $($a.Count)" }
            $dst = Join-Path $out "$($rel.tag_name)-$flavour.msi"
            if (-not (Test-Path $dst)) {
              Invoke-WebRequest -UseBasicParsing -Uri $a[0].browser_download_url -OutFile $dst
            }
            $want = ([string]$a[0].digest -replace '^sha256:', '').ToLower()
            $got = (Get-FileHash -Algorithm SHA256 $dst).Hash.ToLower()
            if (-not $want -or $got -ne $want) { throw "$($a[0].name): sha256 $got, the release says '$want'" }
            Write-Host "released $flavour MSI: $($a[0].name) (sha256 verified)"
            $dst
          }
          # #3754 — Invoke-Msi, and the deadline on install.ps1 below, are the
          # installer runner's.
          . $env:INSTALLER_RUN
          # Every product Apps & Features would show under a Roomler name, one row
          # per ProductCode (a per-User record can sit in more than one hive).
          function Get-Entries {
            $rows = @('HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
                      'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
                      'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall') |
              Where-Object { Test-Path $_ } |
              ForEach-Object { Get-ChildItem $_ -ErrorAction SilentlyContinue } |
              Get-ItemProperty -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -like 'Roomler*' -and $_.PSChildName -like '{*}' }
            @($rows) | Group-Object PSChildName | ForEach-Object {
              $hives = @($_.Group | ForEach-Object { if ($_.PSPath -match 'HKEY_CURRENT_USER') { 'HKCU' } else { 'HKLM' } }) | Sort-Object -Unique
              [pscustomobject]@{ Code = $_.Name; Name = $_.Group[0].DisplayName; Version = $_.Group[0].DisplayVersion; Hives = $hives -join '+' }
            }
          }
          # $names empty = want none. Returns the one entry's name.
          function Assert-Entries([string]$label, [string[]]$names, [string]$version) {
            $e = @(Get-Entries)
            $seen = ($e | ForEach-Object { "'$($_.Name)' $($_.Version) [$($_.Hives)]" }) -join '; '
            Write-Host "${label}: $($e.Count) Apps & Features entries: $seen"
            if ($names.Count -eq 0) {
              if ($e.Count -ne 0) { throw "${label}: want NO Roomler entry, found: $seen" }
              return
            }
            if ($e.Count -ne 1) { throw "${label}: want exactly ONE Roomler entry, found $($e.Count): $seen" }
            if ($names -cnotcontains $e[0].Name) { throw "${label}: the entry is '$($e[0].Name)', want $($names -join ' or ')" }
            if ($version -and $e[0].Version -ne $version) { throw "${label}: the entry is at $($e[0].Version), want $version" }
            $e[0].Name
          }
          function Get-Swap {
            $block = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\Roomler' -Name Environment -ErrorAction SilentlyContinue).Environment
            [bool](@($block) -contains 'ROOMLERD_ENABLE_SYSTEM_SWAP=1')
          }
          function Wait-Running([string]$label) {
            $svc = $null
            foreach ($i in 1..60) {
              $svc = Get-Service Roomler -ErrorAction SilentlyContinue
              if ($svc -and $svc.Status -eq 'Running') { return }
              Start-Sleep -Seconds 1
            }
            throw "${label}: the Roomler service is $($svc.Status), want Running"
          }
          # The served script, in the shell the field runs it in.
          # It runs msiexec /x itself, so it gets the same deadline (#3754).
          function Invoke-UninstallScript([string]$label) {
            $base = Join-Path $logDir "install-ps1-uninstall-$label"
            try {
              Invoke-Installer -Label "${label}: install.ps1 -Uninstall" -FilePath 'powershell.exe' `
                -Arguments '-NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -Uninstall' -Output $base
            } finally {
              foreach ($f in "$base.out.log", "$base.err.log") {
                if (Test-Path -LiteralPath $f) { Get-Content -LiteralPath $f | ForEach-Object { Write-Host "  install.ps1 | $_" } }
              }
            }
          }

          # This branch's MSIs, one patch version above the release they upgrade.
          # #3774: that release is the newest published one AT OR BELOW this
          # build's version. On a ref behind the newest release, upgrading from
          # the newest would put this older build over newer bytes, which ended
          # 1603; at or ahead of the newest release the two are the same.
          $builtText = (& .\target\release\roomlerd.exe --version | Out-String).Trim()
          $built = $null
          if (-not [version]::TryParse((($builtText -split '\s+')[-1] -replace '[-+].*$', ''), [ref]$built)) {
            throw "could not read this build's version from '$builtText'"
          }
          $published = @((Get-ReleaseJson 'releases?per_page=100') |
            Where-Object { $_.tag_name -like 'agent-v*' -and -not $_.draft -and -not $_.prerelease } |
            Sort-Object { [datetime]$_.published_at } -Descending)
          if (-not $published) { throw 'no published agent-v* release to upgrade from' }
          $newest = $published | Where-Object {
              $v = $null
              [version]::TryParse(($_.tag_name -replace '^agent-v', ''), [ref]$v) -and $v -le $built
            } | Select-Object -First 1
          if (-not $newest) { throw "no published agent-v* release at or below this build's $built to upgrade from" }
          $base = [version]($newest.tag_name -replace '^agent-v', '')
          $next = '{0}.{1}.{2}' -f $base.Major, $base.Minor, ($base.Build + 1)
          $nextMsi = "$next.1"
          Write-Host "this build is $built; the newest release is $($published[0].tag_name); upgrading from $($newest.tag_name), the newest at or below this build"
          Write-Host "this branch's MSIs are built at $next-smoke.1 (MSI $nextMsi)"
          $pu = Join-Path $out "branch-$nextMsi-peruser.msi"
          $pm = Join-Path $out "branch-$nextMsi-permachine.msi"
          Remove-Item target\wix\*.msi -Force -ErrorAction SilentlyContinue
          cargo wix -p roomlerd --nocapture --no-build --install-version "$next-smoke.1"
          if ($LASTEXITCODE -ne 0) { throw 'cargo wix (per-User) failed' }
          Move-Item (Get-ChildItem 'target/wix/*.msi' | Select-Object -First 1).FullName $pu -Force
          $wixDir = "agents\roomlerd\wix"
          Copy-Item "$wixDir\main.wxs" "$wixDir\main.wxs.bak" -Force
          Copy-Item "agents\roomlerd\wix-perMachine\main.wxs" "$wixDir\main.wxs" -Force
          try {
            cargo wix -p roomlerd --nocapture --no-build --install-version "$next-smoke.1"
            if ($LASTEXITCODE -ne 0) { throw 'cargo wix (per-Machine) failed' }
          } finally {
            Move-Item "$wixDir\main.wxs.bak" "$wixDir\main.wxs" -Force
          }
          Move-Item (Get-ChildItem 'target/wix/*.msi' | Select-Object -First 1).FullName $pm -Force

          # 1. An install from BEFORE P1 (the pinned release): install.ps1 finds it.
          $pre = Get-ReleaseJson "releases/tags/$env:PRE_P1_TAG"
          Invoke-Msi '/i' (Save-Msi $pre 'pu') (Join-Path $logDir 'fr133-pre-p1-peruser.log') ''
          $null = Assert-Entries "$($pre.tag_name) per-User installed" @($old.pu) ''
          Invoke-UninstallScript 'pre-p1-peruser'
          $null = Assert-Entries "$($pre.tag_name) per-User after install.ps1 -Uninstall" @() ''

          # 2. per-User: the release chosen above, then this branch over it.
          Invoke-Msi '/i' (Save-Msi $newest 'pu') (Join-Path $logDir 'fr133-newest-peruser.log') ''
          $was = Assert-Entries "$($newest.tag_name) per-User installed" @($old.pu, $new.pu) ''
          if ($was -cne $new.pu) { Write-Host "the newest release registers the pre-P1 name: this cell is the rename upgrade" }
          else { Write-Host "::notice::the newest release already registers '$was'; cell 1 above is the pre-P1 case" }
          Invoke-Msi '/i' $pu (Join-Path $logDir 'fr133-branch-peruser.log') ''
          $null = Assert-Entries 'per-User upgraded to this branch' @($new.pu) $nextMsi
          # The Start-menu entry follows the name, and the old one leaves with
          # the old product, whose removal runs ahead of this product's files.
          $menu = Join-Path ([Environment]::GetFolderPath('Programs')) 'Roomler'
          if (-not (Test-Path -LiteralPath (Join-Path $menu "$($new.pu).lnk"))) { throw "no $($new.pu).lnk in $menu after the upgrade" }
          if (Test-Path -LiteralPath (Join-Path $menu "$($old.pu).lnk")) { throw "the pre-P1 shortcut survived the upgrade in $menu" }
          Invoke-UninstallScript 'branch-peruser'
          $null = Assert-Entries 'per-User after install.ps1 -Uninstall' @() ''
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Roomler\roomlerd.exe'
          if (Test-Path $exe) { throw "$exe survived install.ps1 -Uninstall" }

          # 3. per-Machine + SystemContext: the newest release, then a hand-run
          #    upgrade to this branch with NO property, which must keep the switch.
          Invoke-Msi '/i' (Save-Msi $newest 'pm') (Join-Path $logDir 'fr133-newest-permachine.log') 'ENABLE_SYSTEM_CONTEXT=1'
          Wait-Running "$($newest.tag_name) per-Machine"
          if (-not (Get-Swap)) { throw "$($newest.tag_name) per-Machine installed with ENABLE_SYSTEM_CONTEXT=1, but the swap is off" }
          $null = Assert-Entries "$($newest.tag_name) per-Machine installed" @($old.pm, $new.pm) ''
          Invoke-Msi '/i' $pm (Join-Path $logDir 'fr133-branch-permachine.log') ''
          Wait-Running 'per-Machine upgraded to this branch'
          if (-not (Get-Swap)) { throw 'per-Machine upgraded to this branch: the SystemContext switch was not kept' }
          $null = Assert-Entries 'per-Machine upgraded to this branch' @($new.pm) $nextMsi
          Invoke-UninstallScript 'branch-permachine'
          $null = Assert-Entries 'per-Machine after install.ps1 -Uninstall' @() ''
          if (Get-Service Roomler -ErrorAction SilentlyContinue) { throw 'the Roomler service survived install.ps1 -Uninstall' }
          Write-Host 'FR-133 P1: each upgrade left one entry under the new name, and install.ps1 -Uninstall removed both names'

      # The MSIs the step above built one version above the newest release: what
      # a vmtest field cell installs over a released one. CI builds, unsigned:
      # never ship them. Not on a master push: nobody field-tests those, and at
      # 40 MB a run they would only fill the account's Actions storage.
      - name: Upload this branch's MSIs (FR-133 field cell)
        if: ${{ !cancelled() && github.event_name != 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: installer-smoke-msis
          path: ${{ runner.temp }}/fr133/branch-*.msi
          if-no-files-found: warn
          retention-days: 7

      # #3754 — what a failure leaves for its reader, taken before the runner
      # cleans up: every process with its image path, and the service's and the
      # per-User daemon's logs. A failed installer run has saved its own already.
      # On a cancel too: a job that hit its limit is a failure for its reader.
      - name: Save the evidence of a failure (#3754)
        if: failure() || cancelled()
        shell: pwsh
        run: |
          if (-not $env:INSTALLER_RUN -or -not (Test-Path -LiteralPath $env:INSTALLER_RUN)) { Write-Host 'no installer runner: nothing ran'; exit 0 }
          . $env:INSTALLER_RUN
          Save-InstallerEvidence 'job-end'

      - name: Upload MSI logs on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: msi-logs
          path: ${{ runner.temp }}/msi-logs/
          retention-days: 7

      # FR-6 wave 22 (#773): the job's LAST step. Only a master push
      # publishes, and an unchanged cache is not re-uploaded; see the action.
      - name: Publish the cargo cache (release-asset store)
        if: github.ref == 'refs/heads/master' && steps.seed.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/ci-seed-save
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          family: installer-smoke-windows
          key: ${{ steps.seed.outputs.key }}
          exact: ${{ steps.seed.outputs.exact }}

  # macOS had NO installer coverage at all until rc.454, and the platform
  # shipped for months with an install that could not work: the pkg payload was
  # the .app and nothing else (no CLI), the privileged half was gated on a
  # marker file nothing ever created, and running the one-liner under `sudo`
  # silently enrolled into the wrong profile. None of that is visible to a
  # compile check — it needs a real install.
  #
  # What this CAN prove on a hosted runner: the pkg builds, installs, puts both
  # binaries where the plists and the docs say they are, loads the LaunchAgent,
  # and the CLI shim resolves the daemon inside the bundle. TCC is the image's
  # to decide, not the job's: the hosted macos-15 image grants the process the
  # job's shell starts both Screen Recording and Accessibility, so the
  # permissions step checks that `roomlerd caps` reports the grants it holds
  # consistently, and asserts the refusal path only where it is reachable.
  #
  # #3774: every step tests the build this job made. Before the first install
  # the job opts out of the live update channel with the product's own marker,
  # because the update helper the package loads would otherwise install the
  # newest PUBLISHED release over this build whenever the ref is behind it; and
  # every step that runs the bundle's `roomlerd` first checks its `--version`
  # against the build. The marker comes off only for the job's last install.
  macos-pkg-install:
    name: macOS pkg install smoke
    # Pinned to the image release-agent.yml builds the shipped .pkg on (GitHub
    # retires macos-14 by 2026-11-02).
    runs-on: macos-15
    timeout-minutes: 40
    # FR-6 wave 22 (#773): a master push publishes this job's cargo cache as a
    # release asset (ci-seed-save), which needs `contents: write`.
    permissions:
      contents: write
    env:
      # rust-cache set this for the job until wave 22; set it here.
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (aarch64-apple-darwin)
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-darwin

      - name: Salt the cargo cache key with this job's definition
        # FR-6 wave 16 (#773): rotates this job's cargo cache when its own
        # steps change. After checkout, before the cache; see the action.
        uses: ./.github/actions/cargo-cache-salt

      - name: Restore the cargo cache (release-asset store)
        # FR-6 wave 22 (#773): see the Windows job above and the action.
        id: seed
        continue-on-error: true
        uses: ./.github/actions/ci-seed-restore
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          family: macos-pkg-smoke

      - name: Install system deps
        run: brew install cmake libvpx pkg-config

      # Feature set is a subset of release-agent.yml's build-macos: `full`
      # would drag in the whole media stack for no extra signal, and the
      # payload shape plus the launchd wiring are what this job is about.
      # `enigo-input` is in it as in the shipped build: without it
      # `has_input_permission` is false whatever the OS granted, and the
      # permissions step would read a constant (#3774).
      - name: Build the agent + the CLI shim
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          set -euo pipefail
          cargo build -p roomlerd --release \
            --features "media,vp9-444,vp9-444-bindgen,overlay-l3,enigo-input" \
            --target aarch64-apple-darwin
          cargo build -p roomler-cli-shim --release --target aarch64-apple-darwin
          cargo build -p roomler-desktop --release --target aarch64-apple-darwin

      # #3774: the version every later step holds the installed bundle to, read
      # from the binary this job built before anything is installed, and the
      # check those steps run first. A bundle that answers anything else was
      # put there by something other than this job's package.
      - name: Record the build under test, and the check each step runs first
        run: |
          set -euo pipefail
          built="$(target/aarch64-apple-darwin/release/roomlerd --version)"
          [ -n "$built" ] || { echo "::error::the built roomlerd printed no version"; exit 1; }
          echo "this job built: $built"
          echo "SMOKE_BUILT_VERSION=$built" >> "$GITHUB_ENV"
          check="$RUNNER_TEMP/bundle-is-this-build.sh"
          cat > "$check" <<'EOF'
          #!/usr/bin/env bash
          # The installed bundle's roomlerd must be the build this job made (#3774).
          set -euo pipefail
          bin="${1:-/Library/Roomler/roomlerd.app/Contents/MacOS/roomlerd}"
          want="${SMOKE_BUILT_VERSION:?the build step did not record the version it built}"
          got="$("$bin" --version 2>&1)" || { echo "::error::$bin --version failed: $got"; exit 1; }
          if [ "$got" != "$want" ]; then
            echo "::error::the bundle's roomlerd reports '$got' but this job built '$want': something other than this job's package replaced the build under test"
            exit 1
          fi
          echo "  the bundle's roomlerd is this job's build ($got)"
          EOF
          chmod +x "$check"
          # The check refuses a binary that answers another version (its
          # negative control), and accepts the one this job built.
          fake="$RUNNER_TEMP/roomlerd-of-another-version"
          printf '#!/bin/sh\necho "roomlerd 0.0.1"\n' > "$fake"
          chmod +x "$fake"
          if SMOKE_BUILT_VERSION="$built" "$check" "$fake" > /dev/null; then
            echo "::error::the check accepted a roomlerd that answers another version"
            exit 1
          fi
          SMOKE_BUILT_VERSION="$built" "$check" target/aarch64-apple-darwin/release/roomlerd
          echo "  the check refuses another version and accepts this build"
          echo "BUNDLE_CHECK=$check" >> "$GITHUB_ENV"

      - name: Stage + build the pkg
        run: |
          set -euo pipefail
          VERSION="0.0.0-smoke"
          APP=stage/roomlerd.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" "$APP/Contents/Frameworks"
          cp target/aarch64-apple-darwin/release/roomlerd "$APP/Contents/MacOS/roomlerd"

          # The same dependency walk the release lane runs. Without it the
          # binary loads Homebrew paths that exist here and nowhere else, and
          # the install "passes" while being undeployable.
          FW="$APP/Contents/Frameworks"
          bundle_deps() {
            local target="$1" dep base
            otool -L "$target" | tail -n +2 | awk '{print $1}' | while read -r dep; do
              case "$dep" in /usr/lib/*|/System/*|@*) continue ;; esac
              base="$(basename "$dep")"
              if [ ! -f "$FW/$base" ]; then
                cp -L "$dep" "$FW/$base"
                chmod u+w "$FW/$base"
                install_name_tool -id "@rpath/$base" "$FW/$base"
                bundle_deps "$FW/$base"
              fi
              install_name_tool -change "$dep" "@rpath/$base" "$target"
            done
          }
          install_name_tool -add_rpath "@executable_path/../Frameworks" "$APP/Contents/MacOS/roomlerd"
          bundle_deps "$APP/Contents/MacOS/roomlerd"
          # Deliberately AD-HOC here, diverging from the release lane's stable
          # self-signed identity: identity stability is a FLEET property (TCC
          # grants surviving updates), meaningless on a throwaway runner — and
          # fork PRs have no secrets, so requiring the cert would break them.
          find "$APP" -type f \( -name '*.dylib' -o -name 'roomlerd' \) \
            -exec codesign --force --sign - {} \;

          cp agents/roomlerd/packaging/macos/com.roomler.agent.plist "$APP/Contents/Resources/"
          cp agents/roomlerd/packaging/macos/com.roomler.daemon.plist "$APP/Contents/Resources/"
          cp agents/roomlerd/packaging/macos/com.roomler.desktop.plist "$APP/Contents/Resources/"
          cp agents/roomlerd/packaging/macos/com.roomler.update.plist "$APP/Contents/Resources/"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>roomlerd</string>
            <key>CFBundleIdentifier</key><string>com.roomler.agent</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSUIElement</key><true/>
          </dict></plist>
          PLIST

          # Seal the bundle LAST, mirroring the release lane. Signing the main
          # executable earlier seals the whole bundle, and everything written
          # after that (both plists, Info.plist) falsifies the seal — which is
          # what shipped in rc.453/rc.454 and what this job kept failing on.
          codesign --force --sign - "$APP"
          codesign --verify --strict "$APP" || {
            echo "::error::the .app's signature does not match its contents"
            exit 1
          }

          # The companion, staged the same way the release lane does it.
          DESK=stage/Roomler.app
          mkdir -p "$DESK/Contents/MacOS" "$DESK/Contents/Resources"
          cp target/aarch64-apple-darwin/release/roomler-desktop "$DESK/Contents/MacOS/roomler-desktop"
          cat > "$DESK/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>roomler-desktop</string>
            <key>CFBundleIdentifier</key><string>ai.roomler.agent-tray</string>
            <key>CFBundleName</key><string>Roomler</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSUIElement</key><true/>
          </dict></plist>
          PLIST
          codesign --force --sign - "$DESK"

          mkdir -p payload/Applications payload/usr/local/bin scripts dist
          mkdir -p payload/Library/Roomler
          cp -R "$APP" payload/Library/Roomler/
          cp -R "$DESK" payload/Applications/
          cp target/aarch64-apple-darwin/release/roomler-shim payload/usr/local/bin/roomler
          chmod 755 payload/usr/local/bin/roomler
          ln -s /Library/Roomler/roomlerd.app/Contents/MacOS/roomlerd \
            payload/usr/local/bin/roomlerd
          cp agents/roomlerd/packaging/macos/postinstall scripts/postinstall
          chmod 755 scripts/postinstall
          # pkgbuild THEN productbuild — the same two steps release-agent.yml
          # runs, and not an optimisation to skip.
          #
          # `pkgbuild` infers the .app as a relocatable BUNDLE COMPONENT
          # ("Inferring bundle components from contents of payload"). Installing
          # that raw component package directly does not put the payload at its
          # final path before the top-level postinstall runs, so the script
          # fails on a bundle that is demonstrably IN the payload — verified
          # here with `pkgutil --payload-files`. Wrapping it in a product
          # archive is what the shipped artifact is, and it installs correctly
          # on a real Mac.
          #
          # The general rule this cost three CI cycles to relearn: an installer
          # smoke must build its artifact EXACTLY as the release does, or it
          # tests something nobody ships.
          # Pin the bundle to its payload path — see the same block in
          # release-agent.yml. Without it PackageKit relocates the .app to
          # whatever copy LaunchServices already knows about, which on this
          # runner is the staging directory this pkg was built from, and the
          # postinstall then finds nothing at /Applications.
          pkgbuild --analyze --root payload component.plist
          i=0
          while /usr/libexec/PlistBuddy -c "Print :$i:BundleIsRelocatable" component.plist >/dev/null 2>&1; do
            /usr/libexec/PlistBuddy -c "Set :$i:BundleIsRelocatable false" component.plist
            i=$((i + 1))
          done
          [ "$i" -gt 0 ] || { echo "::error::pkgbuild --analyze found no bundle component to pin"; exit 1; }
          plutil -p component.plist

          pkgbuild --root payload --component-plist component.plist \
            --scripts scripts --identifier com.roomler.agent \
            --version "$VERSION" --install-location / component.pkg
          # Gated exactly as the release is (release-agent.yml's MACOS_FLOOR), and
          # a second product gated at an impossible macOS for the negative
          # control below.
          bash scripts/macos-productbuild-gated.sh component.pkg dist/smoke.pkg 15.0
          bash scripts/macos-productbuild-gated.sh component.pkg dist/smoke-gate-99.pkg 99.0

          # Prove what is actually IN the package before installing it, so a
          # script failure can never again be confused with a staging failure.
          echo "=== payload ==="
          pkgutil --payload-files component.pkg | sed -n '1,40p'
          pkgutil --payload-files component.pkg | grep -q 'Contents/Resources/com.roomler.agent.plist' \
            || { echo "::error::the LaunchAgent plist is not in the payload"; exit 1; }
          pkgutil --payload-files component.pkg | grep -q 'usr/local/bin/roomler' \
            || { echo "::error::the CLI is not in the payload"; exit 1; }

      # The shipped .pkg refuses a Mac below its floor, and on this runner every
      # real floor passes, so prove the mechanism with an impossible one. If
      # `installer` ever stopped honouring <allowed-os-versions>, a Mac below the
      # floor would install a daemon that cannot start. Runs BEFORE the real
      # install, while nothing of ours is on this runner yet.
      - name: The installer gate refuses an unsupported macOS (negative control)
        run: |
          set -uo pipefail
          if sudo installer -pkg dist/smoke-gate-99.pkg -target / > gate.log 2>&1; then
            cat gate.log
            echo "::error::installer ACCEPTED a package gated at macOS 99.0"
            exit 1
          fi
          cat gate.log
          [ ! -e /Library/Roomler/roomlerd.app ] \
            || { echo "::error::the refused install still put the daemon bundle down"; exit 1; }
          echo "refused, and nothing landed"

      # The package's script writes the login items as the person at the
      # console: a link at an item's path is replaced by a file of that
      # person's, and what the link pointed at keeps its bytes, owner and mode.
      # Planted before the first install, read right after it.
      - name: Plant a link at the companion's login item (before the first install)
        run: |
          set -euo pipefail
          console_user=$(stat -f "%Su" /dev/console 2>/dev/null || echo "")
          if [ -z "$console_user" ] || [ "$console_user" = root ]; then
            echo "::warning::no GUI session on this runner, so the login-item checks have nothing to read"
            exit 0
          fi
          home=$(dscl . -read /Users/"$console_user" NFSHomeDirectory | awk '{print $2}')
          ls -ld "$home/Library" "$home/Library/LaunchAgents" 2>&1 || true
          printf 'bytes the install leaves alone\n' > "$RUNNER_TEMP/login-item-expected"
          scratch="$RUNNER_TEMP/login-item-link-target"
          sudo cp "$RUNNER_TEMP/login-item-expected" "$scratch"
          sudo chown root:wheel "$scratch"
          sudo chmod 600 "$scratch"
          sudo -u "$console_user" mkdir -p "$home/Library/LaunchAgents"
          sudo -u "$console_user" ln -sfn "$scratch" "$home/Library/LaunchAgents/com.roomler.desktop.plist"
          ls -l "$home/Library/LaunchAgents/com.roomler.desktop.plist"
          sudo ls -l "$scratch"

      # #3774: the product's own opt-out, before the first install. Without it
      # the package loads the update helper (RunAtLoad), which fetches the
      # newest PUBLISHED release and installs it over this job's build whenever
      # the ref is behind that release, and every later step then tests the
      # release instead. With it, every install skips the helper (`postinstall`,
      # the `disable-auto-update` test). Pointing the update URL at a dead
      # address would not do: the updater falls back to GitHub. The marker
      # comes off at the job's last install, which asserts the default.
      - name: Opt out of the live update channel (before the first install)
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/roomler
          sudo touch /etc/roomler/disable-auto-update
          ls -l /etc/roomler/disable-auto-update

      - name: Install it
        run: sudo installer -verbose -pkg dist/smoke.pkg -target /

      # `installer` reports script failures as one opaque sentence ("An error
      # occurred while running scripts from the package") and puts the actual
      # stderr in the system log. Without this the only way to find out why a
      # postinstall failed is to guess.
      - name: Why the install failed
        if: failure()
        run: |
          echo "=== console user ==="
          stat -f "%Su" /dev/console || true
          echo "=== install.log (roomler + script lines) ==="
          sudo tail -200 /var/log/install.log | grep -iE "roomler|script|error|fail" || true
          echo "=== what landed anyway ==="
          ls -la /Library/Roomler/roomlerd.app/Contents/MacOS/ 2>&1 || true
          ls -la /usr/local/bin/roomler 2>&1 || true
          echo "=== is /Applications what we think it is? ==="
          ls -ld /Applications 2>&1 || true
          echo "=== did the bundle land SOMEWHERE else? ==="
          # pkgbuild infers the .app as a bundle component, and bundle
          # components are RELOCATABLE by default: PackageKit may install one
          # wherever it finds an existing copy rather than at the payload path.
          sudo find / -maxdepth 6 -name 'roomlerd.app' -not -path '*/work/*' 2>/dev/null || true
          echo "=== component metadata (relocatable? install-location?) ==="
          rm -rf /tmp/pkgexp
          pkgutil --expand dist/smoke.pkg /tmp/pkgexp 2>&1 || true
          find /tmp/pkgexp -maxdepth 2 -name PackageInfo -o -maxdepth 2 -name Distribution 2>/dev/null \
            | while read -r f; do echo "--- $f"; cat "$f"; echo; done

      - name: The login items are files of the person, and the link's target is as it was
        run: |
          set -euo pipefail
          console_user=$(stat -f "%Su" /dev/console 2>/dev/null || echo "")
          if [ -z "$console_user" ] || [ "$console_user" = root ]; then
            echo "::warning::no GUI session on this runner, so there is no login item to read"
            exit 0
          fi
          uid=$(id -u "$console_user")
          home=$(dscl . -read /Users/"$console_user" NFSHomeDirectory | awk '{print $2}')
          scratch="$RUNNER_TEMP/login-item-link-target"
          fail=0
          if sudo cmp -s "$scratch" "$RUNNER_TEMP/login-item-expected"; then
            echo "  the link's target holds the bytes it had"
          else
            echo "::error::the link's target does not hold its bytes"
            fail=1
          fi
          was=$(sudo stat -f '%Su:%Sg:%Lp' "$scratch")
          if [ "$was" = "root:wheel:600" ]; then
            echo "  the link's target keeps owner and mode ($was)"
          else
            echo "::error::the link's target is $was, not root:wheel:600"
            fail=1
          fi
          for item in com.roomler.agent.plist com.roomler.desktop.plist; do
            p="$home/Library/LaunchAgents/$item"
            if [ -L "$p" ] || [ ! -f "$p" ]; then
              echo "::error::$p is not a regular file: $(ls -ld "$p" 2>&1)"
              fail=1
              continue
            fi
            got=$(stat -f '%u:%Lp' "$p")
            if [ "$got" = "$uid:644" ]; then
              echo "  $item is a regular file of uid $uid, mode 644"
            else
              echo "::error::$p is uid:mode $got, not $uid:644"
              fail=1
            fi
          done
          ls -l "$home/Library/LaunchAgents"
          exit "$fail"

      - name: Assert the payload landed where everything expects it
        run: |
          set -euo pipefail
          BIN=/Library/Roomler/roomlerd.app/Contents/MacOS/roomlerd
          # Both plists and the docs name this path literally, and a rename
          # would void every TCC grant keyed to the binary.
          test -x "$BIN" || { echo "::error::missing $BIN"; exit 1; }
          # The CLI the pkg did not ship at all before rc.454.
          test -x /usr/local/bin/roomler || { echo "::error::missing /usr/local/bin/roomler"; exit 1; }
          # Command-surface parity with Linux and Windows: `roomlerd` on PATH.
          test -x /usr/local/bin/roomlerd || { echo "::error::missing /usr/local/bin/roomlerd"; exit 1; }
          [ "$(readlink /usr/local/bin/roomlerd)" = "$BIN" ] \
            || { echo "::error::roomlerd does not point at the bundle binary"; exit 1; }
          "$BUNDLE_CHECK"
          /usr/local/bin/roomlerd --version >/dev/null \
            || { echo "::error::roomlerd on PATH does not run"; exit 1; }
          echo "  payload OK"

      # FR-46 P5b — the pre-rename bundle must be SWEPT, not left beside the new
      # one. A pkg install is additive, so without the sweep an upgraded Mac
      # keeps a second signed, launchable copy of the daemon — and, worse, the
      # copy that every existing Privacy grant still points at. An operator
      # hunting the right thing to approve would find two candidates.
      #
      # Seeded and re-installed rather than asserted on a fresh box, because on
      # a fresh box the old bundle never exists and the assert would pass while
      # proving nothing.
      - name: The pre-rename bundle is swept by an upgrade
        run: |
          set -euo pipefail
          "$BUNDLE_CHECK"
          sudo mkdir -p /Library/Roomler/roomler-agent.app/Contents/MacOS
          sudo cp /Library/Roomler/roomlerd.app/Contents/MacOS/roomlerd \
            /Library/Roomler/roomler-agent.app/Contents/MacOS/roomler-agent
          test -d /Library/Roomler/roomler-agent.app \
            || { echo "::error::could not seed the pre-rename bundle"; exit 1; }
          sudo installer -verbose -pkg dist/smoke.pkg -target /
          test ! -d /Library/Roomler/roomler-agent.app \
            || { echo "::error::the pre-rename bundle survived the upgrade"; exit 1; }
          test -x /Library/Roomler/roomlerd.app/Contents/MacOS/roomlerd \
            || { echo "::error::the sweep took the CURRENT bundle with it"; exit 1; }
          echo "  pre-rename bundle swept; current bundle intact"

      - name: Assert the LaunchAgent is registered, and the root half is not
        run: |
          set -euo pipefail
          # Two legitimate outcomes, and the job must not confuse them.
          #
          # A hosted runner usually has NO Aqua session, which is the same
          # situation as installing over SSH or at the login window. The
          # postinstall must then place what it can and say so — NOT abort and
          # leave a half-applied install reported as a failure, which is what
          # it did before this job existed to catch it.
          console_user=$(stat -f "%Su" /dev/console 2>/dev/null || echo "")
          echo "console user: '${console_user:-<none>}'"

          if [ -z "$console_user" ] || [ "$console_user" = root ]; then
            # No GUI session: the install must still have SUCCEEDED (asserted by
            # the step above, which would have failed on a missing payload).
            echo "  no GUI session — install completed without registering the agent, as intended"
          else
            uid_now=$(id -u "$console_user")
            plist="$(dscl . -read /Users/"$console_user" NFSHomeDirectory | awk '{print $2}')/Library/LaunchAgents/com.roomler.agent.plist"
            test -f "$plist" || { echo "::error::plist not placed at $plist"; exit 1; }
            echo "  plist placed at $plist"
            if launchctl print "gui/$uid_now/com.roomler.agent" >/dev/null 2>&1; then
              echo "  LaunchAgent loaded in gui/$uid_now"
            else
              # Placed but not loaded is the documented degraded outcome (it
              # loads at next login), so this is a note, not a failure.
              echo "  plist placed but not loaded in gui/$uid_now — starts at next login"
            fi
          fi
          # Opt-in, and NOT requested here, so it must be absent. The
          # postinstall declining to install a root daemon nobody asked for is
          # as load-bearing as installing one that was asked for.
          if [ -f /Library/LaunchDaemons/com.roomler.daemon.plist ]; then
            echo "::error::the root LaunchDaemon appeared without the enable-daemon marker"
            exit 1
          fi
          echo "  privileged half correctly absent"

      # #3774: the marker went down before the first install, so every install
      # so far skipped the update helper, and none loaded a job that could put
      # the newest published release over this build. The helper is then run
      # once by hand, as root as launchd runs it, and must exit on the marker.
      # That the helper is installed BY DEFAULT is asserted by the job's last
      # install, after every step that reads the bundle.
      - name: The live update channel stays shut (the helper exits on the opt-out marker)
        run: |
          set -euo pipefail
          "$BUNDLE_CHECK"
          test -f /etc/roomler/disable-auto-update \
            || { echo "::error::the opt-out marker is gone"; exit 1; }
          if [ -f /Library/LaunchDaemons/com.roomler.update.plist ]; then
            echo "::error::an install placed the update helper although the opt-out marker is set"
            exit 1
          fi
          if launchctl print system/com.roomler.update >/dev/null 2>&1; then
            echo "::error::com.roomler.update is loaded although the opt-out marker is set"
            exit 1
          fi
          echo "--- the package's lines for the helper, from /var/log/install.log ---"
          pkg_lines="$(sudo grep -F 'auto-update opted out' /var/log/install.log || true)"
          printf '%s\n' "$pkg_lines" | sed 's/^.*postinstall: /    /' | tail -3
          [ -n "$pkg_lines" ] \
            || { echo "::error::no install said it skipped the helper for the opt-out marker"; exit 1; }
          # The helper spaces its runs 60 s apart (launchd's ThrottleInterval
          # twin) and a first run has no stamp yet, so this waits about 60 s.
          echo "--- the update helper, run once by hand ---"
          rc=0
          out="$(sudo env RUST_LOG=info NO_COLOR=1 \
            /Library/Roomler/roomlerd.app/Contents/MacOS/roomlerd update-helper 2>&1)" || rc=$?
          printf '%s\n' "$out" | sed 's/^/    /'
          [ "$rc" -eq 0 ] || { echo "::error::the update helper ended rc=$rc"; exit 1; }
          printf '%s\n' "$out" | grep -qF 'auto-update opted out — exiting' \
            || { echo "::error::the update helper did not exit on the opt-out marker"; exit 1; }
          echo "  the update helper exits on the marker: nothing replaces this job's build"

      - name: Assert the menu-bar companion shipped and registered
        run: |
          set -euo pipefail
          # macOS had no companion at all before rc.456 — the platform where the
          # OS silently withholds capture and input was the one with nowhere to
          # SAY so.
          test -x /Applications/Roomler.app/Contents/MacOS/roomler-desktop \
            || { echo "::error::the companion .app is missing"; exit 1; }
          # LSUIElement is what keeps a menu-bar app out of the Dock; without it
          # the user gets a Dock tile for something that has no main window.
          [ "$(plutil -extract LSUIElement raw /Applications/Roomler.app/Contents/Info.plist)" = "true" ] \
            || { echo "::error::the companion is not marked LSUIElement"; exit 1; }
          console_user=$(stat -f "%Su" /dev/console 2>/dev/null || echo "")
          if [ -n "$console_user" ] && [ "$console_user" != root ]; then
            home=$(dscl . -read /Users/"$console_user" NFSHomeDirectory | awk '{print $2}')
            test -f "$home/Library/LaunchAgents/com.roomler.desktop.plist" \
              || { echo "::error::the companion LaunchAgent was not installed"; exit 1; }
            echo "  companion registered for $console_user"
          else
            echo "  no GUI session — companion installed, registration deferred"
          fi

      - name: Assert the CLI shim resolves the daemon inside the bundle
        run: |
          set -euo pipefail
          # The shim execs the bundle's roomlerd.
          "$BUNDLE_CHECK"
          # macOS is the one platform where the shim's sibling-`roomlerd` probe
          # cannot work, so this covers the bundle fallback. Nothing is enrolled
          # here, so the command itself will fail — what must NOT happen is the
          # shim failing to locate the daemon at all.
          out="$(/usr/local/bin/roomler status 2>&1 || true)"
          echo "$out"
          case "$out" in
            *"daemon binary is missing"*)
              echo "::error::the shim could not resolve the bundle executable"
              exit 1
              ;;
          esac
          echo "  shim resolves the daemon"

      # `has_input_permission` used to be a compile-time constant, so a Mac with
      # Accessibility denied still advertised working input. It is now
      # feature && GUI session && the OS grant, and `permissions` lists what
      # the OS granted (`input`, `screen-capture`) or `no-gui-session`
      # (encode/caps.rs). With `enigo-input` built in, the two must agree.
      #
      # What the hosted image grants (#3774): on macos-15 the process this
      # step's shell starts holds BOTH Screen Recording and Accessibility; runs
      # on 2026-11-12 printed `permissions: ["screen-capture", "input"]`. So on
      # this image the step reads the granted path, and the refused path is
      # asserted only when this process's own `permissions` lacks `input`.
      - name: Assert permissions are reported as the OS granted them (the hosted image grants both)
        run: |
          set -euo pipefail
          "$BUNDLE_CHECK"
          # judge HAS_INPUT PERMISSIONS_LINE: rc 0 when the two agree.
          judge() {
            local has="$1" perms="$2" input=0 nogui=0
            case "$perms" in *'"input"'*) input=1 ;; esac
            case "$perms" in *'"no-gui-session"'*) nogui=1 ;; esac
            case "$has" in
              true)
                [ "$input" -eq 1 ] && [ "$nogui" -eq 0 ] && return 0
                echo "::error::has_input_permission is true while permissions is $perms"
                return 1 ;;
              false)
                if [ "$input" -eq 1 ] && [ "$nogui" -eq 0 ]; then
                  echo "::error::has_input_permission is false while permissions is $perms (is enigo-input built in?)"
                  return 1
                fi
                return 0 ;;
              *)
                echo "::error::has_input_permission is '$has', not true or false"
                return 1 ;;
            esac
          }
          # The check refuses what it exists to refuse (its negative controls).
          for bad in 'true|["screen-capture"]' 'true|[]' 'true|["no-gui-session"]' \
                     'true|["no-gui-session", "input"]' 'false|["screen-capture", "input"]' '|["input"]'; do
            if judge "${bad%%|*}" "${bad#*|}" >/dev/null; then
              echo "::error::the check accepted a contradictory report: $bad"
              exit 1
            fi
          done
          for good in 'true|["screen-capture", "input"]' 'true|["input"]' 'false|[]' \
                      'false|["screen-capture"]' 'false|["no-gui-session"]'; do
            judge "${good%%|*}" "${good#*|}" \
              || { echo "::error::the check refused a consistent report: $good"; exit 1; }
          done
          echo "  the check refuses 6 contradictory reports and accepts 5 consistent ones"

          caps="$(/Library/Roomler/roomlerd.app/Contents/MacOS/roomlerd caps 2>&1 || true)"
          has="$(printf '%s\n' "$caps" | sed -n 's/^has_input_permission: //p' | head -1)"
          perms="$(printf '%s\n' "$caps" | sed -n 's/^permissions: //p' | head -1)"
          echo "  has_input_permission: ${has:-<missing>}    permissions: ${perms:-<missing>}"
          [ -n "$has" ] && [ -n "$perms" ] \
            || { printf '%s\n' "$caps"; echo "::error::roomlerd caps printed no has_input_permission or no permissions line"; exit 1; }
          judge "$has" "$perms" || { printf '%s\n' "$caps"; exit 1; }
          case "$perms" in
            *'"input"'*) echo "  this image granted this process Accessibility; the refused path is not reachable here" ;;
            *) echo "  Accessibility not granted to this process, and input is reported refused" ;;
          esac

      - name: An enabled daemon must SURVIVE the next install (self-update)
        run: |
          set -euo pipefail
          # The postinstall removes the root daemon when the marker is absent,
          # which is correct for a real opt-out — but a SELF-UPDATE is not an
          # opt-out, and it runs the very same pkg. Until the enabling branch
          # recorded the choice, a daemon enabled via ROOMLER_MACOS_DAEMON=1
          # left no marker, so the NEXT update silently deleted it: overlay
          # and SSH both gone. Field-hit on a MacBook 2026-08-25 across an
          # rc.458 -> rc.460 self-update.
          #
          # `installer` sends postinstall stdout to /var/log/install.log, NOT to
          # this job's log, so a bare failure here says nothing about what the
          # script actually decided. Dump the script's own lines after every
          # install — the one diagnostic that turns "it failed" into a cause.
          since=$(date -u "+%Y-%m-%d %H:%M:%S")
          dump_log() {
            echo "--- postinstall output from /var/log/install.log ---"
            sudo awk -v s="$since" '$0 ~ /roomler|enable-daemon|daemon/ {print "    " $0}' \
              /var/log/install.log 2>/dev/null | tail -25 || true
          }

          # Enable via the MARKER — the only mechanism that exists. There is no
          # env-var form: macOS runs package scripts from package_script_service,
          # a separate PackageKit daemon, so they never see the environment of
          # whoever ran `installer`. This job proved that on 2026-08-25 — an
          # install with ROOMLER_MACOS_DAEMON=1 logged the per-user lines and
          # none of the daemon ones — and the dead condition was removed.
          # FR-119 P2b-9 — what launchd LOADED, not only what the file says. A
          # job without a ProcessType reports `spawn type = daemon (3)` and runs
          # throttled, in the utility band: the worker that runs every session
          # is spawned inside this job, so its capture and encode ran there too.
          # An Interactive job reports `interactive (4)`.
          daemon_is_interactive() {
            local pt spawn
            pt=$(plutil -extract ProcessType raw /Library/LaunchDaemons/com.roomler.daemon.plist 2>/dev/null || true)
            [ "$pt" = "Interactive" ] \
              || { echo "::error::the installed daemon plist has ProcessType '${pt:-none}', not Interactive"; return 1; }
            spawn=$(sudo launchctl print system/com.roomler.daemon 2>/dev/null \
                      | awk -F' = ' '/spawn type/ {print $2; exit}' || true)
            case "$spawn" in
              interactive*) echo "  launchd runs the daemon as: $spawn" ;;
              *) echo "::error::launchd runs com.roomler.daemon as '${spawn:-not loaded}', not interactive"; return 1 ;;
            esac
          }

          echo "=== install 1: enabled via the marker ==="
          # FR-46 P5a — deliberately seeded at the LEGACY path, so this install
          # exercises the postinstall migration end to end rather than only the
          # happy path. A marker the migration failed to carry would fall through
          # to the else branch and BOOT OUT the daemon, which is the failure this
          # whole phase is shaped around.
          # The migration runs only while /etc/roomler is ABSENT, and the job's
          # opt-out marker (#3774) made it exist: the whole directory is renamed
          # to the legacy name, marker and all, so the migration still runs, and
          # it must carry the opt-out across too. Both readers of the marker
          # dual-read, so the live channel stays shut throughout.
          # RETIRED-NAME-ANCHOR(2): the migration SOURCE, seeded on purpose.
          "$BUNDLE_CHECK"
          test ! -e /etc/roomler-agent \
            || { echo "::error::/etc/roomler-agent exists before the migration is seeded"; exit 1; }
          sudo mv /etc/roomler /etc/roomler-agent
          sudo touch /etc/roomler-agent/enable-daemon
          sudo installer -verbose -pkg dist/smoke.pkg -target /
          dump_log
          test -f /Library/LaunchDaemons/com.roomler.daemon.plist \
            || { echo "::error::daemon plist missing after an enabled install"; exit 1; }
          echo "  daemon installed"
          daemon_is_interactive
          # The migration must have MOVED it, not copied it: a legacy directory
          # left behind would be read again by the dual-read gates forever.
          test -f /etc/roomler/enable-daemon \
            || { echo "::error::the marker was not migrated to /etc/roomler"; exit 1; }
          test ! -d /etc/roomler-agent \
            || { echo "::error::the legacy /etc/roomler-agent survived the migration"; exit 1; }
          test -f /etc/roomler/disable-auto-update \
            || { echo "::error::the migration did not carry the opt-out marker to /etc/roomler"; exit 1; }
          echo "  config dir migrated off the retired name, the opt-out marker with it"

          echo "=== install 2: plain, i.e. what a self-update runs ==="
          sudo installer -verbose -pkg dist/smoke.pkg -target /
          dump_log
          test -f /Library/LaunchDaemons/com.roomler.daemon.plist \
            || { echo "::error::a plain re-install DELETED the enabled daemon — \
                 the self-update regression is back"; exit 1; }
          echo "  daemon survived the update"
          daemon_is_interactive

          # And the opt-OUT path must still work: remove the marker, install,
          # daemon goes. Otherwise this test would pass by making the removal
          # branch unreachable, which is the opposite defect.
          echo "=== install 3: marker removed = a real opt-out ==="
          sudo rm -f /etc/roomler/enable-daemon
          sudo installer -verbose -pkg dist/smoke.pkg -target /
          dump_log
          if [ -f /Library/LaunchDaemons/com.roomler.daemon.plist ]; then
            echo "::error::opt-out no longer removes the daemon"
            exit 1
          fi
          echo "  opt-out still honoured"

      # The opt-out half of the update helper's round trip; the opt-in half is
      # the job's last install. #3774: the marker has been set since before the
      # first install, so the helper the removal branch removes is loaded here
      # by hand, from the bundle's own plist, while the marker is set: a job
      # loaded before the marker was set lingers like that until an install or
      # a reboot, and it must exit on the marker too.
      - name: The update helper's opt-out removes a loaded helper (and a loaded one exits on the marker)
        run: |
          set -euo pipefail
          "$BUNDLE_CHECK"
          since=$(date -u "+%Y-%m-%d %H:%M:%S")
          dump_log() {
            echo "--- postinstall output from /var/log/install.log ---"
            sudo awk -v s="$since" '$0 ~ /roomler|update helper|disable-auto-update/ {print "    " $0}' \
              /var/log/install.log 2>/dev/null | tail -25 || true
          }
          plist=/Library/LaunchDaemons/com.roomler.update.plist

          # Every install above ran WITH the marker, so the helper must still be
          # absent: each of them honoured it.
          if [ -f "$plist" ]; then
            echo "::error::an install placed the update helper although the opt-out marker is set"
            exit 1
          fi

          echo "=== a helper loaded while the marker is set: it runs once and exits on the marker ==="
          sudo cp /Library/Roomler/roomlerd.app/Contents/Resources/com.roomler.update.plist "$plist"
          sudo chown root:wheel "$plist"
          sudo chmod 644 "$plist"
          sudo mkdir -p /var/log/roomler
          sudo launchctl bootstrap system "$plist"
          # RunAtLoad starts it at once; it may first wait out its 60 s run
          # spacing. The removal below waits only 10 s for an idle job, so wait
          # here until it has run and is idle.
          idle=0
          for _ in $(seq 1 60); do
            state=$(sudo launchctl print system/com.roomler.update 2>/dev/null || true)
            if printf '%s\n' "$state" | grep -qE 'runs = [1-9]' \
               && ! printf '%s\n' "$state" | grep -q 'state = running'; then
              idle=1
              break
            fi
            sleep 3
          done
          [ "$idle" -eq 1 ] \
            || { echo "::error::the loaded helper did not run and go idle within 180 s"; exit 1; }
          echo "--- /var/log/roomler/update.log ---"
          sudo tail -n 5 /var/log/roomler/update.log | sed 's/^/    /' || true
          sudo grep -qF 'auto-update opted out — exiting' /var/log/roomler/update.log \
            || { echo "::error::the helper launchd ran did not exit on the opt-out marker"; exit 1; }
          echo "  the helper launchd ran exits on the marker"
          "$BUNDLE_CHECK"

          echo "=== opt out: the marker at the legacy path -> the loaded helper must GO ==="
          # FR-46 P5a — install 1 above migrated the directory, so `/etc/roomler`
          # EXISTS and the migration (dest-absent only) will not run again. That
          # makes this block exercise the DUAL-READ fallback arm: an opt-out
          # marker sitting at the legacy path must still be honoured, because
          # reading only the current path would auto-update a Mac whose operator
          # opted out. Deliberate coverage, not an accident of ordering.
          # RETIRED-NAME-ANCHOR(2): the legacy opt-out path, seeded on purpose.
          sudo mkdir -p /etc/roomler-agent
          sudo mv /etc/roomler/disable-auto-update /etc/roomler-agent/disable-auto-update
          sudo installer -verbose -pkg dist/smoke.pkg -target /
          dump_log
          if [ -f "$plist" ]; then
            echo "::error::disable-auto-update did not remove the helper plist"
            exit 1
          fi
          # The idle job must have been booted out too (the in-flight guard
          # only defers when an update is actually running, which none is here).
          if launchctl print system/com.roomler.update >/dev/null 2>&1; then
            echo "::error::helper job still loaded after opt-out"
            exit 1
          fi
          echo "  opt-out removes the helper"
          # Back at the current path for the steps that follow.
          sudo mv /etc/roomler-agent/disable-auto-update /etc/roomler/disable-auto-update
          sudo rmdir /etc/roomler-agent

      # A rewrite that fails over a login item of the person's: the script keeps
      # the item that is there, still loads it, and says so in a WARNING
      # instead of "installed and started". The person makes their own item
      # immutable (uchg), so the person's copy over it fails.
      - name: A login item the person cannot rewrite is kept, loaded and reported
        run: |
          set -euo pipefail
          console_user=$(stat -f "%Su" /dev/console 2>/dev/null || echo "")
          if [ -z "$console_user" ] || [ "$console_user" = root ]; then
            echo "::warning::no GUI session on this runner, so there is no login item to read"
            exit 0
          fi
          # The login item it loads runs the bundle's roomlerd.
          "$BUNDLE_CHECK"
          uid=$(id -u "$console_user")
          home=$(dscl . -read /Users/"$console_user" NFSHomeDirectory | awk '{print $2}')
          item="$home/Library/LaunchAgents/com.roomler.agent.plist"
          test -f "$item" || { echo "::error::no login item at $item to start from"; exit 1; }
          sudo -u "$console_user" chflags uchg "$item"
          trap 'sudo -u "$console_user" chflags nouchg "$item" || true' EXIT
          before=$(sudo wc -l /var/log/install.log | awk '{print $1}')
          sudo installer -verbose -pkg dist/smoke.pkg -target /
          lines=$(sudo tail -n +"$((before + 1))" /var/log/install.log | grep 'postinstall:' || true)
          echo "--- this install's postinstall lines ---"
          printf '%s\n' "$lines" | sed 's/^.*postinstall: /    /'
          fail=0
          if printf '%s\n' "$lines" | grep -qF "WARNING: the account of $console_user could not rewrite the login item $item"; then
            echo "  the log carries the WARNING"
          else
            echo "::error::the log has no WARNING for the login item that could not be rewritten"
            fail=1
          fi
          # Every install in this job writes the item from this same package, so
          # the person's cmp finds the kept item equal to the package's.
          if printf '%s\n' "$lines" | grep -qF 'so the one already there stays in place'; then
            echo "  the WARNING says the item there stays in place (equal to the package's)"
          else
            echo "::error::the WARNING does not say that the item there stays in place, though it is the package's own"
            fail=1
          fi
          if printf '%s\n' "$lines" | grep -qF 'roomlerd installed and started for'; then
            echo "::error::the log says installed and started, on a login item that could not be rewritten"
            fail=1
          else
            echo "  the log does not say installed and started"
          fi
          if launchctl print "gui/$uid/com.roomler.agent" >/dev/null 2>&1; then
            echo "  com.roomler.agent is loaded in gui/$uid"
          else
            echo "::error::com.roomler.agent is not loaded in gui/$uid"
            fail=1
          fi
          exit "$fail"

      # The opt-in half of the round trip, and the job's LAST install. The
      # update half is the OPPOSITE polarity of the overlay daemon: default ON,
      # marker opts OUT. A default install must carry it, or the DEFAULT macOS
      # flavour (per-user only) can never self-update — which is the exact state
      # that left a Mac permanently stale.
      #
      # #3774: taking the marker away opens the live update channel. The helper
      # this install loads may fetch the newest published release and install it
      # over this build, so it comes after every step that reads the bundle or
      # the install log, and no step after it does. Every earlier step's
      # isolation came from the marker, not from this build's version.
      - name: Assert the update helper is installed BY DEFAULT (the job's last install)
        run: |
          set -euo pipefail
          "$BUNDLE_CHECK"
          sudo rm -f /etc/roomler/disable-auto-update /etc/roomler-agent/disable-auto-update
          sudo installer -verbose -pkg dist/smoke.pkg -target /
          test -f /Library/LaunchDaemons/com.roomler.update.plist \
            || { echo "::error::com.roomler.update.plist missing — default install has no updater"; exit 1; }
          # Loaded, not merely placed: RunAtLoad/StartInterval/WatchPaths all
          # hang off the loaded job.
          launchctl print system/com.roomler.update >/dev/null 2>&1 \
            || { echo "::error::com.roomler.update installed but not loaded"; exit 1; }
          echo "  update helper installed + loaded (default ON)"

      # The package's script keeps launchctl's error text in a variable, so no
      # command in it names a path in /tmp.
      - name: The package's script names no path in /tmp
        run: |
          set -euo pipefail
          s=agents/roomlerd/packaging/macos/postinstall
          test -f "$s" || { echo "::error::$s is missing, so there is nothing to read"; exit 1; }
          hits=$(grep -nE '(^|[^[:alnum:]_])(/private)?/tmp/' "$s" | grep -vE '^[0-9]+:[[:space:]]*#' || true)
          if [ -n "$hits" ]; then
            echo "::error::$s names a path in /tmp:"
            printf '%s\n' "$hits"
            exit 1
          fi
          echo "  no command in $s names a path in /tmp"

      # FR-6 wave 22 (#773): the job's LAST step. Only a master push
      # publishes, and an unchanged cache is not re-uploaded; see the action.
      - name: Publish the cargo cache (release-asset store)
        if: github.ref == 'refs/heads/master' && steps.seed.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/ci-seed-save
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          family: macos-pkg-smoke
          key: ${{ steps.seed.outputs.key }}
          exact: ${{ steps.seed.outputs.exact }}

# RETIRED-NAME-ANCHOR-END
