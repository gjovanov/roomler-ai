# The integration suite, actually running.
#
# `crates/tests` — 288 tests across 25 modules — ran in NO CI lane for
# months. It needs MongoDB + Redis, `ci.yml` has neither, and every module is
# `#[cfg(test)]`-gated so `--workspace` clippy compiles only `pub mod
# fixtures`. The crate stopped compiling entirely (a DAO grew three fields and
# its 8 test callers didn't) and every PR stayed green throughout. #603 added
# a `cargo check` so the crate at least BUILDS; this lane is the other half.
#
# ⚠️ The failure mode that let it rot is a lane that runs NOTHING and reports
# success — a build log printing `Checking roomler-ai-tests` was mistaken for
# coverage for months. So this workflow asserts a MINIMUM TEST COUNT: if the
# harness executes far fewer tests than the suite contains, the job fails
# loudly instead of passing quietly. A green tick here has to mean the tests
# ran.
#
# Deliberately NOT on every PR: the suite is ~40 min on the build host, and
# a job that long on every push trains people to ignore it. Master pushes
# that touch backend code, plus manual dispatch.
name: integration-tests

on:
  push:
    branches: [master]
    paths:
      - 'crates/**'
      - 'agents/roomler-agent/**'
      - '.github/workflows/integration-tests.yml'
  pull_request:
    paths:
      - 'crates/tests/**'
      - '.github/workflows/integration-tests.yml'
  workflow_dispatch:
    inputs:
      filter:
        description: 'Only run tests matching this substring (empty = whole suite)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  integration:
    name: Integration suite (MongoDB + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 75

    services:
      # MongoDB is deliberately NOT a service container — see "Start MongoDB"
      # below. Service containers accept no command arguments, and this
      # workload needs one.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      ROOMLER__DATABASE__URL: mongodb://localhost:27019
      # File storage defaults to local disk in dev/test (see
      # crates/api/src/storage.rs), so no MinIO/S3 is needed here. Leaving
      # ROOMLER__S3__* unset is what selects that backend.
      RUST_BACKTRACE: 1

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Rust cache
        continue-on-error: true
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: ci-integration
          cache-on-failure: true

      - name: Start MongoDB (capped WiredTiger cache)
        # A service container cannot take command arguments, and this one
        # needs `--wiredTigerCacheSizeGB`. The default cache is ~50 % of RAM;
        # on a 2-core/7 GB runner that competes with the test binary, and the
        # first run of this lane (32670680394) lost Mongo mid-suite —
        # 28 tests died on `Connection refused (os error 111)` with
        # `SystemOverloadedError`, while 263 around them passed. Those were
        # never 28 code failures; they were one process going away.
        #
        # Port 27019 on the host, not 27017: `TestApp` and the local
        # docker-compose both use 27019, so the tests need no override.
        run: |
          set -euo pipefail
          # --ulimit nofile is the load-bearing flag. Each test uses its OWN
          # database and WiredTiger holds files open per collection AND index
          # — 18 collections with several indexes each, across ~289 databases.
          # Docker's default nofile is nowhere near that, and mongod does not
          # degrade: run 32673736740 died on
          #   "couldn't open [/proc/1/stat] Too many open files"
          #   WiredTiger error 24 (EMFILE) -> fatal assertion 50853 -> abort
          # 64000 is MongoDB's own documented production minimum.
          docker run -d --name roomler-test-mongo -p 27019:27017 \
            --ulimit nofile=64000:64000 \
            --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'" \
            --health-interval 5s --health-timeout 5s --health-retries 20 \
            mongo:7 --wiredTigerCacheSizeGB 0.5
          for i in $(seq 1 40); do
            if docker exec roomler-test-mongo mongosh --quiet \
                 --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then
              echo "mongo ready after ${i} attempt(s)"; exit 0
            fi
            sleep 2
          done
          echo "::error::MongoDB never became ready"; docker logs roomler-test-mongo | tail -40; exit 1

      - name: Prove the ulimit actually applied
        # ⚠️ Do not assume a flag took. Two runs were "fixed" by raising
        # nofile and both still died on EMFILE, which means either the flag
        # did not apply or the ceiling is not where I thought. Print the
        # effective limit so the next failure is diagnosable from the run
        # page instead of by another guess-and-rerun cycle.
        run: |
          echo "--- mongod's effective limits ---"
          docker exec roomler-test-mongo sh -c 'grep -i "open files" /proc/1/limits' || true
          docker exec roomler-test-mongo sh -c 'ulimit -n' || true

      - name: Build the test binary
        # Separate from the run so a compile failure reads as a compile
        # failure, not as "0 tests passed".
        run: cargo test -p roomler-ai-tests --no-run

      - name: Run the suite
        id: run
        env:
          FILTER: ${{ github.event.inputs.filter }}
        run: |
          set -o pipefail
          # 2 threads, not 4: every test creates and drops its OWN database,
          # so concurrency here is concurrent DB churn against one Mongo on a
          # 2-core runner — which is what took it down on the first run.
          #
          # The two skips were MEASURED here (run 32671814889: 289 passed,
          # these 2 failed), not inherited from the build host — porting that
          # box's list across would have been the same environment-assumption
          # this lane exists to catch. Each needs a reason and a way out:
          #
          #   conference … call_leave_cleans_up_participant_media
          #     Wants a live mediasoup worker; the runner has none, so it gets
          #     `media:error` where `media:router_capabilities` is expected.
          #     Un-skip if the worker is ever provisioned in CI.
          #
          #   rate_limit … rate_limit_returns_429_after_burst
          #     Timing-sensitive against tower_governor's per-second refill.
          #     ⚠️ Skipping a timing test hides real rate-limit regressions —
          #     prefer making it deterministic (inject the clock) over leaving
          #     it skipped forever. Tracked, not resolved.
          #
          # ⚠️ Adding a third skip should feel expensive. If this list grows,
          # the lane is drifting back toward the unfalsifiable state it
          # replaced.
          cargo test -p roomler-ai-tests ${FILTER:+"$FILTER"} -- --test-threads=2 \
            --skip conference_tests::call_leave_cleans_up_participant_media \
            --skip rate_limit_tests::rate_limit_returns_429_after_burst \
            2>&1 | tee /tmp/itest.log

      - name: Assert the suite actually ran
        # ⚠️ THE POINT OF THIS STEP. A test lane that silently executes
        # nothing is indistinguishable from a passing one, and that is
        # precisely how this crate rotted. `cargo test` happily reports
        # success for a filter that matches no test, so success alone is
        # not evidence.
        #
        # The floor is deliberately well under the real count (288 as of
        # 2026-08-23) so ordinary churn does not trip it, while a harness
        # that runs a handful — or none — fails loudly. Raise it when the
        # suite grows; if you find yourself LOWERING it, that is the signal
        # to stop and ask what stopped running.
        if: ${{ github.event.inputs.filter == '' }}
        run: |
          set -euo pipefail
          total=$(grep -oE '^test result: .*[0-9]+ passed' /tmp/itest.log \
                  | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+' \
                  | awk '{s+=$1} END {print s+0}')
          echo "tests reported passed: $total"
          MIN=200
          if [ "$total" -lt "$MIN" ]; then
            echo "::error::only $total tests ran (floor $MIN). A green run that executes nothing is the failure this lane exists to prevent — find out what stopped running before touching this number."
            exit 1
          fi

      - name: How many databases leaked?
        # The suspected root cause: `impl Drop for TestApp` cleans up with a
        # detached `tokio::spawn`, and a `#[tokio::test]`'s runtime shuts down
        # as the test returns — so that task overwhelmingly never runs and the
        # per-test databases are never dropped. WiredTiger then holds every
        # collection and index file of ~289 databases open until EMFILE.
        # (Same shape as #602: a dropped JoinHandle detaches.)
        #
        # A count near the test count confirms it; a count near zero refutes
        # it and sends the next person somewhere else.
        if: always()
        run: |
          docker exec roomler-test-mongo mongosh --quiet --eval '
            const dbs = db.adminCommand({listDatabases:1, nameOnly:true}).databases
              .filter(d => d.name.startsWith("roomler_ai_test_"));
            print("leaked test databases: " + dbs.length);
          ' || echo "(mongo is gone — see the post-mortem below)"

      - name: Did MongoDB survive?
        # Ask FIRST on a failure. A dead or restarted Mongo turns one
        # environmental fault into dozens of unrelated-looking test failures,
        # and reading those as code bugs is a long detour — it is exactly what
        # the first run of this lane looked like.
        if: failure()
        run: |
          echo "--- container state ---"
          docker inspect -f 'Status={{.State.Status}} OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}} Restarts={{.RestartCount}}' \
            roomler-test-mongo || true
          echo "--- mongod fatal/error lines (the CAUSE) ---"
          # ⚠️ Grep for severity first. A plain `--tail` catches only the
          # BACKTRACE frames mongod prints on its way out — which says it died
          # but not why. That happened on run 32672829603: 59 `Frame` lines and
          # no assertion, because the fatal message had already scrolled past.
          docker logs roomler-test-mongo 2>&1 | grep -E '"s":"[FE]"' | tail -20 || true
          echo "--- last 120 lines ---"
          docker logs --tail 120 roomler-test-mongo 2>&1 || true

      - name: Upload the log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-log
          path: /tmp/itest.log
          retention-days: 7
