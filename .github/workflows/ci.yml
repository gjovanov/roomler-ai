name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  rust:
    name: Rust checks
    # FR-69 P5b — 30 minutes, not 20: the job builds clippy for the whole
    # workspace plus the unit tests of five audited crates, and since the
    # module crates arrived (P2–P5a) a COLD-cache run — every rerun is one,
    # a cancelled attempt saves no cache — takes ~20 min 18 s on the 2-core
    # runner. The P5b rerun was cancelled by this ceiling at 20:18 with
    # every step green; warm runs finish in ~10.
    #
    # ⚠️ Why this ceiling keeps rising, and why re-running never fixes it: the
    # Rust cache key below is `hashFiles(ci.yml)`, so ANY edit to this file
    # rotates it and guarantees the very next run is cold — and a cancelled
    # attempt saves no cache, so the retry is cold again. A PR that touches CI
    # therefore pays the cold time twice over and cannot converge by retrying.
    # Measured on 2026-09-04 under the then-30-minute ceiling: cancelled at
    # 31 min 29 s in `Test tunnel-core --features overlay-l3,overlay-netstack`
    # with every prior step green.
    timeout-minutes: 50
    runs-on: ubuntu-latest
    # Warm baseline is 4-5 min; the only step that can blow past it is an
    # Ubuntu-mirror stall inside apt (2026-08-18 evening: 14/19/20/29-min
    # runs, run 32191779671's apt step alone took 25m47s). The apt-package
    # caches below take the mirror out of the hot path; this timeout turns
    # any residual pathological stall into a fast, loud, retryable failure
    # instead of a silent half-hour merge blocker.
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        # Pinned to the version in rust-toolchain.toml so local dev
        # and CI reject the same lints. Bump both in one commit
        # when upgrading.
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Rust cache
        # Swatinem prunes workspace-member artifacts + stale registry
        # entries before saving — ~1–1.5 GB instead of the ~4 GB
        # actions/cache tars (full ~/.cargo + target) this step used to
        # write per Cargo.lock hash. Two of those were standing at once,
        # blowing the repo's 10 GB Actions-cache budget and LRU-evicting
        # the release lane's caches (agent-v0.3.0-rc.176 rebuilt FFmpeg
        # from source for 29 min because of it).
        continue-on-error: true
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: ci-linux
          cache-on-failure: true
          # Rotate the cache key whenever THIS WORKFLOW changes. Without
          # this, a step that adds compile surface without touching
          # Cargo.lock (2026-08-21: `Run API unit tests` pulled the whole
          # api/services dep universe into the test profile) computes the
          # SAME key as the pre-step cache — Swatinem's exact-hit restore
          # then skip-saves every run, the new artifacts can never enter
          # the immutable cache, and every run re-pays the compile
          # (~7 min/run, runs 32509253726/32509577955/32512705127).
          # A ci.yml edit → new key → one cold save → warm thereafter.
          # (The release lane needs no equivalent: every release bumps the
          # workspace version, so its lockfile-keyed generations rotate
          # naturally within one cycle.)
          key: wf-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Check formatting
        run: cargo fmt --check --all

      # The companion's icons shipped as 1x1 PLACEHOLDERS for its whole life.
      # Windows tolerated them; macOS aborts the process before the app starts —
      # `tao`'s tray setup panics on "dimensions don't match the number of
      # pixels supplied", inside a callback that cannot unwind. So the one
      # platform where the companion is the only thing telling you a permission
      # is missing was the one platform it could not run on.
      #
      # Cheap, and it fails on the commit that reintroduces a stub rather than
      # on someone's Mac. Regenerate with scripts/gen-tray-icons.py.
      - name: Assert the companion's icons are real
        run: |
          python3 - <<'PY'
          import sys, struct, pathlib
          icons = pathlib.Path("agents/roomler-desktop/icons")
          bad = []
          for name in ("tray.png", "icon.png"):
              p = icons / name
              raw = p.read_bytes()
              if raw[:8] != b"\x89PNG\r\n\x1a\n":
                  bad.append(f"{name}: not a PNG"); continue
              # IHDR is always the first chunk: width/height at bytes 16..24.
              w, h = struct.unpack(">II", raw[16:24])
              if min(w, h) < 16:
                  bad.append(f"{name}: {w}x{h} — a placeholder, not an icon")
          if bad:
              print("::error::" + "; ".join(bad))
              print("regenerate with: python3 scripts/gen-tray-icons.py")
              sys.exit(1)
          print("  companion icons OK")
          PY

      # P5 (invariant I5) — the vendored webrtc-ice must equal pristine
      # upstream + the ONE canonical patch. An edit to the fork without a
      # matching `--regen` of the patch fails here, so third-party debt
      # stays auditable instead of silently re-accreting.
      - name: Vendored webrtc-ice drift check
        run: bash scripts/revendor-webrtc-ice.sh --check

      # Same invariant for the wintun-bindings fork (windows-target-only
      # crate — Linux CI never compiles it, but the content gate runs here).
      - name: Vendored wintun-bindings drift check
        run: bash scripts/revendor-wintun-bindings.sh --check

      # Same invariant for the scrap fork (the macOS IOSurface row-pitch
      # accessor). The patched arms compile only on a Mac, so this content
      # gate is the part that can run here.
      - name: Vendored scrap drift check
        run: bash scripts/revendor-scrap.sh --check

      # Same invariant for the webrtc-sctp fork (the FORWARD-TSN bundled-
      # chunk parse fix; see crates/vendored/webrtc-sctp/Cargo.toml).
      - name: Vendored webrtc-sctp drift check
        run: bash scripts/revendor-webrtc-sctp.sh --check

      # Belt for the cold path of the cached-apt steps below: apt retries
      # transient mirror failures instead of stalling into the job timeout.
      - name: Configure apt retries
        run: echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/80-ci-retries

      # rc.18 added a Tauri-tray companion (agents/roomler-tray) that
      # pulls in glib-sys / gobject-sys on Linux. Workspace clippy walks
      # every crate, so the build needs libglib2.0-dev + libgtk-3-dev
      # available even before the vp9-444 / scrap apt step further down.
      # Cached via cache-apt-pkgs-action: on a cache hit the packages
      # restore from the Actions cache in seconds with ZERO mirror
      # contact — the 2026-08-18 mirror-stall class (25m47s for this one
      # step, run 32191779671) can only ever bite the first run after
      # the package list or runner image changes.
      - name: Install system deps for workspace clippy (cached apt)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libglib2.0-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev pkg-config
          version: ci-gtk-v1

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

      # FR-27 — the native X11 consent panel. Off by default, so the workspace
      # clippy above never sees it; without this step it would compile in NO
      # lane until a release tag, which is exactly the "invisible until
      # <platform> builds it" class the macOS job exists for.
      - name: Run clippy on the X11 consent panel
        run: cargo clippy -p roomlerd --lib --features viewer-indicator-x11 -- -D warnings

      # The step above is deliberately NOT `--all-targets`, so it never
      # compiles `#[cfg(test)]` bodies — the same blind spot the API-unit-test
      # and integration-type-check steps below exist to cover, but for LINTS
      # rather than compilation. It hid two real things at once: two
      # `items after a test module` errors, and a security control that was
      # dead code (the exec/SSH per-caller rate limit — its constants had no
      # readers and its deny reason was constructed only in tests, which
      # `--all-targets` would have surfaced as unused).
      #
      # Scoped to the audited crates rather than `--workspace`: these are
      # verified green, while the wider workspace has not been audited under
      # `--all-targets` and must not be flipped blind. Widen it per crate as
      # each is checked.
      #
      # `roomler-ai-tests` joined the list in #894. It is the crate that most
      # needed it: virtually all of it is `#[cfg(test)]`, so the `--workspace`
      # step above compiles almost NONE of it, and 24 lints had accumulated
      # unread — 9 when the issue was filed on 2026-08-29, 24 by the time it was
      # fixed, which is the accrual rate of a guard nobody runs.
      #
      # This is the same crate whose history is "it rotted because nothing ran
      # it" (#646). Lints are the cheap half of that guard, and they were off for
      # exactly the crate with the worst record. It also catches a specific
      # mistake nothing else does: a `mod x_tests;` added to `lib.rs` WITHOUT its
      # `#[cfg(test)]` gate compiles the module's helpers into the lib target as
      # dead code, which only `--all-targets` surfaces.
      - name: Run clippy on the audited crates (incl. test targets)
        run: cargo clippy -p roomler-ai-api -p roomler-ai-services -p roomler-ai-tests -p roomler-core --all-targets -- -D warnings

      # `crates/api` unit tests ran in NO lane until now: the clippy step above
      # is `--workspace` WITHOUT `--all-targets`, so it does not even compile
      # `#[cfg(test)]` code, and the `cargo test` steps further down name
      # `roomlerd` / `roomler-ai-tunnel-core` explicitly. Every policy test
      # under `routes/` — who may open a session, what a refusal records — was
      # therefore decorative: a green PR did not mean they had run.
      #
      # `--lib` only: the integration suite in `crates/tests` needs MongoDB and
      # Redis and belongs to a different lane. These are pure in-crate unit
      # tests and need no services.
      - name: Run API unit tests
        run: cargo test -p roomler-ai-api --lib

      # FR-69 — `roomler-core` carries the module contract's own guards (the
      # DAG stays acyclic, the hook order covers every module, the axum Debug
      # parser behind the composition baseline still reads a real router) and,
      # since P1b, the cluster/storage/analytics primitives that moved out of
      # the api crate with their unit tests. Named explicitly for the same
      # reason the api step above is: `--workspace` clippy compiles none of
      # their `#[cfg(test)]` bodies, and a test no lane runs is decorative.
      - name: Run core unit tests
        run: cargo test -p roomler-core --lib

      # FR-69 P5a — the Hub's unit tests (consent, the session state machine,
      # nudges) moved with it into the fleet module.
      - name: Run fleet module unit tests
        run: cargo test -p roomler-ai-mod-fleet --lib

      # The integration crate cannot RUN here (it needs MongoDB + Redis), but
      # it can still be compiled — and compiling it is what was missing. It sat
      # broken for an unknown stretch because `OverlayNodeDao::create` grew
      # three fields and its 8 test callers didn't: `--workspace` clippy skips
      # `#[cfg(test)]` bodies, and no step named this crate, so all 288
      # integration tests were unrunnable while every PR went green.
      #
      # A type-check needs no services and catches that whole class on the
      # commit that introduces it. It does NOT tell you the tests pass — only
      # that they still build. Running them remains a separate lane.
      - name: Type-check the integration test crate
        run: cargo check -p roomler-ai-tests --all-targets

      # Phase Y feature gate. The `vp9-444` feature compiles libvpx
      # via `env-libvpx-sys` (needs pkg-config + libvpx system lib),
      # plus `dcv-color-primitives`. Default workspace clippy never
      # exercises this path because the feature is opt-in. Catch
      # breakage here so the standard release lane (which is still
      # `--features full`, no vp9-444 yet) doesn't ship a regression
      # latent under the feature flag — and so the `bun run e2e`
      # VP9-444 spec doesn't drift away from the agent it's testing.
      - name: Install libvpx (cached apt)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          # libasound2-dev is for the `audio` half of `full` in the capture
          # clippy lane below — without it alsa-sys fails its build script and
          # the lane dies before linting anything. Bump `version:` whenever
          # this list changes, or the action serves the previously cached set.
          packages: libvpx-dev pkg-config libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev cmake libclang-dev libasound2-dev
          version: ci-vpx-v2
      # 2026-09-04: the cache action restored NOTHING (its own manifest was
      # missing: `cat: …/cache-apt-pkgs/manifest_all.log: No such file`) and
      # did not fail the job — the vp9-444 test binary then died at LOAD with
      # `libvpx.so.9: cannot open shared object file` (exit 127) on master
      # and on every PR of that hour. The action's silence is the hazard, so
      # the lane verifies the runtime lib is really there and installs the
      # set directly when it is not. The check is the loader's own view
      # (`ldconfig -p`), not the action's status.
      - name: Verify libvpx really landed (fallback to apt-get)
        run: |
          if ! ldconfig -p | grep -q 'libvpx\.so'; then
            echo "::warning::cached apt set did not deliver libvpx — installing directly"
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends libvpx-dev pkg-config libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev cmake libclang-dev libasound2-dev
          fi
          ldconfig -p | grep 'libvpx\.so' || { echo "::error::libvpx.so still not loadable after the fallback install"; exit 1; }

      # Pair `vp9-444` with `vp9-444-bindgen` on Linux so env-libvpx-sys
      # regenerates its FFI bindings via bindgen against the installed
      # libvpx headers. The apt package on Ubuntu 24.04 (the GH-hosted
      # runner image since 2026-04) ships libvpx 1.14+, but env-libvpx-sys
      # 5.1.3's pre-generated bindings cap at 1.13.0. Without the
      # bindgen feature the build script panics with "Expected file
      # generated/vpx-ffi-1.14.0.rs not found but 'generate' cargo
      # feature not used." `libclang-dev` (installed above) is the
      # bindgen runtime requirement.
      # The capture path is linted by NO other lane. `--workspace` clippy
      # compiles roomlerd with DEFAULT features, and its default is `[]`, so
      # `capture/scrap_backend.rs` — the screen-capture backend on every OS —
      # is never even compiled there. The two agent feature lanes miss it too:
      # `vp9-444` does not enable `scrap-capture`, and `cargo check` does not
      # fail on warnings anyway. Same trap this file already documents for
      # `clipboard` and `ssh-server`, and it had already sprung: an
      # `unused_mut` in scrap_backend.rs survived indefinitely, and FR-29's
      # `capture/x11_damage.rs` landed with no lint coverage at all.
      #
      # `dead_code` is allowed deliberately. This feature set legitimately
      # leaves the ffmpeg-encoder paths unconstructed (`RatePlan`, `FfmpegDc`,
      # …), and enabling `ffmpeg-encoder` here would need the vendored FFmpeg
      # tree — a large cost to silence findings that are not defects. Every
      # other class still bites.
      - name: Clippy agent --features full (the capture + encode + input path)
        run: cargo clippy -p roomlerd --features full,vp9-444,vp9-444-bindgen,clipboard,ssh-server --all-targets -- -D warnings -A dead_code

      - name: Check agent --features vp9-444
        run: cargo check -p roomlerd --features vp9-444,vp9-444-bindgen

      - name: Test agent under vp9-444
        # Runs the full `--features vp9-444` lib test suite:
        #   - 3 video_bytes wire-format tests (byte layout lock
        #     against the worker parser)
        #   - libvpx encoder tests: first-frame-keyframe lock +
        #     odd-dim rejection. These exercise the
        #     env-libvpx-sys-direct rewrite (Y.runtime-encoder,
        #     0.1.47) — vpx_codec_enc_init_ver with g_profile=1,
        #     g_lag_in_frames=0, VPX_IMG_FMT_I444. Without the
        #     rewrite the keyframe test would fail because
        #     `vpx-encode 0.6` hardcoded I420 + buffered the first
        #     ~25 frames behind a non-zero default g_lag_in_frames.
        #   - caps probe assertions: detect_advertises_vp9_444_*
        #     locks the rc:agent.hello advertisement contract.
        #   - clipboard-v2 tests (parse locks, CRLF canonicalization,
        #     PNG codec, ImageRx, FNV vectors): `clipboard` was never
        #     in any CI feature lane before v2 — the module is
        #     `#![cfg(feature = "clipboard")]`, so without it here the
        #     whole suite silently never ran. arboard/png are pure
        #     Rust on Linux (X11 headers already installed above).
        #   - roomler SSH (`ssh-server`, which implies `overlay-netstack`):
        #     same trap the clipboard note above describes, and it had already
        #     sprung — `agents/roomlerd/src/ssh.rs`'s suite (host key,
        #     auth accept/deny, grant redemption, single-use, expiry) is
        #     `#[cfg(feature = "ssh-server")]` and was in NO CI lane, so none
        #     of it ran here. It also puts the Unix half of the privilege drop
        #     under test on a real Linux host, which a Windows dev box cannot
        #     exercise at all. russh is pure Rust; the cost is compile time.
        run: cargo test -p roomlerd --features vp9-444,vp9-444-bindgen,clipboard,ssh-server --lib

      # Overlay L3 (Phase 3) feature gate. `overlay-l3` pulls the `tun`
      # crate (Wintun on Windows / /dev/net/tun on Linux) + the TUN↔WG
      # bridge; the default `--workspace` clippy never compiles it
      # (opt-in), so lint + test it explicitly here — mirrors the
      # vp9-444 gate, catching an L3-path regression before it ships
      # under the flag.
      - name: Clippy tunnel-core --features overlay-l3,overlay-netstack
        # BOTH overlay features, because the release build ships both
        # (`release-agent.yml`: `overlay-l3,overlay-netstack`) and neither the
        # default `--workspace` clippy nor an `overlay-l3`-only lane compiles
        # `overlay::netstack*`. That gap hid a broken TEST helper in
        # netstack_socks.rs for two weeks: #111 added two `PeerInfo` fields
        # without updating a literal that only exists under `overlay-netstack`,
        # and no lane ever compiled it. `--all-targets` covers test code, which
        # is exactly where that class of break lands.
        run: cargo clippy -p roomler-ai-tunnel-core --features overlay-l3,overlay-netstack --all-targets -- -D warnings

      - name: Test tunnel-core --features overlay-l3,overlay-netstack
        # WG handshake (direct + RelayConn) + the TUN↔WG bridge loopback
        # test — all in-process over 127.0.0.1, no real device.
        # `--test-threads=1`: several tests each stand up a full loopback
        # WebRTC/QUIC peer PAIR (ICE + SCTP 8-DC pool). Run in parallel on a
        # 2-core CI runner they starve each other and intermittently blow the
        # pool-open timeout (`Elapsed`) — flaky on master + PRs alike. Serial
        # execution keeps at most one peer-pair up at a time; the tests are
        # individually fast (<1s), so the whole step stays well under a minute.
        run: cargo test -p roomler-ai-tunnel-core --features overlay-l3,overlay-netstack --lib -- --test-threads=1

      - name: Clippy roomlerd --features overlay-l3
        # Phase 3b: the agent's overlay glue (overlay.rs + the main /
        # signaling hooks) only compiles under the opt-in feature, so the
        # default --workspace clippy never sees it. Lint it explicitly.
        run: cargo clippy -p roomlerd --features overlay-l3 -- -D warnings

      - name: Multi-org shared TUN against real kernel networking
        # The mux's bookkeeping is unit-tested against a fake device; the half
        # that touches the OS — a REFUSED registration leaving no address
        # behind, a disjoint block really getting one, a released org really
        # losing it — was never run against a kernel, because reproducing it
        # in the field needs a third organization and there is no way to
        # retire a throwaway one (docs/multi-org.md §12). A `tun` device is
        # free here, so it runs on every push instead.
        #
        # Needs CAP_NET_ADMIN, hence sudo + the env opt-in (the test skips
        # itself silently everywhere else, including developer machines).
        # Built as the normal user and only RUN under sudo, so root never
        # takes ownership of the shared cargo cache.
        run: |
          sudo modprobe tun || true
          # Build FIRST with human diagnostics. The json pass below would
          # otherwise swallow a compile error into records jq drops, leaving
          # only an empty $BIN and "sudo: : command not found".
          cargo test -p roomlerd --features overlay-l3 --lib --no-run
          BIN=$(cargo test -p roomlerd --features overlay-l3 --lib \
                  --no-run --message-format=json \
                | jq -r 'select(.profile.test == true) | .executable' | head -1)
          echo "test binary: $BIN"
          sudo ROOMLER_TUN_KERNEL_TEST=1 "$BIN" tun_kernel_tests \
            --test-threads=1 --nocapture

  macos-overlay-check:
    # The agent's macOS build exists ONLY in release-agent.yml, so a
    # macOS-only compile error is invisible until an `agent-v*` tag is
    # already pushed — where it fails the whole release after the Windows
    # and Linux artifacts have built. rc.297 burned exactly that way:
    # #295 added a `#[cfg(not(any(linux, windows)))]` fallback for
    # `purge_one` but not for `enumerate_if_routes`, and nothing compiled
    # the macOS arm until the tag ran.
    #
    # A cheap `cargo check` on the overlay features closes it. Check only,
    # not a full build — the goal is "does the cfg tree compile on this
    # target", which is the entire class of break this catches.
    name: macOS overlay compile check
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-overlay-check
      - name: cargo check tunnel-core (overlay-l3 + overlay-netstack)
        run: cargo check -p roomler-ai-tunnel-core --features overlay-l3,overlay-netstack

      # This job checked tunnel-core ONLY, so `roomlerd`'s `cfg(unix)` code
      # was never compiled for macOS anywhere except a release-tag build — and
      # that has now broken a release three times, always the same way: a libc
      # declaration that differs between Linux and macOS.
      #
      #   `vec![0i8]`               — c_char is u8 on aarch64
      #   `setgroups(len)`          — macOS takes c_int
      #   `openpty(.., *const ..)`  — macOS declares termp/winp as *mut  ← rc.422
      #
      # Every one of those passed x86_64-linux and Windows and was invisible
      # until tag time. `ssh-server` because that is where the raw libc lives
      # (`src/pty.rs`, `exec.rs`'s privilege drop); check-only, so it costs a
      # compile and not a link.
      - name: cargo check agent (ssh-server — the raw-libc surface)
        run: cargo check -p roomlerd --lib --features ssh-server

      # The capture path is the OTHER macOS-only surface, and until rc.454 it
      # compiled nowhere but a release tag either. It now calls
      # `Frame::bytes_per_row()` from the vendored scrap fork behind
      # `#[cfg(target_os = "macos")]` — a cfg arm that exists on exactly this
      # target. `scrap-capture` also pulls in the quartz backend itself, so
      # this is the only lane that type-checks the fork at all.
      - name: cargo check agent (scrap-capture — the macOS capture surface)
        run: cargo check -p roomlerd --lib --features scrap-capture

      # FR-27 — the native AppKit consent panel. `--bins` as well as `--lib`,
      # and that is the whole point: this feature ALSO changes `main.rs`, which
      # is a separate crate root, to move tokio off the main thread so AppKit
      # can pump. A `--lib` check would compile the panel and miss the swap
      # entirely — the exact escape rc.454 hit, one feature over.
      - name: cargo check agent (viewer-indicator-macos — the AppKit panel + the main-thread swap)
        run: cargo check -p roomlerd --lib --bins --features viewer-indicator-macos

      # `--bins`, because `--lib` alone was not enough. main.rs is a SEPARATE
      # crate root: a `#[cfg(target_os = "macos")]` block there referring to a
      # lib module needs `roomlerd::`, and a bare path compiles nowhere —
      # but nothing on this lane ever built the binary, so rc.454's startup
      # permission preflight passed every check and then failed on master.
      # Same "invisible until a Mac compiles it" class this whole job exists
      # for, one crate root over.
      - name: cargo check agent BINARY (macOS cfg arms in main.rs)
        run: cargo check -p roomlerd --bins --features scrap-capture

      # The desktop companion ships on macOS from rc.455 and owns the
      # permissions panel — the one surface that tells an operator why their
      # remote screen is blank. Its macOS arms (the TCC probes, `open` for the
      # Settings pane) exist on exactly this target.
      - name: cargo check the desktop companion
        run: cargo check -p roomler-desktop

      - name: Lint the macOS packaging
        # A malformed plist or postinstall only fails at INSTALL time, on
        # someone's Mac, with launchctl's famously unhelpful diagnostics.
        # Both checks are free here.
        run: |
          set -euo pipefail
          for p in agents/roomlerd/packaging/macos/*.plist; do
            plutil -lint "$p"
          done
          bash -n agents/roomlerd/packaging/macos/postinstall
          # The daemon plist must point at a path the .pkg actually creates,
          # and must NOT reuse the LaunchAgent's Label — launchctl would
          # refuse the second bootstrap and the failure reads as "already
          # loaded" rather than "you shipped one label twice".
          # Every launchd job this package installs must have a DISTINCT Label:
          # launchctl refuses the second bootstrap of a duplicate and the error
          # reads "already loaded" rather than "you shipped one label twice".
          #
          # Globbed on `com.roomler.*` — the launchd jobs — rather than every
          # .plist in the directory, which also holds entitlements.plist (a
          # codesign input with no Label at all).
          labels=$(for p in agents/roomlerd/packaging/macos/com.roomler.*.plist; do
                     plutil -extract Label raw "$p" \
                       || { echo "::error::$p has no Label"; exit 1; }
                   done)
          echo "$labels" | sed 's/^/  label: /'
          # agent + daemon + desktop. A lower count means a job stopped being
          # globbed, which would silently make the duplicate check vacuous.
          count=$(echo "$labels" | grep -c .)
          [ "$count" -ge 3 ] || { echo "::error::expected >=3 launchd jobs, found $count"; exit 1; }
          dupes=$(echo "$labels" | sort | uniq -d)
          [ -z "$dupes" ] || { echo "::error::duplicate launchd Label(s): $dupes"; exit 1; }
          # FR-46 P5b — the daemon plist must point INSIDE the bundle, at the
          # renamed executable. This assert is why a half-done rename cannot ship:
          # a plist still naming the old path installs fine and the daemon simply
          # never starts, which reads as "the overlay is down", not as a typo.
          grep -q '/Library/Roomler/roomlerd.app/Contents/MacOS/roomlerd' \
            agents/roomlerd/packaging/macos/com.roomler.daemon.plist

      - name: macOS overlay against a real utun
        # The macOS arms of add_address_sync / add_peer_route /
        # add_cidr_route / assign_derived_v6 were no-ops until now, so none
        # of them had ever run anywhere. Compiling them is not evidence —
        # a hardcoded interface name compiles fine and addresses an
        # interface that does not exist, which is precisely what was wrong.
        #
        # This runner has sudo and utun, so the code gets exercised instead
        # of trusted. Built as the normal user and only RUN under sudo, so
        # root never takes ownership of the cargo cache.
        run: |
          BIN=$(cargo test -p roomler-ai-tunnel-core --features overlay-l3 --lib \
                  --no-run --message-format=json \
                | jq -r 'select(.profile.test == true) | .executable' | head -1)
          echo "test binary: $BIN"
          sudo ROOMLER_TUN_KERNEL_TEST=1 "$BIN" macos_kernel_tests \
            --test-threads=1 --nocapture

  windows-overlay-clippy:
    # Windows-only code was entirely UN-LINTED: the Rust job runs on
    # ubuntu-latest, so its `-D warnings` never compiles the 66
    # `#[cfg(windows)]` sites in overlay/ (wfp.rs alone is 456 LOC), the
    # win_service supervisor, or the Windows halves of tun.rs/dns.rs/nat.rs.
    # A dead-code warning shipped in rc.359 sat invisible for 5 rc's
    # because only local Windows builds ever saw it (2026-08-14 audit).
    #
    # Crate-scoped on purpose — a workspace-wide `--all-features` clippy
    # does NOT build on Windows (audiopus pulls cmake); these two lanes
    # mirror the Linux feature lanes and the local dev gates exactly.
    # `--all-targets`/`--tests` included: test-only code is where the
    # first fix wave's lints lived (constant asserts, guard-across-await).
    name: Windows overlay clippy
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          shared-key: ci-windows-clippy
          cache-on-failure: true
      - name: Clippy tunnel-core (overlay-l3 + overlay-netstack, all targets)
        run: cargo clippy -p roomler-ai-tunnel-core --features overlay-l3,overlay-netstack --all-targets -- -D warnings
      # `ssh-server` is in the set because this is the ONLY lane that lints the
      # Windows ConPTY implementation — it is `#[cfg(windows)]` AND behind that
      # feature, so every Linux lane compiles straight past it. It ships in all
      # four release feature sets, so without this a lint failure there would
      # surface at TAG time, on the slowest possible feedback loop. `overlay-l3`
      # stays in the same invocation deliberately: it is what makes tunnel-core's
      # helpers reachable, and dropping it turns pre-existing dead-code warnings
      # into errors that have nothing to do with the change under test.
      - name: Clippy roomlerd (overlay-l3 + ssh-server, incl. tests)
        run: cargo clippy -p roomlerd --features overlay-l3,ssh-server --tests -- -D warnings

  ffmpeg-encoder-check:
    # `ffmpeg-encoder` compiled in NO pull-request lane. It needs a vendored
    # FFmpeg 9.0.1 (Ubuntu apt ships 6.1 and `ffmpeg-next = 9.0` needs 9.x),
    # so the only place it has ever been built is release-agent.yml — at TAG
    # time, on the slowest feedback loop there is.
    #
    # That is the exact shape as the macOS job above, which exists because
    # tag-time-only compilation broke three releases in a row. This one guards
    # the main video pump's hardware-encoder backend, so the same accident
    # here fails a release after every other artifact has already built.
    #
    # A SEPARATE job rather than a step in `rust`, deliberately: that job has a
    # 20-minute timeout against a 4-5 minute warm baseline, and the timeout is
    # load-bearing (it turns an apt-mirror stall into a fast, loud failure).
    # Bolting a from-source FFmpeg-linked compile onto it would spend that
    # headroom and make the timeout meaningless.
    name: ffmpeg-encoder compile + dispatch locks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          shared-key: ci-ffmpeg-encoder
          cache-on-failure: true
      - name: Install build deps (cached apt)
        # libclang is bindgen's runtime requirement (ffmpeg-sys-next and
        # env-libvpx-sys both generate FFI at build time); pkg-config is how the
        # vendored FFmpeg tree is found; libvpx-dev is needed because this lane
        # lints WITH `vp9-444` — see the clippy step for why that matters.
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: pkg-config libclang-dev libvpx-dev
          version: ci-ffmpeg-v2
      # Same self-heal as the vp9-444 lane (2026-09-04: a silent empty cache
      # restore left `libvpx.so.9` missing at test-binary load, exit 127).
      - name: Verify libvpx really landed (fallback to apt-get)
        run: |
          if ! ldconfig -p | grep -q 'libvpx\.so'; then
            echo "::warning::cached apt set did not deliver libvpx — installing directly"
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends pkg-config libclang-dev libvpx-dev
          fi
          ldconfig -p | grep 'libvpx\.so' || { echo "::error::libvpx.so still not loadable after the fallback install"; exit 1; }
      - name: Fetch vendored FFmpeg 9.0.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The SAME artifact release-agent.yml consumes, so this lane and the
          # tag build cannot disagree about what "the FFmpeg backend" compiles
          # against. Minimal build: exactly the ten encoders the cascade
          # dispatches, whole lib dir ~2.5 MB.
          gh release download vendored-ffmpeg-9.0.1 \
            --repo "${{ github.repository }}" \
            --pattern 'ffmpeg-9.0.1-linux64-lgpl-shared-minimal-vaapi.tar.xz' \
            --dir /tmp/ffdl
          sudo mkdir -p /opt/roomler-ffmpeg
          sudo tar xf /tmp/ffdl/ffmpeg-9.0.1-linux64-lgpl-shared-minimal-vaapi.tar.xz \
            -C /opt/roomler-ffmpeg --strip-components=1
          # The .pc files hardcode the vendor machine's prefix.
          sudo sed -i "s|^prefix=.*|prefix=/opt/roomler-ffmpeg|" \
            /opt/roomler-ffmpeg/lib/pkgconfig/*.pc
          {
            echo "FFMPEG_DIR=/opt/roomler-ffmpeg"
            echo "PKG_CONFIG_PATH=/opt/roomler-ffmpeg/lib/pkgconfig"
            echo "LD_LIBRARY_PATH=/opt/roomler-ffmpeg/lib"
          } >> "$GITHUB_ENV"
      - name: Prove pkg-config resolved the VENDORED tree
        # ⚠️ Without this, a silent fall-through to some system FFmpeg would
        # make the lane pass against a library the release never ships — a
        # green tick that proves nothing, which is the failure mode this
        # whole class of gate exists to avoid. Assert the prefix, not the
        # version: the prefix is the property that distinguishes the two.
        run: |
          set -euo pipefail
          prefix=$(pkg-config --variable=prefix libavcodec)
          echo "libavcodec $(pkg-config --modversion libavcodec) from $prefix"
          if [ "$prefix" != "/opt/roomler-ffmpeg" ]; then
            echo "::error::pkg-config resolved libavcodec to '$prefix', not the vendored tree — this lane would be testing the wrong library"
            exit 1
          fi
      - name: Clippy agent --features ffmpeg-encoder + vp9-444 (incl. tests)
        # This code was UNLINTED. `--workspace` clippy never compiles it (the
        # feature is opt-in), and #672 added compile+test here but left lint out
        # because the feature "had pre-existing warnings" — which is circular:
        # it stayed unlinted BECAUSE it was unlinted. Opt-in features are
        # exactly where lints accumulate unseen; same argument as the Windows
        # overlay lane above, where a dead-code warning sat invisible 5 rc's.
        #
        # ⚠️ `vp9-444` is in the set ON PURPOSE, and dropping it makes this lane
        # LIE. Four of the "pre-existing warnings" were `dead_code` on
        # `on_encoder_rebuilt_mirror_only`, `PipelineKey::Vp9Dc`,
        # `quality_state` and `min_quality` — all of which ARE used, from call
        # sites inside `#[cfg(feature = "vp9-444")]` functions in peer.rs. Lint
        # a feature set no one ships and you get findings that are artifacts of
        # the configuration; "fixing" them by deleting would have broken every
        # real build. Keep this set a subset of what release-agent.yml builds.
        #
        # `--all-targets` so test-only lints fire, matching the repo rule.
        run: cargo clippy -p roomlerd --features ffmpeg-encoder,vp9-444,vp9-444-bindgen --all-targets -- -D warnings

      - name: Test agent --features ffmpeg-encoder
        # Test, not merely check. The ten encoder names the cascade dispatches
        # (`*_nvenc`/`*_qsv`/`*_amf` x h264/hevc/av1, plus `vp9_qsv`) are locked
        # by unit tests, and those locks are exactly what keeps the minimal
        # vendored build and the dispatch table from drifting apart — a drift
        # that is invisible until a device silently falls back to software.
        # They need the library present, not a GPU.
        run: cargo test -p roomlerd --features ffmpeg-encoder --lib

  fr-registry:
    name: FR registry integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The FR registry is not documentation -- it is the mechanism that
    # ARBITRATES FR-number collisions between parallel sessions. The standing
    # rule is "claim the number by adding your row to docs/fr/README.md in the
    # SAME commit as the spec", precisely so git rejects the loser's push
    # instead of two sessions discovering the clash after both have published.
    # That only holds while the row and the spec travel together.
    #
    # They stopped, and nothing noticed. Master carried an FR-52 row whose spec
    # had NEVER been on master -- carried in as a passenger by a PR about FR-49
    # and FR-50 -- so the registry advertised a claimed number, linked to a 404,
    # and documented nothing for two days. It also made the real FR-52 PR
    # unmergeable (both sides added the row), so that stalled silently with
    # every check green.
    #
    # A spec with no row is the worse half: it fails no build and no test, and
    # simply leaves the next session free to take the same number.
    steps:
      - uses: actions/checkout@v4
      - name: Audit the FR registry
        run: bash scripts/fr-registry-audit.sh

  machine-names:
    name: No real machine names
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # This repo is PUBLIC, and field notes are written in the heat of debugging
    # — which is exactly when someone writes down the name of the machine they
    # are debugging. Committed hostnames are reconnaissance value: they map the
    # fleet and say which host runs what.
    #
    # SHAPE-based, not name-based, so it needs no secret: the map that pairs
    # each real name with its replacement lives outside the repo and must stay
    # there. Shape is also the stronger test — the 2026-08-30 whole-history
    # sweep applied a four-name map to every blob, message and issue, and this
    # scan still found two machines nobody had ever listed, one of them
    # published in an FR spec since the PR that created it.
    #
    # ⚠️ Its OWN job, deliberately, and a 5-minute one: it is the REQUIRED
    # status check on master, so it must not be welded to the 30-minute Rust
    # suite. It was a step inside `Rust checks` until 2026-09-04, which made it
    # unusable as a required check and gave it no separate signal.
    #
    # When it fires: add the real name to the map (outside the repo), re-run
    # the sweep, and let this go green. NEVER add a real name to the allowlist.
    # See .claude/skills/sanitize-hostnames/SKILL.md.
    steps:
      - uses: actions/checkout@v4
      - name: Guard self-test, then scan
        run: |
          # The selftest plants a canary of every shape IN BOTH CASINGS and
          # asserts the guard FAILS, then asserts it passes on the real tree.
          # It runs first because this guard has silently self-disarmed four
          # times and every symptom was a confident "none found" — most
          # recently by matching uppercase only, while the leak that got
          # through was written in lowercase.
          bash .claude/skills/sanitize-hostnames/selftest.sh
          python3 .claude/skills/sanitize-hostnames/check_shapes.py --root .

  commit-identity:
    name: No foreign commit identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The sibling of `No real machine names`, one layer over. That job asks
    # whether the CONTENT names a real machine; this asks whether the COMMIT
    # names a real person we did not mean to publish.
    #
    # Neither can see the other's surface. A commit's author and committer are
    # METADATA — they are in no blob and no message, so the shape scan walks
    # straight past them — and this repo is PUBLIC, so an address from a corp
    # mailbox names an employer beside a personal project in every clone,
    # forever.
    #
    # Why it exists: an audit on 2026-09-05 found a second GitHub account (a
    # corp one, whose LOGIN alone named an employer) had authored an issue and
    # three comments here. It had authored no commits, and that was luck rather
    # than design — nothing anywhere checked, while 520 commits already in this
    # history carried a corp mailbox as their author address.
    #
    # ⚠️ An ALLOWLIST, not a denylist, and the reason is structural rather than
    # stylistic: a denylist of unwanted addresses would have to write them into
    # a public file, publishing exactly what the guard exists to remove. It
    # would also only find the mistakes someone already thought of. Same
    # reasoning as check_shapes.py being shape-based rather than map-based — a
    # denylist finds the identities you know about, an allowlist finds the class.
    #
    # ⚠️ `--require-commits` is load-bearing. Without it an empty range answers
    # "all known" over zero commits, which is indistinguishable from a real
    # pass — the same defect as a `cargo test` filter matching no test, which
    # this repo's integration lane already shipped once.
    #
    # ⚠️ A merge made through the GitHub web UI is created ON GitHub from the
    # email set on the ACCOUNT, after every local hook and PR check has already
    # passed — so nothing can BLOCK it here. A ruleset would, but the whole
    # metadata-rule family is organisation-and-paid-plan only and is refused
    # with HTTP 422 on this user-owned repo (measured 2026-09-06).
    #
    # This job's `push` trigger is therefore the backstop: it scans
    # `event.before..sha` and turns master red within a minute. Detection, not
    # prevention — but the alternative was finding out in an audit eleven days
    # later, which is how the leak that prompted all this was found.
    #
    # ⚠️ The `event.before` fallback below is load-bearing, and was exercised on
    # its first real run: after a force-push that SHA no longer exists, and
    # `git log A..B` against a missing A is an error, not a pass.
    steps:
      - uses: actions/checkout@v4
        with:
          # The identity check reads commits, so it needs their objects. The
          # default shallow checkout has the PR head but not the base, and
          # `base..head` against a missing base is an error, not a pass.
          fetch-depth: 0

      - name: Guard self-tests, then scan the commits this PR adds
        run: |
          # Selftests first, and both of them: a guard nobody has watched FAIL
          # is not evidence of anything. The sibling shape guard has silently
          # self-disarmed four times and every symptom was a confident pass.
          bash .githooks/check-identity-selftest.sh
          bash .claude/hooks/gh-account-guard-selftest.sh

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            # A push to master. `github.event.before` is the zero sha for the
            # first push to a new branch and for a force-push over a deleted
            # ref; fall back to the single head commit rather than scanning
            # nothing or the whole history.
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              RANGE="${{ github.sha }}~1..${{ github.sha }}"
            else
              RANGE="$BEFORE..${{ github.sha }}"
            fi
          fi
          echo "range: $RANGE"
          bash .githooks/check-identity.sh --require-commits --range "$RANGE"

  name-audit:
    name: Retired-name audit (FR-21)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # FR-21 (#809). Two assertions, and the PAIR is what makes it sound while the
    # migration is still in flight:
    #
    #   1. unclassified must not RISE   -> nobody adds a fresh retired name
    #   2. anchors must not FALL        -> nobody deletes a dual-read fallback
    #
    # (2) is the half a plain ratchet misses, and it is the half that matters:
    # deleting an anchor fails no build and no test, it just strands every
    # pre-rename host at its next update. The macOS `.app` anchor is the worst
    # case -- its name keys the TCC grants.
    #
    # P5: this job now BLOCKS. It was `continue-on-error` while P1-P4 were in
    # flight, because a job that is red for a whole program trains people to
    # ignore it — but an advisory guard nobody ever flips is a guard that does
    # nothing, so the flip is the phase.
    #
    # P7: now `--check --strict`. Every remaining occurrence was resolved one
    # at a time, so `unclassified == 0` and the third assertion is live:
    #
    #   3. unclassified must be ZERO -> every retired name left in the tree is
    #      marked, and the marker says WHY the name is still real
    #
    # That is the assertion worth having. (1) only says the number stopped
    # growing; (3) says a reader can no longer meet a retired name without an
    # explanation next to it, and the ~730 anchored sites are the map of what
    # the field still depends on — RPATHs, published asset names, legacy service
    # and task names, the macOS bundle whose name keys the TCC grants, the QUIC
    # ALPN, and the pre-rename appdirs tree.
    #
    # (1) and (2) stay: strict alone would accept deleting an anchor and its
    # dual-read fallback together, which is exactly the change that strands a
    # fleet while every build and test stays green.
    #
    # The job also fails on a shebang that is not on line 1 — the anchor
    # system's own failure mode, which broke the macOS .pkg on this branch.
    steps:
      - uses: actions/checkout@v4
      - name: Audit retired product names
        run: bash scripts/name-audit.sh --check --strict
      - name: Report (always, so a red run shows WHAT moved)
        if: always()
        run: bash scripts/name-audit.sh --summary

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        # Pin bun to match local reproducible builds; setup-bun@v2 with
        # no version input resolves to `latest`, which has silently
        # shipped regressions that broke `vue-tsc --noEmit` for us in
        # the past. Local 1.3.12 on Windows + Linux (WSL) passes, so
        # we pin there and bump intentionally.
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          # `ui/bun.lock` is the text-format lockfile bun 1.2+ writes.
          # The older `bun.lockb` binary format isn't produced by our
          # installs, so the previous key hashed a non-existent file
          # (always the empty-string hash) and the cache never varied.
          key: ${{ runner.os }}-bun-${{ hashFiles('ui/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        # `--frozen-lockfile` fails the build if bun.lock is missing
        # or stale. Without it the resolver silently up-versions
        # transitive deps between runs, which is how the CI frontend
        # build started diverging from local.
        run: cd ui && bun install --frozen-lockfile

      - name: Build (includes vue-tsc --noEmit)
        # Override the default runner shell to drop -e/pipefail so we
        # can capture exit codes and always flush output, and emit the
        # last 30 lines as ::error:: annotations so the failure mode
        # is visible via the anonymous GitHub API (annotations endpoint
        # is publicly readable for public repos; step summaries and
        # raw logs are not without auth).
        shell: bash --noprofile --norc {0}
        run: |
          cd ui
          echo "bun $(bun --version)"

          echo "::group::vue-tsc --noEmit"
          bun x vue-tsc --noEmit 2>&1 | tee /tmp/vue-tsc.log
          tsc_rc=${PIPESTATUS[0]}
          echo "::endgroup::"
          if [ "$tsc_rc" != 0 ]; then
            {
              echo "### vue-tsc --noEmit (exit $tsc_rc)"
              echo '```'
              cat /tmp/vue-tsc.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Emit last 30 lines of tsc output as a single error
            # annotation. %0A escapes newlines per GHA workflow command
            # grammar so the annotation preserves multi-line output.
            tail -30 /tmp/vue-tsc.log | awk 'BEGIN{ORS="%0A"}{print}' | sed 's/^/::error::vue-tsc: /'
            exit "$tsc_rc"
          fi

          echo "::group::vite build"
          bun x vite build 2>&1 | tee /tmp/vite.log
          vite_rc=${PIPESTATUS[0]}
          echo "::endgroup::"
          if [ "$vite_rc" != 0 ]; then
            {
              echo "### vite build (exit $vite_rc)"
              echo '```'
              cat /tmp/vite.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail -30 /tmp/vite.log | awk 'BEGIN{ORS="%0A"}{print}' | sed 's/^/::error::vite: /'
          fi
          exit "$vite_rc"

      - name: Build the docs site (FR-60)
        # `bun run build` chains `vue-tsc && vite build && bun docs/build.ts`,
        # but this job deliberately runs the first two separately so each
        # failure gets its own annotation. Without this step the docs
        # generator's BUILD GATES — dangling internal links, missing or
        # over-length descriptions, duplicate slugs, unclosed containers, a
        # search index over budget — would never run in CI, which is exactly
        # the "a job that silently runs nothing is indistinguishable from a
        # passing one" failure the integration lane already learned.
        # ⚠️ It must run AFTER `vite build`: vite empties `dist/`.
        shell: bash --noprofile --norc {0}
        run: |
          cd ui
          echo "::group::docs build"
          bun docs/build.ts 2>&1 | tee /tmp/docs.log
          docs_rc=${PIPESTATUS[0]}
          echo "::endgroup::"
          if [ "$docs_rc" != 0 ]; then
            {
              echo "### docs build (exit $docs_rc)"
              echo '```'
              cat /tmp/docs.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail -30 /tmp/docs.log | awk 'BEGIN{ORS="%0A"}{print}' | sed 's/^/::error::docs: /'
          fi
          # The SEO files land at the site root, next to the SPA — assert
          # they exist rather than trusting the generator's own log line.
          test -f dist/sitemap.xml || { echo "::error::docs: dist/sitemap.xml missing"; exit 1; }
          test -f dist/robots.txt || { echo "::error::docs: dist/robots.txt missing"; exit 1; }
          test -f dist/docs/index.html || { echo "::error::docs: dist/docs/index.html missing"; exit 1; }
          exit "$docs_rc"

      - name: Run unit tests
        run: cd ui && bun run test:unit

  # FR-69 P8 (D13) — the four reduced profiles must COMPILE, and the C++ SFU
  # worker and the tunnel stack must be ABSENT from the graphs that do not
  # sell them (AC3). `cargo clippy --workspace` above compiles the feature
  # UNION, so it can never see a profile: these checks are per package, with
  # `--no-default-features`, or they check nothing.
  #
  # One job, four sequential checks, not a 4-way matrix: every module crate
  # is a shared artifact in the cache and only the api crate's own objects
  # differ per set — a matrix would pay the cold cache four times for the
  # same result.
  profiles:
    name: Build profiles (FR-69)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Rust cache
        continue-on-error: true
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: ci-profiles
          cache-on-failure: true
          key: wf-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Configure apt retries
        run: echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/80-ci-retries

      # `collab` is the only reduced profile that links mediasoup, whose
      # worker build wants these; the others need nothing beyond the toolchain.
      - name: Build deps for the SFU worker (collab)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev cmake python3-pip

      - name: Check every reduced profile compiles
        run: |
          for p in collab remote mesh access; do
            echo "::group::profile-$p"
            cargo check -p roomler-ai-api --no-default-features --features "profile-$p"
            echo "::endgroup::"
          done

      # AC3 — what a profile does NOT link is the product claim. Read the
      # graph per profile and assert the absence; a `cargo tree` that lists
      # nothing is also a failure (the assertion must be able to fail).
      - name: Assert what each profile leaves out (AC3)
        run: |
          tree() { cargo tree -p roomler-ai-api --no-default-features --features "profile-$1" -e normal --prefix none 2>/dev/null | awk '{print $1}' | sort -u; }
          fail=0
          for p in remote mesh access; do
            T=$(tree "$p"); N=$(printf '%s\n' "$T" | wc -l)
            if [ "$N" -lt 100 ]; then echo "::error::profile-$p: cargo tree returned $N crates — the assertion cannot be trusted"; fail=1; fi
            if printf '%s\n' "$T" | grep -qxE 'mediasoup(-sys)?'; then echo "::error::profile-$p links mediasoup"; fail=1; else echo "  profile-$p: no mediasoup ($N crates)"; fi
          done
          T=$(tree collab); N=$(printf '%s\n' "$T" | wc -l)
          if [ "$N" -lt 100 ]; then echo "::error::profile-collab: cargo tree returned $N crates"; fail=1; fi
          if printf '%s\n' "$T" | grep -qx 'roomler-ai-tunnel-core'; then echo "::error::profile-collab links roomler-ai-tunnel-core"; fail=1; else echo "  profile-collab: no tunnel-core ($N crates)"; fi
          # And the positive control: the FULL graph must contain both, or
          # the greps above prove nothing about the names they look for.
          F=$(cargo tree -p roomler-ai-api -e normal --prefix none 2>/dev/null | awk '{print $1}' | sort -u)
          printf '%s\n' "$F" | grep -qx 'mediasoup' || { echo "::error::positive control failed: full does not list mediasoup"; fail=1; }
          printf '%s\n' "$F" | grep -qx 'roomler-ai-tunnel-core' || { echo "::error::positive control failed: full does not list roomler-ai-tunnel-core"; fail=1; }
          exit $fail
