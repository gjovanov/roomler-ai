name: Cache janitor

# Keeps the repo's 10 GB Actions-cache pool under budget so LRU eviction
# never gets to choose a victim — historically it chose the release-lane
# seeds (2026-07-30: pool at 11.8 GB of PR/CI churn evicted the seeds
# within days and every agent release ran ~14 min slower until someone
# noticed). GitHub's own policy (7-day unused expiry + LRU over 10 GB)
# is too slow for this repo's cadence: several releases and PR merges a
# day each save 0.5–1.5 GB.
#
# Policy per cache entry:
#   - PR merge-ref caches idle > 48 h  → delete (the PR run that made
#     them restores from master anyway; they exist only for same-PR
#     re-pushes)
#   - ANY cache idle > 96 h            → delete (half GitHub's 7-day
#     expiry; anything load-bearing is touched daily by CI or releases)
#   - tag-ref caches                   → delete (never restorable by any
#     other run; release workflows no longer create them, this catches
#     stragglers from branches that predate the save-if gates)
#   - master-ref release seeds AGE-based refresh: with the env-hash-free
#     flat keys (PR #266), GitHub's cache immutability means every
#     post-release reseed SKIPS its save ("cache already exists") — the
#     seed slowly stales as Cargo.lock drifts from its snapshot (observed
#     08-01→08-05: warm releases crept 10–12 → 14–17 min). So: delete
#     master seeds CREATED > 7 days ago and immediately dispatch the
#     artifacts-only rehearsal, so a fresh seed lands within ~25 min of
#     the 04:43 sweep — before the day's first tag. No cold release.
#
# Master-ref seeds otherwise survive indefinitely: every tag build
# restores them (access refresh keeps them out of the idle sweeps).

on:
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch: {}

permissions:
  actions: write

jobs:
  sweep:
    name: Sweep stale caches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete stale entries
        id: sweep
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          now=$(date +%s)
          gh api --paginate 'repos/${{ github.repository }}/actions/caches?per_page=100' \
            --jq '.actions_caches[] | [.id, .ref, .last_accessed_at, .size_in_bytes, .key, .created_at] | @tsv' > /tmp/caches.tsv
          before=$(awk -F'\t' '{s+=$4} END{printf "%d", s/1048576}' /tmp/caches.tsv)
          deleted=0
          freed=0
          seed_refresh=0
          while IFS=$'\t' read -r id ref last size key created; do
            last_s=$(date -d "$last" +%s)
            idle=$(( now - last_s ))
            created_s=$(date -d "$created" +%s)
            age=$(( now - created_s ))
            del=""
            case "$ref" in
              refs/pull/*) [ "$idle" -gt 172800 ] && del="pr-idle" ;;
              refs/tags/*|refs/heads/refs/tags/*) del="tag-ref" ;;
              refs/heads/master)
                # Release-lane seed refresh: flat keys are immutable, so a
                # week-old seed must be deleted for the next reseed (which
                # this workflow dispatches below) to save a fresh one.
                case "$key" in
                  v0-rust-agent-*|v0-rust-installer-smoke-windows*)
                    [ "$age" -gt 604800 ] && { del="seed-age-7d"; seed_refresh=1; }
                    ;;
                esac
                ;;
            esac
            [ -z "$del" ] && [ "$idle" -gt 345600 ] && del="idle-96h"
            if [ -n "$del" ]; then
              if gh api -X DELETE "repos/${{ github.repository }}/actions/caches/$id" >/dev/null 2>&1; then
                deleted=$((deleted + 1))
                freed=$((freed + size))
                echo "deleted [$del] $key ($ref, $((size / 1048576)) MB)"
              fi
            fi
          done < /tmp/caches.tsv
          echo "---"
          echo "pool before: ${before} MB; deleted ${deleted} entries; freed $((freed / 1048576)) MB"
          echo "seed_refresh=${seed_refresh}" >> "$GITHUB_OUTPUT"

      - name: Dispatch reseed rehearsal (seed was age-refreshed)
        if: steps.sweep.outputs.seed_refresh == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Same GITHUB_TOKEN workflow_dispatch exception as
          # seed-release-caches.yml; version read from master so
          # validate-version passes.
          version=$(gh api 'repos/${{ github.repository }}/contents/Cargo.toml?ref=master' --jq .content | base64 -d | awk '
            /^\[workspace\.package\]/ {in_section=1; next}
            /^\[/ {in_section=0}
            in_section && /^version[[:space:]]*=/ {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ')
          echo "Re-seeding after age-based seed deletion (workspace ${version})"
          gh workflow run release-agent.yml --ref master \
            -f version="${version}" -f publish_release=false
