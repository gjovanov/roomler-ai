name: Cache janitor

# Keeps the repo's Actions-cache pool under budget so LRU eviction never
# gets to choose a victim — historically it chose the release-lane seeds
# (2026-07-30: pool at 11.8 GB of PR/CI churn evicted the seeds within days
# and every agent release ran ~14 min slower until someone noticed).
# GitHub's own policy (7-day unused expiry + LRU over the limit) is too slow
# for this repo's cadence: several releases and PR merges a day each save
# 0.5–1.5 GB.
#
# The limit is the free 10 GB again since 2026-10-10. From 2026-09-28 it was
# 20 GB (raised by the operator, paid, `PUT repos/{repo}/actions/cache/
# storage-limit`), and everything above 10 GB draws on the ACCOUNT's Actions
# budget, which another repository's paid minutes can exhaust. When that
# happened the pool went read-only ("Cache reservation failed: You have reached
# your configured budget") and every lane restored an ever-older generation
# (2026-10-09). So master's working set is being cut to fit the free tier
# (FR-6 waves 21-21b). The plain recorder lane restores the audio lane's
# family instead of keeping its own, and the integration lane builds with line
# tables instead of full debuginfo. ⚠ A step that deletes the crate archives
# before the save CANNOT work. rust-cache's post step runs `cargo metadata
# --all-features` first, and cargo needs a crate's `.crate` file even when its
# source is already unpacked, so it downloads all of them again. Wave 21
# shipped that trim and 21b removed it. At 10 GB the rules below are what keep
# a lockfile rotation (every family saving a new generation in one run) from
# evicting a live family: superseded generations go right after the run.
#
# Policy per cache entry:
#   - PR merge-ref caches idle > 48 h  → delete (the PR run that made
#     them restores from master anyway; they exist only for same-PR
#     re-pushes)
#   - ANY cache idle > 96 h            → delete (half GitHub's 7-day
#     expiry; anything load-bearing is touched daily by CI or releases)
#   - tag-ref caches                   → delete (never restorable by any
#     other run; release workflows no longer create them, this catches
#     stragglers from branches that predate the save-if gates)
#   - master-ref release seeds AGE-based refresh: with the env-hash-free
#     flat keys (PR #266), GitHub's cache immutability means every
#     post-release reseed SKIPS its save ("cache already exists") — the
#     seed slowly stales as Cargo.lock drifts from its snapshot (observed
#     08-01→08-05: warm releases crept 10–12 → 14–17 min). So: delete
#     master seeds CREATED > 7 days ago and immediately dispatch the
#     artifacts-only rehearsal, so a fresh seed lands within ~25 min of
#     the 04:43 sweep — before the day's first tag. No cold release.
#
# Master-ref seeds otherwise survive indefinitely: every tag build
# restores them (access refresh keeps them out of the idle sweeps).
#
# FR-6 wave 14 (#773, 2026-09-27) — two rules for the CI cargo caches:
#   - a `v0-rust-*` cache on a PR ref → delete at once. Every workflow now
#     saves those only from master (`save-if`), so one on a PR ref is a
#     leftover — and each hour it stands it pushes master's entries toward
#     LRU. That is exactly how 13.1 of a 15.0 GB pool came to sit on PR refs
#     and evict master's `ci-linux`, turning a 20 min run into 36.8.
#   - master keeps ONE generation per Swatinem family. A key is
#     `v0-rust-<family>-<os>-<arch>-<env hash>-<lockfile hash>`, and a new
#     generation lands whenever a member crate's Cargo.toml or a third-party
#     Cargo.lock entry changes, and (since wave 16's cargo-cache-salt) when
#     the job's own steps change; a version bump rotates nothing (see ci.yml's
#     `rust-lint` cache step). So superseded ones would otherwise sit out
#     their 96 h. Restores never need them: an exact miss falls back to the
#     NEWEST prefix match.

on:
  schedule:
    # Every 6 h (was daily): seed-cache-save now retires its own family's
    # superseded generations inline, but branch-ref leftovers, PR caches,
    # and anything a failed run orphans still need the sweep — and a daily
    # cadence let the pool sit over budget for hours (2026-08-18:
    # generations hit 9.5 GB and LRU evicted the CI cargo caches).
    - cron: '43 */6 * * *'
  # And after every CI run on master: that is the run that SAVES, so it is
  # also the moment an older generation becomes superseded.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch: {}

# One sweep at a time; a second trigger waits rather than racing the first
# over the same entries.
concurrency:
  group: cache-janitor
  cancel-in-progress: false

permissions:
  actions: write

jobs:
  sweep:
    name: Sweep stale caches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete stale entries
        id: sweep
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          now=$(date +%s)
          gh api --paginate 'repos/${{ github.repository }}/actions/caches?per_page=100' \
            --jq '.actions_caches[] | [.id, .ref, .last_accessed_at, .size_in_bytes, .key, .created_at] | @tsv' > /tmp/caches.tsv
          before=$(awk -F'\t' '{s+=$4} END{printf "%d", s/1048576}' /tmp/caches.tsv)
          deleted=0
          freed=0
          # NOTE (lock-keyed seeds, 2026-08-15): release-lane cache keys
          # now carry a per-Cargo.lock suffix, so every rehearsal save
          # lands under a fresh key and seeds refresh ORGANICALLY (the
          # post-release reseed builds the new generation warm from the
          # previous one). The old age-based seed deletion + re-dispatch
          # is gone — superseded generations simply go idle and fall to
          # the 96 h sweep below.
          #
          # FR-6 wave 14: the superseded CI cargo generations on master —
          # every entry of a Swatinem family except its newest by creation.
          # The family is the key less its two trailing hashes (gh's jq is
          # gojq: RE2 regexes, so `{8}` needs no awk support).
          gh api --paginate 'repos/${{ github.repository }}/actions/caches?per_page=100' \
            --jq '.actions_caches[]
                  | select(.ref == "refs/heads/master")
                  | select(.key | test("^v0-rust-.+-[0-9a-f]{8}-[0-9a-f]{8}$"))
                  | [.created_at, (.id | tostring), (.key | sub("-[0-9a-f]{8}-[0-9a-f]{8}$"; ""))]
                  | @tsv' \
            | sort -r | awk -F'\t' 'seen[$3]++ { print $2 }' > /tmp/superseded.ids
          echo "superseded master generations: $(wc -l < /tmp/superseded.ids)"
          while IFS=$'\t' read -r id ref last size key created; do
            last_s=$(date -d "$last" +%s)
            idle=$(( now - last_s ))
            del=""
            case "$ref" in
              refs/pull/*)
                case "$key" in
                  v0-rust-*) del="pr-cargo" ;;
                  *) [ "$idle" -gt 172800 ] && del="pr-idle" ;;
                esac ;;
              refs/tags/*|refs/heads/refs/tags/*) del="tag-ref" ;;
              refs/heads/master) grep -qx "$id" /tmp/superseded.ids && del="superseded" ;;
            esac
            [ -z "$del" ] && [ "$idle" -gt 345600 ] && del="idle-96h"
            if [ -n "$del" ]; then
              if gh api -X DELETE "repos/${{ github.repository }}/actions/caches/$id" >/dev/null 2>&1; then
                deleted=$((deleted + 1))
                freed=$((freed + size))
                echo "deleted [$del] $key ($ref, $((size / 1048576)) MB)"
              fi
            fi
          done < /tmp/caches.tsv
          echo "---"
          echo "pool before: ${before} MB; deleted ${deleted} entries; freed $((freed / 1048576)) MB"
