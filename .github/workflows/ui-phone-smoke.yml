name: UI phone smoke

# FR-116 D6 — the phone-width smoke (`ui/e2e-phone/`): the built SPA served by
# `vite preview`, every `/api` call answered from fixtures, every signed-in
# route at 360 and 390 px. It asserts that nothing is cut off sideways and
# that each page's primary action is on screen. No backend, no database.
# The same job then runs the soft-keyboard harness (`ui/e2e-harness/`, #2888)
# in the same Chromium — one runner slot for both.
#
# Its own workflow, path-filtered to `ui/**`: ci.yml has no path filter, so a
# job there would run on every PR (agreed with the CI-runner work, FR-6).
on:
  pull_request:
    paths:
      - 'ui/**'
      - '.github/workflows/ui-phone-smoke.yml'
  push:
    branches: [master]
    paths:
      - 'ui/**'
      - '.github/workflows/ui-phone-smoke.yml'
  workflow_dispatch:

concurrency:
  group: ui-phone-smoke-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  phone-smoke:
    name: Phone-width smoke (360 / 390 px)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        # The frontend job's pin (ci.yml), for the same reasons.
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Cache bun dependencies
        # The frontend job's key exactly, so both share one entry.
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('ui/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the SPA
        # `vite build` alone: the frontend job already runs vue-tsc.
        run: bunx vite build

      - name: Install Chromium
        # Not cached on purpose: the Actions cache is shared and nearly full,
        # and PR-ref saves are what evicted master's entries before. The
        # install is ~30–60 s.
        run: bunx playwright install --with-deps chromium

      - name: Run the smoke
        run: bunx playwright test -c playwright.phone.config.ts

      - name: Run the soft-keyboard harness
        # #2888 — the viewer's key path in the same Chromium (`ui/e2e-harness/`):
        # the real `MobileKeyboard.vue` and the real key-routing code on a
        # one-page harness the Vite DEV server serves (the config starts it on
        # :4174 and waits for it). Every hardware key, the soft keyboard's own
        # typing, an IME composition and a paste must reach the host exactly
        # once, in every viewer state. A step of this job, not a job of its own:
        # runner SLOTS are the scarce resource, and the install is the same.
        # Runs even when the smoke failed, so one red run reports both.
        if: success() || failure()
        run: bunx playwright test -c playwright.harness.config.ts

      - name: Upload the reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phone-smoke-report
          path: |
            ui/playwright-report-phone/
            ui/test-results-phone/
            ui/playwright-report-harness/
            ui/test-results-harness/
          retention-days: 7
