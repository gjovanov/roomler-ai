# FR-73 P4 (#1389) — retention for the package on GHCR, the counterpart of the
# build host's weekly `registry-retention.sh` for the registry it replaces.
#
# Two prunes, both bounded by what they may NEVER touch:
#   1. untagged versions that are BuildKit CACHE manifests (every push of
#      `buildcache-hosted` orphans the previous one) — and ONLY those. GHCR
#      has no referrers API, so a provenance attestation is pushed as an
#      UNTAGGED manifest plus a `sha256-<subject digest>` index that points at
#      it: "delete everything untagged" deletes the attestations (the first
#      dry run, 2026-09-05, would have taken the hosted image's). A version
#      is deleted only when its own manifest says it is a cache
#      (`config.mediaType` = `application/vnd.buildkit.cacheconfig.v0`);
#      anything else, or anything unreadable, is kept;
#   2. the hosted lane's dated tags beyond the newest KEEP — a version is a
#      candidate ONLY if every tag it carries is `hosted-<YYYYMMDD>-<sha7>`.
#      A version that also carries `hosted`, `latest`, `v*`, `*-<profile>`,
#      `buildcache-*` or an attestation tag (`sha256-*`) is never a candidate,
#      whatever its age. That rule is asserted in the script, not assumed of
#      the input (AC7).
#
# `dry_run=true` lists what would go and deletes nothing — use it first.
name: ghcr retention

on:
  schedule:
    - cron: '0 5 * * 1'   # Mondays 05:00 UTC, after the RTC-forwarding audit's slot
  workflow_dispatch:
    inputs:
      keep:
        description: 'How many hosted-* tags to keep (newest first)'
        type: number
        default: 20
      dry_run:
        description: 'List only, delete nothing'
        type: boolean
        default: true

permissions:
  packages: write

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      KEEP: ${{ inputs.keep || 20 }}
      DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          PKG="${GITHUB_REPOSITORY#*/}"
          IMAGE="ghcr.io/${OWNER}/${PKG}"
          API="/users/${OWNER}/packages/container/${PKG}/versions"
          echo "package ${OWNER}/${PKG}  keep=${KEEP}  dry_run=${DRY}"
          gh api --paginate "$API" > versions.json
          TOTAL="$(jq 'length' versions.json)"
          echo "versions: $TOTAL"

          # 1. untagged — only the BuildKit cache manifests (see the header).
          # Each candidate's manifest is read back from the registry by digest;
          # a version whose manifest is not a cache config, or cannot be read,
          # is kept. The attestations live here untagged, referenced by their
          # `sha256-<subject>` index.
          jq -r '.[] | select((.metadata.container.tags | length) == 0) | "\(.id) \(.name) \(.created_at)"' versions.json > untagged-all.txt
          : > untagged.txt
          while read -r ID DIGEST CREATED; do
            MT="$(docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --raw 2>/dev/null | jq -r '.config.mediaType // .mediaType // "unreadable"' 2>/dev/null || echo unreadable)"
            if [ "$MT" = "application/vnd.buildkit.cacheconfig.v0" ]; then
              echo "$ID $CREATED" >> untagged.txt
            else
              echo "  keeping untagged $ID ($CREATED): $MT"
            fi
          done < untagged-all.txt
          echo "untagged: $(wc -l < untagged-all.txt), of which cache manifests: $(wc -l < untagged.txt)"

          # 2. hosted-* beyond KEEP — candidates are versions whose EVERY tag is a dated hosted tag
          jq -r '
            .[]
            | select((.metadata.container.tags | length) > 0)
            | select(all(.metadata.container.tags[]; test("^hosted-[0-9]{8}-[0-9a-f]{7}$")))
            | "\(.created_at) \(.id) \(.metadata.container.tags | join(","))"' versions.json \
            | sort -r > hosted.txt
          echo "dated hosted-* versions: $(wc -l < hosted.txt) (keeping the newest ${KEEP})"
          tail -n +"$((KEEP + 1))" hosted.txt > hosted-prune.txt || true
          echo "hosted-* to prune: $(wc -l < hosted-prune.txt)"

          # The guard: nothing in the prune lists may carry a protected tag.
          # Re-derived from versions.json by id, so a bug above cannot widen it.
          while read -r _ ID _; do
            TAGS="$(jq -r --arg id "$ID" '.[] | select(.id == ($id|tonumber)) | .metadata.container.tags | join(",")' versions.json)"
            case ",$TAGS," in
              *",hosted,"*|*",latest,"*|*",v"*|*"-amd64,"*|*"-arm64,"*|*",buildcache-"*|*",sha256-"*|*"-collab,"*|*"-remote,"*|*"-mesh,"*|*"-access,"*)
                echo "::error::refusing: version $ID carries a protected tag ($TAGS)"; exit 1 ;;
            esac
          done < hosted-prune.txt

          del() {
            if [ "$DRY" = "true" ]; then echo "  would delete $1 ($2)"; return; fi
            gh api -X DELETE "${API}/$1" >/dev/null && echo "  deleted $1 ($2)"
          }
          while read -r ID CREATED; do del "$ID" "untagged, $CREATED"; done < untagged.txt
          while read -r CREATED ID TAGS; do del "$ID" "$TAGS, $CREATED"; done < hosted-prune.txt

          {
            echo "## ghcr retention"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| versions | $TOTAL |"
            echo "| untagged pruned | $(wc -l < untagged.txt) |"
            echo "| hosted-* pruned | $(wc -l < hosted-prune.txt) (kept newest ${KEEP}) |"
            echo "| dry run | ${DRY} |"
          } >> "$GITHUB_STEP_SUMMARY"
