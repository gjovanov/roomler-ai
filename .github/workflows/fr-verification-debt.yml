name: FR verification debt

# An FR closes when its acceptance criteria are FIELD-VERIFIED and its docs
# exist — not when its PR merges. `CLAUDE.md` says "CI green != done" in three
# places. This lane is the one check that reads those two facts together: the
# GitHub issue's state, and whether its spec's criteria are actually ticked.
#
# WHY IT IS NOT A JOB IN ci.yml, where its sibling `fr-registry` lives
#
#   ci.yml keys the Rust cache on `hashFiles('.github/workflows/ci.yml')`, and
#   documents the consequence in its own comments: ANY edit to that file
#   rotates the key, guarantees the next run is cold, and — because a cancelled
#   attempt saves no cache — makes a CI-touching PR pay the cold time twice and
#   unable to converge by retrying. Measured 2026-09-04: cancelled at 31m29s
#   with every prior step green.
#
#   This job is five minutes of `gh` and `awk` with no Rust in it. Putting it
#   in ci.yml would tax every future edit of it with a cold ~20-50 min Rust
#   rebuild, for nothing.
#
# WHY IT IS ALSO SCHEDULED, not only triggered by pushes
#
#   ⚠️ The debt this measures is NOT created by a commit. It is created by
#      CLOSING AN ISSUE — an action that leaves no trace in the repository at
#      all. A push-only trigger would therefore miss the exact event it exists
#      to catch, and would look healthy while doing so. The daily run is what
#      makes the check honest; the path-filtered push/PR run is the fast half
#      that catches a criterion being un-ticked in a diff.
#
#   A sharper option the operator can enable is `on: issues: [closed]`, which
#   catches it within seconds instead of within a day. It is left off here
#   because it fires for every issue in the repository, FR or not, and a red
#   check hanging off an unrelated closed issue reads as a bug in the check.

on:
  schedule:
    - cron: '0 7 * * *'     # 07:00 UTC daily — an hour after daily-health-check
  pull_request:
    branches: [master]
    paths:
      - 'docs/fr/**'
      - 'scripts/fr-*'
      - '.github/workflows/fr-verification-debt.yml'
  push:
    branches: [master]
    paths:
      - 'docs/fr/**'
      - 'scripts/fr-*'
      - '.github/workflows/fr-verification-debt.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  debt:
    name: Closed FRs with unticked criteria
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Audit FR verification debt
        run: bash scripts/fr-verification-debt.sh
        env:
          GH_TOKEN: ${{ github.token }}
