name: seed-cache-save
description: >-
  Prune + save the cargo seed under this Cargo.lock's unique key (must
  mirror seed-cache-restore's path list + key exactly). Because the key is
  unique per lockfile, saves ALWAYS land — GitHub cache immutability never
  blocks a refresh, so no delete steps and no absent-key window exist
  anywhere. A same-lockfile twin rehearsal loses the save reservation
  race and warns ("cache already exists") — harmless, the winner's
  content is equivalent. After saving, this action retires its OWN
  family's superseded generations (keeps ONLY the newest on this ref: at current sizes (~950 MB avg) even two generations per family total ~9.5 GB and re-evict the CI lane; a partial newest from a failed rehearsal is replaced within one release cycle by the next reseed) —
  self-cleaning at the production site. The 2026-08-18 lesson: relying
  on cache-janitor's 96 h idle sweep let generations pile to 9.5 GB of
  the 10 GB pool within a day of releases, and GitHub's LRU evicted the
  CI lane's cargo caches instead (run 32198738776 went cold). Requires
  the CALLING step to pass `env: GH_TOKEN` (and the workflow to hold
  `actions: write`); retirement soft-skips if the token is absent.
inputs:
  shared-key:
    description: Cache family name (must match the restore call)
    required: true
runs:
  using: composite
  steps:
    - name: Prune before save
      shell: bash
      run: |
        # rust-cache-style trim: registry sources + git checkouts re-extract
        # cheaply from the cached index/db; incremental dirs are rebuilt
        # every run anyway. Keeps a generation at roughly Swatinem size.
        rm -rf ~/.cargo/registry/src ~/.cargo/git/checkouts 2>/dev/null || true
        rm -rf target/release/incremental target/debug 2>/dev/null || true
        du -sh target ~/.cargo 2>/dev/null || true

    - uses: actions/cache/save@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          ~/.cargo/bin
          target
        key: seed-${{ inputs.shared-key }}-${{ runner.os }}-${{ runner.arch }}-lock-${{ hashFiles('**/Cargo.lock') }}

    - name: Retire superseded generations (keep only the newest on this ref)
      shell: bash
      run: |
        set -uo pipefail
        if [ -z "${GH_TOKEN:-}" ]; then
          echo "GH_TOKEN not provided by the calling step — skipping generation retirement"
          exit 0
        fi
        fam="seed-${{ inputs.shared-key }}-${{ runner.os }}-${{ runner.arch }}-lock-"
        ref="${GITHUB_REF}"
        # Newest-first by created_at; keep only the newest (the one just
        # saved); delete the rest ON THIS REF ONLY.
        gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
          --jq ".actions_caches[] | select(.ref == \"${ref}\" and (.key | startswith(\"${fam}\"))) | [.created_at, .id, .key] | @tsv" \
          | sort -r | tail -n +2 | while IFS=$'\t' read -r created id key; do
              if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${id}" >/dev/null 2>&1; then
                echo "retired ${key} (created ${created})"
              fi
            done
        exit 0
