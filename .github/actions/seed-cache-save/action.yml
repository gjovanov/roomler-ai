name: seed-cache-save
description: >-
  Prune + publish the cargo seed as RELEASE ASSETS on the rolling
  `seed-cache` release (two per family: <fam>-cargo.tar.zst +
  <fam>-target.tar.zst; must mirror seed-cache-restore's layout).
  Deliberately OUTSIDE GitHub's 10 GB Actions-cache pool — see
  seed-cache-restore's header for the 13-incident history that ended
  there. `--clobber` IS the retention policy (exactly keep-newest-1);
  there are no reservations to race or wedge, no LRU to displace, no
  budget to blow. The calling step must pass `env: GH_TOKEN`
  (publication soft-skips without it) and the workflow needs
  `contents: write` (release-agent.yml has it).
inputs:
  shared-key:
    description: Seed family name (must match the restore call)
    required: true
runs:
  using: composite
  steps:
    - name: Prune before publish
      shell: bash
      run: |
        # rust-cache-style trim: registry sources + git checkouts re-extract
        # cheaply from the cached index/db; incremental dirs are rebuilt
        # every run anyway. (Accretion GC lives in seed-cache-restore,
        # BEFORE the build, so what we publish here is complete AND lean.)
        rm -rf ~/.cargo/registry/src ~/.cargo/git/checkouts 2>/dev/null || true
        rm -rf target/release/incremental target/debug 2>/dev/null || true
        du -sh target ~/.cargo 2>/dev/null || true

    - name: Pack + publish the seed assets
      shell: bash
      run: |
        set -uo pipefail
        if [ -z "${GH_TOKEN:-}" ]; then
          echo "GH_TOKEN not provided — skipping seed publication"
          exit 0
        fi
        fam="seed-${{ inputs.shared-key }}-${{ runner.os }}-${{ runner.arch }}"
        pk="${RUNNER_TEMP:-/tmp}/seedpk"
        mkdir -p "$pk"
        # cargo-home subset: only what restore needs; guard each path so a
        # lane without e.g. git/db still packs.
        cargo_paths=""
        for d in registry/index registry/cache git/db bin; do
          [ -e "$HOME/.cargo/$d" ] && cargo_paths="$cargo_paths $d"
        done
        if [ -n "$cargo_paths" ]; then
          # shellcheck disable=SC2086
          tar --zstd -cf "$pk/${fam}-cargo.tar.zst" -C "$HOME/.cargo" $cargo_paths
        fi
        if [ -d target ]; then
          tar --zstd -cf "$pk/${fam}-target.tar.zst" target
        fi
        ls -lh "$pk" | tail -n +2
        # Ensure the rolling release exists. --latest=false is CRITICAL:
        # fielded agents poll /releases/latest for self-update — a
        # seed-cache release must never shadow an agent release there.
        if ! gh release view seed-cache --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
          gh release create seed-cache --repo "${GITHUB_REPOSITORY}" \
            --title "Rolling CI seed cache (build dep — not an agent release)" \
            --notes "Cargo seed tarballs published by seed-cache-save and consumed by seed-cache-restore in release-agent.yml. Clobbered on every rehearsal; safe to delete (next rehearsal republishes)." \
            --latest=false || true
        fi
        ok=1
        for f in "$pk/${fam}-cargo.tar.zst" "$pk/${fam}-target.tar.zst"; do
          [ -f "$f" ] || continue
          gh release upload seed-cache "$f" --repo "${GITHUB_REPOSITORY}" --clobber || ok=0
        done
        rm -rf "$pk"
        # Verify-after-publish, ON THE RUN PAGE (2026-08-24 lesson: a green
        # step whose effect silently didn't land cost a day of cold builds).
        have="$(gh release view seed-cache --repo "${GITHUB_REPOSITORY}" \
                 --json assets --jq "[.assets[].name] | map(select(startswith(\"${fam}-\"))) | length" 2>/dev/null || echo 0)"
        if [ "$ok" = "1" ] && [ "${have:-0}" -ge 2 ]; then
          echo "seed published: ${fam} (both assets on seed-cache)"
        else
          echo "::warning title=Seed publish did not land::'${fam}' assets are incomplete on the seed-cache release (upload ok=${ok}, assets present=${have}) — tag builds will run cold (~+10 min) until a later rehearsal publishes successfully."
        fi
        exit 0
