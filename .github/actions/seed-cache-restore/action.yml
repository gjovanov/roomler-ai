name: seed-cache-restore
description: >-
  Restore the release-lane cargo seed from a RELEASE ASSET on the rolling
  `seed-cache` release — deliberately OUTSIDE GitHub's 10 GB Actions-cache
  pool. Thirteen incidents (2026-07-13 → 08-25) proved the shared pool
  cannot host the seeds: whatever key scheme we used, the pool's LRU
  eventually evicted a needed seed under pressure from the (legitimately
  hot) CI caches — final straw rc.472: a rehearsal VERIFIED its Windows
  save at 19:36 and the tag's restore found nothing at 20:05, evicted by
  the next rehearsal's own sibling saves. Release assets have no LRU, no
  budget, no reservations; retention is `--clobber` (exactly the
  keep-newest-1 we always wanted); the pattern is field-proven here since
  July by the vendored-ffmpeg releases. Pair with seed-cache-save; the
  calling step must pass `env: GH_TOKEN` (soft-fallback to cold without
  it).
inputs:
  shared-key:
    description: Seed family name (unique per job)
    required: true
runs:
  using: composite
  steps:
    - name: Download + unpack the seed asset
      shell: bash
      run: |
        set -uo pipefail
        fam="seed-${{ inputs.shared-key }}-${{ runner.os }}-${{ runner.arch }}"
        if [ -z "${GH_TOKEN:-}" ]; then
          echo "GH_TOKEN not provided — building cold"
          exit 0
        fi
        # mktemp, NOT $RUNNER_TEMP: on Windows runners RUNNER_TEMP is
        # `D:\a\_temp`, and GNU tar parses the `D:` in an -f path as a
        # REMOTE HOST ("Cannot connect to D: resolve failed" — run
        # 32967165070 lost every Windows publish to it). mktemp yields a
        # POSIX path on all three runner OSes.
        dl="$(mktemp -d)"
        # Two assets per family — no tar path-transforms, so the same
        # commands work on GNU tar (linux) and bsdtar (macOS/windows):
        #   <fam>-cargo.tar.zst  → unpacked into ~/.cargo
        #   <fam>-target.tar.zst → unpacked into the workspace (./target)
        if ! gh release download seed-cache --repo "${GITHUB_REPOSITORY}" \
              --pattern "${fam}-*.tar.zst" --dir "$dl" 2>/dev/null \
           || [ ! -f "$dl/${fam}-target.tar.zst" ]; then
          # First run ever, a clobber-gap of a few seconds, or a failed
          # producer. A COLD TAG is an SLO breach in the making (+~10 min):
          # put it on the run page, not in log archaeology.
          if [ "${GITHUB_REF_TYPE:-branch}" = "tag" ]; then
            echo "::warning title=Cold tag build (no cargo seed)::no '${fam}-*.tar.zst' on the seed-cache release — this release build runs cold (~+10 min). Check the reseed rehearsals' 'seed published' lines (gh run list --workflow=release-agent.yml, workflow_dispatch lanes)."
          else
            echo "no ${fam} seed yet — building cold (this run's save will publish it)"
          fi
          exit 0
        fi
        mkdir -p "$HOME/.cargo"
        tar --zstd -xf "$dl/${fam}-cargo.tar.zst" -C "$HOME/.cargo" 2>/dev/null || true
        tar --zstd -xf "$dl/${fam}-target.tar.zst" 2>/dev/null || true
        rm -f "$dl/${fam}-cargo.tar.zst" "$dl/${fam}-target.tar.zst"
        echo "restored from: ${fam} assets ($(du -sh target 2>/dev/null | cut -f1 || echo '?') target)"

    - name: Accretion GC (rehearsals only)
      shell: bash
      run: |
        # Each rehearsal restores the previous generation, builds the delta,
        # and publishes EVERYTHING — without a sweep, artifacts of superseded
        # dep versions accrete monotonically (generations grew ~500 MB →
        # 1.4-2.6 GB in four days once).
        #
        # ⚠️ Never delete individual files under `target`: cargo's decision
        # to re-run a build script lives in `.fingerprint/`, not in the
        # outputs — removing an OUTPUT while its fingerprint survives means
        # cargo silently never rebuilds it (rc.422-424 died on a GC'd
        # env-libvpx-sys OUT_DIR/ffi.rs baked into the seed). The registry
        # cache IS safe to sweep by mtime (missing .crate = re-download);
        # `target` is dropped WHOLESALE when fat — one slow rehearsal, then
        # a correct lean generation.
        if [ "${GITHUB_REF_TYPE:-branch}" = "tag" ]; then
          echo "tag run — skipping accretion GC"
          exit 0
        fi
        find ~/.cargo/registry/cache -type f -mtime +4 -delete 2>/dev/null || true
        TARGET_MB=$(du -sm target 2>/dev/null | cut -f1 || echo 0)
        if [ "${TARGET_MB:-0}" -gt "${SEED_TARGET_MAX_MB:-3000}" ]; then
          echo "target is ${TARGET_MB} MB (> ${SEED_TARGET_MAX_MB:-3000}) — dropping it whole"
          rm -rf target
        else
          echo "target is ${TARGET_MB} MB — kept intact"
        fi
