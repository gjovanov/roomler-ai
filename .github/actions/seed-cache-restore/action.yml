name: seed-cache-restore
description: >-
  Restore the release-lane cargo seed. Key scheme:
  seed-<shared-key>-<os>-<arch>-lock-<Cargo.lock hash>, with a prefix
  restore-key so a lockfile drift still restores the NEWEST older
  generation (cargo rebuilds only the delta). Deliberately NO environment
  hash — runner-image variance flapped rust-cache's env hash run-to-run
  (0c34b334 vs e76361e6, 2026-08-01) and made warm/cold a lottery. Why not
  rust-cache: with add-rust-environment-hash-key:false its `key:` input is
  folded into the dropped component and becomes a no-op (#482, re-proven
  by probe run 31907241610), leaving only an immutable flat key — which
  forced the #485 delete-before-restore dance and its absent-key race
  (rc.382 went cold mid-window). Pair with seed-cache-save.
inputs:
  shared-key:
    description: Cache family name (unique per job)
    required: true
runs:
  using: composite
  steps:
    - uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          ~/.cargo/bin
          target
        key: seed-${{ inputs.shared-key }}-${{ runner.os }}-${{ runner.arch }}-lock-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          seed-${{ inputs.shared-key }}-${{ runner.os }}-${{ runner.arch }}-lock-

    - name: Accretion GC (rehearsals only)
      shell: bash
      run: |
        # 2026-08-20: each rehearsal restores the previous generation,
        # builds the delta, and saves EVERYTHING — without a stale-artifact
        # sweep, artifacts of superseded dep versions accrete monotonically
        # (generations grew ~500 MB → 1.4-2.6 GB in four days; five of
        # them = 7.4 GB, re-evicting the CI lane's caches whenever a save
        # crested the 10 GB pool). actions/cache preserves mtimes and a
        # compile refreshes them, so files untouched for 4+ days are dead
        # artifacts of superseded deps — or live-but-stable units, which is
        # why this runs BEFORE the build and only on non-tag runs: the
        # rehearsal rebuilds anything it deleted by mistake and saves a
        # complete, lean generation. Tag runs never GC (they'd pay the
        # rebuild on the release path for artifacts they don't re-save).
        if [ "${GITHUB_REF_TYPE:-branch}" = "tag" ]; then
          echo "tag run — skipping accretion GC"
          exit 0
        fi
        find target ~/.cargo/registry/cache -type f -mtime +4 -delete 2>/dev/null || true
        du -sh target 2>/dev/null || true
