name: seed-cache-restore
description: >-
  Restore the release-lane cargo seed. Key scheme:
  seed-<shared-key>-<os>-<arch>-lock-<Cargo.lock hash>, with a prefix
  restore-key so a lockfile drift still restores the NEWEST older
  generation (cargo rebuilds only the delta). Deliberately NO environment
  hash — runner-image variance flapped rust-cache's env hash run-to-run
  (0c34b334 vs e76361e6, 2026-08-01) and made warm/cold a lottery. Why not
  rust-cache: with add-rust-environment-hash-key:false its `key:` input is
  folded into the dropped component and becomes a no-op (#482, re-proven
  by probe run 31907241610), leaving only an immutable flat key — which
  forced the #485 delete-before-restore dance and its absent-key race
  (rc.382 went cold mid-window). Pair with seed-cache-save.
inputs:
  shared-key:
    description: Cache family name (unique per job)
    required: true
runs:
  using: composite
  steps:
    - uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          ~/.cargo/bin
          target
        # Run-salted primary key (always a miss — restores go through the
        # restore-keys below; saves land under this unique key). The salt
        # exists because 2026-08-24 a rehearsal was CANCELLED mid-upload by
        # the #556 concurrency group and GitHub's reservation for the
        # shared key stayed wedged: every later (green!) rehearsal failed
        # its save with "Unable to reserve cache … another job may be
        # creating this cache", no Windows generation persisted, and
        # rc.460 built near-cold. Unique per-run keys make reservation
        # contention structurally impossible; the keep-newest retirement
        # in seed-cache-save prunes the salted siblings.
        key: seed-${{ inputs.shared-key }}-${{ runner.os }}-${{ runner.arch }}-lock-${{ hashFiles('**/Cargo.lock') }}-r${{ github.run_id }}
        restore-keys: |
          seed-${{ inputs.shared-key }}-${{ runner.os }}-${{ runner.arch }}-lock-${{ hashFiles('**/Cargo.lock') }}-
          seed-${{ inputs.shared-key }}-${{ runner.os }}-${{ runner.arch }}-lock-

    - name: Accretion GC (rehearsals only)
      shell: bash
      run: |
        # Each rehearsal restores the previous generation, builds the delta,
        # and saves EVERYTHING — without a sweep, artifacts of superseded dep
        # versions accrete monotonically (generations grew ~500 MB → 1.4-2.6 GB
        # in four days; five of them = 7.4 GB, re-evicting the CI lane's caches
        # whenever a save crested the 10 GB pool).
        #
        # ⚠️ 2026-08-20 — this used to be:
        #
        #     find target ~/.cargo/registry/cache -type f -mtime +4 -delete
        #
        # and it POISONED the seed for every downstream run. Deleting
        # individual files inside `target` is unsound: cargo's decision to
        # re-run a build script lives in `target/*/.fingerprint/`, not in the
        # outputs, so removing an OUTPUT while leaving its fingerprint makes
        # cargo skip the rebuild and the file is simply gone. The original
        # premise — "the rehearsal rebuilds anything it deleted by mistake" —
        # is exactly what cargo does NOT do.
        #
        # It hit `env-libvpx-sys`, whose build script writes `OUT_DIR/ffi.rs`.
        # libvpx is pinned, so that file is never touched and always trips
        # `-mtime +4`. A rehearsal deleted it and saved the hole; every later
        # run restored it and died on
        # `couldn't read .../out/ffi.rs` in ~2 min. Three releases in a row
        # (rc.422/423/424) plus a dispatch run failed this way, and a re-run
        # could not help — the poison was IN the cache.
        #
        # So: never touch individual files under `target`. The registry cache
        # is safe to sweep by mtime (those are downloaded `.crate` archives;
        # cargo re-fetches what it needs), and `target` is dropped WHOLESALE
        # when it gets fat — one slow rehearsal, and a correct generation
        # afterwards.
        if [ "${GITHUB_REF_TYPE:-branch}" = "tag" ]; then
          echo "tag run — skipping accretion GC"
          exit 0
        fi
        # Sound: cargo treats a missing .crate as "download it again".
        find ~/.cargo/registry/cache -type f -mtime +4 -delete 2>/dev/null || true
        # All-or-nothing on target. A partial sweep is what broke the releases.
        TARGET_MB=$(du -sm target 2>/dev/null | cut -f1 || echo 0)
        if [ "${TARGET_MB:-0}" -gt "${SEED_TARGET_MAX_MB:-3000}" ]; then
          echo "target is ${TARGET_MB} MB (> ${SEED_TARGET_MAX_MB:-3000}) — dropping it whole"
          rm -rf target
        else
          echo "target is ${TARGET_MB} MB — kept intact"
        fi
