name: ci-seed-save
description: >-
  FR-6 wave 22 (#773): publish a CI job's cargo cache to the free release-asset
  store, the pair of `ci-seed-restore` (see there for why it is not the Actions
  cache). Run it as the job's LAST step and only from master; pass
  `env: GH_TOKEN`, a token with `contents: write`, and the restore step's `key`
  and `exact` outputs. An unchanged cache (`exact` = true) is not re-uploaded.
  Before packing, every LOCAL package's units go (workspace members and path
  dependencies: the checkout's fresh mtimes make cargo rebuild them on every
  run anyway), together with their fingerprints, never outputs alone. So do
  incremental state and each profile's top-level binaries. Third-party
  dependencies stay, which is what rust-cache keeps. It never fails the job:
  a cache that does not publish costs the next run time, not correctness.

inputs:
  family:
    description: Cache family name (must match the ci-seed-restore call)
    required: true
  key:
    description: The ci-seed-restore step's `key` output
    required: true
  exact:
    description: The ci-seed-restore step's `exact` output
    required: true

runs:
  using: composite
  steps:
    - name: Prune, pack and publish the cache assets
      shell: bash
      env:
        FAM: ci-${{ inputs.family }}-${{ runner.os }}-${{ runner.arch }}
        KEY: ${{ inputs.key }}
        EXACT: ${{ inputs.exact }}
      run: |
        # GitHub runs this with `bash -e -o pipefail`. Every status below is checked by hand, and
        # a stray non-zero (an empty grep, a du on a vanished path) must not abort half-way.
        set +e
        set -uo pipefail
        if [ "$EXACT" = "true" ]; then
          echo "cache up-to-date: ${FAM} was restored under this same key — nothing to publish"
          exit 0
        fi
        if [ -z "${GH_TOKEN:-}" ]; then
          echo "::warning::GH_TOKEN not provided — ${FAM} not published"
          exit 0
        fi
        if [ ! -d target ] || [ -z "$KEY" ]; then
          echo "no target dir or no key — nothing to publish"
          exit 0
        fi

        # Local packages = no `source` in cargo metadata (workspace members + path deps).
        # Units are named <package or target name>-<hash>, with `-` as `_` and a `lib`
        # prefix in deps/. Without --no-deps, metadata needs every package's manifest, which
        # the build already downloaded; that is the same call rust-cache makes.
        local_names=$(mktemp)
        if ! cargo metadata --format-version 1 --all-features 2>/dev/null \
               | jq -r '.packages[] | select(.source == null) | .name, (.targets[].name)' \
               | sort -u > "$local_names.raw" || [ ! -s "$local_names.raw" ]; then
          echo "::warning::${FAM}: cargo metadata failed — not publishing an unpruned cache"
          exit 0
        fi
        { cat "$local_names.raw"; sed 's/-/_/g' "$local_names.raw"; sed 's/-/_/g; s/^/lib/' "$local_names.raw"; } \
          | sort -u > "$local_names"
        echo "local packages/targets to prune: $(wc -l < "$local_names.raw")"

        before=$(du -sm target 2>/dev/null | cut -f1)
        # A profile dir is any dir holding `.fingerprint` (target/debug, target/release,
        # target/<triple>/release, …).
        find target -maxdepth 3 -type d -name .fingerprint | while IFS= read -r fp; do
          prof=$(dirname "$fp")
          # Everything at the profile's top level except the three unit dirs: binaries, .d
          # files, examples/, incremental/ — rebuilt or relinked on every run.
          find "$prof" -mindepth 1 -maxdepth 1 ! -name build ! -name .fingerprint ! -name deps \
               -exec rm -rf {} + 2>/dev/null
          for sub in build .fingerprint deps; do
            [ -d "$prof/$sub" ] || continue
            ls -1A "$prof/$sub" | awk -v L="$local_names" '
              BEGIN { while ((getline m < L) > 0) local[m] = 1 }
              { base = $0; i = match(base, /-[^-]*$/); if (i > 0) base = substr(base, 1, i - 1)
                if (base in local) print }' \
            | while IFS= read -r unit; do rm -rf "$prof/$sub/$unit"; done
          done
        done
        rm -f "$local_names" "$local_names.raw"
        printf '%s\n' "$KEY" > target/.ci-seed-key
        after=$(du -sm target 2>/dev/null | cut -f1)
        echo "pruned target: ${before:-?} MB -> ${after:-?} MB (third-party dependencies only)"
        # FR-6 wave 33: a target over the restore's cap is dropped by every later restore, so
        # every run of this job builds cold and the next master run publishes the same size
        # again. The restore step exports the cap it applied.
        cap="${CI_SEED_MAX_TARGET_MB:-}"
        if [ -n "$cap" ] && [ -n "${after:-}" ] && [ "$after" -gt "$cap" ]; then
          echo "::warning title=CI cache over its cap::'${FAM}' publishes a ${after} MB target, over the ${cap} MB its restore keeps, so every run of this job builds cold. Raise the job's max-target-mb (ci-seed-restore) above ${after}."
        fi

        home="${CARGO_HOME:-$HOME/.cargo}"
        if command -v cygpath >/dev/null 2>&1; then home=$(cygpath -u "$home"); fi
        pk="$(mktemp -d)"
        cargo_paths=""
        for d in registry/index registry/cache git/db .crates.toml .crates2.json; do
          [ -e "$home/$d" ] && cargo_paths="$cargo_paths $d"
        done
        # `bin`: the tools a job `cargo install`s (cargo-wix…), as rust-cache kept them, but
        # never rustup's own proxies: an old proxy restored over the runner's would downgrade it.
        if [ -d "$home/bin" ]; then
          for f in "$home"/bin/*; do
            [ -f "$f" ] || continue
            b=$(basename "$f"); b=${b%.exe}
            case "$b" in
              cargo|cargo-clippy|cargo-fmt|cargo-miri|clippy-driver|rls|rust-analyzer|rust-gdb|rust-gdbgui|rust-lldb|rustc|rustdoc|rustfmt|rustup) ;;
              *) cargo_paths="$cargo_paths bin/$(basename "$f")" ;;
            esac
          done
        fi
        # A failed pack must never reach the upload: --clobber would replace a good cache with
        # a truncated one (a dry run without zstd produced two 0-byte archives that "uploaded").
        packed=1
        if [ -n "$cargo_paths" ]; then
          tar --zstd -cf "$pk/${FAM}-cargo.tar.zst" -C "$home" $cargo_paths || packed=0
        fi
        tar --zstd -cf "$pk/${FAM}-target.tar.zst" target || packed=0
        if [ "$packed" != "1" ] || [ ! -s "$pk/${FAM}-target.tar.zst" ]; then
          echo "::warning::${FAM}: packing failed — not publishing (the existing cache stays)"
          rm -rf "$pk"
          exit 0
        fi
        ls -l "$pk" | tail -n +2
        # A release asset is capped at 2 GiB. A target archive over the 1.9 GiB margin goes up as
        # numbered 1,900 MiB parts, `<fam>-target.tar.zst.part00`, `.part01`, …, which
        # ci-seed-restore concatenates (FR-6 wave 34: the Linux unit lane's runs ~2.5 GB).
        # `dd`, not `split`: one spelling on GNU, BSD and Git Bash.
        t="$pk/${FAM}-target.tar.zst"
        tsz=$(wc -c < "$t")
        if [ "$tsz" -gt 2040109465 ]; then
          n=0
          while [ $((n * 1992294400)) -lt "$tsz" ]; do
            if ! dd if="$t" of="$(printf '%s.part%02d' "$t" "$n")" bs=1048576 \
                   skip=$((n * 1900)) count=1900 2>/dev/null; then
              echo "::warning::${FAM}: splitting the target archive failed — not publishing (the existing cache stays)"
              rm -rf "$pk"
              exit 0
            fi
            n=$((n + 1))
          done
          rm -f "$t"
          echo "target archive is ${tsz} bytes: publishing it in ${n} parts"
        fi
        for f in "$pk"/*; do
          sz=$(wc -c < "$f")
          if [ "$sz" -gt 2040109465 ]; then
            echo "::warning::${FAM}: $(basename "$f") is ${sz} bytes, over the 1.9 GiB margin of the asset cap — not publishing"
            rm -rf "$pk"
            exit 0
          fi
        done

        ok=1
        want=""
        for f in "$pk"/*; do
          want="$want $(basename "$f")"
          gh release upload seed-cache "$f" --repo "${GITHUB_REPOSITORY}" --clobber || ok=0
        done
        rm -rf "$pk"
        # The target goes up whole or in parts, never both. Retire this family's target assets
        # that this publish did not write (the other form, or parts past the new count). A
        # restore prefers a whole asset, and parts from two publishes fail to unpack. Only after
        # every upload landed: a half-published set must not retire the old cache that works.
        if [ "$ok" = "1" ]; then
          names=$(gh release view seed-cache --repo "${GITHUB_REPOSITORY}" --json assets \
                    --jq '.assets[].name' 2>/dev/null) || ok=0
          for a in $names; do
            case "$a" in "${FAM}-target.tar.zst"|"${FAM}-target.tar.zst.part"*) ;; *) continue ;; esac
            case " $want " in *" $a "*) continue ;; esac
            gh release delete-asset seed-cache "$a" --repo "${GITHUB_REPOSITORY}" --yes \
              && echo "retired ${a}" || ok=0
          done
        fi
        # Every asset this publish wrote must be there.
        have=$(gh release view seed-cache --repo "${GITHUB_REPOSITORY}" --json assets \
                 --jq '.assets[].name' 2>/dev/null)
        missing=""
        for w in $want; do
          printf '%s\n' "$have" | grep -qxF "$w" || missing="$missing $w"
        done
        if [ "$ok" = "1" ] && [ -n "$want" ] && [ -z "$missing" ]; then
          echo "cache published: ${FAM} (${want# })"
        else
          echo "::warning title=CI cache did not publish::'${FAM}' assets are incomplete on the seed-cache release (upload ok=${ok}, missing:${missing:- none}) — the next run of this job may build cold"
        fi
        exit 0
