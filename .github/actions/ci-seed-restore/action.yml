name: ci-seed-restore
description: >-
  FR-6 wave 22 (#773): restore a CI job's cargo cache from the free
  release-asset store (the rolling `seed-cache` release, assets
  `ci-<family>-<os>-<arch>-{cargo,target}.tar.zst`) instead of the Actions
  cache. The Actions cache's free 10 GB holds the hot Linux lanes. Above 10 GB
  it bills the ACCOUNT's Actions budget, and when another repository spent that
  budget (2026-10-09) the pool went read-only. Release assets have no LRU, no
  limit and no budget; the release lane's seeds have lived there since
  2026-08-26 (`seed-cache-restore`). Pair with `ci-seed-save`. The calling step
  passes `env: GH_TOKEN`; without it this soft-falls back to a cold build.
  Outputs `key`, a hash of what the cached dependency builds depend on, and
  `exact`, true when the restored cache was saved under that same key, so
  `ci-seed-save` can skip re-publishing an unchanged cache.

inputs:
  family:
    description: Cache family name, unique per job (must match the ci-seed-save call)
    required: true
  max-target-mb:
    description: >-
      A restored `target` larger than this is dropped whole, and the run builds
      cold and publishes a lean one. Old dependency versions otherwise accrete
      across lockfile changes. Whole, never file by file: cargo fingerprints
      outlive outputs.
    required: false
    default: "4000"

outputs:
  key:
    description: This job's cache key
    value: ${{ steps.restore.outputs.key }}
  exact:
    description: '"true" when the restored cache carries this same key'
    value: ${{ steps.restore.outputs.exact }}

runs:
  using: composite
  steps:
    - name: Download + unpack the cache assets
      id: restore
      shell: bash
      env:
        FAM: ci-${{ inputs.family }}-${{ runner.os }}-${{ runner.arch }}
        MAX_MB: ${{ inputs.max-target-mb }}
      run: |
        # GitHub runs this with `bash -e -o pipefail`. Every status below is checked by hand, and
        # a stray non-zero (an empty grep, a du on a vanished path) must not abort half-way.
        set +e
        set -uo pipefail
        # The key covers what third-party build artifacts depend on: the lockfile, the
        # toolchain, the job's own definition (cargo-cache-salt's file, which the calling job
        # writes first) and the cargo/compiler environment. It only decides whether a save may be
        # skipped, never what cargo treats as fresh, so a spurious change costs one upload.
        key=$(
          {
            echo "os=${RUNNER_OS:-?} arch=${RUNNER_ARCH:-?}"
            rustc -vV 2>/dev/null | grep -E '^(release|commit-hash|host):' || true
            env | grep -E '^(CARGO_|RUSTFLAGS=|RUSTDOCFLAGS=|CC=|CXX=|CFLAGS=|CXXFLAGS=)' \
                | grep -vE '^CARGO_(HOME|TERM_COLOR)=' | LC_ALL=C sort
            for f in Cargo.lock rust-toolchain.toml rust-toolchain ci-cache-salt/.cargo/config.toml; do
              [ -f "$f" ] && printf '%s %s\n' "$f" "$(git hash-object "$f")"
            done
          } | git hash-object --stdin
        )
        echo "key=$key" >> "$GITHUB_OUTPUT"
        # Written once, on every exit path (a name written twice is ambiguous).
        exact=false
        trap 'echo "exact=$exact" >> "$GITHUB_OUTPUT"' EXIT

        if [ -z "${GH_TOKEN:-}" ]; then
          echo "GH_TOKEN not provided — building cold"
          exit 0
        fi
        dl="$(mktemp -d)"
        if ! gh release download seed-cache --repo "${GITHUB_REPOSITORY}" \
              --pattern "${FAM}-*.tar.zst" --dir "$dl" 2>/dev/null \
           || [ ! -f "$dl/${FAM}-target.tar.zst" ]; then
          echo "no ${FAM} cache on the seed-cache release yet — building cold (a master run publishes it)"
          rm -rf "$dl"
          exit 0
        fi
        home="${CARGO_HOME:-$HOME/.cargo}"
        # Windows runners hand bash a `C:\...` CARGO_HOME.
        if command -v cygpath >/dev/null 2>&1; then home=$(cygpath -u "$home"); fi
        mkdir -p "$home"
        if [ -f "$dl/${FAM}-cargo.tar.zst" ]; then
          tar --zstd -xf "$dl/${FAM}-cargo.tar.zst" -C "$home" || echo "::warning::${FAM}: the cargo-home asset did not unpack"
        fi
        if ! tar --zstd -xf "$dl/${FAM}-target.tar.zst"; then
          echo "::warning::${FAM}: the target asset did not unpack — building cold"
          rm -rf target "$dl"
          exit 0
        fi
        rm -rf "$dl"
        mb=$(du -sm target 2>/dev/null | cut -f1)
        if [ "${mb:-0}" -gt "$MAX_MB" ]; then
          echo "restored target is ${mb} MB (> ${MAX_MB}) — dropping it whole; this run builds cold and the next master run publishes a lean one"
          rm -rf target
          exit 0
        fi
        have=$(cat target/.ci-seed-key 2>/dev/null || true)
        if [ "$have" = "$key" ]; then
          exact=true
          echo "restored ${FAM}: target ${mb} MB, same key"
        else
          echo "restored ${FAM}: target ${mb} MB, key changed (a master run republishes)"
        fi
