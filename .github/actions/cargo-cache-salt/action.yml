name: cargo-cache-salt
description: >-
  Rotates the calling job's Swatinem/rust-cache key whenever that job's own
  definition changes, while the restore still falls back to the previous
  generation. Run it after checkout and right before the rust-cache step.
  FR-6 wave 16 (#773).

# Why this exists
#
#   A job whose steps start compiling new dependency builds (another crate
#   under test, another feature set) needs those builds in its cargo cache,
#   or every later run recompiles them. `Run API unit tests` cost +7 min a run
#   on 2026-08-21 that way. A full-match restore saves nothing, so the builds
#   only get in when the key rotates, and nothing rotated it on purpose:
#   rust-cache ignores `key` whenever `shared-key` is set (its src/config.ts,
#   v2.9.2), so the `key: wf-${{ hashFiles(ci.yml) }}` added for this in wave
#   10 was dead from its first run (wave 15, #1772). The key moved only with a
#   member Cargo.toml, a third-party Cargo.lock entry or the toolchain: on 11
#   of the 30 days to 2026-09-28, with one gap of 17.3 days.
#
# Why a file, not an input
#
#   `prefix-key` and `env-vars` would rotate the key, but both sit in the part
#   a restore matches as a prefix, so either would start the job cold. The one
#   input that rotates the key AND keeps the fallback is the lockfile hash, and
#   rust-cache feeds every `.cargo/config.toml` under the workspace into it
#   byte for byte. So this writes one: comment-only, in a directory cargo never
#   runs from (cargo reads config from its working directory and that
#   directory's ANCESTORS), holding a hash of the calling job's definition.
#
# What rotates it
#
#   The hash covers the job's block in its workflow file, from `  <job>:` to
#   the next job, without comment-only and blank lines. A changed or added
#   step rotates this job's cache alone. A comment edit, another job's edit, a
#   new job or a workflow-level `env:` change rotate nothing (an env var
#   already moves rust-cache's own env hash). CRLF and LF checkouts hash alike.
#
# ⚠️ It leans on a rust-cache implementation detail. If a release stops
#   hashing nested `.cargo/config.toml` files, the salt is ignored and the job
#   behaves as it did before this existed, no worse. A lane's rust-cache log
#   lists what it hashed under "Lockfiles considered", and this file must be
#   among them.
#
# ⚠️ Place it AFTER actions/checkout, whose clean step would delete the file,
#   and BEFORE rust-cache, which reads it once, when it computes the key.

inputs:
  workflow:
    description: >-
      Path of the workflow file that defines the calling job. Defaults to the
      file this run was started from (github.workflow_ref).
    required: false
    default: ''
  root:
    description: >-
      The workspace root rust-cache hashes, i.e. the left side of its
      `workspaces` input.
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - name: Write the salt
      shell: bash
      env:
        JOB_ID: ${{ github.job }}
        WORKFLOW_REF: ${{ github.workflow_ref }}
        SALT_WORKFLOW: ${{ inputs.workflow }}
        SALT_ROOT: ${{ inputs.root }}
      run: |
        wf=$SALT_WORKFLOW
        if [ -z "$wf" ]; then
          ref=${WORKFLOW_REF%@*}          # owner/repo/.github/workflows/ci.yml
          wf=.github/${ref#*/.github/}    # .github/workflows/ci.yml
        fi
        if [ ! -f "$wf" ]; then
          echo "::warning title=cargo cache salt::no workflow file at '$wf' (from '$WORKFLOW_REF'), so job $JOB_ID's cargo cache will not rotate when the job changes"
          exit 0
        fi
        # The job's block: from `  <job>:` under `jobs:` to the next job or
        # top-level key. It reads to EOF rather than `exit`ing at the next job,
        # because an early exit can SIGPIPE `tr`, which pipefail turns into a
        # failed step. Then drop comment-only and blank lines.
        strip='!/^[[:space:]]*(#|$)/ { sub(/[[:space:]]+$/, ""); print }'
        lines=$(tr -d '\r' < "$wf" | awk -v job="$JOB_ID" '
          /^jobs:[[:space:]]*(#.*)?$/ { injobs = 1; next }
          !injobs || done { next }
          on && ($0 ~ /^  [A-Za-z0-9_-]+:[[:space:]]*(#.*)?$/ || $0 ~ /^[^[:space:]#]/) { on = 0; done = 1; next }
          on { print; next }
          $0 ~ ("^  " job ":[[:space:]]*(#.*)?$") { on = 1; print }
        ' | awk "$strip")
        scope="job $JOB_ID in $wf"
        if [ -z "$lines" ]; then
          echo "::warning title=cargo cache salt::job '$JOB_ID' not found in $wf, so the salt covers the whole file and any edit to it rotates this cache"
          lines=$(tr -d '\r' < "$wf" | awk "$strip")
          scope="the whole of $wf"
        fi
        salt=$(printf '%s\n' "$lines" | git hash-object --stdin)
        n=$(printf '%s\n' "$lines" | awk 'END { print NR }')
        dir="$SALT_ROOT/ci-cache-salt/.cargo"
        mkdir -p "$dir"
        {
          echo "# FR-6 (#773). NOT a cargo config: comment-only, and cargo never runs"
          echo "# from here. Swatinem/rust-cache hashes every .cargo/config.toml under"
          echo "# the workspace into its key, so the line below rotates the cargo cache"
          echo "# of $scope when that definition changes."
          echo "# $salt"
        } > "$dir/config.toml"
        echo "cargo cache salt $salt: $n lines of $scope"
