<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" aria-labelledby="cb-title cb-desc">
  <!-- Sibling of hero-mesh.svg — same visual system as the landing page. -->
  <title id="cb-title">Video conferencing and team collaboration</title>
  <desc id="cb-desc">
    A four-person video call with one participant speaking and one sharing a
    screen, next to a chat room where messages arrive in a thread, someone
    reacts with a heart, and someone else is typing.
  </desc>
  <style>
    .speak-ring { transform-box: fill-box; transform-origin: center; animation: cb-ring 1.8s ease-out infinite; }
    @keyframes cb-ring { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(1.7); opacity: 0; } }
    .bar { transform-box: fill-box; transform-origin: center bottom; animation: cb-bar 1s ease-in-out infinite; }
    @keyframes cb-bar { 0%,100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
    /* Keep the scene complete at any glance: only the newest message
       "arrives" each cycle, and the reaction pulses without vanishing. */
    .b3 { animation: cb-arrive 7s ease infinite; }
    .heart { transform-box: fill-box; transform-origin: center; animation: cb-pulse 7s ease infinite; }
    @keyframes cb-arrive {
      0% { opacity: 0; transform: translateY(7px); }
      8%, 100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes cb-pulse {
      0%, 26%, 44%, 100% { transform: scale(1); }
      32% { transform: scale(1.3); }
      38% { transform: scale(.95); }
    }
    .dot { animation: cb-dot 1.2s ease-in-out infinite; }
    @keyframes cb-dot { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-3.5px); } }
    .rec { animation: cb-rec 2s ease-in-out infinite; }
    @keyframes cb-rec { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; opacity: 1 !important; }
    }
  </style>
  <defs>
    <linearGradient id="cb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0f2f1" />
      <stop offset=".5" stop-color="#e8f5e9" />
      <stop offset="1" stop-color="#e0f7fa" />
    </linearGradient>
    <linearGradient id="cb-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3550" />
      <stop offset="1" stop-color="#233047" />
    </linearGradient>
    <linearGradient id="cb-desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="rgba(0,150,136,.55)" />
      <stop offset="1" stop-color="rgba(0,121,107,.3)" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="760" height="400" rx="18" fill="url(#cb-bg)" />

  <!-- ══ The call ══ -->
  <g>
    <rect x="60" y="55" width="340" height="250" rx="10" fill="#1a1a2e" />
    <!-- REC badge -->
    <circle class="rec" cx="78" cy="47" r="3.5" fill="#ef5350" />
    <text x="86" y="50.5" font-size="9" fill="rgba(26,26,46,.6)">recording</text>

    <!-- tile 1 -->
    <rect x="70" y="65" width="156" height="100" rx="6" fill="url(#cb-tile)" />
    <circle cx="148" cy="103" r="15" fill="#4DB6AC" />
    <path d="M124 148 a24 17 0 0 1 48 0 z" fill="#4DB6AC" opacity=".85" />
    <rect x="76" y="150" width="34" height="11" rx="5.5" fill="rgba(0,0,0,.4)" />
    <text x="93" y="158" text-anchor="middle" font-size="7" fill="#ffffff">ana</text>

    <!-- tile 2 — speaking -->
    <rect x="234" y="65" width="156" height="100" rx="6" fill="url(#cb-tile)" />
    <rect x="234" y="65" width="156" height="100" rx="6" fill="none" stroke="#4caf50" stroke-width="1.5" opacity=".8" />
    <circle class="speak-ring" cx="312" cy="103" r="17" fill="none" stroke="rgba(76,175,80,.7)" stroke-width="2" />
    <circle cx="312" cy="103" r="15" fill="#80CBC4" />
    <path d="M288 148 a24 17 0 0 1 48 0 z" fill="#80CBC4" opacity=".85" />
    <g fill="#4caf50">
      <rect class="bar" x="364" y="144" width="3.5" height="14" rx="1.75" />
      <rect class="bar" x="370" y="144" width="3.5" height="14" rx="1.75" style="animation-delay: .15s" />
      <rect class="bar" x="376" y="144" width="3.5" height="14" rx="1.75" style="animation-delay: .3s" />
    </g>
    <rect x="240" y="150" width="34" height="11" rx="5.5" fill="rgba(0,0,0,.4)" />
    <text x="257" y="158" text-anchor="middle" font-size="7" fill="#ffffff">ben</text>

    <!-- tile 3 -->
    <rect x="70" y="173" width="156" height="100" rx="6" fill="url(#cb-tile)" />
    <circle cx="148" cy="211" r="15" fill="#B2DFDB" />
    <path d="M124 256 a24 17 0 0 1 48 0 z" fill="#B2DFDB" opacity=".85" />
    <rect x="76" y="258" width="34" height="11" rx="5.5" fill="rgba(0,0,0,.4)" />
    <text x="93" y="266" text-anchor="middle" font-size="7" fill="#ffffff">mia</text>

    <!-- tile 4 — screen share -->
    <rect x="234" y="173" width="156" height="100" rx="6" fill="url(#cb-desk)" />
    <rect x="246" y="185" width="66" height="40" rx="3" fill="rgba(236,250,249,.92)" />
    <rect x="246" y="185" width="66" height="8" rx="3" fill="rgba(0,121,107,.3)" />
    <rect x="252" y="199" width="40" height="2.5" rx="1.25" fill="rgba(0,121,107,.5)" />
    <rect x="252" y="205" width="52" height="2.5" rx="1.25" fill="rgba(0,121,107,.35)" />
    <rect x="252" y="211" width="30" height="2.5" rx="1.25" fill="rgba(0,121,107,.45)" />
    <rect x="322" y="196" width="54" height="52" rx="3" fill="rgba(26,26,46,.85)" />
    <rect x="328" y="203" width="26" height="2.5" rx="1.25" fill="#4DB6AC" />
    <rect x="328" y="209" width="40" height="2.5" rx="1.25" fill="rgba(77,182,172,.6)" />
    <rect x="328" y="215" width="20" height="2.5" rx="1.25" fill="rgba(77,182,172,.8)" />
    <rect x="240" y="258" width="64" height="11" rx="5.5" fill="rgba(0,0,0,.4)" />
    <text x="272" y="266" text-anchor="middle" font-size="7" fill="#ffffff">leo — screen</text>

    <!-- control bar -->
    <rect x="175" y="283" width="110" height="16" rx="8" fill="rgba(255,255,255,.12)" />
    <circle cx="192" cy="291" r="5" fill="rgba(255,255,255,.25)" />
    <path d="M192 288 a1.8 1.8 0 0 1 1.8 1.8 v1.4 a1.8 1.8 0 0 1 -3.6 0 v-1.4 a1.8 1.8 0 0 1 1.8 -1.8" fill="#ffffff" />
    <circle cx="214" cy="291" r="5" fill="rgba(255,255,255,.25)" />
    <path d="M210.5 289 h4.5 v4 h-4.5 z M215.5 290.2 l2.5 -1.4 v4.4 l-2.5 -1.4 z" fill="#ffffff" />
    <circle cx="236" cy="291" r="5" fill="rgba(255,255,255,.25)" />
    <rect x="233" y="288.5" width="6" height="4" rx=".8" fill="#ffffff" />
    <rect x="234.8" y="293" width="2.4" height="1.4" fill="#ffffff" />
    <circle cx="264" cy="291" r="6.5" fill="#ef5350" />
    <rect x="260" y="290" width="8" height="2.4" rx="1.2" fill="#ffffff" />
  </g>

  <!-- ══ The chat ══ -->
  <g>
    <rect x="430" y="55" width="270" height="250" rx="10" fill="#ffffff" stroke="rgba(0,0,0,.08)" />
    <text x="446" y="80" font-size="11" font-weight="700" fill="#00796B"># release-42</text>
    <text x="684" y="80" text-anchor="end" font-size="8.5" fill="rgba(26,26,46,.45)">3 online</text>
    <line x1="430" y1="90" x2="700" y2="90" stroke="rgba(0,0,0,.07)" />

    <!-- bubble 1 (them) -->
    <g class="b1">
      <circle cx="452" cy="112" r="8" fill="#4DB6AC" />
      <rect x="466" y="100" width="182" height="32" rx="9" fill="rgba(0,0,0,.05)" />
      <rect x="476" y="109" width="120" height="4" rx="2" fill="rgba(26,26,46,.35)" />
      <rect x="476" y="119" width="88" height="4" rx="2" fill="rgba(26,26,46,.22)" />
    </g>

    <!-- bubble 2 (you) + reaction -->
    <g class="b2">
      <rect x="500" y="142" width="184" height="28" rx="9" fill="rgba(0,150,136,.16)" />
      <rect x="512" y="150" width="132" height="4" rx="2" fill="rgba(0,121,107,.55)" />
      <rect x="512" y="159" width="76" height="4" rx="2" fill="rgba(0,121,107,.38)" />
    </g>
    <g class="heart">
      <rect x="652" y="164" width="30" height="15" rx="7.5" fill="#ffffff" stroke="rgba(239,83,80,.4)" />
      <path d="M662 170.5 a2.1 2.1 0 0 1 3.6 -1.5 a2.1 2.1 0 0 1 3.6 1.5 q0 2.1 -3.6 4.4 q-3.6 -2.3 -3.6 -4.4" fill="#ef5350" />
      <text x="675" y="175" text-anchor="middle" font-size="8" fill="#ef5350">2</text>
    </g>

    <!-- bubble 3 (them, thread) -->
    <g class="b3">
      <circle cx="452" cy="196" r="8" fill="#B2DFDB" />
      <rect x="466" y="184" width="156" height="28" rx="9" fill="rgba(0,0,0,.05)" />
      <rect x="476" y="192" width="104" height="4" rx="2" fill="rgba(26,26,46,.35)" />
      <rect x="476" y="201" width="62" height="4" rx="2" fill="rgba(26,26,46,.22)" />
      <text x="470" y="226" font-size="8" fill="#00796B">↳ 3 replies in thread</text>
    </g>

    <!-- typing -->
    <g>
      <circle cx="452" cy="252" r="8" fill="#80CBC4" />
      <rect x="466" y="242" width="52" height="20" rx="9" fill="rgba(0,0,0,.05)" />
      <circle class="dot" cx="481" cy="252" r="2.5" fill="rgba(26,26,46,.4)" />
      <circle class="dot" cx="490" cy="252" r="2.5" fill="rgba(26,26,46,.4)" style="animation-delay: .15s" />
      <circle class="dot" cx="499" cy="252" r="2.5" fill="rgba(26,26,46,.4)" style="animation-delay: .3s" />
    </g>

    <!-- composer -->
    <rect x="444" y="274" width="242" height="20" rx="10" fill="rgba(0,0,0,.045)" />
    <text x="456" y="287.5" font-size="8.5" fill="rgba(26,26,46,.4)">Message #release-42…</text>
    <circle cx="676" cy="284" r="7" fill="#009688" />
    <path d="M673 284 h6 M676.6 281.5 l2.8 2.5 l-2.8 2.5" stroke="#ffffff" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- ══ Value chips ══ -->
  <g font-size="10">
    <rect x="88" y="330" width="186" height="24" rx="12" fill="#ffffff" stroke="rgba(0,150,136,.35)" />
    <text x="181" y="345.5" text-anchor="middle" fill="#00796B">rooms · threads · reactions · files</text>
    <rect x="298" y="330" width="212" height="24" rx="12" fill="#ffffff" stroke="rgba(0,150,136,.35)" />
    <text x="404" y="345.5" text-anchor="middle" fill="#00796B">HD calls · screen share · recordings</text>
    <rect x="534" y="330" width="140" height="24" rx="12" fill="#ffffff" stroke="rgba(0,150,136,.35)" />
    <text x="604" y="345.5" text-anchor="middle" fill="#00796B">included in every plan</text>
  </g>
</svg>
